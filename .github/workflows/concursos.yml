name: Atualizar Concursos

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia as 09:00 UTC (~06:00 BRT)
  workflow_dispatch:        # permite rodar manualmente

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar feed de concursos
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
        run: python3 scripts/atualizar_concursos.py

      - name: Commit das mudancas (se houver)
        run: |
          git config user.name "concursos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add concursos.json
          if git diff --staged --quiet; then
            echo "Sem mudancas no feed."
          else
            git commit -m "chore: atualizacao automatica do feed de concursos ($(date -u +%Y-%m-%d))"
            git push origin HEAD:main
          fi

      - name: Redeploy no Vercel
        run: |
          npm install -g vercel@latest
          vercel deploy . --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
