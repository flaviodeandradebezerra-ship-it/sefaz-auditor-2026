ivas (VPD), apurando o resultado patrimonial do periodo.`},{a:2022,r:`FCC/TCE-2022`,q:`O regime contabil adotado para a RECEITA no setor publico (Lei 4.320) e:`,o:[`A) Competencia integral`,`B) Caixa para a receita`,`C) Competencia para receita e despesa`,`D) Misto invertido`,`E) So competencia para despesa`],g:`B`,c:`Lei 4.320: regime de CAIXA para a receita (reconhecida na arrecadacao) e COMPETENCIA para a despesa (empenhada). MCASP avanca para competencia patrimonial.`},{a:2021,r:`FCC/PGE-2021`,q:`O RECOLHIMENTO, ultimo estagio da receita, consiste em:`,o:[`A) Prever na LOA`,`B) Entregar os valores arrecadados ao Tesouro (conta unica)`,`C) Lancar o credito`,`D) Pagar o credor`,`E) Empenhar`],g:`B`,c:`RECOLHIMENTO: transferencia dos valores arrecadados pelos agentes para a conta unica do Tesouro (principio da unidade de tesouraria).`},{a:2020,r:`FCC/TCM-2020`,q:`Os Restos a Pagar sao inscritos em:`,o:[`A) 1 de janeiro`,`B) 31 de dezembro (despesas empenhadas e nao pagas)`,`C) 30 de junho`,`D) Qualquer data`,`E) Inicio do mandato`],g:`B`,c:`RP: despesas empenhadas e nao pagas ate 31/12. Processados (liquidados) e nao processados (so empenhados).`},{a:2019,r:`FCC/SEFAZ-2019`,q:`A NBC TSP 01 trata de:`,o:[`A) Estoques`,`B) Apresentacao das demonstracoes contabeis`,`C) Receita de tributos`,`D) Ativo imobilizado`,`E) Provisoes`],g:`B`,c:`NBC TSP 01: apresentacao das demonstracoes contabeis (equivale a IPSAS 1): BP, DVP, DFC, DMPL e notas explicativas.`}],"CGP-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No metodo PEPS, o estoque final fica valorado a:`,o:[`A) Precos mais antigos`,`B) Precos mais recentes`,`C) Media das compras`,`D) Custo padrao`,`E) Valor de venda`],g:`B`,c:`PEPS (primeiro a entrar, primeiro a sair): saidas pelos precos antigos -> estoque final pelos precos mais RECENTES. Em inflacao, estoque final maior.`},{a:2022,r:`FCC/RS-2022`,q:`O CMV (Custo da Mercadoria Vendida) e calculado por:`,o:[`A) EI + Compras - EF`,`B) EF - EI`,`C) Compras - EI`,`D) EI + EF`,`E) Vendas - Compras`],g:`A`,c:`CMV = Estoque Inicial + Compras - Estoque Final.`},{a:2021,r:`FCC/ISS-2021`,q:`A DEPRECIACAO pelo metodo linear (linha reta):`,o:[`A) Cresce ao longo do tempo`,`B) E constante em cada periodo`,`C) Decresce`,`D) Depende da producao`,`E) E zero no 1o ano`],g:`B`,c:`Linha reta: cota de depreciacao CONSTANTE por periodo = (custo - valor residual)/vida util.`},{a:2020,r:`FCC/Adm-2020`,q:`Provisao (CPC 25) deve ser reconhecida quando:`,o:[`A) Ha possibilidade remota de saida`,`B) Ha obrigacao presente, saida provavel e estimativa confiavel`,`C) Apenas se houver acao judicial`,`D) Sempre que houver risco`,`E) So por exigencia fiscal`],g:`B`,c:`Provisao: obrigacao presente + saida provavel de recursos + estimativa confiavel. Passivo contingente possivel=notas; remoto=nada.`},{a:2019,r:`FCC/BA-2019`,q:`O Ativo Intangivel (CPC 04) caracteriza-se por:`,o:[`A) Ter substancia fisica`,`B) Ser identificavel, sem substancia fisica e controlado pela entidade`,`C) Ser sempre o goodwill`,`D) Nao gerar beneficios`,`E) Ser circulante`],g:`B`,c:`Intangivel: identificavel, sem substancia fisica, controlado, gera beneficios futuros. Goodwill gerado internamente NAO e reconhecido.`},{a:2023,r:`FCC/TRT-2023`,q:`O teste de IMPAIRMENT (CPC 01) reduz o ativo quando:`,o:[`A) O valor contabil e menor que o recuperavel`,`B) O valor contabil supera o valor recuperavel`,`C) Ha valorizacao`,`D) Ocorre venda`,`E) Sempre no fim do ano`],g:`B`,c:`Impairment: se valor contabil > valor recuperavel, reconhece-se perda por reducao ao valor recuperavel.`},{a:2022,r:`FCC/TCE-2022`,q:`A Media Ponderada Movel (MPM):`,o:[`A) Mantem o preco da 1a compra`,`B) Recalcula o custo medio a cada nova entrada`,`C) Usa o preco mais recente`,`D) Ignora as compras`,`E) E igual ao PEPS`],g:`B`,c:`MPM: recalcula o custo medio unitario A CADA ENTRADA de mercadoria. Suaviza variacoes de preco.`},{a:2021,r:`FCC/ISS-2021`,q:`A DRE apura:`,o:[`A) A posicao patrimonial`,`B) O resultado (lucro ou prejuizo) do periodo`,`C) Os fluxos de caixa`,`D) As mutacoes do PL`,`E) A riqueza distribuida`],g:`B`,c:`DRE: confronta receitas e despesas, apurando o RESULTADO (lucro/prejuizo). BP=posicao; DFC=caixa; DMPL=PL; DVA=riqueza.`},{a:2020,r:`FCC/Adm-2020`,q:`Os estoques sao mensurados pelo:`,o:[`A) Valor de venda`,`B) Menor valor entre custo e valor realizavel liquido`,`C) Custo de reposicao`,`D) Valor justo sempre`,`E) Valor presente`],g:`B`,c:`CPC 16: estoques pelo MENOR valor entre o custo e o valor realizavel liquido (VRL).`},{a:2019,r:`FCC/BA-2019`,q:`A Demonstracao do Valor Adicionado (DVA) evidencia:`,o:[`A) O lucro liquido apenas`,`B) A riqueza gerada pela entidade e sua distribuicao`,`C) Os fluxos de caixa`,`D) As provisoes`,`E) O ativo imobilizado`],g:`B`,c:`DVA: riqueza criada pela entidade e como foi distribuida (pessoal, governo, financiadores, socios). Obrigatoria para companhias abertas.`}],"COA-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No CPC 46, os dados de NIVEL 1 da hierarquia de valor justo sao:`,o:[`A) Dados nao observaveis`,`B) Premissas da entidade`,`C) Precos cotados em mercado ativo para ativos identicos`,`D) Ativos similares`,`E) Fluxo de caixa descontado`],g:`C`,c:`Nivel 1: precos cotados em mercado ATIVO para ativos IDENTICOS (maior confiabilidade). Nivel 3: nao observaveis (premissas internas).`},{a:2022,r:`FCC/RS-2022`,q:`No CPC 06 R2 (IFRS 16), o arrendatario reconhece:`,o:[`A) Apenas despesa linear`,`B) Ativo de direito de uso e passivo de arrendamento`,`C) Passivo contingente`,`D) Receita diferida`,`E) Apenas nas notas`],g:`B`,c:`CPC 06 R2: arrendatario reconhece ATIVO DE DIREITO DE USO + PASSIVO DE ARRENDAMENTO. Excecoes: <=12 meses e baixo valor.`},{a:2021,r:`FCC/ISS-2021`,q:`O GOODWILL positivo (CPC 15) ocorre quando:`,o:[`A) VJ liquido > contraprestacao`,`B) Contraprestacao+PNC+interesse previo > VJ liquido dos ativos/passivos`,`C) A adquirida tem prejuizo`,`D) Valor contabil > mercado`,`E) Ha marca famosa`],g:`B`,c:`Goodwill = (contraprestacao + PNC + interesse previo) - VJ liquido. Positivo=goodwill (intangivel, impairment anual); negativo=compra vantajosa (resultado).`},{a:2020,r:`FCC/Adm-2020`,q:`O MEP (CPC 18) aplica-se a:`,o:[`A) Qualquer investimento acima de 1%`,`B) Coligadas (influencia significativa >=20% votante) e controladas`,`C) So controladas >50% total`,`D) Ativos ao valor justo`,`E) Todas as listadas`],g:`B`,c:`MEP: coligadas (influencia significativa, presuncao >=20% do votante) e controladas. Atualiza o investimento pelo % do PL da investida.`},{a:2019,r:`FCC/BA-2019`,q:`A COMPRA VANTAJOSA (goodwill negativo) e reconhecida:`,o:[`A) No ativo intangivel`,`B) Como ganho no resultado do periodo`,`C) No PL diretamente`,`D) Como passivo`,`E) Amortizada em 10 anos`],g:`B`,c:`Goodwill NEGATIVO (compra vantajosa): ganho reconhecido no RESULTADO imediatamente (apos revisao das mensuracoes).`},{a:2023,r:`FCC/TRT-2023`,q:`No CPC 48 (IFRS 9), os instrumentos financeiros sao classificados em:`,o:[`A) So custo historico`,`B) Custo amortizado, valor justo por ORA e valor justo por resultado`,`C) Apenas valor de mercado`,`D) Valor nominal`,`E) So circulante e nao circulante`],g:`B`,c:`CPC 48: custo amortizado; valor justo por outros resultados abrangentes (ORA); valor justo por resultado (VJR). Modelo de perdas esperadas.`},{a:2022,r:`FCC/RS-2022`,q:`O Ajuste a Valor Presente (AVP) aplica-se a:`,o:[`A) Operacoes a vista`,`B) Ativos e passivos de longo prazo (e relevantes de curto prazo)`,`C) So o imobilizado`,`D) Apenas receitas`,`E) Estoques sempre`],g:`B`,c:`AVP: elementos de longo prazo (e relevantes de curto prazo) trazidos a valor presente, reconhecendo encargo financeiro pro rata.`},{a:2021,r:`FCC/ISS-2021`,q:`A hierarquia do valor justo busca:`,o:[`A) Minimizar disclosure`,`B) Maximizar o uso de dados observaveis e minimizar nao observaveis`,`C) Usar so premissas internas`,`D) Ignorar o mercado`,`E) Adotar custo historico`],g:`B`,c:`CPC 46: MAXIMIZAR dados observaveis (niveis 1 e 2) e minimizar dados nao observaveis (nivel 3).`},{a:2020,r:`FCC/Adm-2020`,q:`O goodwill reconhecido em combinacao de negocios:`,o:[`A) E amortizado em 5 anos`,`B) Nao e amortizado, mas testado por impairment anualmente`,`C) E baixado no resultado`,`D) Vai para o PL`,`E) E reavaliado a valor justo`],g:`B`,c:`Goodwill: NAO amortizado; submetido a teste de IMPAIRMENT anual (ou quando houver indicio de perda).`},{a:2019,r:`FCC/BA-2019`,q:`A subvencao governamental (CPC 07) deve ser:`,o:[`A) Reconhecida direto no PL`,`B) Reconhecida no resultado em base sistematica confrontada com as despesas`,`C) Ignorada`,`D) Tratada como passivo permanente`,`E) Distribuida como dividendo obrigatorio`],g:`B`,c:`CPC 07: subvencao reconhecida no resultado de forma sistematica, confrontada com as despesas que pretende compensar.`}],"COA-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`CF=400.000, PV=200, CV=120. O Ponto de Equilibrio Contabil e:`,o:[`A) 2.000 un`,`B) 3.333 un`,`C) 4.000 un`,`D) 5.000 un`,`E) 6.667 un`],g:`D`,c:`MC=200-120=80. PEC=CF/MC=400.000/80=5.000 unidades.`},{a:2022,r:`FCC/RS-2022`,q:`No custeio por ABSORCAO, os custos fixos sao:`,o:[`A) Tratados como despesa do periodo`,`B) Rateados aos produtos`,`C) Ignorados`,`D) Levados ao PL`,`E) Sempre variaveis`],g:`B`,c:`ABSORCAO: TODOS os custos (fixos+variaveis) sao alocados aos produtos. Exigido pelo fisco e societario.`},{a:2021,r:`FCC/ISS-2021`,q:`A Margem de Contribuicao unitaria e:`,o:[`A) PV - custo fixo unitario`,`B) Preco de venda - custo/despesa variavel unitario`,`C) PV - custo total`,`D) Custo fixo / quantidade`,`E) Lucro / PV`],g:`B`,c:`MC unitaria = Preco de Venda - Custos e Despesas Variaveis unitarios. Cobre os custos fixos e forma o lucro.`},{a:2020,r:`FCC/Adm-2020`,q:`O custeio VARIAVEL e mais adequado para:`,o:[`A) Atender o fisco`,`B) Decisoes gerenciais (nao rateia fixos aos produtos)`,`C) Avaliacao de estoques fiscal`,`D) Demonstracoes societarias`,`E) Auditoria externa`],g:`B`,c:`Custeio VARIAVEL: apenas custos variaveis no produto; fixos sao despesa do periodo. Melhor para DECISAO gerencial. Nao aceito pelo fisco.`},{a:2019,r:`FCC/BA-2019`,q:`O Ponto de Equilibrio FINANCEIRO:`,o:[`A) Inclui o custo de oportunidade`,`B) Exclui a depreciacao dos custos fixos`,`C) E igual ao contabil`,`D) Ignora a MC`,`E) E sempre maior que o economico`],g:`B`,c:`PEF = (CF - depreciacao)/MCu. Considera so as saidas de CAIXA. PEC inclui depreciacao; PEE soma custo de oportunidade.`},{a:2023,r:`FCC/TRT-2023`,q:`O custeio ABC (Activity-Based Costing) aloca custos indiretos por:`,o:[`A) Volume de producao apenas`,`B) Atividades e seus direcionadores de custo`,`C) Rateio simples`,`D) Mao de obra direta`,`E) Material direto`],g:`B`,c:`ABC: rastreia custos indiretos por ATIVIDADES e direcionadores (cost drivers), oferecendo maior precisao em ambientes diversificados.`},{a:2022,r:`FCC/RS-2022`,q:`Custo fixo unitario, com aumento da producao:`,o:[`A) Aumenta`,`B) Diminui (diluicao)`,`C) Permanece constante`,`D) Torna-se variavel`,`E) Zera`],g:`B`,c:`Custo fixo TOTAL e constante; o custo fixo UNITARIO DIMINUI com mais producao (diluicao). Variavel: total cresce, unitario constante.`},{a:2021,r:`FCC/ISS-2021`,q:`O Ponto de Equilibrio ECONOMICO considera:`,o:[`A) So custos contabeis`,`B) Os custos fixos mais o custo de oportunidade do capital`,`C) Menos a depreciacao`,`D) Apenas o caixa`,`E) So custos variaveis`],g:`B`,c:`PEE = (CF + custo de oportunidade)/MCu. Garante remunerar o capital proprio (lucro minimo desejado).`},{a:2020,r:`FCC/Adm-2020`,q:`Custos DIRETOS sao aqueles que:`,o:[`A) Nao podem ser identificados ao produto`,`B) Sao apropriados diretamente ao produto sem rateio`,`C) Sao sempre fixos`,`D) Independem da producao`,`E) Sao despesas administrativas`],g:`B`,c:`Custos DIRETOS: identificados e apropriados diretamente ao produto (materia-prima, MO direta). INDIRETOS exigem rateio.`},{a:2019,r:`FCC/BA-2019`,q:`Na producao conjunta, os subprodutos:`,o:[`A) Tem valor de venda elevado e objetivo principal`,`B) Sao secundarios, de valor reduzido, surgidos naturalmente do processo`,`C) Nao existem`,`D) Sao iguais aos coprodutos`,`E) Geram so prejuizo`],g:`B`,c:`SUBPRODUTOS: itens secundarios, de pequeno valor, surgidos naturalmente. COPRODUTOS: objetivos principais. Sucata: residuo sem processo.`}],"DTR-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`A obrigacao tributaria ACESSORIA tem por objeto:`,o:[`A) Pagamento de tributo ou penalidade`,`B) Prestacoes positivas ou negativas no interesse da arrecadacao/fiscalizacao`,`C) So o pagamento do tributo`,`D) Entrega em cartorio`,`E) Recolhimento antecipado`],g:`B`,c:`Art. 113 par.2: acessoria=prestacoes positivas (emitir NF, escriturar) ou negativas (nao obstruir). Descumprir converte em principal (multa).`},{a:2022,r:`FCC/Fiscal-2022`,q:`Sao causas de SUSPENSAO do credito (art. 151):`,o:[`A) Pagamento, compensacao, remissao`,`B) Moratoria, deposito integral, reclamacoes/recursos, liminar/tutela, parcelamento`,`C) Isencao e anistia`,`D) Decadencia e prescricao`,`E) Dacao em pagamento`],g:`B`,c:`Art. 151 (MDRRLP): Moratoria, Deposito integral, Reclamacoes/Recursos, Liminar/Tutela, Parcelamento.`},{a:2021,r:`FCC/GO-2021`,q:`O lancamento por HOMOLOGACAO caracteriza-se por:`,o:[`A) Fisco agir sozinho`,`B) Contribuinte declarar e Fisco lancar`,`C) Contribuinte antecipar o pagamento sem previo exame`,`D) Ser usado no IPTU`,`E) Dispensar pagamento`],g:`C`,c:`Art. 150: por HOMOLOGACAO, o sujeito passivo antecipa o pagamento sem previo exame. Decadencia: 5 anos do FG. Ex: ICMS, IR, IPI.`},{a:2020,r:`FCC/TRF-2020`,q:`A DECADENCIA tributaria extingue:`,o:[`A) A pretensao de cobrar`,`B) O direito de a Fazenda constituir o credito pelo lancamento`,`C) A execucao fiscal`,`D) O direito de repetir indebito`,`E) O parcelamento`],g:`B`,c:`DECADENCIA (art. 173): extingue o direito de LANCAR. PRESCRICAO (art. 174): extingue a acao de COBRAR. Ambas: 5 anos.`},{a:2019,r:`FCC/RJ-2019`,q:`Sao modalidades de EXTINCAO do credito (art. 156):`,o:[`A) Moratoria e parcelamento`,`B) Pagamento, compensacao, transacao, remissao, prescricao, decadencia`,`C) Isencao e anistia`,`D) Reclamacoes e recursos`,`E) Liminar em MS`],g:`B`,c:`Art. 156 (extincao): pagamento, compensacao, transacao, remissao, prescricao, decadencia, dacao em pagamento etc. Isencao/anistia=exclusao.`},{a:2023,r:`FCC/TRT-2023`,q:`A responsabilidade por SUBSTITUICAO tributaria:`,o:[`A) Surge apos o fato gerador`,`B) Atribui ao substituto a obrigacao desde a origem`,`C) E sempre subsidiaria`,`D) Depende de sucessao`,`E) Exige dolo`],g:`B`,c:`SUBSTITUICAO: o responsavel (substituto) ocupa o lugar do contribuinte desde a origem (ex: ICMS-ST). TRANSFERENCIA: por evento posterior.`},{a:2022,r:`FCC/Fiscal-2022`,q:`A ISENCAO, como causa de EXCLUSAO:`,o:[`A) Extingue o credito`,`B) Dispensa o pagamento do tributo (antes do lancamento)`,`C) Suspende a exigibilidade`,`D) Perdoa a multa`,`E) E o mesmo que imunidade`],g:`B`,c:`ISENCAO: exclui o credito tributario (dispensa o tributo), decorre de lei. ANISTIA: exclui a multa. IMUNIDADE: limitacao constitucional.`},{a:2021,r:`FCC/GO-2021`,q:`A solidariedade tributaria (art. 124):`,o:[`A) Comporta beneficio de ordem`,`B) Nao comporta beneficio de ordem`,`C) Exige contrato`,`D) So entre entes publicos`,`E) Depende de homologacao`],g:`B`,c:`Art. 124 PU: a solidariedade tributaria NAO comporta beneficio de ordem (o Fisco cobra de qualquer um integralmente).`},{a:2020,r:`FCC/TRF-2020`,q:`A responsabilidade do art. 135 (socios-gerentes) ocorre quando:`,o:[`A) Ha mero inadimplemento`,`B) Ha atos com excesso de poderes ou infracao de lei/contrato (dolo)`,`C) Sempre que a empresa deve`,`D) Ha dissolucao regular`,`E) Por culpa leve`],g:`B`,c:`Art. 135: responsabilidade PESSOAL por atos com excesso de poderes/infracao de lei. Sumula 430 STJ: mero inadimplemento nao gera responsabilidade do socio.`},{a:2019,r:`FCC/RJ-2019`,q:`O Fato Gerador da obrigacao principal e:`,o:[`A) Qualquer ato administrativo`,`B) A situacao definida em lei como necessaria e suficiente a sua ocorrencia`,`C) O lancamento`,`D) A inscricao em divida ativa`,`E) O pagamento`],g:`B`,c:`Art. 114: FG da obrigacao principal = situacao definida em lei como NECESSARIA E SUFICIENTE a sua ocorrencia.`}],"DTR-2":[{a:2024,r:`FCC/RT-2024`,q:`A EC 132/2023 criou o IBS, de competencia:`,o:[`A) Federal`,`B) Estadual`,`C) Compartilhada entre estados, DF e municipios`,`D) Municipal`,`E) Uniao e estados`],g:`C`,c:`EC 132/2023: IBS=competencia COMPARTILHADA (estados, DF, municipios), substitui ICMS+ISS, gerido pelo Comite Gestor (art. 156-B).`},{a:2024,r:`FCC-estilo-2024`,q:`O Comite Gestor do IBS tem como funcao:`,o:[`A) Politica monetaria`,`B) Administrar, arrecadar, fiscalizar e cobrar o IBS`,`C) Substituir o CONFAZ totalmente`,`D) Definir o IR`,`E) Regular o ISS municipal isolado`],g:`B`,c:`Art. 156-B: Comite Gestor administra, arrecada, fiscaliza, cobra e representa o IBS. Colegiado de estados, DF e municipios.`},{a:2024,r:`FCC-estilo-2024`,q:`O principio do DESTINO no IBS significa:`,o:[`A) Imposto no local de producao`,`B) Imposto devido no local de consumo`,`C) Aliquota por destino economico`,`D) So importacoes`,`E) Partilha 50/50`],g:`B`,c:`DESTINO: imposto devido no local de CONSUMO, nao de producao. Reduz a guerra fiscal, alinha-se ao IVA internacional.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A CBS substitui:`,o:[`A) IPI e ICMS`,`B) PIS e COFINS`,`C) IRPJ e CSLL`,`D) IOF e ITR`,`E) IPI e IOF`],g:`B`,c:`CBS=Contribuicao sobre Bens e Servicos: substitui PIS e COFINS. Competencia FEDERAL, administracao pela Receita Federal.`},{a:2023,r:`FCC/SEFAZ-2023`,q:`O Imposto Seletivo (IS) incide sobre:`,o:[`A) Exportacoes`,`B) Operacoes financeiras`,`C) Bens/servicos prejudiciais a saude ou ao meio ambiente`,`D) Combustiveis substituindo o ICMS`,`E) Todo consumo a 1%`],g:`C`,c:`IS (art. 153, VIII): bens/servicos PREJUDICIAIS a saude ou ao meio ambiente. Federal. Nao integra a base do IBS/CBS.`},{a:2024,r:`FCC-estilo-2024`,q:`O modelo de tributacao sobre consumo da reforma e do tipo:`,o:[`A) Cumulativo`,`B) IVA dual (IBS subnacional + CBS federal)`,`C) Monofasico geral`,`D) Imposto unico federal`,`E) So estadual`],g:`B`,c:`Reforma adota IVA DUAL: IBS (estados/municipios) + CBS (federal), com nao-cumulatividade plena e principio do destino.`},{a:2024,r:`FCC-estilo-2024`,q:`A nao-cumulatividade PLENA do IBS significa:`,o:[`A) Credito so fisico`,`B) Credito amplo de todo IBS pago nas etapas anteriores`,`C) Sem direito a credito`,`D) Credito so do ativo`,`E) Credito so de insumos industriais`],g:`B`,c:`Nao-cumulatividade PLENA: credito amplo de todo o IBS que onerou as aquisicoes, com poucas excecoes (uso/consumo pessoal).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A transicao da reforma tributaria conclui-se em:`,o:[`A) 2026`,`B) 2027`,`C) 2029`,`D) 2033`,`E) 2040`],g:`D`,c:`Transicao: inicio em 2026 (teste 0,1%), CBS plena em 2027, reducao gradual do ICMS/ISS 2029-2032, sistema completo em 2033.`},{a:2024,r:`FCC-estilo-2024`,q:`O cashback previsto na reforma destina-se a:`,o:[`A) Grandes empresas`,`B) Devolucao de tributo a familias de baixa renda`,`C) Exportadores`,`D) Estados deficitarios`,`E) Importadores`],g:`B`,c:`Cashback: devolucao de parte do IBS/CBS a familias de BAIXA RENDA, reduzindo a regressividade do consumo.`},{a:2023,r:`FCC/SEFAZ-2023`,q:`A CBS sera administrada pela:`,o:[`A) Comite Gestor do IBS`,`B) Receita Federal do Brasil`,`C) Secretarias estaduais`,`D) CONFAZ`,`E) Banco Central`],g:`B`,c:`CBS (federal): administrada pela RECEITA FEDERAL. O IBS (subnacional) e administrado pelo Comite Gestor.`}],"DTR-3":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Na LC 87/96, o credito do ICMS sobre ATIVO PERMANENTE:`,o:[`A) E integral no mes`,`B) E a razao de 1/48 por mes`,`C) Nao gera credito`,`D) So para industria`,`E) Em qualquer prazo`],g:`B`,c:`LC 87/96 art. 20 par.5: ativo permanente -> credito a razao de 1/48 por mes (4 anos).`},{a:2022,r:`FCC/Fiscal-2022`,q:`Os convenios CONFAZ (LC 24/75) sao aprovados por:`,o:[`A) Maioria simples`,`B) Unanimidade dos estados presentes`,`C) 2/3 dos estados`,`D) Decisao do STF`,`E) Maioria absoluta`],g:`B`,c:`LC 24/75: convenios de ICMS exigem UNANIMIDADE dos presentes (minimo 4/5). Um estado pode vetar.`},{a:2021,r:`FCC/SEFAZ-2021`,q:`No Simples Nacional (LC 123/2006), o ICMS-ST:`,o:[`A) Entra no DAS`,`B) E recolhido separadamente, fora do DAS`,`C) E isento`,`D) Tem aliquota zero`,`E) E facultativo`],g:`B`,c:`ICMS-ST NAO entra no DAS: recolhido SEPARADAMENTE. O DAS reune os demais tributos do Simples em guia unica.`},{a:2020,r:`FCC/Adm-2020`,q:`A nao-cumulatividade do ICMS (LC 87/96) permite:`,o:[`A) Credito so na industria`,`B) Compensar o imposto devido com o cobrado nas etapas anteriores`,`C) Credito de uso e consumo ja`,`D) Credito ilimitado`,`E) Nenhum credito`],g:`B`,c:`Nao-cumulatividade: compensa-se o ICMS devido com o montante cobrado nas operacoes anteriores. Uso e consumo: vedado ate 2033.`},{a:2019,r:`FCC/RS-2019`,q:`As aliquotas interestaduais de ICMS sao:`,o:[`A) Sempre 18%`,`B) 7% ou 12% conforme a regiao de destino`,`C) 25%`,`D) Definidas por cada estado`,`E) Zero`],g:`B`,c:`Aliquotas interestaduais: 7% (Sul/Sudeste -> Norte/Nordeste/CO/ES) e 12% (demais). Fixadas por Resolucao do Senado.`},{a:2023,r:`FCC/TRT-2023`,q:`A LC 116/2003 trata do:`,o:[`A) ICMS`,`B) ISS (Imposto Sobre Servicos) - competencia municipal`,`C) IPVA`,`D) ITCD`,`E) IPI`],g:`B`,c:`LC 116/2003: normas gerais do ISSQN, competencia MUNICIPAL. Lista anexa define os servicos tributaveis pelo ISS.`},{a:2022,r:`FCC/Fiscal-2022`,q:`O DIFAL (EC 87/2015) e cobrado:`,o:[`A) So nas importacoes`,`B) Na operacao interestadual destinada a consumidor final`,`C) Em todas as vendas internas`,`D) So no Simples`,`E) Nunca`],g:`B`,c:`DIFAL: diferencial de aliquota nas operacoes interestaduais destinadas a consumidor final (contribuinte ou nao do imposto).`},{a:2021,r:`FCC/SEFAZ-2021`,q:`A LC 160/2017 tratou de:`,o:[`A) Criar o IBS`,`B) Remissao/convalidacao de beneficios de ICMS concedidos sem convenio`,`C) Extinguir o ICMS`,`D) Aumentar aliquotas`,`E) Criar o Simples`],g:`B`,c:`LC 160/2017: permitiu a remissao e convalidacao de beneficios fiscais de ICMS concedidos sem convenio (guerra fiscal pretérita).`},{a:2020,r:`FCC/Adm-2020`,q:`No Simples Nacional, os limites de receita sao (anual):`,o:[`A) MEI 81 mil, ME 360 mil, EPP 4,8 milhoes`,`B) MEI 60 mil, ME 300 mil, EPP 3,6 milhoes`,`C) MEI 100 mil, ME 500 mil, EPP 5 milhoes`,`D) Sem limite`,`E) ME 1 milhao`],g:`A`,c:`LC 123: MEI ate 81 mil/ano, ME ate 360 mil, EPP ate 4,8 milhoes. Acima -> exclusao do regime.`},{a:2019,r:`FCC/RS-2019`,q:`A LC 105/2001 trata:`,o:[`A) Do Simples Nacional`,`B) Do sigilo bancario e seu acesso pelo Fisco`,`C) Do ISS`,`D) Do IPVA`,`E) Da reforma tributaria`],g:`B`,c:`LC 105/2001: dispoe sobre o sigilo das operacoes financeiras e o acesso de dados bancarios pela administracao tributaria.`}],"LTE-1":[{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O 'ICMS por dentro' significa que:`,o:[`A) Calcula-se excluindo o tributo`,`B) O ICMS integra a propria base de calculo`,`C) Incide so na industria`,`D) E recolhido antes da NF`,`E) Substitui tributos municipais`],g:`B`,c:`ICMS por dentro: BC=valor sem ICMS/(1-aliquota). Ex: 82/0,82=100 -> ICMS=18. Aliquota efetiva (21,95%) > nominal (18%).`},{a:2022,r:`FCC/SEFAZ-CE-2022`,q:`A substituicao tributaria PROGRESSIVA no ICMS-CE:`,o:[`A) Responsabiliza o adquirente pelas etapas anteriores`,`B) Atribui ao fabricante/importador o ICMS das etapas subsequentes`,`C) E inconstitucional`,`D) Dispensa NF`,`E) So para essenciais`],g:`B`,c:`ST progressiva (para frente): substituto (fabricante/importador) recolhe o ICMS das etapas futuras (MVA/pauta). FG presumido nao ocorrido -> restituicao.`},{a:2021,r:`FCC/SEFAZ-CE-2021`,q:`O ITCD do Ceara (Lei 15.812/2015) incide sobre:`,o:[`A) Transmissao onerosa de imoveis`,`B) Transmissao causa mortis e doacao de quaisquer bens`,`C) Circulacao de mercadorias`,`D) Servicos`,`E) Propriedade de veiculos`],g:`B`,c:`ITCD-CE: causa mortis (heranca) e doacao de quaisquer bens/direitos. Competencia estadual. Aliquotas progressivas; maxima 8%.`},{a:2020,r:`FCC/SEFAZ-CE-2020`,q:`O FECOP do Ceara (LC 37/2003) consiste em:`,o:[`A) Fundo previdenciario`,`B) Adicional de ICMS de ate 2% sobre superfluos para combate a pobreza`,`C) Taxa de importacao`,`D) Contribuicao de melhoria`,`E) Fundo de equalizacao`],g:`B`,c:`FECOP: Fundo Estadual de Combate a Pobreza, adicional de ICMS de ate 2% sobre produtos superfluos. Base: art. 82 ADCT.`},{a:2019,r:`FCC/SEFAZ-CE-2019`,q:`O IPVA-CE (Lei 12.023/1992) tem como fato gerador:`,o:[`A) Transmissao do veiculo`,`B) Propriedade de veiculo automotor em 1 de janeiro`,`C) Circulacao em rodovias`,`D) Licenciamento`,`E) Importacao`],g:`B`,c:`IPVA: propriedade de veiculo automotor em 1 de janeiro. Base de calculo: valor venal. Aliquotas diferenciadas por tipo de veiculo.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O contribuinte do ICMS-CE e:`,o:[`A) So a industria`,`B) Quem realiza operacoes de circulacao com habitualidade ou volume`,`C) So o consumidor final`,`D) Apenas importadores`,`E) So atacadistas`],g:`B`,c:`Contribuinte: quem realiza, com habitualidade ou em volume que caracterize intuito comercial, operacoes de circulacao de mercadorias ou prestacoes.`},{a:2022,r:`FCC/SEFAZ-CE-2022`,q:`Na nao-cumulatividade do ICMS-CE, o credito de uso e consumo:`,o:[`A) E permitido desde ja`,`B) Esta vedado ate 2033`,`C) E integral`,`D) E de 1/48`,`E) Nunca existira`],g:`B`,c:`Material de uso e consumo: credito VEDADO ate 2033 (LC 87/96 art. 33, aplicada no CE). Ativo permanente: 1/48 por mes.`},{a:2021,r:`FCC/SEFAZ-CE-2021`,q:`O diferimento (ST regressiva) no ICMS-CE:`,o:[`A) Antecipa o imposto`,`B) Posterga o recolhimento para etapa posterior`,`C) Isenta o produto`,`D) Dobra a aliquota`,`E) Dispensa a NF`],g:`B`,c:`DIFERIMENTO (ST regressiva/para tras): posterga o recolhimento do ICMS para etapa posterior da cadeia (ex: produtor rural).`},{a:2020,r:`FCC/SEFAZ-CE-2020`,q:`A base de calculo do ITCD-CE e:`,o:[`A) O valor venal do bem ou direito transmitido`,`B) O valor de aquisicao historico`,`C) O dobro do IPTU`,`D) A renda do herdeiro`,`E) O valor simbolico`],g:`A`,c:`ITCD: base de calculo = valor venal (de mercado) do bem ou direito transmitido por heranca ou doacao.`},{a:2019,r:`FCC/SEFAZ-CE-2019`,q:`O RICMS-CE foi aprovado pelo:`,o:[`A) Decreto 33.327/2019`,`B) Lei federal 5.172/66`,`C) LC 87/96`,`D) EC 132/2023`,`E) Lei 12.023/92`],g:`A`,c:`O RICMS-CE atual e o Decreto 33.327/2019, que regulamenta o ICMS no Ceara (consolidado com a Lei 18.665/2023).`}],"FLD-1":[{a:2023,r:`FCC/TI-2023`,q:`A clausula HAVING em SQL:`,o:[`A) Filtra linhas antes do agrupamento`,`B) Filtra grupos apos o GROUP BY`,`C) Ordena resultados`,`D) Define colunas`,`E) Substitui o WHERE em linhas`],g:`B`,c:`HAVING filtra GRUPOS apos GROUP BY (usa SUM, COUNT, AVG). WHERE filtra LINHAS antes, sem funcoes de agregacao.`},{a:2022,r:`FCC/Analista-2022`,q:`O Data Lakehouse combina:`,o:[`A) So dados relacionais`,`B) Flexibilidade do Data Lake com ACID e performance do Data Warehouse`,`C) So tempo real`,`D) Banco operacional e Data Mart`,`E) Nuvem e on-premises`],g:`B`,c:`Lakehouse: une dados brutos do Data Lake + transacoes ACID + performance analitica do DW (ex: Delta Lake, Iceberg).`},{a:2021,r:`FCC/TI-2021`,q:`A base legal da LGPD para o Fisco tratar dados de fiscalizacao e:`,o:[`A) Consentimento`,`B) Legitimo interesse`,`C) Cumprimento de obrigacao legal/regulatoria`,`D) Execucao de contrato`,`E) Protecao da vida`],g:`C`,c:`Art. 7, II LGPD: cumprimento de obrigacao legal ou regulatoria. A fiscalizacao tributaria e obrigacao legal (CTN art. 194), dispensa consentimento.`},{a:2020,r:`FCC/TI-2020`,q:`O processo ETL realiza:`,o:[`A) So encriptacao`,`B) Extracao de multiplas fontes, transformacao e carga em repositorio`,`C) Backups`,`D) Monitoramento de qualidade so`,`E) Indexacao`],g:`B`,c:`ETL: Extract (coleta), Transform (limpeza/padronizacao), Load (carga no DW/Lakehouse). ELT inverte transform e load (cloud).`},{a:2019,r:`FCC/Analista-2019`,q:`O LEFT JOIN retorna:`,o:[`A) So correspondencias em ambas`,`B) Todos os registros da esquerda + correspondentes da direita (NULL se nao)`,`C) Produto cartesiano`,`D) So a direita`,`E) Apenas duplicatas`],g:`B`,c:`LEFT JOIN: todos da tabela esquerda + correspondentes da direita (NULL onde nao ha). INNER: so correspondencias; CROSS: produto cartesiano.`},{a:2023,r:`FCC/TI-2023`,q:`Em um Data Warehouse, o esquema e tipicamente:`,o:[`A) Schema-on-read`,`B) Schema-on-write (dados curados na entrada)`,`C) Sem esquema`,`D) Apenas NoSQL`,`E) Grafo`],g:`B`,c:`DW: schema-on-WRITE (estrutura definida na carga, dados curados). Data Lake: schema-on-READ (estrutura na leitura, dados brutos).`},{a:2022,r:`FCC/Analista-2022`,q:`O encarregado de dados (DPO) na LGPD:`,o:[`A) E o titular dos dados`,`B) E o canal entre controlador, titulares e a ANPD`,`C) E o operador`,`D) Define a base legal sozinho`,`E) Audita o sistema`],g:`B`,c:`DPO (encarregado): canal de comunicacao entre o controlador, os titulares e a ANPD (Autoridade Nacional de Protecao de Dados).`},{a:2021,r:`FCC/TI-2021`,q:`Dados semiestruturados sao representados por formatos como:`,o:[`A) Tabelas relacionais`,`B) JSON e XML`,`C) Imagens puras`,`D) Texto livre`,`E) Video`],g:`B`,c:`Semiestruturados: JSON, XML (tem marcadores/tags mas nao esquema rigido). Estruturados=tabelas; nao estruturados=texto/imagem/video.`},{a:2020,r:`FCC/TI-2020`,q:`A triade CIA da seguranca da informacao significa:`,o:[`A) Controle, Integracao, Auditoria`,`B) Confidencialidade, Integridade, Disponibilidade`,`C) Criptografia, Identidade, Acesso`,`D) Custo, Impacto, Analise`,`E) Cloud, IA, Analytics`],g:`B`,c:`CIA: Confidencialidade (sigilo), Integridade (nao adulteracao), Disponibilidade (acesso quando necessario).`},{a:2019,r:`FCC/Analista-2019`,q:`A ordem de execucao logica de uma consulta SQL inicia por:`,o:[`A) SELECT`,`B) FROM`,`C) WHERE`,`D) ORDER BY`,`E) GROUP BY`],g:`B`,c:`Ordem de execucao: FROM -> JOIN -> WHERE -> GROUP BY -> HAVING -> SELECT -> ORDER BY -> LIMIT. SELECT vem depois do agrupamento.`}],"FPB-1":[{a:2023,r:`FCC/Fiscal-2023`,q:`As tres funcoes do governo (Musgrave) sao:`,o:[`A) Arrecadar, fiscalizar, redistribuir`,`B) Alocativa, distributiva, estabilizadora`,`C) Regulatoria, tributaria, redistributiva`,`D) Planejar, executar, controlar`,`E) Producao, monopolio, externalidade`],g:`B`,c:`Musgrave: ALOCATIVA (falhas de mercado), DISTRIBUTIVA (desigualdade), ESTABILIZADORA (emprego/precos/crescimento).`},{a:2022,r:`FCC/Fiscal-2022`,q:`Os bens publicos PUROS caracterizam-se por:`,o:[`A) Rivalidade e exclusao`,`B) Nao rivalidade e nao exclusao (free rider)`,`C) Rivalidade e nao exclusao`,`D) Nao rivalidade e exclusao`,`E) Alta rivalidade`],g:`B`,c:`Bem publico puro: NAO RIVAL + NAO EXCLUDENTE -> free rider -> mercado falha -> Estado prove. Ex: defesa nacional, iluminacao publica.`},{a:2021,r:`FCC/TCE-2021`,q:`O superavit primario indica que:`,o:[`A) Pagou todos os juros sem deficit`,`B) Receitas nao financeiras > despesas nao financeiras, antes dos juros`,`C) A divida total caiu`,`D) O nominal e positivo`,`E) Nao houve nova divida`],g:`B`,c:`Superavit PRIMARIO: esforco fiscal antes dos juros. Pode coexistir com deficit nominal (se os juros superarem o superavit).`},{a:2020,r:`FCC/Econ-2020`,q:`A externalidade NEGATIVA gera falha porque:`,o:[`A) Produz pouco`,`B) Custo social > privado; mercado produz em excesso`,`C) Empresas nao lucram`,`D) E bem publico`,`E) Exige subsidio`],g:`B`,c:`Externalidade negativa: custo social > privado -> producao acima do otimo. Solucao: imposto pigouviano (poluidor-pagador).`},{a:2019,r:`FCC/Econ-2019`,q:`A NFSP nominal e:`,o:[`A) Primario - juros reais`,`B) Deficit primario + juros nominais`,`C) Receitas - despesas`,`D) Variacao da divida - correcao`,`E) Operacional + cambio`],g:`B`,c:`NFSP nominal = deficit primario + juros nominais (= -resultado primario + juros). Mede a variacao da divida liquida do setor publico.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A funcao DISTRIBUTIVA do governo atua por meio de:`,o:[`A) Controle da inflacao`,`B) Impostos progressivos, transferencias e subsidios`,`C) Provisao de defesa nacional`,`D) Politica monetaria`,`E) Regulacao de monopolios`],g:`B`,c:`Funcao DISTRIBUTIVA: reduzir desigualdade via impostos progressivos, transferencias (programas sociais) e subsidios.`},{a:2022,r:`FCC/Fiscal-2022`,q:`A externalidade POSITIVA (ex: vacinacao):`,o:[`A) Gera producao em excesso`,`B) Gera producao abaixo do otimo; solucao: subsidio`,`C) E um bem privado puro`,`D) Exige imposto`,`E) Cria monopolio`],g:`B`,c:`Externalidade positiva: beneficio social > privado -> producao ABAIXO do otimo. Solucao: subsidio ou provisao publica.`},{a:2021,r:`FCC/TCE-2021`,q:`O resultado NOMINAL do setor publico:`,o:[`A) Exclui os juros`,`B) Inclui os juros nominais (primario - juros)`,`C) E sempre superavitario`,`D) Ignora a divida`,`E) Mede so o PIB`],g:`B`,c:`NOMINAL = primario - juros nominais. Reflete a variacao total da divida. PRIMARIO exclui os juros (mede esforco fiscal).`},{a:2020,r:`FCC/Econ-2020`,q:`O monopolio natural justifica intervencao porque:`,o:[`A) Ha muitos concorrentes`,`B) Custos decrescentes tornam ineficiente a duplicacao -> regulacao`,`C) E bem publico`,`D) Gera externalidade positiva`,`E) Tem demanda elastica`],g:`B`,c:`Monopolio natural: custos medios decrescentes (uma so firma atende com menor custo). Estado regula (preco/qualidade) para evitar abuso.`},{a:2019,r:`FCC/Econ-2019`,q:`O criterio do BENEFICIO na tributacao defende que:`,o:[`A) Paga mais quem tem mais renda`,`B) Paga quem se beneficia do gasto publico, na proporcao do beneficio`,`C) Todos pagam igual`,`D) So empresas pagam`,`E) Tributa-se o consumo`],g:`B`,c:`Criterio do BENEFICIO: o tributo deve ser pago por quem se beneficia do servico publico (ex: taxas, contribuicao de melhoria). Alternativa: capacidade contributiva.`}]},p=e((e=>{var t=Symbol.for(`react.transitional.element`);func
