alarios a pagar, contas a pagar).`},{a:2022,r:`FCC/ISS-2022`,q:`A conta 'Adiantamento de Clientes' e classificada como:`,o:[`A) Ativo`,`B) Passivo (obrigacao de entregar bem/servico)`,`C) Receita`,`D) Patrimonio liquido`,`E) Despesa`],g:`B`,c:`Adiantamento de clientes: o cliente paga antes, criando uma OBRIGACAO (passivo) de entregar o bem/servico futuramente. So vira receita quando a obrigacao for cumprida.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Lucro antes do IR de 500.000, aliquota total de 34%. O IR/CSLL e o lucro liquido sao:`,o:[`A) 150.000 e 350.000`,`B) 170.000 e 330.000`,`C) 100.000 e 400.000`,`D) 200.000 e 300.000`,`E) 170.000 e 500.000`],g:`B`,c:`IR/CSLL = 500.000 x 34% = 170.000. Lucro liquido = 500.000 - 170.000 = 330.000.`},{a:2023,r:`FCC/RS-2023`,q:`O 'goodwill' (agio por expectativa de rentabilidade futura) e classificado no:`,o:[`A) Passivo`,`B) Ativo intangivel`,`C) Ativo circulante`,`D) Patrimonio liquido`,`E) Resultado`],g:`B`,c:`O GOODWILL adquirido em combinacao de negocios e ATIVO INTANGIVEL, nao amortizavel, sujeito a teste de impairment anual.`},{a:2022,r:`FCC/ISS-2022`,q:`A DMPL demonstra:`,o:[`A) O caixa`,`B) As mutacoes (variacoes) das contas do patrimonio liquido no periodo`,`C) O resultado`,`D) Os estoques`,`E) A divida`],g:`B`,c:`DMPL (Demonstracao das Mutacoes do Patrimonio Liquido): evidencia todas as VARIACOES das contas do PL (capital, reservas, lucros/prejuizos) durante o exercicio.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Margem liquida de 12% sobre receita de 2.000.000 significa lucro liquido de:`,o:[`A) 120.000`,`B) 240.000`,`C) 24.000`,`D) 200.000`,`E) 360.000`],g:`B`,c:`Margem liquida = lucro liquido/receita. Lucro = 12% x 2.000.000 = 240.000.`},{a:2023,r:`FCC/RS-2023`,q:`O ciclo operacional de uma empresa compreende o periodo:`,o:[`A) Do pagamento ao recebimento`,`B) Da compra/producao ate o recebimento da venda`,`C) Do lucro ao dividendo`,`D) Da abertura ao fechamento`,`E) Da emissao da nota ao empenho`],g:`B`,c:`CICLO OPERACIONAL: tempo entre a aquisicao/producao do estoque e o RECEBIMENTO das vendas (PME + PMR). O ciclo de caixa desconta o prazo de pagamento a fornecedores (PMP).`}],"COA-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No CPC 46, os dados de NIVEL 1 da hierarquia de valor justo sao:`,o:[`A) Dados nao observaveis`,`B) Premissas da entidade`,`C) Precos cotados em mercado ativo para ativos identicos`,`D) Ativos similares`,`E) Fluxo de caixa descontado`],g:`C`,c:`Nivel 1: precos cotados em mercado ATIVO para ativos IDENTICOS (maior confiabilidade). Nivel 3: nao observaveis (premissas internas).`},{a:2022,r:`FCC/RS-2022`,q:`No CPC 06 R2 (IFRS 16), o arrendatario reconhece:`,o:[`A) Apenas despesa linear`,`B) Ativo de direito de uso e passivo de arrendamento`,`C) Passivo contingente`,`D) Receita diferida`,`E) Apenas nas notas`],g:`B`,c:`CPC 06 R2: arrendatario reconhece ATIVO DE DIREITO DE USO + PASSIVO DE ARRENDAMENTO. Excecoes: <=12 meses e baixo valor.`},{a:2021,r:`FCC/ISS-2021`,q:`O GOODWILL positivo (CPC 15) ocorre quando:`,o:[`A) VJ liquido > contraprestacao`,`B) Contraprestacao+PNC+interesse previo > VJ liquido dos ativos/passivos`,`C) A adquirida tem prejuizo`,`D) Valor contabil > mercado`,`E) Ha marca famosa`],g:`B`,c:`Goodwill = (contraprestacao + PNC + interesse previo) - VJ liquido. Positivo=goodwill (intangivel, impairment anual); negativo=compra vantajosa (resultado).`},{a:2020,r:`FCC/Adm-2020`,q:`O MEP (CPC 18) aplica-se a:`,o:[`A) Qualquer investimento acima de 1%`,`B) Coligadas (influencia significativa >=20% votante) e controladas`,`C) So controladas >50% total`,`D) Ativos ao valor justo`,`E) Todas as listadas`],g:`B`,c:`MEP: coligadas (influencia significativa, presuncao >=20% do votante) e controladas. Atualiza o investimento pelo % do PL da investida.`},{a:2019,r:`FCC/BA-2019`,q:`A COMPRA VANTAJOSA (goodwill negativo) e reconhecida:`,o:[`A) No ativo intangivel`,`B) Como ganho no resultado do periodo`,`C) No PL diretamente`,`D) Como passivo`,`E) Amortizada em 10 anos`],g:`B`,c:`Goodwill NEGATIVO (compra vantajosa): ganho reconhecido no RESULTADO imediatamente (apos revisao das mensuracoes).`},{a:2023,r:`FCC/TRT-2023`,q:`No CPC 48 (IFRS 9), os instrumentos financeiros sao classificados em:`,o:[`A) So custo historico`,`B) Custo amortizado, valor justo por ORA e valor justo por resultado`,`C) Apenas valor de mercado`,`D) Valor nominal`,`E) So circulante e nao circulante`],g:`B`,c:`CPC 48: custo amortizado; valor justo por outros resultados abrangentes (ORA); valor justo por resultado (VJR). Modelo de perdas esperadas.`},{a:2022,r:`FCC/RS-2022`,q:`O Ajuste a Valor Presente (AVP) aplica-se a:`,o:[`A) Operacoes a vista`,`B) Ativos e passivos de longo prazo (e relevantes de curto prazo)`,`C) So o imobilizado`,`D) Apenas receitas`,`E) Estoques sempre`],g:`B`,c:`AVP: elementos de longo prazo (e relevantes de curto prazo) trazidos a valor presente, reconhecendo encargo financeiro pro rata.`},{a:2021,r:`FCC/ISS-2021`,q:`A hierarquia do valor justo busca:`,o:[`A) Minimizar disclosure`,`B) Maximizar o uso de dados observaveis e minimizar nao observaveis`,`C) Usar so premissas internas`,`D) Ignorar o mercado`,`E) Adotar custo historico`],g:`B`,c:`CPC 46: MAXIMIZAR dados observaveis (niveis 1 e 2) e minimizar dados nao observaveis (nivel 3).`},{a:2020,r:`FCC/Adm-2020`,q:`O goodwill reconhecido em combinacao de negocios:`,o:[`A) E amortizado em 5 anos`,`B) Nao e amortizado, mas testado por impairment anualmente`,`C) E baixado no resultado`,`D) Vai para o PL`,`E) E reavaliado a valor justo`],g:`B`,c:`Goodwill: NAO amortizado; submetido a teste de IMPAIRMENT anual (ou quando houver indicio de perda).`},{a:2019,r:`FCC/BA-2019`,q:`A subvencao governamental (CPC 07) deve ser:`,o:[`A) Reconhecida direto no PL`,`B) Reconhecida no resultado em base sistematica confrontada com as despesas`,`C) Ignorada`,`D) Tratada como passivo permanente`,`E) Distribuida como dividendo obrigatorio`],g:`B`,c:`CPC 07: subvencao reconhecida no resultado de forma sistematica, confrontada com as despesas que pretende compensar.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No CPC 47 (Receita de Contrato com Cliente), a receita e reconhecida quando:`,o:[`A) O caixa e recebido`,`B) A entidade satisfaz a obrigacao de desempenho (transfere o controle)`,`C) O contrato e assinado`,`D) A nota e emitida`,`E) No fim do periodo`],g:`B`,c:`CPC 47/IFRS 15: 5 passos; a receita e reconhecida quando (ou a medida que) a obrigacao de desempenho e satisfeita, com a transferencia do controle do bem/servico.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O custo de emprestimos (CPC 20) atribuivel a ativo qualificavel deve ser:`,o:[`A) Sempre despesa`,`B) Capitalizado como parte do custo do ativo`,`C) Reconhecido no PL`,`D) Ignorado`,`E) Levado a reserva`],g:`B`,c:`CPC 20: custos de emprestimos diretamente atribuiveis a aquisicao/construcao de ativo qualificavel sao CAPITALIZADOS; os demais sao despesa.`},{a:2022,r:`FCC/PGE-2022`,q:`No CPC 27, a reavaliacao de imobilizado (quando adotada):`,o:[`A) E vedada no Brasil`,`B) Permite mensurar pelo valor justo, com aumento em outros resultados abrangentes`,`C) Vai sempre ao resultado`,`D) Reduz o capital`,`E) Nao afeta a depreciacao`],g:`B`,c:`O modelo de reavaliacao (CPC 27) mensura pelo valor justo; o aumento vai a ORA (reserva de reavaliacao). No Brasil societario o uso e restrito, mas o conceito e cobrado.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No CPC 32 (Tributos sobre o Lucro), o imposto diferido surge de:`,o:[`A) Diferencas permanentes`,`B) Diferencas temporarias entre base contabil e fiscal`,`C) Multas fiscais`,`D) Subvencoes`,`E) Dividendos`],g:`B`,c:`CPC 32: o tributo diferido decorre de DIFERENCAS TEMPORARIAS (tributaveis -> passivo diferido; dedutiveis -> ativo diferido) e de prejuizos fiscais a compensar.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O valor recuperavel de um ativo (CPC 01) e o:`,o:[`A) Custo historico`,`B) Maior valor entre o valor justo liquido de despesas e o valor em uso`,`C) Valor contabil`,`D) Valor de mercado apenas`,`E) Custo de reposicao`],g:`B`,c:`CPC 01: valor recuperavel = MAIOR entre (valor justo - despesas de venda) e (valor em uso = VP dos fluxos futuros). Se contabil > recuperavel, ha impairment.`},{a:2022,r:`FCC/PGE-2022`,q:`No CPC 16, NAO integra o custo dos estoques:`,o:[`A) Custo de aquisicao`,`B) Custos de transformacao`,`C) Gastos gerais de administracao nao relacionados a producao`,`D) Fretes de compra`,`E) Impostos nao recuperaveis`],g:`C`,c:`CPC 16: despesas administrativas gerais e perdas anormais NAO integram o custo do estoque (vao a resultado). Integram: aquisicao, transformacao e outros para deixar pronto.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A mensuracao a valor justo prioriza, na hierarquia (CPC 46):`,o:[`A) Premissas internas`,`B) Precos cotados em mercado ativo (nivel 1)`,`C) Custo historico`,`D) Fluxo de caixa`,`E) Valor de reposicao`],g:`B`,c:`CPC 46: a hierarquia prioriza o Nivel 1 (precos cotados em mercado ativo para ativos identicos), depois Nivel 2 (observaveis) e por ultimo Nivel 3 (nao observaveis).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Provisao difere de passivo contingente porque a provisao:`,o:[`A) Nunca e reconhecida`,`B) E reconhecida no passivo (obrigacao presente provavel e mensuravel)`,`C) So vai em nota explicativa`,`D) E um ativo`,`E) Depende de acao judicial transitada`],g:`B`,c:`CPC 25: PROVISAO e passivo de prazo/valor incertos, reconhecida quando provavel e mensuravel. Passivo CONTINGENTE (possivel) so e divulgado em nota; remoto nao se divulga.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No CPC 47, o preco da transacao deve ser alocado:`,o:[`A) Igualmente entre periodos`,`B) As obrigacoes de desempenho com base no preco de venda individual (stand-alone)`,`C) Todo na assinatura`,`D) No recebimento`,`E) No fim do contrato`],g:`B`,c:`CPC 47 (passo 4): o preco da transacao e alocado a cada obrigacao de desempenho proporcionalmente ao preco de venda INDIVIDUAL (stand-alone selling price).`},{a:2023,r:`FCC/Fiscal-2023`,q:`No CPC 06 (R2), o arrendatario NAO reconhece ativo de direito de uso quando:`,o:[`A) O prazo e de 5 anos`,`B) O arrendamento e de curto prazo (ate 12 meses) ou de baixo valor`,`C) Ha opcao de compra`,`D) O bem e imovel`,`E) Ha pagamentos variaveis`],g:`B`,c:`CPC 06 R2: o arrendatario pode NAO reconhecer ativo/passivo nos arrendamentos de CURTO PRAZO (<=12 meses) e de BAIXO VALOR (lancando como despesa).`},{a:2022,r:`FCC/PGE-2022`,q:`A mensuracao subsequente de propriedade para investimento (CPC 28) pode ser pelo:`,o:[`A) Custo apenas`,`B) Metodo do custo ou do valor justo (escolha de politica contabil)`,`C) Valor de mercado obrigatorio`,`D) Valor presente`,`E) Custo de reposicao`],g:`B`,c:`CPC 28: apos o reconhecimento, a propriedade para investimento pode ser mensurada pelo CUSTO ou pelo VALOR JUSTO (politica aplicada a todas).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No CPC 32, o ativo fiscal diferido decorre de:`,o:[`A) Diferencas permanentes`,`B) Diferencas temporarias dedutiveis e prejuizos fiscais a compensar`,`C) Multas`,`D) Dividendos`,`E) Reavaliacao`],g:`B`,c:`Ativo fiscal diferido: diferencas temporarias DEDUTIVEIS e prejuizos fiscais/bases negativas a compensar, desde que provavel lucro tributavel futuro.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A combinacao de negocios (CPC 15) e contabilizada pelo metodo:`,o:[`A) Da equivalencia`,`B) De aquisicao (purchase method)`,`C) Da consolidacao proporcional`,`D) Do custo`,`E) Do valor justo do PL`],g:`B`,c:`CPC 15: combinacoes de negocios sao contabilizadas pelo METODO DE AQUISICAO - identifica-se o adquirente, mensura-se a contraprestacao e reconhece-se o goodwill/compra vantajosa.`},{a:2022,r:`FCC/PGE-2022`,q:`Os Outros Resultados Abrangentes (ORA) compreendem itens que:`,o:[`A) Transitam pelo resultado`,`B) Afetam o PL sem transitar pelo resultado do periodo (ex: ajuste de avaliacao patrimonial)`,`C) Sao despesas`,`D) Sao receitas de venda`,`E) Reduzem o capital`],g:`B`,c:`ORA: variacoes patrimoniais que ainda nao transitam pelo resultado (ex: ganhos de instrumentos a valor justo por ORA, ajustes de conversao, reavaliacao). Compoem o resultado abrangente total.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No teste de impairment, a unidade geradora de caixa (UGC) e:`,o:[`A) Um unico ativo sempre`,`B) O menor grupo de ativos que gera entradas de caixa independentes`,`C) A empresa toda`,`D) Um passivo`,`E) O estoque`],g:`B`,c:`CPC 01: quando nao se pode estimar o valor recuperavel de um ativo isolado, usa-se a UGC = menor grupo identificavel de ativos que gera fluxos de caixa amplamente independentes.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A subvencao governamental para investimento (CPC 07), apos a Lei 14.789/23:`,o:[`A) Nunca e tributada`,`B) Compoe a base do IRPJ/CSLL, com possibilidade de credito fiscal sobre subvencoes para implantacao/expansao`,`C) E receita isenta total`,`D) Vai direto ao capital`,`E) E ignorada`],g:`B`,c:`Lei 14.789/2023 alterou o tratamento: as subvencoes passam a compor a base de calculo, criando-se um credito fiscal de ate 25% sobre subvencoes para implantacao/expansao habilitadas.`},{a:2022,r:`FCC/PGE-2022`,q:`No CPC 25, uma obrigacao presente provavel, mas sem mensuracao confiavel:`,o:[`A) Vira provisao`,`B) E divulgada como passivo contingente (nota explicativa)`,`C) Vai ao resultado`,`D) E ativo`,`E) Aumenta o PL`],g:`B`,c:`CPC 25: se a obrigacao e provavel mas NAO mensuravel de forma confiavel (caso raro), nao se reconhece provisao - divulga-se como passivo contingente em nota.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O valor em uso de um ativo (CPC 01) corresponde ao:`,o:[`A) Preco de venda`,`B) Valor presente dos fluxos de caixa futuros esperados do ativo`,`C) Custo historico`,`D) Valor de reposicao`,`E) Valor contabil liquido`],g:`B`,c:`Valor em uso = VALOR PRESENTE dos fluxos de caixa futuros que se espera obter do ativo (uso continuado + alienacao final), descontados a taxa apropriada.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Combinacao de negocios: contraprestacao 800; VJ dos ativos liquidos 600; participacao nao controladora (PNC) mensurada a VJ em 150. O goodwill e:`,o:[`A) 200`,`B) 350`,`C) 50`,`D) 150`,`E) 800`],g:`B`,c:`Goodwill = (contraprestacao + PNC + participacao previa) - VJ liquido = (800 + 150) - 600 = 350.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Arrendamento (CPC 06 R2): pagamentos de 100.000/ano por 5 anos, taxa de desconto que resulta em VP de 379.000. O passivo inicial e:`,o:[`A) 500.000`,`B) 379.000`,`C) 100.000`,`D) 421.000`,`E) 79.000`],g:`B`,c:`O passivo de arrendamento e mensurado pelo VALOR PRESENTE dos pagamentos = 379.000. O ativo de direito de uso e reconhecido por valor equivalente (+ custos diretos).`},{a:2022,r:`FCC/PGE-2022`,q:`MEP: investida tem lucro de 200.000; a investidora detem 30%. O reconhecimento na investidora e:`,o:[`A) Dividendo de 60.000`,`B) Receita de equivalencia de 60.000, aumentando o investimento`,`C) Despesa de 60.000`,`D) Receita de 200.000`,`E) Nenhum`],g:`B`,c:`MEP: a investidora reconhece 30% x 200.000 = 60.000 como resultado de equivalencia (receita), AUMENTANDO a conta de investimento. Dividendos recebidos depois reduzem o investimento.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Teste de impairment: valor contabil 500.000; valor justo liquido 420.000; valor em uso 460.000. A perda por impairment e:`,o:[`A) 80.000`,`B) 40.000`,`C) 0`,`D) 460.000`,`E) 500.000`],g:`B`,c:`Valor recuperavel = MAIOR entre VJ liquido (420.000) e valor em uso (460.000) = 460.000. Perda = contabil - recuperavel = 500.000 - 460.000 = 40.000.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Imposto diferido: diferenca temporaria tributavel de 100.000, aliquota 34%. Reconhece-se:`,o:[`A) Ativo fiscal diferido de 34.000`,`B) Passivo fiscal diferido de 34.000`,`C) Despesa de 100.000`,`D) Receita de 34.000`,`E) Nada`],g:`B`,c:`Diferenca temporaria TRIBUTAVEL (sera tributada no futuro) gera PASSIVO fiscal diferido = 100.000 x 34% = 34.000. Diferenca dedutivel geraria ativo.`},{a:2022,r:`FCC/PGE-2022`,q:`Compra vantajosa: contraprestacao 400; VJ dos ativos liquidos 470. O reconhecimento e:`,o:[`A) Goodwill de 70`,`B) Ganho de 70 no resultado (apos revisao das mensuracoes)`,`C) Reserva de 70`,`D) Passivo de 70`,`E) Nenhum`],g:`B`,c:`VJ liquido (470) > contraprestacao (400) -> COMPRA VANTAJOSA de 70, reconhecida como GANHO no resultado do periodo (apos reavaliar se as mensuracoes estao corretas).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Instrumento financeiro mensurado a valor justo por resultado (VJR): variacao de +20.000 no periodo. O efeito e:`,o:[`A) Reconhecido em ORA`,`B) Reconhecido diretamente no resultado do periodo`,`C) No PL sem transitar`,`D) Ignorado`,`E) Como passivo`],g:`B`,c:`Ativo a VALOR JUSTO POR RESULTADO (VJR): as variacoes de valor justo vao DIRETAMENTE ao resultado do periodo. (Por ORA, iriam ao patrimonio/resultado abrangente.)`},{a:2023,r:`FCC/Fiscal-2023`,q:`Provisao para garantia: a empresa vende 10.000 un e estima 2% de defeitos a custo de 50/un. A provisao e:`,o:[`A) 50.000`,`B) 10.000`,`C) 20.000`,`D) 100.000`,`E) 5.000`],g:`B`,c:`Provisao = 10.000 un x 2% x 50 = 200 un x 50 = 10.000. Reconhece-se passivo (obrigacao presente provavel e mensuravel - CPC 25).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O reconhecimento de receita ao longo do tempo (CPC 47) aplica-se quando:`,o:[`A) Ha venda a vista`,`B) O cliente recebe e consome os beneficios simultaneamente, ou o ativo nao tem uso alternativo e ha direito a pagamento`,`C) Nunca`,`D) So em bens`,`E) No fim do contrato`],g:`B`,c:`CPC 47: reconhece-se receita AO LONGO DO TEMPO quando o cliente consome simultaneamente os beneficios, ou o desempenho cria/melhora ativo que o cliente controla, ou o ativo nao tem uso alternativo e ha direito a pagamento.`},{a:2023,r:`FCC/Fiscal-2023`,q:`No CPC 06 (R2), a taxa de desconto do arrendamento e, preferencialmente:`,o:[`A) A Selic`,`B) A taxa de juros implicita no arrendamento; se nao determinavel, a taxa incremental do arrendatario`,`C) Zero`,`D) O IPCA`,`E) A TR`],g:`B`,c:`CPC 06 R2: usa-se a taxa de juros IMPLICITA no contrato; quando nao for facilmente determinavel, a taxa de juros INCREMENTAL sobre emprestimo do arrendatario.`},{a:2022,r:`FCC/PGE-2022`,q:`Ativos biologicos e produtos agricolas (CPC 29) sao mensurados, em regra, a:`,o:[`A) Custo historico`,`B) Valor justo menos despesas de venda`,`C) Valor presente`,`D) Custo de reposicao`,`E) Valor nominal`],g:`B`,c:`CPC 29 (IAS 41): ativos biologicos e produtos agricolas no ponto de colheita sao mensurados ao VALOR JUSTO menos despesas de venda, com variacoes no resultado.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Demonstracao do Resultado Abrangente (DRA) inclui:`,o:[`A) So o lucro liquido`,`B) O resultado liquido + os outros resultados abrangentes (ORA)`,`C) O caixa`,`D) As mutacoes do PL`,`E) Os estoques`],g:`B`,c:`A DRA parte do RESULTADO LIQUIDO e adiciona os OUTROS RESULTADOS ABRANGENTES (ORA - itens que afetam o PL sem transitar pelo resultado), chegando ao resultado abrangente total.`},{a:2023,r:`FCC/Fiscal-2023`,q:`No hedge accounting (CPC 48), o objetivo e:`,o:[`A) Especular`,`B) Refletir contabilmente o efeito compensatorio entre o instrumento de hedge e o item protegido`,`C) Aumentar o lucro`,`D) Reduzir tributos`,`E) Ocultar perdas`],g:`B`,c:`HEDGE ACCOUNTING: contabiliza de forma a reconhecer simultaneamente os efeitos do instrumento de protecao e do item protegido, reduzindo a volatilidade do resultado decorrente do descasamento.`},{a:2022,r:`FCC/PGE-2022`,q:`O custo atribuido (deemed cost) na adocao das IFRS permitiu:`,o:[`A) Reavaliar todo ano`,`B) Adotar o valor justo na data de transicao como novo custo do imobilizado`,`C) Ignorar a depreciacao`,`D) Criar reservas`,`E) Baixar ativos`],g:`B`,c:`DEEMED COST (custo atribuido): na transicao para as IFRS/CPCs, permitiu-se usar o VALOR JUSTO na data de transicao como custo do imobilizado, ajustando contra o PL (uma unica vez).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Um passivo contingente classificado como possivel (nao provavel) deve ser:`,o:[`A) Provisionado`,`B) Apenas divulgado em nota explicativa`,`C) Ignorado`,`D) Reconhecido como despesa`,`E) Levado ao PL`],g:`B`,c:`CPC 25: passivo contingente POSSIVEL (mas nao provavel) - apenas DIVULGADO em nota explicativa. PROVAVEL e mensuravel -> provisao. REMOTO -> nada se divulga.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A mensuracao inicial de um ativo imobilizado (CPC 27) inclui:`,o:[`A) So o preco`,`B) Preco + custos diretamente atribuiveis + estimativa de desmontagem/restauracao (quando houver obrigacao)`,`C) Despesas administrativas`,`D) Treinamento`,`E) Perdas iniciais`],g:`B`,c:`CPC 27: custo = preco de compra + custos diretamente atribuiveis (frete, instalacao) + estimativa inicial de desmontagem/remocao/restauracao do local (quando ha obrigacao).`}],"COA-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`CF=400.000, PV=200, CV=120. O Ponto de Equilibrio Contabil e:`,o:[`A) 2.000 un`,`B) 3.333 un`,`C) 4.000 un`,`D) 5.000 un`,`E) 6.667 un`],g:`D`,c:`MC=200-120=80. PEC=CF/MC=400.000/80=5.000 unidades.`},{a:2022,r:`FCC/RS-2022`,q:`No custeio por ABSORCAO, os custos fixos sao:`,o:[`A) Tratados como despesa do periodo`,`B) Rateados aos produtos`,`C) Ignorados`,`D) Levados ao PL`,`E) Sempre variaveis`],g:`B`,c:`ABSORCAO: TODOS os custos (fixos+variaveis) sao alocados aos produtos. Exigido pelo fisco e societario.`},{a:2021,r:`FCC/ISS-2021`,q:`A Margem de Contribuicao unitaria e:`,o:[`A) PV - custo fixo unitario`,`B) Preco de venda - custo/despesa variavel unitario`,`C) PV - custo total`,`D) Custo fixo / quantidade`,`E) Lucro / PV`],g:`B`,c:`MC unitaria = Preco de Venda - Custos e Despesas Variaveis unitarios. Cobre os custos fixos e forma o lucro.`},{a:2020,r:`FCC/Adm-2020`,q:`O custeio VARIAVEL e mais adequado para:`,o:[`A) Atender o fisco`,`B) Decisoes gerenciais (nao rateia fixos aos produtos)`,`C) Avaliacao de estoques fiscal`,`D) Demonstracoes societarias`,`E) Auditoria externa`],g:`B`,c:`Custeio VARIAVEL: apenas custos variaveis no produto; fixos sao despesa do periodo. Melhor para DECISAO gerencial. Nao aceito pelo fisco.`},{a:2019,r:`FCC/BA-2019`,q:`O Ponto de Equilibrio FINANCEIRO:`,o:[`A) Inclui o custo de oportunidade`,`B) Exclui a depreciacao dos custos fixos`,`C) E igual ao contabil`,`D) Ignora a MC`,`E) E sempre maior que o economico`],g:`B`,c:`PEF = (CF - depreciacao)/MCu. Considera so as saidas de CAIXA. PEC inclui depreciacao; PEE soma custo de oportunidade.`},{a:2023,r:`FCC/TRT-2023`,q:`O custeio ABC (Activity-Based Costing) aloca custos indiretos por:`,o:[`A) Volume de producao apenas`,`B) Atividades e seus direcionadores de custo`,`C) Rateio simples`,`D) Mao de obra direta`,`E) Material direto`],g:`B`,c:`ABC: rastreia custos indiretos por ATIVIDADES e direcionadores (cost drivers), oferecendo maior precisao em ambientes diversificados.`},{a:2022,r:`FCC/RS-2022`,q:`Custo fixo unitario, com aumento da producao:`,o:[`A) Aumenta`,`B) Diminui (diluicao)`,`C) Permanece constante`,`D) Torna-se variavel`,`E) Zera`],g:`B`,c:`Custo fixo TOTAL e constante; o custo fixo UNITARIO DIMINUI com mais producao (diluicao). Variavel: total cresce, unitario constante.`},{a:2021,r:`FCC/ISS-2021`,q:`O Ponto de Equilibrio ECONOMICO considera:`,o:[`A) So custos contabeis`,`B) Os custos fixos mais o custo de oportunidade do capital`,`C) Menos a depreciacao`,`D) Apenas o caixa`,`E) So custos variaveis`],g:`B`,c:`PEE = (CF + custo de oportunidade)/MCu. Garante remunerar o capital proprio (lucro minimo desejado).`},{a:2020,r:`FCC/Adm-2020`,q:`Custos DIRETOS sao aqueles que:`,o:[`A) Nao podem ser identificados ao produto`,`B) Sao apropriados diretamente ao produto sem rateio`,`C) Sao sempre fixos`,`D) Independem da producao`,`E) Sao despesas administrativas`],g:`B`,c:`Custos DIRETOS: identificados e apropriados diretamente ao produto (materia-prima, MO direta). INDIRETOS exigem rateio.`},{a:2019,r:`FCC/BA-2019`,q:`Na producao conjunta, os subprodutos:`,o:[`A) Tem valor de venda elevado e objetivo principal`,`B) Sao secundarios, de valor reduzido, surgidos naturalmente do processo`,`C) Nao existem`,`D) Sao iguais aos coprodutos`,`E) Geram so prejuizo`],g:`B`,c:`SUBPRODUTOS: itens secundarios, de pequeno valor, surgidos naturalmente. COPRODUTOS: objetivos principais. Sucata: residuo sem processo.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`CF=600.000, MCu=150. O ponto de equilibrio contabil em unidades e:`,o:[`A) 3.000`,`B) 4.000`,`C) 5.000`,`D) 6.000`,`E) 4.500`],g:`B`,c:`PEC = CF/MCu = 600.000/150 = 4.000 unidades.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A margem de seguranca operacional indica:`,o:[`A) O lucro maximo`,`B) O quanto as vendas podem cair antes de atingir o ponto de equilibrio`,`C) O custo fixo`,`D) A margem de contribuicao`,`E) O preco minimo`],g:`B`,c:`Margem de seguranca = (vendas atuais - vendas no PE) / vendas atuais. Mostra a folga antes de comecar a ter prejuizo.`},{a:2022,r:`FCC/ISS-2022`,q:`No custeio variavel, o resultado e influenciado por:`,o:[`A) Volume de producao`,`B) Volume de VENDAS (custos fixos sao do periodo)`,`C) Nivel de estoque`,`D) Rateio dos fixos`,`E) Depreciacao alocada`],g:`B`,c:`No custeio VARIAVEL, o lucro varia com as VENDAS (fixos sao despesa do periodo). No absorcao, estocar producao 'segura' custo fixo no estoque e altera o resultado.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O grau de alavancagem operacional (GAO) mede:`,o:[`A) O endividamento`,`B) A variacao percentual do lucro para cada 1% de variacao nas vendas`,`C) A liquidez`,`D) O custo de capital`,`E) A margem bruta`],g:`B`,c:`GAO = variacao % do lucro operacional / variacao % das vendas = MC total / lucro operacional. Quanto maior o custo fixo, maior a alavancagem.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Custos de transformacao compreendem:`,o:[`A) Apenas materia-prima`,`B) Mao de obra direta + custos indiretos de fabricacao`,`C) Despesas de venda`,`D) Comissoes`,`E) Fretes de entrega`],g:`B`,c:`Custos de transformacao = MOD + CIF (custos indiretos de fabricacao), aplicados para transformar a materia-prima em produto acabado.`},{a:2022,r:`FCC/ISS-2022`,q:`No metodo ABC, os direcionadores de custo (cost drivers) servem para:`,o:[`A) Reduzir custos`,`B) Alocar custos indiretos as atividades e destas aos produtos`,`C) Calcular o preco`,`D) Definir o lucro`,`E) Ratear receitas`],g:`B`,c:`ABC: os cost drivers medem o consumo de cada atividade pelos produtos, permitindo alocar os custos indiretos com mais precisao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na producao conjunta, o ponto de separacao (split-off) e:`,o:[`A) O fim da producao`,`B) O momento em que os coprodutos passam a ser identificaveis separadamente`,`C) O inicio do processo`,`D) A venda`,`E) O rateio do lucro`],g:`B`,c:`Ponto de separacao: estagio do processo conjunto em que os produtos se tornam individualmente identificaveis. Custos conjuntos sao rateados ate ali.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O custo-padrao serve para:`,o:[`A) Substituir o custo real`,`B) Servir de referencia e permitir analise de variacoes (real x padrao)`,`C) Calcular tributos`,`D) Definir o preco de venda obrigatorio`,`E) Eliminar custos indiretos`],g:`B`,c:`Custo-padrao: meta cientificamente estabelecida; compara-se com o real para apurar VARIACOES (de preco e de quantidade) e tomar acoes corretivas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`CF=300.000, PV=80, CV=50. Para lucro de 60.000, a quantidade a vender e:`,o:[`A) 10.000`,`B) 12.000`,`C) 8.000`,`D) 6.000`,`E) 15.000`],g:`B`,c:`MCu=80-50=30. Q=(CF+lucro)/MCu=(300.000+60.000)/30=12.000 unidades.`},{a:2023,r:`FCC/Fiscal-2023`,q:`No custeio por absorcao, o aumento dos estoques (produzir mais que vender):`,o:[`A) Reduz o lucro`,`B) Aumenta o lucro (parte do custo fixo fica ativada no estoque)`,`C) Nao altera`,`D) Zera o lucro`,`E) Vira despesa`],g:`B`,c:`No ABSORCAO, produzir mais que vender 'segura' custo fixo no estoque (ativo), reduzindo o custo do periodo e AUMENTANDO o lucro. No variavel isso nao ocorre.`},{a:2022,r:`FCC/ISS-2022`,q:`O custo primario (ou direto) e composto por:`,o:[`A) MOD + CIF`,`B) Material direto + Mao de obra direta`,`C) So material direto`,`D) Todos os custos`,`E) Despesas + custos`],g:`B`,c:`Custo PRIMARIO = Material Direto + Mao de Obra Direta (os custos diretamente atribuiveis). Custo de transformacao = MOD + CIF.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O grau de alavancagem operacional, com MC total de 200.000 e lucro de 50.000, e:`,o:[`A) 2`,`B) 4`,`C) 0,25`,`D) 5`,`E) 250.000`],g:`B`,c:`GAO = MC total / Lucro operacional = 200.000/50.000 = 4. Cada 1% de aumento nas vendas eleva o lucro em 4%.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A variacao de PRECO de materiais (custo-padrao) e apurada por:`,o:[`A) (Qtd real - padrao) x preco`,`B) (Preco real - preco padrao) x quantidade real`,`C) Preco real x padrao`,`D) Quantidade x lucro`,`E) MC x preco`],g:`B`,c:`Variacao de PRECO = (preco real - preco padrao) x quantidade real adquirida/usada. A variacao de QUANTIDADE/eficiencia usa (qtd real - padrao) x preco padrao.`},{a:2022,r:`FCC/ISS-2022`,q:`O rateio dos custos indiretos no custeio por absorcao e necessario porque:`,o:[`A) Os custos indiretos nao se identificam diretamente com cada produto`,`B) E proibido por lei`,`C) Os custos sao todos diretos`,`D) Nao ha custos fixos`,`E) O lucro e fixo`],g:`A`,c:`Custos INDIRETOS (ex: aluguel da fabrica, supervisao) nao se identificam diretamente com o produto, exigindo RATEIO por criterios (horas-maquina, MOD etc.) no absorcao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No ponto de equilibrio, o lucro operacional e:`,o:[`A) Maximo`,`B) Zero (receita total = custo total)`,`C) Negativo`,`D) Igual a MC`,`E) Igual ao CF`],g:`B`,c:`No ponto de equilibrio, a receita total iguala o custo total, e o lucro operacional e ZERO. Acima dele ha lucro; abaixo, prejuizo.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Coprodutos diferem de subprodutos porque os coprodutos:`,o:[`A) Tem valor irrelevante`,`B) Sao os produtos principais, objetivo da producao`,`C) Sao residuos`,`D) Nao tem mercado`,`E) Sao sucata`],g:`B`,c:`COPRODUTOS: produtos principais que justificam o processo (valor relevante). SUBPRODUTOS: secundarios, de valor reduzido. SUCATA/residuo: valor irrisorio ou nulo.`},{a:2022,r:`FCC/ISS-2022`,q:`O custeio variavel e util gerencialmente porque:`,o:[`A) Atende ao fisco`,`B) Isola a margem de contribuicao e facilita decisoes de curto prazo`,`C) Rateia os fixos`,`D) Aumenta o estoque`,`E) E exigido por lei`],g:`B`,c:`Custeio VARIAVEL evidencia a MARGEM DE CONTRIBUICAO e separa custos fixos (do periodo), apoiando decisoes gerenciais (mix, precos, descontinuar produto). Nao e aceito para fins fiscais/societarios.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A margem de contribuicao total, vendidas 5.000 un com MCu de 30, e:`,o:[`A) R$30.000`,`B) R$150.000`,`C) R$5.000`,`D) R$35.000`,`E) R$300.000`],g:`B`,c:`MC total = MCu x quantidade = 30 x 5.000 = 150.000. Dela se subtrai o custo fixo para chegar ao lucro.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Custos: MP 200.000; MOD 150.000; CIF 100.000; despesas de venda 80.000. O custo de producao do periodo e:`,o:[`A) 530.000`,`B) 450.000`,`C) 350.000`,`D) 300.000`,`E) 250.000`],g:`B`,c:`Custo de producao = MP + MOD + CIF = 200.000 + 150.000 + 100.000 = 450.000. Despesas de venda NAO sao custo (vao ao resultado).`},{a:2023,r:`FCC/Fiscal-2023`,q:`PEC=4.000 un; PV=100; CV=60. Para um lucro-alvo de 80.000, vendem-se:`,o:[`A) 4.000`,`B) 6.000`,`C) 5.000`,`D) 7.000`,`E) 2.000`],g:`B`,c:`MCu=100-60=40. CF=PEC x MCu=4.000 x 40=160.000. Q=(CF+lucro)/MCu=(160.000+80.000)/40=240.000/40=6.000 un.`},{a:2022,r:`FCC/ISS-2022`,q:`Custo conjunto de 300.000 rateado a 2 coprodutos pelo valor de mercado (A vale 400.000 e B 200.000). Cabe ao produto A:`,o:[`A) 150.000`,`B) 200.000`,`C) 100.000`,`D) 300.000`,`E) 250.000`],g:`B`,c:`Rateio pelo valor de mercado: A representa 400/(400+200)=2/3. Custo a A = 300.000 x 2/3 = 200.000. A B caberia 100.000.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Variacao de quantidade (eficiencia) de MP: padrao 2kg/un x 1.000 un = 2.000kg; real usado 2.200kg; preco padrao 10/kg. A variacao e:`,o:[`A) 2.000 favoravel`,`B) 2.000 desfavoravel`,`C) 200 favoravel`,`D) 22.000 desfavoravel`,`E) 0`],g:`B`,c:`Variacao de quantidade = (real - padrao) x preco padrao = (2.200 - 2.000) x 10 = 200 x 10 = 2.000 DESFAVORAVEL (usou mais material que o padrao).`},{a:2023,r:`FCC/Fiscal-2023`,q:`No custeio por absorcao com producao de 1.000 e venda de 800 un, CF=40.000. O CF que fica no estoque final e:`,o:[`A) 40.000`,`B) 8.000`,`C) 32.000`,`D) 0`,`E) 10.000`],g:`B`,c:`CF unitario=40.000/1.000=40. Estoque final=200 un. CF retido no estoque=200 x 40=8.000 (no absorcao, parte do CF fica ativada, nao indo ao resultado).`},{a:2022,r:`FCC/ISS-2022`,q:`Margem de contribuicao de tres produtos, recurso escasso (horas-maquina). Prioriza-se o produto com maior:`,o:[`A) Preco`,`B) Margem de contribuicao por unidade do fator limitante (hora-maquina)`,`C) Volume`,`D) Custo fixo`,`E) Receita total`],g:`B`,c:`Com fator limitante (gargalo), prioriza-se o produto com maior MARGEM DE CONTRIBUICAO POR UNIDADE DO RECURSO ESCASSO (ex: MC por hora-maquina), nao a MC unitaria simples.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Custeio variavel: lucro = MC total - custos fixos. Com MC total 250.000 e CF 180.000:`,o:[`A) 430.000`,`B) 70.000`,`C) 250.000`,`D) 180.000`,`E) 30.000`],g:`B`,c:`Lucro (custeio variavel) = MC total - Custos Fixos = 250.000 - 180.000 = 70.000.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A diferenca de lucro entre absorcao e variavel ocorre quando:`,o:[`A) Producao = venda`,`B) Producao difere da venda (variacao de estoque)`,`C) Nao ha estoque`,`D) CF = 0`,`E) MC = 0`],g:`B`,c:`Quando producao DIFERE da venda (varia o estoque), os metodos divergem: no absorcao o CF acompanha o estoque; no variavel o CF e sempre do periodo. Se producao=venda, os lucros se igualam.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`CF=240.000; PV=120; CV=80. Margem de contribuicao total no ponto de equilibrio:`,o:[`A) 120.000`,`B) 240.000`,`C) 360.000`,`D) 80.000`,`E) 160.000`],g:`B`,c:`No ponto de equilibrio, a MC total iguala o CF (lucro zero). PEC=240.000/40=6.000 un; MC total = 6.000 x 40 = 240.000 = CF.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O custeio baseado em atividades (ABC) e mais preciso quando:`,o:[`A) Ha poucos produtos identicos`,`B) Ha alta diversidade de produtos e custos indiretos relevantes`,`C) Nao ha custos indiretos`,`D) So ha um produto`,`E) Os custos sao todos diretos`],g:`B`,c:`O ABC traz mais precisao quando ha ALTA DIVERSIDADE de produtos/processos e CUSTOS INDIRETOS RELEVANTES, situacao em que o rateio por volume distorceria muito os custos.`},{a:2022,r:`FCC/ISS-2022`,q:`A diferenca entre gasto, custo e despesa: custo refere-se a:`,o:[`A) Qualquer desembolso`,`B) Gasto aplicado na producao de bens/servicos`,`C) Gasto da administracao/vendas`,`D) Investimento`,`E) Perda`],g:`B`,c:`CUSTO: gasto relativo a bem/servico utilizado na PRODUCAO. DESPESA: gasto para obter receita (administracao, vendas). GASTO: termo amplo. INVESTIMENTO: gasto ativado.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Producao 2.000 un, custo variavel total 160.000, CF 100.000. O custo unitario total (absorcao) e:`,o:[`A) 80`,`B) 130`,`C) 50`,`D) 180`,`E) 100`],g:`B`,c:`Custo total = CV total + CF = 160.000 + 100.000 = 260.000. Unitario = 260.000/2.000 = 130 (no absorcao, inclui rateio dos fixos).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Margem de contribuicao negativa indica que o produto:`,o:[`A) Da lucro`,`B) Nao cobre nem os custos variaveis (cada venda aumenta o prejuizo)`,`C) E o melhor`,`D) Deve ser priorizado`,`E) Tem custo fixo alto`],g:`B`,c:`MC NEGATIVA (PV < CV unitario): o produto nem cobre os custos variaveis - cada unidade vendida AUMENTA o prejuizo. Em regra, deve ser descontinuado.`},{a:2022,r:`FCC/ISS-2022`,q:`O metodo de custeio aceito pela legislacao fiscal/societaria brasileira e o:`,o:[`A) Variavel`,`B) Absorcao`,`C) ABC obrigatorio`,`D) Direto`,`E) Padrao`],g:`B`,c:`O custeio por ABSORCAO e o aceito para fins FISCAIS e SOCIETARIOS (avaliacao de estoques), pois apropria todos os custos de producao ao produto. O variavel e so gerencial.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Vendas 800.000, MC 40%, CF 200.000. O lucro operacional e:`,o:[`A) 120.000`,`B) 120.000 (320.000 MC - 200.000 CF)`,`C) 200.000`,`D) 320.000`,`E) 480.000`],g:`B`,c:`MC total = 40% x 800.000 = 320.000. Lucro = MC total - CF = 320.000 - 200.000 = 120.000.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O rateio de custos de departamentos auxiliares para os produtivos usa o metodo:`,o:[`A) Direto, sequencial (escalonado) ou reciproco`,`B) So o direto`,`C) Apenas absorcao`,`D) ABC obrigatorio`,`E) Variavel`],g:`A`,c:`O rateio dos departamentos AUXILIARES aos PRODUTIVOS pode usar o metodo DIRETO, o SEQUENCIAL (escalonado) ou o RECIPROCO (algebrico), conforme se consideram ou nao as prestacoes mutuas entre auxiliares.`}],"DTR-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`A obrigacao tributaria ACESSORIA tem por objeto:`,o:[`A) Pagamento de tributo ou penalidade`,`B) Prestacoes positivas ou negativas no interesse da arrecadacao/fiscalizacao`,`C) So o pagamento do tributo`,`D) Entrega em cartorio`,`E) Recolhimento antecipado`],g:`B`,c:`Art. 113 par.2: acessoria=prestacoes positivas (emitir NF, escriturar) ou negativas (nao obstruir). Descumprir converte em principal (multa).`},{a:2022,r:`FCC/Fiscal-2022`,q:`Sao causas de SUSPENSAO do credito (art. 151):`,o:[`A) Pagamento, compensacao, remissao`,`B) Moratoria, deposito integral, reclamacoes/recursos, liminar/tutela, parcelamento`,`C) Isencao e anistia`,`D) Decadencia e prescricao`,`E) Dacao em pagamento`],g:`B`,c:`Art. 151 (MDRRLP): Moratoria, Deposito integral, Reclamacoes/Recursos, Liminar/Tutela, Parcelamento.`},{a:2021,r:`FCC/GO-2021`,q:`O lancamento por HOMOLOGACAO caracteriza-se por:`,o:[`A) Fisco agir sozinho`,`B) Contribuinte declarar e Fisco lancar`,`C) Contribuinte antecipar o pagamento sem previo exame`,`D) Ser usado no IPTU`,`E) Dispensar pagamento`],g:`C`,c:`Art. 150: por HOMOLOGACAO, o sujeito passivo antecipa o pagamento sem previo exame. Decadencia: 5 anos do FG. Ex: ICMS, IR, IPI.`},{a:2020,r:`FCC/TRF-2020`,q:`A DECADENCIA tributaria extingue:`,o:[`A) A pretensao de cobrar`,`B) O direito de a Fazenda constituir o credito pelo lancamento`,`C) A execucao fiscal`,`D) O direito de repetir indebito`,`E) O parcelamento`],g:`B`,c:`DECADENCIA (art. 173): extingue o direito de LANCAR. PRESCRICAO (art. 174): extingue a acao de COBRAR. Ambas: 5 anos.`},{a:2019,r:`FCC/RJ-2019`,q:`Sao modalidades de EXTINCAO do credito (art. 156):`,o:[`A) Moratoria e parcelamento`,`B) Pagamento, compensacao, transacao, remissao, prescricao, decadencia`,`C) Isencao e anistia`,`D) Reclamacoes e recursos`,`E) Liminar em MS`],g:`B`,c:`Art. 156 (extincao): pagamento, compensacao, transacao, remissao, prescricao, decadencia, dacao em pagamento etc. Isencao/anistia=exclusao.`},{a:2023,r:`FCC/TRT-2023`,q:`A responsabilidade por SUBSTITUICAO tributaria:`,o:[`A) Surge apos o fato gerador`,`B) Atribui ao substituto a obrigacao desde a origem`,`C) E sempre subsidiaria`,`D) Depende de sucessao`,`E) Exige dolo`],g:`B`,c:`SUBSTITUICAO: o responsavel (substituto) ocupa o lugar do contribuinte desde a origem (ex: ICMS-ST). TRANSFERENCIA: por evento posterior.`},{a:2022,r:`FCC/Fiscal-2022`,q:`A ISENCAO, como causa de EXCLUSAO:`,o:[`A) Extingue o credito`,`B) Dispensa o pagamento do tributo (antes do lancamento)`,`C) Suspende a exigibilidade`,`D) Perdoa a multa`,`E) E o mesmo que imunidade`],g:`B`,c:`ISENCAO: exclui o credito tributario (dispensa o tributo), decorre de lei. ANISTIA: exclui a multa. IMUNIDADE: limitacao constitucional.`},{a:2021,r:`FCC/GO-2021`,q:`A solidariedade tributaria (art. 124):`,o:[`A) Comporta beneficio de ordem`,`B) Nao comporta beneficio de ordem`,`C) Exige contrato`,`D) So entre entes publicos`,`E) Depende de homologacao`],g:`B`,c:`Art. 124 PU: a solidariedade tributaria NAO comporta beneficio de ordem (o Fisco cobra de qualquer um integralmente).`},{a:2020,r:`FCC/TRF-2020`,q:`A responsabilidade do art. 135 (socios-gerentes) ocorre quando:`,o:[`A) Ha mero inadimplemento`,`B) Ha atos com excesso de poderes ou infracao de lei/contrato (dolo)`,`C) Sempre que a empresa deve`,`D) Ha dissolucao regular`,`E) Por culpa leve`],g:`B`,c:`Art. 135: responsabilidade PESSOAL por atos com excesso de poderes/infracao de lei. Sumula 430 STJ: mero inadimplemento nao gera responsabilidade do socio.`},{a:2019,r:`FCC/RJ-2019`,q:`O Fato Gerador da obrigacao principal e:`,o:[`A) Qualquer ato administrativo`,`B) A situacao definida em lei como necessaria e suficiente a sua ocorrencia`,`C) O lancamento`,`D) A inscricao em divida ativa`,`E) O pagamento`],g:`B`,c:`Art. 114: FG da obrigacao principal = situacao definida em lei como NECESSARIA E SUFICIENTE a sua ocorrencia.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A capacidade tributaria PASSIVA independe de:`,o:[`A) Estar a pessoa juridica regularmente constituida`,`B) Achar-se a pessoa sujeita a medidas que importem privacao de direitos`,`C) Estar a pessoa natural sujeita a incapacidade civil`,`D) Todas as anteriores (independe de tudo isso)`,`E) Apenas da capacidade civil`],g:`D`,c:`Art. 126 CTN: a capacidade tributaria passiva independe da capacidade civil, de restricoes ao exercicio de atividades e da regular constituicao da PJ.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A denuncia espontanea (art. 138 CTN) afasta:`,o:[`A) O tributo devido`,`B) A responsabilidade por infracoes, se acompanhada do pagamento do tributo e juros`,`C) Os juros de mora`,`D) A correcao monetaria`,`E) Sempre todas as penalidades, mesmo sem pagamento`],g:`B`,c:`Art. 138: a denuncia espontanea, com pagamento do tributo + juros antes de qualquer procedimento fiscal, exclui a responsabilidade por infracoes (multa). Sumula 360 STJ: nao se aplica a tributo declarado e nao pago.`},{a:2022,r:`FCC/PGE-2022`,q:`Na solidariedade tributaria, o pagamento por um dos obrigados:`,o:[`A) Nao aproveita aos demais`,`B) Aproveita aos demais`,`C) Extingue so a parte dele`,`D) Depende de convenio`,`E) Exige autorizacao judicial`],g:`B`,c:`Art. 125, I: o pagamento efetuado por um dos obrigados APROVEITA aos demais. A isencao/remissao tambem, salvo se outorgada pessoalmente.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A moratoria, quando em carater individual:`,o:[`A) Gera direito adquirido`,`B) NAO gera direito adquirido e pode ser revogada se cessadas as condicoes`,`C) E irrevogavel`,`D) Independe de lei`,`E) Extingue o credito`],g:`B`,c:`Art. 155: a moratoria individual NAO gera direito adquirido; revoga-se de oficio se o beneficiario nao satisfazia as condicoes (cobranca com juros).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A consignacao em pagamento (art. 164) cabe quando:`,o:[`A) O contribuinte quer parcelar`,`B) Ha recusa de recebimento ou exigencia de tributo indevido por mais de um ente`,`C) Ha decadencia`,`D) Ocorre remissao`,`E) Ha isencao`],g:`B`,c:`Art. 164: cabe consignacao em caso de recusa de recebimento, subordinacao a outra exigencia, ou exigencia por mais de uma PJ sobre o mesmo fato gerador.`},{a:2022,r:`FCC/PGE-2022`,q:`A isencao concedida por prazo certo e sob condicao onerosa:`,o:[`A) Pode ser revogada a qualquer tempo`,`B) Nao pode ser livremente revogada (Sumula 544 STF)`,`C) Independe de lei`,`D) E o mesmo que imunidade`,`E) Atinge a obrigacao acessoria`],g:`B`,c:`Sumula 544 STF: isencoes tributarias concedidas sob condicao onerosa e por prazo certo NAO podem ser livremente suprimidas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O lancamento reporta-se a data:`,o:[`A) Do lancamento`,`B) Da ocorrencia do fato gerador, regendo-se pela lei entao vigente`,`C) Da inscricao em divida ativa`,`D) Do pagamento`,`E) Da notificacao`],g:`B`,c:`Art. 144: o lancamento reporta-se a data do FATO GERADOR e rege-se pela lei entao vigente, ainda que posteriormente modificada ou revogada.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A decadencia do direito de lancar, no lancamento de oficio, conta-se:`,o:[`A) Do fato gerador`,`B) Do 1o dia do exercicio seguinte aquele em que poderia ter sido lancado`,`C) Da inscricao em divida ativa`,`D) Da notificacao`,`E) Do pagamento antecipado`],g:`B`,c:`Art. 173, I: 5 anos contados do 1o dia do exercicio seguinte aquele em que o lancamento poderia ter sido efetuado (regra geral/oficio).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Sobre a anterioridade tributaria, o IPI:`,o:[`A) Submete-se a anterioridade anual`,`B) Submete-se apenas a noventena (anterioridade nonagesimal)`,`C) Nao se submete a nenhuma`,`D) Submete-se as duas`,`E) E imune`],g:`B`,c:`O IPI e excecao a anterioridade ANUAL, mas obedece a NOVENTENA (90 dias). II, IE e IOF nao se submetem a nenhuma das duas.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A obrigacao acessoria, pelo simples fato de sua inobservancia, converte-se em:`,o:[`A) Isencao`,`B) Obrigacao principal relativamente a penalidade pecuniaria`,`C) Imunidade`,`D) Anistia`,`E) Remissao`],g:`B`,c:`Art. 113, par.3 CTN: a obrigacao acessoria, pelo seu descumprimento, converte-se em principal quanto a PENALIDADE PECUNIARIA (multa).`},{a:2022,r:`FCC/PGE-2022`,q:`O CTN admite a interpretacao literal da legislacao que disponha sobre:`,o:[`A) Obrigacao principal`,`B) Suspensao/exclusao do credito, outorga de isencao e dispensa de obrigacoes acessorias`,`C) Fato gerador`,`D) Base de calculo`,`E) Sujeito passivo`],g:`B`,c:`Art. 111 CTN: interpreta-se LITERALMENTE a legislacao sobre suspensao/exclusao do credito, isencao e dispensa de cumprimento de obrigacoes acessorias.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A taxa, como tributo, tem por fato gerador:`,o:[`A) Qualquer atividade economica`,`B) O exercicio do poder de policia ou servico publico especifico e divisivel`,`C) A propriedade`,`D) A renda`,`E) A circulacao de mercadorias`],g:`B`,c:`Art. 77 CTN: a taxa tem como FG o exercicio regular do poder de policia ou a utilizacao (efetiva/potencial) de servico publico especifico e divisivel.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A contribuicao de melhoria e instituida para fazer face ao custo de:`,o:[`A) Servicos gerais`,`B) Obras publicas de que decorra valorizacao imobiliaria`,`C) Iluminacao publica`,`D) Coleta de lixo`,`E) Seguranca`],g:`B`,c:`Art. 81 CTN: contribuicao de melhoria decorre de OBRA PUBLICA que gere VALORIZACAO imobiliaria; limite total = despesa da obra; limite individual = valorizacao de cada imovel.`},{a:2022,r:`FCC/PGE-2022`,q:`No CTN, a 'norma geral antielisiva' (art. 116, PU) permite a autoridade:`,o:[`A) Criar tributos`,`B) Desconsiderar atos/negocios praticados para dissimular o fato gerador`,`C) Anular isencoes`,`D) Aumentar aliquotas`,`E) Conceder remissao`],g:`B`,c:`Art. 116, PU: a autoridade pode DESCONSIDERAR atos ou negocios juridicos praticados com a finalidade de DISSIMULAR a ocorrencia do fato gerador (norma antielisiva, pende de lei ordinaria de procedimentos).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O domicilio tributario, na falta de eleicao, para a pessoa juridica de direito privado e:`,o:[`A) O do socio`,`B) O lugar da sua sede ou de cada estabelecimento`,`C) O da residencia do contador`,`D) A Capital do Estado`,`E) O domicilio do credor`],g:`B`,c:`Art. 127, II CTN: na falta de eleicao, o domicilio da PJ de direito privado e o lugar de sua SEDE ou, em relacao aos atos que derem origem a obrigacao, o de cada ESTABELECIMENTO.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A responsabilidade dos sucessores na aquisicao de fundo de comercio (art. 133) e integral quando o alienante:`,o:[`A) Continua a explorar atividade`,`B) Cessa a exploracao e nao inicia nova atividade em 6 meses`,`C) Paga o tributo`,`D) E pessoa fisica`,`E) Tem isencao`],g:`B`,c:`Art. 133: o adquirente responde INTEGRALMENTE se o alienante CESSAR a exploracao; e SUBSIDIARIAMENTE se o alienante prosseguir ou iniciar nova atividade em ate 6 meses.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A compensacao tributaria, como forma de extincao:`,o:[`A) Independe de lei`,`B) Depende de lei que estipule as condicoes e garantias`,`C) E automatica`,`D) So por decisao judicial`,`E) Equivale a remissao`],g:`B`,c:`Art. 170 CTN: a lei pode autorizar a COMPENSACAO de creditos tributarios com creditos liquidos e certos do sujeito passivo contra a Fazenda, nas condicoes que estipular.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Segundo o CTN, tributo NAO constitui sancao de ato ilicito. Isso significa que:`,o:[`A) Multa e tributo`,`B) A hipotese de incidencia nao pode ser um ato ilicito, mas a renda de atividade ilicita e tributavel (pecunia non olet)`,`C) Atividade ilicita nunca e tributada`,`D) Tributo e penalidade`,`E) So o licito gera renda`],g:`B`,c:`Art. 3 CTN: tributo nao e sancao de ato ilicito (difere de multa). Porem, pelo principio PECUNIA NON OLET (art. 118), a renda obtida de atividade ilicita E tributavel.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Empresa em recuperacao judicial transfere unidade produtiva isolada. O adquirente, quanto aos tributos do alienante (art. 133, par.1 CTN):`,o:[`A) Responde integralmente`,`B) NAO responde, salvo se for parte relacionada ou agente do devedor`,`C) Responde subsidiariamente sempre`,`D) Responde solidariamente`,`E) Responde so pela metade`],g:`B`,c:`Art. 133, par.1: na alienacao em recuperacao judicial/falencia, o adquirente NAO sucede nos tributos, salvo se for socio, parente ou agente do devedor (para evitar fraude). Visa preservar a empresa.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Contribuinte declara em DCTF debito de ICMS e nao paga. Quanto a constituicao do credito (Sumula 436 STJ):`,o:[`A) Exige lancamento de oficio`,`B) A declaracao constitui o credito, dispensando outro ato; o Fisco pode inscrever em divida ativa`,`C) Decai em 5 anos`,`D) Exige notificacao previa`,`E) Nao pode ser cobrado`],g:`B`,c:`Sumula 436 STJ: a entrega de declaracao pelo contribuinte (DCTF/GIA) reconhecendo o debito CONSTITUI o credito tributario, dispensando outra providencia do Fisco. Cabe inscricao direta em divida ativa.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No lancamento por homologacao com pagamento parcial e ausencia de dolo, o prazo decadencial conta-se (art. 150, par.4):`,o:[`A) Do 1o dia do exercicio seguinte`,`B) Da data do fato gerador`,`C) Da inscricao em divida ativa`,`D) Da notificacao`,`E) Do transito em julgado`],g:`B`,c:`Art. 150, par.4: havendo pagamento antecipado (ainda que parcial) e sem dolo/fraude, a decadencia conta-se da DATA DO FATO GERADOR (5 anos). Sem pagamento algum, aplica-se o art. 173, I.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A Fazenda inscreve credito em divida ativa em 10/03/2020 (constituicao definitiva). A acao de execucao prescreve, em regra, em:`,o:[`A) 10/03/2023`,`B) 10/03/2025`,`C) 10/03/2030`,`D) Nao prescreve`,`E) 10/03/2022`],g:`B`,c:`Art. 174 CTN: a acao de cobranca prescreve em 5 ANOS da constituicao definitiva do credito. Constituido em 10/03/2020 -> prescreve em 10/03/2025 (salvo causas de interrupcao).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Lei nova reduz a multa de 50% para 30%. Aplica-se a ato pretérito nao definitivamente julgado (art. 106, II, 'c'):`,o:[`A) Nao retroage`,`B) Retroage para beneficiar (multa mais branda)`,`C) Aplica-se a multa de 50%`,`D) So a tributo`,`E) Exige opcao do contribuinte`],g:`B`,c:`Art. 106, II, 'c': a lei aplica-se a ato pretérito quando comine PENALIDADE MENOS SEVERA que a prevista a epoca, desde que nao definitivamente julgado (retroatividade benigna em materia de infracoes).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Quanto a responsabilidade do art. 134 (terceiros), ela e:`,o:[`A) Solidaria plena`,`B) Subsidiaria (atuacao apenas na impossibilidade de exigir do contribuinte) e limitada a atos em que intervieram`,`C) Pessoal e exclusiva`,`D) Por substituicao`,`E) Inexistente`],g:`B`,c:`Art. 134: embora o texto diga 'solidariamente', a doutrina/jurisprudencia entendem como SUBSIDIARIA (so na impossibilidade de exigir do contribuinte) e restrita aos atos em que os terceiros intervieram ou pelas omissoes.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Mandado de seguranca com liminar suspende a exigibilidade. Cassada a liminar e julgado improcedente, os tributos do periodo:`,o:[`A) Sao perdoados`,`B) Sao exigidos com os encargos, pois a suspensao era provisoria`,`C) Decaem`,`D) Prescrevem`,`E) Tornam-se isentos`],g:`B`,c:`A suspensao por liminar (art. 151, IV) e provisoria; cassada/denegada a ordem, restabelece-se a exigibilidade e os tributos do periodo sao cobrados com os encargos (a suspensao nao extingue o credito).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O parcelamento, salvo disposicao em contrario, NAO exclui:`,o:[`A) O tributo`,`B) A incidencia de juros e multas`,`C) A obrigacao principal`,`D) O fato gerador`,`E) A correcao`],g:`B`,c:`Art. 155-A, par.1: salvo disposicao de lei em contrario, o parcelamento NAO exclui a incidencia de juros e multas. Suspende a exigibilidade, mas nao perdoa os encargos.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A consulta fiscal formulada pelo contribuinte, enquanto pendente de resposta:`,o:[`A) Suspende o credito`,`B) Impede a aplicacao de penalidade e cobranca de juros de mora sobre o periodo, se eficaz`,`C) Extingue o tributo`,`D) Gera isencao`,`E) Nao tem efeito`],g:`B`,c:`A consulta eficaz (sobre fato determinado) impede o inicio de procedimento fiscal e afasta multa e juros de mora relativos a materia consultada enquanto pendente a resposta (efeito protetivo).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Distingue-se isencao de aliquota ZERO porque, na aliquota zero:`,o:[`A) Ha dispensa legal do tributo`,`B) Ocorre o fato gerador e ha tributo devido, mas o calculo resulta em zero (pode ser alterada por ato infralegal nos casos permitidos)`,`C) Nao ha fato gerador`,`D) E o mesmo que imunidade`,`E) Exclui a obrigacao acessoria`],g:`B`,c:`ISENCAO: dispensa legal do tributo (exclusao do credito, exige lei). ALIQUOTA ZERO: o FG ocorre e ha incidencia, mas a aliquota zera o valor; nos tributos extrafiscais (IPI, II) pode ser alterada por ato do Executivo.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A taxa difere do preco publico (tarifa) porque a taxa:`,o:[`A) E facultativa`,`B) Decorre de regime tributario/compulsorio (lei), enquanto a tarifa e contratual/facultativa`,`C) Nao tem fato gerador`,`D) E paga so por PJ`,`E) Independe de lei`],g:`B`,c:`TAXA: tributo compulsorio, decorre de lei, regime de direito publico. TARIFA/PRECO PUBLICO: facultativa, contratual, regime de direito privado (Sumula 545 STF).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O emprestimo compulsorio so pode ser instituido por:`,o:[`A) Lei ordinaria`,`B) Lei complementar, nos casos de calamidade/guerra ou investimento publico urgente`,`C) Medida provisoria`,`D) Decreto`,`E) Resolucao`],g:`B`,c:`Art. 148 CF: emprestimo compulsorio exige LEI COMPLEMENTAR, cabivel para despesas de calamidade/guerra externa ou investimento publico de carater urgente e relevante interesse nacional.`},{a:2022,r:`FCC/PGE-2022`,q:`A contribuicao de iluminacao publica (COSIP) e de competencia:`,o:[`A) Estadual`,`B) Municipal e do DF (art. 149-A CF)`,`C) Federal`,`D) Compartilhada`,`E) Da Uniao`],g:`B`,c:`Art. 149-A CF: a COSIP (Contribuicao para custeio do servico de iluminacao publica) e de competencia dos MUNICIPIOS e do DF, cobrada em regra na fatura de energia.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O sujeito passivo da obrigacao acessoria e:`,o:[`A) Sempre o contribuinte do tributo`,`B) A pessoa obrigada as prestacoes (fazer/nao fazer) no interesse da fiscalizacao, ainda que imune/isenta`,`C) So o responsavel`,`D) A Fazenda`,`E) O fiscal`],g:`B`,c:`O sujeito passivo da acessoria e quem esta obrigado as prestacoes positivas/negativas no interesse da arrecadacao/fiscalizacao - inclusive entes imunes ou isentos podem ter deveres acessorios.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A 'norma tributaria em branco' caracteriza-se por:`,o:[`A) Nao existir`,`B) Depender de complementacao por outro ato (ex: pauta, tabela) para ser aplicada`,`C) Ser inconstitucional`,`D) Dispensar lei`,`E) Criar tributo por decreto`],g:`B`,c:`Norma tributaria 'em branco' precisa de COMPLEMENTACAO por outro ato (regulamento, pauta, tabela) para sua plena aplicacao, sem ferir a legalidade (a lei define o essencial).`},{a:2022,r:`FCC/PGE-2022`,q:`A retroatividade da lei tributaria e admitida quando:`,o:[`A) Aumenta o tributo`,`B) For interpretativa ou, em materia de penalidade, mais benigna ao infrator (ato nao julgado)`,`C) Cria novo tributo`,`D) Majora aliquota`,`E) Nunca`],g:`B`,c:`Art. 106 CTN: a lei aplica-se a ato pretérito quando EXPRESSAMENTE INTERPRETATIVA ou, tratando-se de PENALIDADE, quando mais branda (ato nao definitivamente julgado).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O domicilio tributario pode ser RECUSADO pela autoridade quando:`,o:[`A) For a sede da empresa`,`B) Impossibilite ou dificulte a arrecadacao/fiscalizacao (art. 127, par.2)`,`C) Houver mais de um`,`D) For eleito pelo contribuinte`,`E) Nunca pode`],g:`B`,c:`Art. 127, par.2 CTN: a autoridade pode RECUSAR o domicilio eleito quando este impossibilite ou dificulte a arrecadacao/fiscalizacao, fixando-se entao o do local dos bens/atos.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A solidariedade tributaria pode decorrer de:`,o:[`A) So contrato`,`B) Interesse comum na situacao do fato gerador ou designacao legal`,`C) Vontade das partes apenas`,`D) Decisao judicial`,`E) Convenio`],g:`B`,c:`Art. 124 CTN: sao solidarias as pessoas com INTERESSE COMUM na situacao do fato gerador e as expressamente DESIGNADAS POR LEI. Nao comporta beneficio de ordem.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A remissao, como extincao do credito:`,o:[`A) Perdoa a multa apenas`,`B) E o perdao total ou parcial do credito tributario, concedido por lei`,`C) Suspende a exigibilidade`,`D) E o mesmo que isencao`,`E) Independe de lei`],g:`B`,c:`REMISSAO (art. 172): perdao do credito tributario (tributo e/ou penalidade) JA constituido, concedido por LEI especifica, atendendo a criterios (situacao economica, equidade, valor diminuto).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A diferenca entre evasao e elisao fiscal e que a elisao:`,o:[`A) E ilicita`,`B) E licita (planejamento antes do fato gerador, por meios legais)`,`C) E crime`,`D) Ocorre apos o fato gerador`,`E) Gera multa`],g:`B`,c:`ELISAO: planejamento tributario LICITO, por meios legais, em regra ANTES do fato gerador (economia legitima). EVASAO: ilicita, sonegacao, apos o FG. Elusao: abuso de formas (zona cinzenta).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O credito tributario regularmente constituido so se modifica/extingue nos casos previstos em lei, sob pena de:`,o:[`A) Multa ao contribuinte`,`B) Responsabilidade funcional de quem o dispensar sem previsao legal (art. 141)`,`C) Nulidade do tributo`,`D) Isencao`,`E) Anistia`],g:`B`,c:`Art. 141 CTN: o credito regularmente constituido so se modifica, extingue, suspende ou exclui nos casos previstos em lei, FORA dos quais nao podem ser dispensados, sob pena de responsabilidade funcional.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A capacidade tributaria ATIVA (ser sujeito ativo) pode ser delegada?`,o:[`A) Nao, e indelegavel`,`B) Sim, as funcoes de arrecadar/fiscalizar sao delegaveis (parafiscalidade); a competencia (instituir) e indelegavel`,`C) So a Uniao delega`,`D) Apenas por convenio`,`E) Nunca a outro ente`],g:`B`,c:`A COMPETENCIA tributaria (instituir) e INDELEGAVEL. Ja a CAPACIDADE TRIBUTARIA ATIVA (arrecadar, fiscalizar, executar leis) e DELEGAVEL (art. 7 CTN) - base da parafiscalidade.`}],"DTR-2":[{a:2024,r:`FCC/RT-2024`,q:`A EC 132/2023 criou o IBS, de competencia:`,o:[`A) Federal`,`B) Estadual`,`C) Compartilhada entre estados, DF e municipios`,`D) Municipal`,`E) Uniao e estados`],g:`C`,c:`EC 132/2023: IBS=competencia COMPARTILHADA (estados, DF, municipios), substitui ICMS+ISS, gerido pelo Comite Gestor (art. 156-B).`},{a:2024,r:`FCC-estilo-2024`,q:`O Comite Gestor do IBS tem como funcao:`,o:[`A) Politica monetaria`,`B) Administrar, arrecadar, fiscalizar e cobrar o IBS`,`C) Substituir o CONFAZ totalmente`,`D) Definir o IR`,`E) Regular o ISS municipal isolado`],g:`B`,c:`Art. 156-B: Comite Gestor administra, arrecada, fiscaliza, cobra e representa o IBS. Colegiado de estados, DF e municipios.`},{a:2024,r:`FCC-estilo-2024`,q:`O principio do DESTINO no IBS significa:`,o:[`A) Imposto no local de producao`,`B) Imposto devido no local de consumo`,`C) Aliquota por destino economico`,`D) So importacoes`,`E) Partilha 50/50`],g:`B`,c:`DESTINO: imposto devido no local de CONSUMO, nao de producao. Reduz a guerra fiscal, alinha-se ao IVA internacional.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A CBS substitui:`,o:[`A) IPI e ICMS`,`B) PIS e COFINS`,`C) IRPJ e CSLL`,`D) IOF e ITR`,`E) IPI e IOF`],g:`B`,c:`CBS=Contribuicao sobre Bens e Servicos: substitui PIS e COFINS. Competencia FEDERAL, administracao pela Receita Federal.`},{a:2023,r:`FCC/SEFAZ-2023`,q:`O Imposto Seletivo (IS) incide sobre:`,o:[`A) Exportacoes`,`B) Operacoes financeiras`,`C) Bens/servicos prejudiciais a saude ou ao meio ambiente`,`D) Combustiveis substituindo o ICMS`,`E) Todo consumo a 1%`],g:`C`,c:`IS (art. 153, VIII): bens/servicos PREJUDICIAIS a saude ou ao meio ambiente. Federal. Nao integra a base do IBS/CBS.`},{a:2024,r:`FCC-estilo-2024`,q:`O modelo de tributacao sobre consumo da reforma e do tipo:`,o:[`A) Cumulativo`,`B) IVA dual (IBS subnacional + CBS federal)`,`C) Monofasico geral`,`D) Imposto unico federal`,`E) So estadual`],g:`B`,c:`Reforma adota IVA DUAL: IBS (estados/municipios) + CBS (federal), com nao-cumulatividade plena e principio do destino.`},{a:2024,r:`FCC-estilo-2024`,q:`A nao-cumulatividade PLENA do IBS significa:`,o:[`A) Credito so fisico`,`B) Credito amplo de todo IBS pago nas etapas anteriores`,`C) Sem direito a credito`,`D) Credito so do ativo`,`E) Credito so de insumos industriais`],g:`B`,c:`Nao-cumulatividade PLENA: credito amplo de todo o IBS que onerou as aquisicoes, com poucas excecoes (uso/consumo pessoal).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A transicao da reforma tributaria conclui-se em:`,o:[`A) 2026`,`B) 2027`,`C) 2029`,`D) 2033`,`E) 2040`],g:`D`,c:`Transicao: inicio em 2026 (teste 0,1%), CBS plena em 2027, reducao gradual do ICMS/ISS 2029-2032, sistema completo em 2033.`},{a:2024,r:`FCC-estilo-2024`,q:`O cashback previsto na reforma destina-se a:`,o:[`A) Grandes empresas`,`B) Devolucao de tributo a familias de baixa renda`,`C) Exportadores`,`D) Estados deficitarios`,`E) Importadores`],g:`B`,c:`Cashback: devolucao de parte do IBS/CBS a familias de BAIXA RENDA, reduzindo a regressividade do consumo.`},{a:2023,r:`FCC/SEFAZ-2023`,q:`A CBS sera administrada pela:`,o:[`A) Comite Gestor do IBS`,`B) Receita Federal do Brasil`,`C) Secretarias estaduais`,`D) CONFAZ`,`E) Banco Central`],g:`B`,c:`CBS (federal): administrada pela RECEITA FEDERAL. O IBS (subnacional) e administrado pelo Comite Gestor.`},{a:2024,r:`FCC/RT-2024`,q:`A EC 132/2023 instituiu o principio da:`,o:[`A) Cumulatividade`,`B) Neutralidade e simplicidade tributaria`,`C) Tributacao na origem`,`D) Anterioridade nonagesimal apenas`,`E) Progressividade do consumo`],g:`B`,c:`A EC 132 trouxe os principios da SIMPLICIDADE, TRANSPARENCIA, JUSTICA TRIBUTARIA, COOPERACAO e DEFESA DO MEIO AMBIENTE, alem da NEUTRALIDADE do IVA.`},{a:2024,r:`FCC-estilo-2024`,q:`A cesta basica nacional de alimentos, na reforma:`,o:[`A) Tera aliquota dobrada`,`B) Tera aliquota ZERO de IBS e CBS`,`C) Sera tributada normalmente`,`D) So tera reducao de 50%`,`E) Sera isenta apenas de CBS`],g:`B`,c:`A LC define a Cesta Basica Nacional de Alimentos com aliquota ZERO de IBS e CBS, para reduzir a regressividade.`},{a:2024,r:`FCC-estilo-2024`,q:`O 'split payment' previsto na reforma consiste em:`,o:[`A) Dividir o pagamento em parcelas`,`B) Recolhimento do imposto no momento da liquidacao financeira da operacao`,`C) Pagar metade do imposto`,`D) Parcelar o IBS`,`E) Dividir entre estados`],g:`B`,c:`Split payment: o imposto e segregado e recolhido automaticamente no momento da liquidacao financeira (pagamento), reduzindo a sonegacao.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Na reforma, os setores com regimes ESPECIFICOS incluem:`,o:[`A) Apenas industria`,`B) Combustiveis, servicos financeiros, planos de saude, entre outros`,`C) Somente exportadores`,`D) So o agronegocio`,`E) Nenhum setor`],g:`B`,c:`A EC 132 preve regimes especificos para combustiveis (monofasico), servicos financeiros, seguros, planos de saude, operacoes imobiliarias, cooperativas etc.`},{a:2024,r:`FCC-estilo-2024`,q:`O Fundo de Desenvolvimento Regional, criado pela reforma:`,o:[`A) Foi extinto`,`B) Visa reduzir desigualdades regionais com recursos da Uniao`,`C) E custeado pelos municipios`,`D) So atende o Sul`,`E) Substitui o FPE`],g:`B`,c:`A EC 132 criou o Fundo Nacional de Desenvolvimento Regional (FNDR), com aportes da Uniao, para reduzir desigualdades regionais apos o fim da guerra fiscal.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Durante a transicao, em 2026, a aliquota-teste de CBS e IBS:`,o:[`A) 1% cada`,`B) CBS 0,9% e IBS 0,1%`,`C) 5%`,`D) 12%`,`E) Zero`],g:`B`,c:`Em 2026: aliquota-teste com CBS de 0,9% e IBS de 0,1% (compensaveis com PIS/COFINS), para calibrar o sistema.`},{a:2024,r:`FCC-estilo-2024`,q:`O Imposto Seletivo NAO incidira sobre:`,o:[`A) Cigarros`,`B) Bebidas alcoolicas`,`C) Exportacoes`,`D) Veiculos poluentes`,`E) Bens prejudiciais a saude`],g:`C`,c:`O IS NAO incide sobre exportacoes (imunidade). Incide sobre bens/servicos prejudiciais a saude e ao meio ambiente, como tabaco e alcool.`},{a:2024,r:`FCC-estilo-2024`,q:`A nao-cumulatividade plena do IBS/CBS difere do ICMS atual porque:`,o:[`A) Veda totalmente o credito`,`B) Permite credito amplo, inclusive de bens de uso e consumo da atividade`,`C) So permite credito fisico`,`D) E cumulativa`,`E) Exige convenio`],g:`B`,c:`Na reforma, a nao-cumulatividade e PLENA: credita-se de praticamente tudo que foi onerado (inclusive uso/consumo da atividade), exceto uso pessoal. Hoje o ICMS limita o credito de uso e consumo.`},{a:2024,r:`FCC/RT-2024`,q:`Na reforma, o IBS e a CBS adotam o creditamento do tipo:`,o:[`A) Fisico`,`B) Financeiro amplo (credito sobre tudo que foi onerado, exceto uso/consumo pessoal)`,`C) Presumido obrigatorio`,`D) Cumulativo`,`E) Por estimativa`],g:`B`,c:`IVA dual: credito FINANCEIRO amplo - credita-se de praticamente todas as aquisicoes onerosas, exceto bens/servicos de uso/consumo pessoal.`},{a:2024,r:`FCC-estilo-2024`,q:`O Comite Gestor do IBS sera composto por representantes:`,o:[`A) Apenas da Uniao`,`B) Dos Estados, DF e Municipios`,`C) Do setor privado`,`D) Do Congresso`,`E) Do Banco Central`],g:`B`,c:`O Comite Gestor do IBS e entidade publica sob regime especial, composta por representantes dos ESTADOS, DF e MUNICIPIOS, sem participacao da Uniao (que cuida da CBS).`},{a:2024,r:`FCC-estilo-2024`,q:`A cashback (devolucao) na reforma sera obrigatoria nas operacoes de:`,o:[`A) Veiculos`,`B) Energia eletrica e gas de botijao para familias de baixa renda`,`C) Importacao`,`D) Servicos financeiros`,`E) Combustiveis`],g:`B`,c:`A LC preve cashback OBRIGATORIO em energia eletrica e gas de cozinha (botijao) para familias de baixa renda inscritas no CadUnico, reduzindo a regressividade.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Durante a transicao, o ICMS e o ISS serao extintos em:`,o:[`A) 2026`,`B) 2027`,`C) 2029`,`D) 2033`,`E) 2040`],g:`D`,c:`O ICMS e o ISS serao reduzidos gradualmente de 2029 a 2032 e EXTINTOS em 2033, quando o IBS estara plenamente vigente.`},{a:2024,r:`FCC-estilo-2024`,q:`A 'aliquota de referencia' do IBS e fixada por:`,o:[`A) Cada municipio livremente`,`B) Resolucao do Senado Federal, podendo o ente fixar a sua propria`,`C) Decreto do Presidente`,`D) Lei complementar federal apenas`,`E) Convenio CONFAZ`],g:`B`,c:`A aliquota de REFERENCIA e fixada por Resolucao do Senado, para repor a arrecadacao; cada ente pode fixar aliquota propria por lei, somando-se a estadual e a municipal.`},{a:2024,r:`FCC-estilo-2024`,q:`O Imposto Seletivo tambem incidira sobre a extracao de:`,o:[`A) Agua`,`B) Recursos minerais (ate 1% do valor de mercado)`,`C) Petroleo isento`,`D) Energia solar`,`E) Madeira de reflorestamento`],g:`B`,c:`O IS incidira ainda sobre a EXTRACAO de bens minerais e petroleo, com aliquota maxima de 1% do valor de mercado do produto extraido.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A nao-cumulatividade na reforma e assegurada por:`,o:[`A) Credito presumido`,`B) Credito do imposto destacado e efetivamente recolhido nas etapas anteriores`,`C) Isencao`,`D) Reducao de base`,`E) Diferimento`],g:`B`,c:`Na reforma, o credito depende do efetivo recolhimento do imposto nas etapas anteriores (split payment ajuda a garantir isso), assegurando a nao-cumulatividade plena.`},{a:2024,r:`FCC-estilo-2024`,q:`Os entes que perderem arrecadacao com o fim da guerra fiscal serao compensados pelo:`,o:[`A) FPE`,`B) Fundo de Compensacao de Beneficios Fiscais e pelo FNDR`,`C) Bolsa Familia`,`D) Tesouro municipal`,`E) BNDES`],g:`B`,c:`A reforma criou o Fundo de Compensacao de Beneficios Fiscais (ate 2032, para honrar incentivos de ICMS ja concedidos) e o Fundo Nacional de Desenvolvimento Regional (FNDR).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O principio da TRANSPARENCIA tributaria na EC 132 implica que:`,o:[`A) O tributo fica oculto no preco`,`B) O contribuinte deve poder identificar o valor do IBS/CBS na operacao`,`C) Nao ha divulgacao`,`D) So o Fisco conhece o valor`,`E) O tributo e secreto`],g:`B`,c:`A EC 132 consagra a TRANSPARENCIA: o imposto sobre consumo deve ser visivel ao consumidor (destacado), permitindo-lhe conhecer a carga tributaria da operacao.`},{a:2024,r:`FCC-estilo-2024`,q:`Sobre a Zona Franca de Manaus, a reforma tributaria:`,o:[`A) Extinguiu seus beneficios`,`B) Manteve o tratamento diferenciado e favorecido`,`C) Ignorou`,`D) Transferiu para o Nordeste`,`E) Reduziu pela metade`],g:`B`,c:`A EC 132 preservou o tratamento tributario DIFERENCIADO E FAVORECIDO da Zona Franca de Manaus, com instrumentos para manter sua competitividade.`},{a:2024,r:`FCC/RT-2024`,q:`Sobre o creditamento na reforma, se o fornecedor nao recolher o IBS/CBS destacado, o adquirente:`,o:[`A) Mantem o credito normalmente`,`B) Pode ter o credito condicionado ao efetivo recolhimento (mecanismos como split payment mitigam o risco)`,`C) Perde sempre o direito`,`D) Recolhe em dobro`,`E) Fica isento`],g:`B`,c:`Na reforma, o aproveitamento do credito pode ser CONDICIONADO ao efetivo recolhimento pelo fornecedor; o split payment (recolhimento na liquidacao) reduz esse risco ao adquirente.`},{a:2024,r:`FCC-estilo-2024`,q:`Uma empresa do Simples Nacional, na reforma, podera optar por:`,o:[`A) Sair obrigatoriamente do Simples`,`B) Recolher IBS/CBS por fora do Simples para transferir creditos integrais aos adquirentes`,`C) Nao recolher tributos`,`D) Aliquota zero sempre`,`E) Tributacao monofasica obrigatoria`],g:`B`,c:`A reforma permite ao optante do Simples escolher recolher o IBS/CBS pelo regime regular (por fora) para gerar CREDITO INTEGRAL aos seus clientes, ampliando competitividade na cadeia B2B.`},{a:2024,r:`FCC-estilo-2024`,q:`O periodo de teste de 2026, com aliquota de 1% (0,9% CBS + 0,1% IBS):`,o:[`A) Substitui ja o ICMS`,`B) Permite compensar o valor com PIS/COFINS, sem aumento de carga, para calibrar o sistema`,`C) E definitivo`,`D) Extingue o ISS`,`E) Dobra a carga`],g:`B`,c:`Em 2026 (teste), o valor pago de IBS/CBS pode ser COMPENSADO com PIS/COFINS (ou outros tributos federais), evitando aumento de carga - serve para calibrar aliquotas e sistemas.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Na reforma, operacoes com bens imoveis terao:`,o:[`A) Imunidade total`,`B) Regime especifico, com reducao de aliquota e redutor de base`,`C) Aliquota dobrada`,`D) Tributacao monofasica`,`E) Isencao integral`],g:`B`,c:`As operacoes IMOBILIARIAS (incorporacao, locacao, venda) tem REGIME ESPECIFICO na reforma, com reducao de aliquota e redutores de base de calculo, dada sua peculiaridade.`},{a:2024,r:`FCC-estilo-2024`,q:`A 'trava' ou teto de referencia da carga tributaria na reforma serve para:`,o:[`A) Aumentar tributos`,`B) Limitar a carga global do IBS/CBS a media historica, revisando aliquotas se ultrapassada`,`C) Eliminar o IS`,`D) Reduzir transferencias`,`E) Acabar com o Simples`],g:`B`,c:`A EC 132 preve mecanismo de avaliacao: se a arrecadacao de IBS/CBS superar o teto de referencia (carga media historica 2012-2021 em % do PIB), as aliquotas de referencia sao reduzidas - trava contra aumento de carga.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Servicos financeiros, na reforma, terao:`,o:[`A) Isencao`,`B) Regime especifico de IBS/CBS, dada a complexidade da base`,`C) Aliquota zero`,`D) Tributacao pelo IS`,`E) Imunidade`],g:`B`,c:`Os SERVICOS FINANCEIROS tem REGIME ESPECIFICO (apuracao e aliquotas proprias), pois a base (spread, tarifas) exige tratamento diferenciado em relacao ao regime geral.`},{a:2024,r:`FCC-estilo-2024`,q:`O 'imposto seletivo' sobre um veiculo poluente integra a base de calculo do IBS/CBS?`,o:[`A) Sim, integra a base`,`B) Sim, o IS compoe a base do IBS e da CBS (mas o IBS/CBS nao integram a base do IS)`,`C) Nao integra`,`D) So integra o IBS`,`E) E mutuamente excludente`],g:`B`,c:`O Imposto Seletivo INTEGRA a base de calculo do IBS e da CBS. Em contrapartida, o IBS e a CBS NAO integram a base do IS nem a sua propria base.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Na transicao 2029-2032, o ICMS sera reduzido a fracoes anuais. Em 2030, por exemplo, vigora:`,o:[`A) 100% do ICMS`,`B) Reducao proporcional (ex: 80%), com IBS subindo na mesma medida`,`C) ICMS extinto`,`D) IBS pleno`,`E) ICMS dobrado`],g:`B`,c:`Entre 2029 e 2032 ocorre a transicao FEDERATIVA: o ICMS/ISS sao reduzidos em fracoes (90%, 80%, 70%, 60%) enquanto o IBS sobe proporcionalmente, ate a extincao do ICMS/ISS em 2033.`},{a:2024,r:`FCC/RT-2024`,q:`Na reforma, a regra geral de incidencia do IBS/CBS adota o criterio:`,o:[`A) Origem`,`B) Destino (local de consumo) com nao-cumulatividade plena`,`C) Misto`,`D) Producao`,`E) Renda`],g:`B`,c:`O IBS/CBS seguem o principio do DESTINO (tributa-se no local de consumo) com nao-cumulatividade plena - alinhamento ao IVA moderno e fim da guerra fiscal.`},{a:2024,r:`FCC-estilo-2024`,q:`A LC 214/2025 regulamentou:`,o:[`A) Apenas o ICMS`,`B) O IBS, a CBS e o Imposto Seletivo (regras gerais da reforma do consumo)`,`C) So o Simples`,`D) O IPVA`,`E) A LRF`],g:`B`,c:`A LC 214/2025 e a lei complementar que regulamenta o IBS, a CBS e o IS, detalhando fatos geradores, base, creditos, regimes especificos e a transicao.`},{a:2024,r:`FCC-estilo-2024`,q:`O 'Comite Gestor do IBS' tem natureza de:`,o:[`A) Empresa privada`,`B) Entidade publica sob regime especial, com independencia tecnica e financeira`,`C) Orgao da Receita Federal`,`D) Autarquia federal`,`E) Fundacao`],g:`B`,c:`O Comite Gestor do IBS e entidade publica sob regime especial, com autonomia tecnica, administrativa, orcamentaria e financeira, gerida por Estados, DF e Municipios.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Na reforma, a aliquota total do IBS sera a soma das aliquotas:`,o:[`A) Federal e estadual`,`B) Estadual e municipal (cada ente fixa a sua)`,`C) So estadual`,`D) Federal apenas`,`E) Definida pela Uniao`],g:`B`,c:`O IBS e formado pela soma da aliquota ESTADUAL e da MUNICIPAL do local de destino (cada ente fixa a propria por lei), aplicadas sobre a mesma base.`},{a:2024,r:`FCC-estilo-2024`,q:`Os profissionais liberais e servicos intelectuais terao, na reforma:`,o:[`A) Imunidade`,`B) Possivel reducao de 30% nas aliquotas de IBS/CBS (regime favorecido)`,`C) Aliquota dobrada`,`D) Tributacao monofasica`,`E) Isencao total`],g:`B`,c:`A reforma preve reducao de 30% nas aliquotas para profissoes intelectuais/regulamentadas (servicos de natureza cientifica, literaria ou artistica), entre outros regimes diferenciados.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A nao-cumulatividade do IBS/CBS sera apurada de forma:`,o:[`A) Por mercadoria`,`B) Por periodo (debito menos credito), com creditos amplos`,`C) Cumulativa`,`D) Monofasica sempre`,`E) Sem creditos`],g:`B`,c:`Apuracao por PERIODO: o contribuinte abate dos debitos (saidas) os creditos (entradas oneradas), com direito a credito amplo - modelo de IVA nao-cumulativo.`},{a:2024,r:`FCC-estilo-2024`,q:`A 'devolucao' de creditos acumulados de IBS/CBS ao contribuinte:`,o:[`A) E vedada`,`B) Sera assegurada de forma celere (ex: exportadores e saldos credores)`,`C) So apos 5 anos`,`D) Em mercadorias`,`E) Nunca ocorre`],g:`B`,c:`A reforma assegura a DEVOLUCAO celere de creditos acumulados (notadamente exportadores e contribuintes com saldo credor), reduzindo o acumulo de creditos que distorce o ICMS atual.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O periodo de transicao federativa (ICMS/ISS -> IBS) ocorre entre:`,o:[`A) 2026 e 2027`,`B) 2029 e 2032, com extincao do ICMS/ISS em 2033`,`C) 2024 e 2026`,`D) 2033 e 2040`,`E) Imediatamente`],g:`B`,c:`Transicao FEDERATIVA: de 2029 a 2032 o ICMS/ISS sao reduzidos gradualmente e o IBS sobe; em 2033 o ICMS e o ISS sao EXTINTOS e vigora plenamente o IBS.`}],"DTR-3":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Na LC 87/96, o credito do ICMS sobre ATIVO PERMANENTE:`,o:[`A) E integral no mes`,`B) E a razao de 1/48 por mes`,`C) Nao gera credito`,`D) So para industria`,`E) Em qualquer prazo`],g:`B`,c:`LC 87/96 art. 20 par.5: ativo permanente -> credito a razao de 1/48 por mes (4 anos).`},{a:2022,r:`FCC/Fiscal-2022`,q:`Os convenios CONFAZ (LC 24/75) sao aprovados por:`,o:[`A) Maioria simples`,`B) Unanimidade dos estados presentes`,`C) 2/3 dos estados`,`D) Decisao do STF`,`E) Maioria absoluta`],g:`B`,c:`LC 24/75: convenios de ICMS exigem UNANIMIDADE dos presentes (minimo 4/5). Um estado pode vetar.`},{a:2021,r:`FCC/SEFAZ-2021`,q:`No Simples Nacional (LC 123/2006), o ICMS-ST:`,o:[`A) Entra no DAS`,`B) E recolhido separadamente, fora do DAS`,`C) E isento`,`D) Tem aliquota zero`,`E) E facultativo`],g:`B`,c:`ICMS-ST NAO entra no DAS: recolhido SEPARADAMENTE. O DAS reune os demais tributos do Simples em guia unica.`},{a:2020,r:`FCC/Adm-2020`,q:`A nao-cumulatividade do ICMS (LC 87/96) permite:`,o:[`A) Credito so na industria`,`B) Compensar o imposto devido com o cobrado nas etapas anteriores`,`C) Credito de uso e consumo ja`,`D) Credito ilimitado`,`E) Nenhum credito`],g:`B`,c:`Nao-cumulatividade: compensa-se o ICMS devido com o montante cobrado nas operacoes anteriores. Uso e consumo: vedado ate 2033.`},{a:2019,r:`FCC/RS-2019`,q:`As aliquotas interestaduais de ICMS sao:`,o:[`A) Sempre 18%`,`B) 7% ou 12% conforme a regiao de destino`,`C) 25%`,`D) Definidas por cada estado`,`E) Zero`],g:`B`,c:`Aliquotas interestaduais: 7% (Sul/Sudeste -> Norte/Nordeste/CO/ES) e 12% (demais). Fixadas por Resolucao do Senado.`},{a:2023,r:`FCC/TRT-2023`,q:`A LC 116/2003 trata do:`,o:[`A) ICMS`,`B) ISS (Imposto Sobre Servicos) - competencia municipal`,`C) IPVA`,`D) ITCD`,`E) IPI`],g:`B`,c:`LC 116/2003: normas gerais do ISSQN, competencia MUNICIPAL. Lista anexa define os servicos tributaveis pelo ISS.`},{a:2022,r:`FCC/Fiscal-2022`,q:`O DIFAL (EC 87/2015) e cobrado:`,o:[`A) So nas importacoes`,`B) Na operacao interestadual destinada a consumidor final`,`C) Em todas as vendas internas`,`D) So no Simples`,`E) Nunca`],g:`B`,c:`DIFAL: diferencial de aliquota nas operacoes interestaduais destinadas a consumidor final (contribuinte ou nao do imposto).`},{a:2021,r:`FCC/SEFAZ-2021`,q:`A LC 160/2017 tratou de:`,o:[`A) Criar o IBS`,`B) Remissao/convalidacao de beneficios de ICMS concedidos sem convenio`,`C) Extinguir o ICMS`,`D) Aumentar aliquotas`,`E) Criar o Simples`],g:`B`,c:`LC 160/2017: permitiu a remissao e convalidacao de beneficios fiscais de ICMS concedidos sem convenio (guerra fiscal pretérita).`},{a:2020,r:`FCC/Adm-2020`,q:`No Simples Nacional, os limites de receita sao (anual):`,o:[`A) MEI 81 mil, ME 360 mil, EPP 4,8 milhoes`,`B) MEI 60 mil, ME 300 mil, EPP 3,6 milhoes`,`C) MEI 100 mil, ME 500 mil, EPP 5 milhoes`,`D) Sem limite`,`E) ME 1 milhao`],g:`A`,c:`LC 123: MEI ate 81 mil/ano, ME ate 360 mil, EPP ate 4,8 milhoes. Acima -> exclusao do regime.`},{a:2019,r:`FCC/RS-2019`,q:`A LC 105/2001 trata:`,o:[`A) Do Simples Nacional`,`B) Do sigilo bancario e seu acesso pelo Fisco`,`C) Do ISS`,`D) Do IPVA`,`E) Da reforma tributaria`],g:`B`,c:`LC 105/2001: dispoe sobre o sigilo das operacoes financeiras e o acesso de dados bancarios pela administracao tributaria.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na LC 87/96, o ICMS NAO incide sobre:`,o:[`A) Energia eletrica`,`B) Operacoes que destinem mercadorias ao exterior (exportacao)`,`C) Comunicacao onerosa`,`D) Transport
