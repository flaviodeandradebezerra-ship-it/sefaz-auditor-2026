e interestadual`,`E) Importacao`],g:`B`,c:`Art. 3, II LC 87/96: nao incide sobre exportacoes (imunidade do art. 155, par.2, X, 'a' CF), assegurado o credito das operacoes anteriores.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O local da operacao para cobranca do ICMS, em regra, e:`,o:[`A) O do destino`,`B) O do estabelecimento onde se encontre a mercadoria no momento do fato gerador`,`C) O do consumidor`,`D) O da sede da empresa`,`E) O do transportador`],g:`B`,c:`Art. 11 LC 87/96: em regra, o local da operacao e o do estabelecimento onde a mercadoria se encontra no momento da ocorrencia do fato gerador (origem).`},{a:2022,r:`FCC/SEFAZ-2022`,q:`A base de calculo do ICMS na importacao inclui:`,o:[`A) Apenas o valor da mercadoria`,`B) Valor da mercadoria + II + IPI + IOF + despesas aduaneiras + o proprio ICMS`,`C) So o frete`,`D) Somente o II`,`E) Valor FOB sem tributos`],g:`B`,c:`BC do ICMS-importacao: valor da mercadoria + Imposto de Importacao + IPI + IOF + demais despesas aduaneiras + o proprio ICMS (calculo por dentro).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A LC 24/75 exige convenio para:`,o:[`A) Aumentar aliquota interna`,`B) Conceder isencoes, incentivos e beneficios fiscais de ICMS`,`C) Criar obrigacao acessoria`,`D) Definir contribuinte`,`E) Fixar prazo de recolhimento`],g:`B`,c:`LC 24/75: isencoes, reducoes de base, creditos presumidos e demais beneficios de ICMS dependem de CONVENIO aprovado no CONFAZ (unanimidade).`},{a:2023,r:`FCC/Fiscal-2023`,q:`No Simples Nacional, NAO podem optar empresas que:`,o:[`A) Faturem ate 4,8 milhoes`,`B) Exerçam atividade de banco, financeira ou que tenham socio PJ`,`C) Sejam MEI`,`D) Sejam comercio`,`E) Prestem servico permitido`],g:`B`,c:`Art. 17 LC 123: vedacoes - instituicoes financeiras, empresas com socio PJ, com filial no exterior, que prestem certos servicos, debito com o INSS/Fazenda etc.`},{a:2022,r:`FCC/SEFAZ-2022`,q:`A substituicao tributaria 'para frente' tem respaldo:`,o:[`A) Apenas legal`,`B) Constitucional (art. 150, par.7 CF), com restituicao se o FG presumido nao ocorrer`,`C) Vedada pelo STF`,`D) So por convenio`,`E) Apenas para combustiveis`],g:`B`,c:`Art. 150, par.7 CF: autoriza a ST progressiva, assegurando a restituicao da quantia paga se o fato gerador presumido nao se realizar. STF (RE 593.849): cabe restituicao tambem se a base efetiva for menor.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No DIFAL para consumidor final NAO contribuinte (EC 87/15), o imposto cabe:`,o:[`A) Integralmente a origem`,`B) Ao estado de DESTINO, recolhido pelo remetente`,`C) Ao municipio`,`D) A Uniao`,`E) Ao transportador`],g:`B`,c:`EC 87/2015: na venda interestadual a consumidor final nao contribuinte, o DIFAL cabe ao estado de DESTINO e e recolhido pelo remetente (LC 190/2022).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O ICMS sobre combustiveis, apos a LC 192/2022, e:`,o:[`A) Cumulativo`,`B) Monofasico, com aliquotas uniformes nacionais definidas por convenio`,`C) Isento`,`D) Progressivo`,`E) Cobrado em todas as etapas`],g:`B`,c:`LC 192/2022: ICMS MONOFASICO sobre combustiveis (incide uma unica vez), com aliquotas ad rem uniformes em todo o pais, definidas pelo CONFAZ.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na LC 87/96, o creditamento do ICMS sobre energia eletrica e permitido quando:`,o:[`A) Sempre, para qualquer uso`,`B) Consumida no processo de industrializacao ou em operacao de saida/exportacao`,`C) Nunca`,`D) So no comercio`,`E) So uso residencial`],g:`B`,c:`LC 87/96 art. 33, II: o credito de energia eletrica e admitido quando consumida no PROCESSO DE INDUSTRIALIZACAO ou na proporcao de operacoes de saida/exportacao tributadas.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A imunidade do ICMS na exportacao assegura ao exportador:`,o:[`A) Perda do credito`,`B) A manutencao e o aproveitamento dos creditos das operacoes anteriores`,`C) Aliquota majorada`,`D) Substituicao tributaria`,`E) Diferimento`],g:`B`,c:`Art. 155, par.2, X, 'a' CF + LC 87/96: a exportacao e imune, mas ASSEGURA-SE a manutencao do credito relativo as entradas (nao-estorno).`},{a:2022,r:`FCC/SEFAZ-2022`,q:`O fato gerador do ICMS no fornecimento de alimentacao em bares e restaurantes:`,o:[`A) Nao incide`,`B) Incide ICMS sobre o valor total (mercadoria + servico)`,`C) Incide so ISS`,`D) E imune`,`E) So sobre a bebida`],g:`B`,c:`Sumula 163 STJ: o fornecimento de mercadorias com servico em bares/restaurantes sujeita-se ao ICMS sobre o VALOR TOTAL da operacao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A LC 24/75 estabelece que a concessao de beneficio sem convenio gera:`,o:[`A) Validade plena`,`B) Nulidade do ato e ineficacia do credito fiscal respectivo`,`C) Apenas advertencia`,`D) Multa ao contribuinte`,`E) Suspensao do CONFAZ`],g:`B`,c:`LC 24/75 art. 8: a inobservancia (beneficio sem convenio) acarreta a NULIDADE do ato e a ineficacia do credito fiscal atribuido, alem da exigibilidade do imposto nao pago.`},{a:2023,r:`FCC/Fiscal-2023`,q:`No Simples Nacional, a tributacao e:`,o:[`A) Por dentro de cada tributo isolado`,`B) Unificada em documento unico (DAS) com aliquotas progressivas por faixa de receita`,`C) Isenta`,`D) Fixa em 6%`,`E) Por estimativa anual`],g:`B`,c:`Simples Nacional: recolhimento UNIFICADO via DAS, com aliquotas efetivas PROGRESSIVAS conforme a faixa de receita bruta acumulada (anexos I a V).`},{a:2022,r:`FCC/SEFAZ-2022`,q:`A alíquota interestadual de 4% no ICMS aplica-se a:`,o:[`A) Todas as operacoes`,`B) Bens importados ou com conteudo de importacao superior a 40% (Resolucao SF 13/2012)`,`C) Servicos`,`D) Energia`,`E) Combustiveis`],g:`B`,c:`Resolucao do Senado 13/2012: aliquota interestadual de 4% para bens/mercadorias IMPORTADOS ou com conteudo de importacao > 40% (combate a guerra dos portos).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O contribuinte do ICMS na importacao e:`,o:[`A) Sempre o vendedor estrangeiro`,`B) A pessoa, fisica ou juridica, que importa, ainda que sem habitualidade`,`C) O transportador`,`D) A Uniao`,`E) O despachante`],g:`B`,c:`LC 87/96 art. 4, PU: e contribuinte na importacao quem importa mercadorias do exterior, AINDA QUE SEM HABITUALIDADE ou intuito comercial (inclusive PF).`},{a:2023,r:`FCC/Fiscal-2023`,q:`No diferimento do ICMS:`,o:[`A) Antecipa-se o pagamento`,`B) Posterga-se o lancamento/pagamento para etapa futura, atribuindo a responsabilidade a outro contribuinte`,`C) Isenta-se a operacao`,`D) Reduz-se a base`,`E) Dobra-se a aliquota`],g:`B`,c:`DIFERIMENTO (ST 'para tras'): adia-se o momento do recolhimento para etapa posterior da cadeia, transferindo a responsabilidade (ex: produtor rural -> industria).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A LC 116/2003 define que o ISS, em regra, e devido no:`,o:[`A) Local do tomador`,`B) Local do estabelecimento prestador (com excecoes da lista)`,`C) Domicilio do cliente`,`D) Local da sede da empresa sempre`,`E) Municipio da capital`],g:`B`,c:`LC 116/2003 art. 3: em REGRA o ISS e devido no local do ESTABELECIMENTO PRESTADOR; ha excecoes (ex: construcao civil, limpeza) em que e devido no local da prestacao.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O Simples Nacional e administrado por:`,o:[`A) Cada estado isoladamente`,`B) Comite Gestor do Simples Nacional (Uniao, Estados e Municipios)`,`C) Apenas a Receita Federal`,`D) CONFAZ`,`E) Municipios`],g:`B`,c:`O Simples Nacional e gerido pelo COMITE GESTOR DO SIMPLES NACIONAL (CGSN), com representantes da Uniao (RFB), Estados/DF e Municipios.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Mercadoria importada por leasing internacional sem opcao de compra. Quanto ao ICMS (jurisprudencia STF):`,o:[`A) Incide normalmente`,`B) NAO incide ICMS na importacao via leasing/arrendamento sem transferencia da titularidade`,`C) Incide em dobro`,`D) E isento por convenio`,`E) Incide so o DIFAL`],g:`B`,c:`STF (RE 540.829): nao incide ICMS na importacao por ARRENDAMENTO MERCANTIL (leasing) sem a circulacao juridica (transferencia de titularidade) do bem; o mero ingresso fisico nao basta.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Transferencia de mercadoria entre estabelecimentos do MESMO titular, em estados diferentes. Quanto ao ICMS (ADC 49/STF):`,o:[`A) Incide normalmente`,`B) NAO incide ICMS (nao ha circulacao juridica), assegurada a transferencia dos creditos`,`C) Incide so na origem`,`D) Incide DIFAL`,`E) E fato gerador presumido`],g:`B`,c:`STF (ADC 49, 2021): e INCONSTITUCIONAL a incidencia de ICMS na mera transferencia entre estabelecimentos do mesmo titular (nao ha circulacao juridica). LC 204/2023 assegura a transferencia dos creditos.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na base de calculo da ST, a Margem de Valor Agregado de 40% sobre mercadoria que custa 100 (com frete 10) resulta em base de:`,o:[`A) 140`,`B) 154`,`C) 110`,`D) 150`,`E) 144`],g:`B`,c:`Base ST = (valor + frete + IPI + despesas) x (1 + MVA) = (100 + 10) x 1,40 = 154.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O contribuinte substituido, se a base presumida (ST) foi MAIOR que a efetiva de venda, tem direito a (STF RE 593.849):`,o:[`A) Nada`,`B) Restituicao da diferenca do ICMS-ST pago a maior`,`C) Pagar complemento`,`D) Multa`,`E) Credito presumido`],g:`B`,c:`STF (RE 593.849, 2016): e devida a RESTITUICAO da diferenca do ICMS-ST pago a maior quando a base de calculo efetiva da operacao for INFERIOR a presumida. (Estados tambem podem cobrar complemento se for maior.)`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Software 'de prateleira' (padronizado) baixado por download. Incide (STF ADI 5659):`,o:[`A) ICMS`,`B) ISS (operacoes com software sao tributadas pelo ISS, conforme STF 2021)`,`C) IPI`,`D) Nenhum`,`E) IOF`],g:`B`,c:`STF (ADI 5659/1945, 2021): as operacoes com SOFTWARE (licenciamento/cessao de uso, padronizado ou por encomenda) sujeitam-se ao ISS, e nao ao ICMS, por preponderar a obrigacao de fazer.`},{a:2023,r:`FCC/Fiscal-2023`,q:`No Simples Nacional, a empresa ultrapassa o sublimite estadual de receita. Quanto ao ICMS/ISS:`,o:[`A) Continua no DAS`,`B) Recolhe ICMS/ISS por fora (regime normal), permanecendo no Simples para os tributos federais`,`C) E excluida do Simples`,`D) Fica isenta`,`E) Recolhe em dobro`],g:`B`,c:`Ultrapassado o SUBLIMITE estadual (em regra R$ 3,6 mi), o ICMS e o ISS passam a ser recolhidos FORA do DAS (regime normal), mas a empresa permanece no Simples para os tributos federais.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A LC 87/96 permite o estorno do credito de ICMS quando a mercadoria entrada:`,o:[`A) For revendida`,`B) For objeto de saida isenta/nao tributada, perecer, deteriorar ou ser usada em fim alheio a atividade`,`C) For exportada`,`D) Gerar debito`,`E) For industrializada`],g:`B`,c:`Art. 21 LC 87/96: estorna-se o credito quando a mercadoria/servico entrada for objeto de saida isenta/nao tributada, perecer, deteriorar-se, ser furtada ou usada para fim alheio a atividade. Exportacao NAO estorna.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Energia eletrica: a demanda contratada de potencia, mas NAO utilizada, segundo o STJ (Sumula 391):`,o:[`A) Integra a base do ICMS`,`B) NAO integra a base do ICMS (so a energia efetivamente consumida)`,`C) Gera DIFAL`,`D) E isenta`,`E) Tem aliquota zero`],g:`B`,c:`Sumula 391 STJ: o ICMS sobre energia eletrica incide apenas sobre o valor da demanda de potencia EFETIVAMENTE UTILIZADA; a demanda contratada e nao consumida nao integra a base.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A base de calculo do ICMS NAO inclui:`,o:[`A) O proprio ICMS`,`B) O IPI, quando a operacao for entre contribuintes, relativa a produto destinado a industrializacao/comercializacao`,`C) O frete`,`D) O seguro`,`E) As despesas acessorias`],g:`B`,c:`Art. 155, par.2, XI CF: o IPI NAO integra a base do ICMS quando a operacao for entre contribuintes, com produto destinado a industrializacao ou comercializacao e configure fato gerador dos dois impostos.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Na importacao, o aspecto temporal do ICMS ocorre:`,o:[`A) Na saida do exterior`,`B) No desembaraco aduaneiro`,`C) Na venda interna`,`D) No pagamento`,`E) Na nota fiscal`],g:`B`,c:`O fato gerador do ICMS-importacao consuma-se no DESEMBARACO ADUANEIRO (Sumula Vinculante 48: nao incide ICMS antes do desembaraco).`},{a:2022,r:`FCC/SEFAZ-2022`,q:`O credito de ICMS de mercadoria para revenda que vem a perecer:`,o:[`A) E mantido`,`B) Deve ser estornado`,`C) Dobra`,`D) Vira debito`,`E) Gera restituicao`],g:`B`,c:`Art. 21 LC 87/96: perecendo, deteriorando ou extraviando-se a mercadoria, o credito do ICMS da entrada deve ser ESTORNADO (nao havera saida tributada que o justifique).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O CONFAZ e composto por:`,o:[`A) Apenas a Uniao`,`B) Representantes de cada Estado/DF e do Governo Federal, presidido pelo Ministro da Fazenda`,`C) So os municipios`,`D) O Congresso`,`E) O STF`],g:`B`,c:`O CONFAZ (Conselho Nacional de Politica Fazendaria) reune representantes de cada Estado e do DF e um do Governo Federal, sob presidencia do Ministro da Fazenda; delibera convenios de ICMS.`},{a:2023,r:`FCC/Fiscal-2023`,q:`No Simples Nacional, a apuracao do valor devido considera:`,o:[`A) Aliquota fixa`,`B) Aliquota efetiva calculada a partir da receita bruta acumulada em 12 meses (RBT12) e do anexo`,`C) So o faturamento do mes`,`D) O lucro`,`E) O patrimonio`],g:`B`,c:`A aliquota EFETIVA no Simples e calculada com base na Receita Bruta dos ULTIMOS 12 MESES (RBT12), na aliquota nominal da faixa e na parcela a deduzir, conforme o anexo da atividade.`},{a:2022,r:`FCC/SEFAZ-2022`,q:`A guerra fiscal entre estados ocorre tipicamente por:`,o:[`A) Aumento de aliquotas`,`B) Concessao de beneficios de ICMS sem convenio para atrair investimentos`,`C) Reducao de gastos`,`D) Convenios unanimes`,`E) Imunidades`],g:`B`,c:`GUERRA FISCAL: estados concedem beneficios de ICMS (creditos presumidos, reducoes) SEM convenio CONFAZ para atrair empresas, gerando conflito federativo e inconstitucionalidades.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A LC 116/2003 lista servicos sujeitos ao ISS. Servico nao listado:`,o:[`A) Sofre ISS por analogia`,`B) Nao pode ser tributado pelo ISS (lista taxativa, admitida interpretacao extensiva dentro de cada item)`,`C) Sofre ICMS sempre`,`D) E isento`,`E) E imune`],g:`B`,c:`A lista da LC 116 e TAXATIVA (STF): servico nao previsto nao sofre ISS. Admite-se interpretacao EXTENSIVA dentro de cada item (congeneres), mas nao a inclusao de servico estranho a lista.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O ICMS-ST tem por objetivo principal:`,o:[`A) Aumentar a aliquota`,`B) Concentrar a arrecadacao e facilitar a fiscalizacao em um unico contribuinte da cadeia`,`C) Isentar etapas`,`D) Reduzir tributo`,`E) Eliminar o credito`],g:`B`,c:`A SUBSTITUICAO TRIBUTARIA concentra o recolhimento do ICMS de toda a cadeia em um responsavel (em regra o industrial/importador), FACILITANDO a fiscalizacao e combatendo a sonegacao.`}],"LTE-1":[{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O 'ICMS por dentro' significa que:`,o:[`A) Calcula-se excluindo o tributo`,`B) O ICMS integra a propria base de calculo`,`C) Incide so na industria`,`D) E recolhido antes da NF`,`E) Substitui tributos municipais`],g:`B`,c:`ICMS por dentro: BC=valor sem ICMS/(1-aliquota). Ex: 82/0,82=100 -> ICMS=18. Aliquota efetiva (21,95%) > nominal (18%).`},{a:2022,r:`FCC/SEFAZ-CE-2022`,q:`A substituicao tributaria PROGRESSIVA no ICMS-CE:`,o:[`A) Responsabiliza o adquirente pelas etapas anteriores`,`B) Atribui ao fabricante/importador o ICMS das etapas subsequentes`,`C) E inconstitucional`,`D) Dispensa NF`,`E) So para essenciais`],g:`B`,c:`ST progressiva (para frente): substituto (fabricante/importador) recolhe o ICMS das etapas futuras (MVA/pauta). FG presumido nao ocorrido -> restituicao.`},{a:2021,r:`FCC/SEFAZ-CE-2021`,q:`O ITCD do Ceara (Lei 15.812/2015) incide sobre:`,o:[`A) Transmissao onerosa de imoveis`,`B) Transmissao causa mortis e doacao de quaisquer bens`,`C) Circulacao de mercadorias`,`D) Servicos`,`E) Propriedade de veiculos`],g:`B`,c:`ITCD-CE: causa mortis (heranca) e doacao de quaisquer bens/direitos. Competencia estadual. Aliquotas progressivas; maxima 8%.`},{a:2020,r:`FCC/SEFAZ-CE-2020`,q:`O FECOP do Ceara (LC 37/2003) consiste em:`,o:[`A) Fundo previdenciario`,`B) Adicional de ICMS de ate 2% sobre superfluos para combate a pobreza`,`C) Taxa de importacao`,`D) Contribuicao de melhoria`,`E) Fundo de equalizacao`],g:`B`,c:`FECOP: Fundo Estadual de Combate a Pobreza, adicional de ICMS de ate 2% sobre produtos superfluos. Base: art. 82 ADCT.`},{a:2019,r:`FCC/SEFAZ-CE-2019`,q:`O IPVA-CE (Lei 12.023/1992) tem como fato gerador:`,o:[`A) Transmissao do veiculo`,`B) Propriedade de veiculo automotor em 1 de janeiro`,`C) Circulacao em rodovias`,`D) Licenciamento`,`E) Importacao`],g:`B`,c:`IPVA: propriedade de veiculo automotor em 1 de janeiro. Base de calculo: valor venal. Aliquotas diferenciadas por tipo de veiculo.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O contribuinte do ICMS-CE e:`,o:[`A) So a industria`,`B) Quem realiza operacoes de circulacao com habitualidade ou volume`,`C) So o consumidor final`,`D) Apenas importadores`,`E) So atacadistas`],g:`B`,c:`Contribuinte: quem realiza, com habitualidade ou em volume que caracterize intuito comercial, operacoes de circulacao de mercadorias ou prestacoes.`},{a:2022,r:`FCC/SEFAZ-CE-2022`,q:`Na nao-cumulatividade do ICMS-CE, o credito de uso e consumo:`,o:[`A) E permitido desde ja`,`B) Esta vedado ate 2033`,`C) E integral`,`D) E de 1/48`,`E) Nunca existira`],g:`B`,c:`Material de uso e consumo: credito VEDADO ate 2033 (LC 87/96 art. 33, aplicada no CE). Ativo permanente: 1/48 por mes.`},{a:2021,r:`FCC/SEFAZ-CE-2021`,q:`O diferimento (ST regressiva) no ICMS-CE:`,o:[`A) Antecipa o imposto`,`B) Posterga o recolhimento para etapa posterior`,`C) Isenta o produto`,`D) Dobra a aliquota`,`E) Dispensa a NF`],g:`B`,c:`DIFERIMENTO (ST regressiva/para tras): posterga o recolhimento do ICMS para etapa posterior da cadeia (ex: produtor rural).`},{a:2020,r:`FCC/SEFAZ-CE-2020`,q:`A base de calculo do ITCD-CE e:`,o:[`A) O valor venal do bem ou direito transmitido`,`B) O valor de aquisicao historico`,`C) O dobro do IPTU`,`D) A renda do herdeiro`,`E) O valor simbolico`],g:`A`,c:`ITCD: base de calculo = valor venal (de mercado) do bem ou direito transmitido por heranca ou doacao.`},{a:2019,r:`FCC/SEFAZ-CE-2019`,q:`O RICMS-CE foi aprovado pelo:`,o:[`A) Decreto 33.327/2019`,`B) Lei federal 5.172/66`,`C) LC 87/96`,`D) EC 132/2023`,`E) Lei 12.023/92`],g:`A`,c:`O RICMS-CE atual e o Decreto 33.327/2019, que regulamenta o ICMS no Ceara (consolidado com a Lei 18.665/2023).`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`No RICMS-CE, considera-se ocorrido o fato gerador na:`,o:[`A) Emissao do pedido`,`B) Saida da mercadoria do estabelecimento do contribuinte`,`C) Entrega ao consumidor`,`D) Inscricao estadual`,`E) Assinatura do contrato`],g:`B`,c:`O FG do ICMS ocorre, entre outras hipoteses, na SAIDA da mercadoria do estabelecimento, ainda que para outro do mesmo titular (com ressalvas da jurisprudencia - Sumula 166 STJ para mesma titularidade).`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`A aliquota interna geral do ICMS no Ceara, apos as alteracoes recentes, situa-se em torno de:`,o:[`A) 7%`,`B) 12%`,`C) 18% a 20%`,`D) 25%`,`E) 30%`],g:`C`,c:`A aliquota interna padrao do ICMS-CE foi ajustada para a faixa de 18% a 20% (a banca cobra a aplicacao; confira a aliquota vigente no RICMS-CE atual).`},{a:2022,r:`FCC/SEFAZ-CE-2022`,q:`O contribuinte substituto, na ST do ICMS-CE, e responsavel por:`,o:[`A) Recolher so o seu imposto`,`B) Reter e recolher o ICMS das operacoes subsequentes (ST para frente)`,`C) Nao recolher nada`,`D) Pagar so o DIFAL`,`E) Apenas emitir nota`],g:`B`,c:`Na ST progressiva, o substituto (industria/importador) retem e recolhe o ICMS devido nas etapas seguintes da cadeia, com base na MVA/pauta.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`A escrituracao fiscal digital (EFD) no Ceara tem por finalidade:`,o:[`A) Substituir o pagamento`,`B) Prestar informacoes fiscais e apurar o ICMS em arquivo digital`,`C) Isentar o contribuinte`,`D) Eliminar a nota fiscal`,`E) Apenas controle interno da empresa`],g:`B`,c:`A EFD (SPED Fiscal) e a escrituracao digital dos livros e documentos fiscais, usada para apurar o ICMS e prestar informacoes ao Fisco estadual.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O credito acumulado de ICMS no Ceara pode, em regra:`,o:[`A) Nunca ser transferido`,`B) Ser transferido a outros estabelecimentos ou utilizado conforme a legislacao estadual`,`C) Ser convertido em dinheiro automaticamente`,`D) Ser doado`,`E) Ser usado para pagar IPVA`],g:`B`,c:`O credito acumulado (ex: exportador) pode ser transferido/utilizado nos termos do RICMS-CE, observados os limites e a homologacao do Fisco.`},{a:2022,r:`FCC/SEFAZ-CE-2022`,q:`A nota fiscal eletronica (NF-e) no Ceara:`,o:[`A) E facultativa para todos`,`B) E obrigatoria e autorizada pela SEFAZ antes da circulacao`,`C) Substitui a apuracao`,`D) Dispensa a EFD`,`E) So vale para servicos`],g:`B`,c:`A NF-e e documento fiscal eletronico obrigatorio, autorizado pela SEFAZ (protocolo de autorizacao) antes da circulacao da mercadoria.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`O regime de antecipacao do ICMS no Ceara aplica-se tipicamente a:`,o:[`A) Exportacoes`,`B) Entradas interestaduais de mercadorias para revenda`,`C) Servicos municipais`,`D) Operacoes isentas`,`E) Vendas a consumidor final local`],g:`B`,c:`A antecipacao tributaria recai sobre entradas interestaduais (cobra-se o ICMS antecipadamente na entrada), conforme o RICMS-CE, podendo ou nao encerrar a tributacao.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O FECOP no Ceara destina-se a:`,o:[`A) Custeio da maquina administrativa`,`B) Acoes e programas de combate a pobreza e inclusao social`,`C) Pagamento de servidores`,`D) Obras viarias`,`E) Fundo previdenciario`],g:`B`,c:`O FECOP (adicional de ate 2% no ICMS de produtos superfluos) e vinculado a programas de combate a pobreza e inclusao social (art. 82 ADCT / LC estadual).`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`No calculo do ICMS 'por dentro', se a mercadoria custa R$164 sem ICMS e a aliquota e 18%, a base e:`,o:[`A) R$164`,`B) R$200 (164/0,82)`,`C) R$193,52`,`D) R$180`,`E) R$196,80`],g:`B`,c:`ICMS por dentro: BC = valor sem ICMS / (1 - aliquota) = 164/0,82 = 200. ICMS = 200 x 18% = 36.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`No RICMS-CE, a margem de valor agregado (MVA) e usada para:`,o:[`A) Calcular o IPVA`,`B) Definir a base de calculo presumida na substituicao tributaria`,`C) Reduzir a aliquota`,`D) Isentar produtos`,`E) Apurar o ITCD`],g:`B`,c:`A MVA (ou IVA-ST) e o percentual aplicado para estimar a BASE DE CALCULO PRESUMIDA das operacoes subsequentes na substituicao tributaria 'para frente'.`},{a:2022,r:`FCC/SEFAZ-CE-2022`,q:`O ITCD cearense incide sobre doacao e, no caso de bens imoveis, e devido ao estado:`,o:[`A) Do domicilio do doador`,`B) Da situacao do bem imovel`,`C) Do donatario`,`D) Onde o ITCD foi pago`,`E) Da capital`],g:`B`,c:`Na doacao/transmissao de BENS IMOVEIS, o ITCD e devido ao Estado da SITUACAO do bem (art. 155, par.1, I CF). Bens moveis: domicilio do doador (doacao) ou do inventario.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`A antecipacao tributaria do ICMS-CE, quando 'com encerramento de fase':`,o:[`A) Gera nova cobranca na saida`,`B) Encerra a tributacao, dispensando recolhimento na operacao subsequente`,`C) Isenta o produto`,`D) Difere o pagamento`,`E) Aumenta a aliquota`],g:`B`,c:`Na antecipacao COM encerramento de fase (similar a ST), o recolhimento na entrada ENCERRA a tributacao, nao havendo novo debito na saida subsequente.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O IPVA-CE e devido proporcionalmente quando:`,o:[`A) O veiculo e zero-km adquirido durante o ano`,`B) Sempre integral`,`C) Nunca`,`D) So para usados`,`E) Apenas em janeiro`],g:`A`,c:`Para veiculo NOVO (zero-km) adquirido ao longo do exercicio, o IPVA-CE e devido PROPORCIONALMENTE aos meses restantes, contados da aquisicao.`},{a:2022,r:`FCC/SEFAZ-CE-2022`,q:`A inscricao no Cadastro Geral da Fazenda (CGF) do Ceara e:`,o:[`A) Facultativa`,`B) Obrigatoria para quem realiza operacoes sujeitas ao ICMS`,`C) So para industrias`,`D) Dispensada para o Simples`,`E) Anual e onerosa`],g:`B`,c:`A inscricao no CGF e OBRIGATORIA para os contribuintes que realizam operacoes/prestacoes sujeitas ao ICMS no Ceara, identificando-os perante o Fisco.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`A diferenca entre aliquota interna e interestadual (DIFAL) no CE, para consumidor final contribuinte:`,o:[`A) Cabe a origem`,`B) E recolhida pelo proprio adquirente (contribuinte) ao Ceara`,`C) Nao existe`,`D) Cabe a Uniao`,`E) E isenta`],g:`B`,c:`No DIFAL para consumidor final CONTRIBUINTE do ICMS, o proprio adquirente apura e recolhe a diferenca de aliquota ao estado de destino (Ceara).`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O regime de estimativa do ICMS-CE aplica-se a:`,o:[`A) Grandes industrias`,`B) Contribuintes de pequeno porte cuja apuracao normal seja dificil, com valor fixado pelo Fisco`,`C) Exportadores`,`D) Substitutos tributarios`,`E) Importadores`],g:`B`,c:`O regime de ESTIMATIVA fixa um valor de ICMS a recolher para contribuintes em que a apuracao normal seja inviavel/dificil, conforme criterios da SEFAZ-CE.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`A nota fiscal de consumidor eletronica (NFC-e) no Ceara destina-se a:`,o:[`A) Operacoes interestaduais`,`B) Vendas no varejo a consumidor final, substituindo o cupom fiscal`,`C) Exportacoes`,`D) Servicos municipais`,`E) Transferencias`],g:`B`,c:`A NFC-e e o documento fiscal eletronico para vendas a CONSUMIDOR FINAL no varejo presencial, substituindo o antigo cupom fiscal (ECF).`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O lancamento do ICMS-CE, em regra, e do tipo:`,o:[`A) De oficio`,`B) Por homologacao (o contribuinte apura e antecipa o pagamento)`,`C) Por declaracao`,`D) Por arbitramento sempre`,`E) Misto`],g:`B`,c:`O ICMS, inclusive no Ceara, e tributo sujeito a lancamento por HOMOLOGACAO: o contribuinte apura e recolhe antecipadamente, cabendo ao Fisco homologar (ou lancar de oficio se houver falta).`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`Operacao interna no CE: mercadoria por 1.000, aliquota 20%. Sendo o ICMS 'por dentro', se 1.000 ja inclui o imposto, o ICMS destacado e:`,o:[`A) 150`,`B) 200`,`C) 250`,`D) 180`,`E) 166,67`],g:`B`,c:`Quando o valor (1.000) JA inclui o ICMS (por dentro), o imposto = 1.000 x 20% = 200 (a aliquota incide sobre o total que ja o contem). Destaque = 200.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`Contribuinte cearense adquire ativo imobilizado por 48.000 com ICMS de 9.600. O credito mensal (1/48) e:`,o:[`A) 9.600`,`B) 200`,`C) 800`,`D) 400`,`E) 100`],g:`B`,c:`Credito de ativo permanente: 1/48 ao mes. ICMS total 9.600 / 48 = 200 por mes (durante 48 meses), proporcionalmente as saidas tributadas.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`No ITCD-CE, doacao de imovel avaliado em 500.000 com aliquota progressiva (faixa de 6%) gera imposto de:`,o:[`A) 40.000`,`B) 30.000`,`C) 25.000`,`D) 8.000`,`E) 50.000`],g:`B`,c:`ITCD = base x aliquota = 500.000 x 6% = 30.000 (na faixa progressiva indicada; o CE adota aliquotas progressivas ate o teto de 8% do Senado).`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`Mercadoria sujeita a ST entra no CE de outro estado. A antecipacao do ICMS-ST e exigida:`,o:[`A) Na saida para consumidor`,`B) Na entrada no territorio cearense, do responsavel por substituicao`,`C) Apenas na venda`,`D) Na exportacao`,`E) Nunca`],g:`B`,c:`Na ST, quando a mercadoria entra no CE oriunda de UF sem acordo, exige-se a antecipacao do ICMS-ST na ENTRADA do territorio, recolhida pelo responsavel, encerrando (em regra) a tributacao da cadeia.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`Empresa cearense exporta mercadoria. Quanto aos creditos de ICMS das entradas:`,o:[`A) Devem ser estornados`,`B) Sao mantidos e podem ser aproveitados/transferidos (exportacao e imune com manutencao de credito)`,`C) Sao perdidos`,`D) Geram debito`,`E) Convertem-se em multa`],g:`B`,c:`A exportacao e imune ao ICMS, MAS a LC 87/96 (e o RICMS-CE) ASSEGURAM a manutencao dos creditos das entradas, que podem ser aproveitados em outras operacoes ou transferidos.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O FECOP cearense, adicional de ate 2%, aplica-se sobre:`,o:[`A) Todos os produtos`,`B) Produtos e servicos supérfluos definidos em lei (ex: bebidas, fumo, joias)`,`C) Cesta basica`,`D) Medicamentos`,`E) Exportacoes`],g:`B`,c:`O adicional do FECOP (ate 2% sobre o ICMS) incide sobre produtos/servicos SUPERFLUOS definidos em lei (bebidas alcoolicas, cigarros, joias, etc.), vinculado ao combate a pobreza.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`Microempresa cearense no Simples vende para consumidor final em outro estado (nao contribuinte). O DIFAL:`,o:[`A) E devido pela ME`,`B) NAO e exigido das optantes do Simples Nacional nessa hipotese (entendimento aplicavel)`,`C) E dobrado`,`D) Cabe ao destino sempre`,`E) E isento de tudo`],g:`B`,c:`Para optantes do Simples, ha entendimento (e decisoes) afastando a exigencia do DIFAL nas vendas interestaduais a consumidor final nao contribuinte, dado o tratamento diferenciado da LC 123 - tema sensivel e cobrado.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`O regime especial de tributacao concedido pelo CE a um setor:`,o:[`A) Independe de previsao legal`,`B) Deve observar a legislacao e, se beneficio fiscal de ICMS, depende de convenio CONFAZ`,`C) E livre`,`D) Dispensa contrapartida`,`E) E permanente e irrevogavel`],g:`B`,c:`Regimes especiais/beneficios de ICMS no CE devem respeitar a legislacao estadual e, tratando-se de incentivo fiscal, dependem de CONVENIO no CONFAZ (LC 24/75), sob pena de nulidade.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`No ICMS-CE, a aliquota aplicavel a operacao interestadual destinada a contribuinte localizado no CE, vinda do Sudeste, e:`,o:[`A) 18%`,`B) 7%`,`C) 12%`,`D) 4%`,`E) 25%`],g:`B`,c:`Operacoes do Sul/Sudeste (exceto ES) para Norte/Nordeste/CO/ES: aliquota interestadual de 7%. O CE (Nordeste) recebe a 7% e cobra o DIFAL ate a aliquota interna.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`Mercadoria importada e desembaracada no porto de Pecem-CE. O ICMS-importacao e devido:`,o:[`A) Ao estado do porto sempre`,`B) Ao Ceara se for o estado do destinatario/importador (titular da operacao)`,`C) A Uniao`,`D) Ao municipio`,`E) Ao remetente estrangeiro`],g:`B`,c:`O ICMS-importacao cabe ao estado do DESTINATARIO juridico da mercadoria (importador), independentemente do local do desembaraco (Sumula 661 STF). Se o importador esta no CE, o imposto e cearense.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`A apuracao do ICMS-CE e, em regra:`,o:[`A) Por mercadoria`,`B) Por periodo (mensal): debitos das saidas menos creditos das entradas`,`C) Anual`,`D) Por operacao`,`E) Diaria`],g:`B`,c:`A apuracao do ICMS e periodica (em regra MENSAL): confrontam-se os DEBITOS (saidas) com os CREDITOS (entradas); o saldo devedor e recolhido, o credor transfere-se ao periodo seguinte.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`No ITCD cearense, o contribuinte na transmissao causa mortis e:`,o:[`A) O espolio`,`B) O herdeiro ou legatario (quem recebe)`,`C) O doador`,`D) O inventariante apenas`,`E) O Estado`],g:`B`,c:`Na transmissao causa mortis, o contribuinte do ITCD e o HERDEIRO ou LEGATARIO (beneficiario da transmissao). Na doacao, em regra, o donatario.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`O IPVA-CE de veiculo furtado/roubado, comprovada a ocorrencia:`,o:[`A) Continua devido`,`B) Pode ter dispensa/restituicao proporcional ao periodo sem posse, conforme a legislacao`,`C) Dobra`,`D) Vira ITCD`,`E) E transferido ao seguro`],g:`B`,c:`Comprovados furto/roubo (perda da posse/propriedade), a legislacao do IPVA-CE admite a DISPENSA ou restituicao proporcional ao periodo em que o contribuinte ficou sem o veiculo.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`A guia nacional de recolhimento (GNRE) e usada no CE para:`,o:[`A) Pagar IPVA`,`B) Recolher ICMS devido a outro estado (ex: ST e DIFAL interestadual)`,`C) Emitir nota`,`D) Apurar lucro`,`E) Inscrever no CGF`],g:`B`,c:`A GNRE (Guia Nacional de Recolhimento de Tributos Estaduais) serve para recolher ICMS devido a OUTRA unidade federada, como ST interestadual e DIFAL, comum em operacoes que envolvem o CE.`},{a:2024,r:`FCC/SEFAZ-CE-2024`,q:`A escrituracao do credito de ICMS no CE deve observar o prazo decadencial de:`,o:[`A) 1 ano`,`B) 5 anos contados da emissao do documento fiscal`,`C) 10 anos`,`D) 6 meses`,`E) Sem prazo`],g:`B`,c:`O direito ao credito do ICMS extingue-se apos 5 ANOS contados da data de emissao do documento fiscal (art. 23, PU LC 87/96), aplicavel no CE.`},{a:2023,r:`FCC/SEFAZ-CE-2023`,q:`A malha fiscal eletronica do CE cruza dados para:`,o:[`A) Reduzir aliquotas`,`B) Identificar inconsistencias e indicios de sonegacao (NF-e, EFD, etc.)`,`C) Emitir notas`,`D) Isentar contribuintes`,`E) Calcular o IPVA`],g:`B`,c:`A malha fiscal eletronica cruza informacoes (NF-e, NFC-e, EFD, GNRE) para detectar INCONSISTENCIAS e indicios de sonegacao, subsidiando a fiscalizacao e a autuacao.`}],"FLD-1":[{a:2023,r:`FCC/TI-2023`,q:`A clausula HAVING em SQL:`,o:[`A) Filtra linhas antes do agrupamento`,`B) Filtra grupos apos o GROUP BY`,`C) Ordena resultados`,`D) Define colunas`,`E) Substitui o WHERE em linhas`],g:`B`,c:`HAVING filtra GRUPOS apos GROUP BY (usa SUM, COUNT, AVG). WHERE filtra LINHAS antes, sem funcoes de agregacao.`},{a:2022,r:`FCC/Analista-2022`,q:`O Data Lakehouse combina:`,o:[`A) So dados relacionais`,`B) Flexibilidade do Data Lake com ACID e performance do Data Warehouse`,`C) So tempo real`,`D) Banco operacional e Data Mart`,`E) Nuvem e on-premises`],g:`B`,c:`Lakehouse: une dados brutos do Data Lake + transacoes ACID + performance analitica do DW (ex: Delta Lake, Iceberg).`},{a:2021,r:`FCC/TI-2021`,q:`A base legal da LGPD para o Fisco tratar dados de fiscalizacao e:`,o:[`A) Consentimento`,`B) Legitimo interesse`,`C) Cumprimento de obrigacao legal/regulatoria`,`D) Execucao de contrato`,`E) Protecao da vida`],g:`C`,c:`Art. 7, II LGPD: cumprimento de obrigacao legal ou regulatoria. A fiscalizacao tributaria e obrigacao legal (CTN art. 194), dispensa consentimento.`},{a:2020,r:`FCC/TI-2020`,q:`O processo ETL realiza:`,o:[`A) So encriptacao`,`B) Extracao de multiplas fontes, transformacao e carga em repositorio`,`C) Backups`,`D) Monitoramento de qualidade so`,`E) Indexacao`],g:`B`,c:`ETL: Extract (coleta), Transform (limpeza/padronizacao), Load (carga no DW/Lakehouse). ELT inverte transform e load (cloud).`},{a:2019,r:`FCC/Analista-2019`,q:`O LEFT JOIN retorna:`,o:[`A) So correspondencias em ambas`,`B) Todos os registros da esquerda + correspondentes da direita (NULL se nao)`,`C) Produto cartesiano`,`D) So a direita`,`E) Apenas duplicatas`],g:`B`,c:`LEFT JOIN: todos da tabela esquerda + correspondentes da direita (NULL onde nao ha). INNER: so correspondencias; CROSS: produto cartesiano.`},{a:2023,r:`FCC/TI-2023`,q:`Em um Data Warehouse, o esquema e tipicamente:`,o:[`A) Schema-on-read`,`B) Schema-on-write (dados curados na entrada)`,`C) Sem esquema`,`D) Apenas NoSQL`,`E) Grafo`],g:`B`,c:`DW: schema-on-WRITE (estrutura definida na carga, dados curados). Data Lake: schema-on-READ (estrutura na leitura, dados brutos).`},{a:2022,r:`FCC/Analista-2022`,q:`O encarregado de dados (DPO) na LGPD:`,o:[`A) E o titular dos dados`,`B) E o canal entre controlador, titulares e a ANPD`,`C) E o operador`,`D) Define a base legal sozinho`,`E) Audita o sistema`],g:`B`,c:`DPO (encarregado): canal de comunicacao entre o controlador, os titulares e a ANPD (Autoridade Nacional de Protecao de Dados).`},{a:2021,r:`FCC/TI-2021`,q:`Dados semiestruturados sao representados por formatos como:`,o:[`A) Tabelas relacionais`,`B) JSON e XML`,`C) Imagens puras`,`D) Texto livre`,`E) Video`],g:`B`,c:`Semiestruturados: JSON, XML (tem marcadores/tags mas nao esquema rigido). Estruturados=tabelas; nao estruturados=texto/imagem/video.`},{a:2020,r:`FCC/TI-2020`,q:`A triade CIA da seguranca da informacao significa:`,o:[`A) Controle, Integracao, Auditoria`,`B) Confidencialidade, Integridade, Disponibilidade`,`C) Criptografia, Identidade, Acesso`,`D) Custo, Impacto, Analise`,`E) Cloud, IA, Analytics`],g:`B`,c:`CIA: Confidencialidade (sigilo), Integridade (nao adulteracao), Disponibilidade (acesso quando necessario).`},{a:2019,r:`FCC/Analista-2019`,q:`A ordem de execucao logica de uma consulta SQL inicia por:`,o:[`A) SELECT`,`B) FROM`,`C) WHERE`,`D) ORDER BY`,`E) GROUP BY`],g:`B`,c:`Ordem de execucao: FROM -> JOIN -> WHERE -> GROUP BY -> HAVING -> SELECT -> ORDER BY -> LIMIT. SELECT vem depois do agrupamento.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Em SQL, para contar registros por categoria usa-se:`,o:[`A) WHERE COUNT`,`B) GROUP BY com a funcao COUNT()`,`C) ORDER BY`,`D) DISTINCT apenas`,`E) HAVING sem GROUP BY`],g:`B`,c:`Agregacao por categoria: GROUP BY categoria + COUNT(*). O HAVING filtra os grupos resultantes; o WHERE filtra linhas antes.`},{a:2023,r:`FCC/Analista-2023`,q:`Em um Data Warehouse, o esquema ESTRELA (star schema) tem:`,o:[`A) Varias tabelas fato normalizadas`,`B) Uma tabela fato central ligada a tabelas dimensao desnormalizadas`,`C) So tabelas dimensao`,`D) Estrutura sem fatos`,`E) Apenas chaves primarias`],g:`B`,c:`Star schema: uma tabela FATO central (metricas) cercada por tabelas DIMENSAO desnormalizadas. O floco de neve (snowflake) normaliza as dimensoes.`},{a:2022,r:`FCC/TI-2022`,q:`Na LGPD, dados sensiveis incluem:`,o:[`A) Nome e endereco`,`B) Origem racial, conviccao religiosa, saude, dado genetico/biometrico`,`C) CPF apenas`,`D) E-mail`,`E) Telefone`],g:`B`,c:`Dados SENSIVEIS (art. 5, II): origem racial/etnica, conviccao religiosa, opiniao politica, saude, vida sexual, dado genetico ou biometrico. Tem protecao reforcada.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O aprendizado de maquina SUPERVISIONADO caracteriza-se por:`,o:[`A) Dados sem rotulo`,`B) Treinar com dados rotulados (entrada e saida conhecidas)`,`C) Nao usar dados`,`D) Apenas agrupar`,`E) Aprendizado por reforco`],g:`B`,c:`Aprendizado SUPERVISIONADO: usa dados ROTULADOS (X->Y conhecidos), ex: classificacao e regressao. NAO SUPERVISIONADO: sem rotulos (clusterizacao).`},{a:2023,r:`FCC/Analista-2023`,q:`O comando SQL para remover duplicatas no resultado e:`,o:[`A) DELETE`,`B) DISTINCT`,`C) DROP`,`D) TRUNCATE`,`E) GROUP`],g:`B`,c:`SELECT DISTINCT retorna apenas linhas unicas (remove duplicatas do resultado). DELETE/DROP/TRUNCATE alteram dados/estrutura.`},{a:2022,r:`FCC/TI-2022`,q:`Big Data e usualmente descrito pelos V's, entre eles:`,o:[`A) Valor, Visao, Verdade`,`B) Volume, Velocidade, Variedade (e Veracidade, Valor)`,`C) Vetor, Versao`,`D) Visual, Virtual`,`E) Verbo, Voz`],g:`B`,c:`Os V's do Big Data: VOLUME (quantidade), VELOCIDADE (geracao/processamento), VARIEDADE (formatos), VERACIDADE (confiabilidade) e VALOR.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O encarregado (DPO) pela LGPD tem como atribuicao:`,o:[`A) Vender dados`,`B) Ser canal entre controlador, titulares e a ANPD, orientando sobre praticas`,`C) Definir o lucro`,`D) Auditar contas`,`E) Aprovar a LOA`],g:`B`,c:`O encarregado/DPO (art. 41): aceita reclamacoes dos titulares, comunica-se com a ANPD e orienta a organizacao sobre protecao de dados.`},{a:2023,r:`FCC/Analista-2023`,q:`Numa consulta com JOIN, a clausula ON define:`,o:[`A) A ordenacao`,`B) A condicao de relacionamento entre as tabelas`,`C) O agrupamento`,`D) O filtro de grupos`,`E) As colunas exibidas`],g:`B`,c:`ON especifica a CONDICAO de juncao (ex: a.id = b.id) que relaciona as tabelas no JOIN.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Em SQL, a subconsulta (subquery) e:`,o:[`A) Uma tabela fisica`,`B) Uma consulta aninhada dentro de outra (ex: no WHERE ou FROM)`,`C) Um indice`,`D) Uma chave estrangeira`,`E) Um gatilho`],g:`B`,c:`SUBQUERY (subconsulta): consulta SELECT aninhada dentro de outra (no WHERE, FROM ou SELECT), usada para filtrar/derivar dados a partir de outro resultado.`},{a:2023,r:`FCC/Analista-2023`,q:`Na modelagem dimensional, a tabela FATO armazena tipicamente:`,o:[`A) Descricoes textuais`,`B) Metricas/medidas numericas e chaves para as dimensoes`,`C) So chaves primarias`,`D) Atributos descritivos`,`E) Hierarquias`],g:`B`,c:`A tabela FATO contem as MEDIDAS numericas do negocio (vendas, valores) e as chaves estrangeiras que apontam para as tabelas DIMENSAO (descritivas).`},{a:2022,r:`FCC/TI-2022`,q:`Os agentes de tratamento na LGPD sao:`,o:[`A) Titular e ANPD`,`B) Controlador e operador`,`C) Encarregado e titular`,`D) ANPD e operador`,`E) So o controlador`],g:`B`,c:`Agentes de tratamento (LGPD): CONTROLADOR (decide sobre o tratamento) e OPERADOR (realiza o tratamento em nome do controlador). O encarregado (DPO) e o canal de comunicacao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A clausula WHERE NAO pode conter:`,o:[`A) Comparacoes`,`B) Funcoes de agregacao como SUM e COUNT (estas vao no HAVING)`,`C) AND/OR`,`D) LIKE`,`E) BETWEEN`],g:`B`,c:`Funcoes de AGREGACAO (SUM, COUNT, AVG, MAX, MIN) nao podem ser usadas no WHERE (que filtra linhas antes do agrupamento); devem ir no HAVING (apos GROUP BY).`},{a:2023,r:`FCC/Analista-2023`,q:`O processo de transformar dado bruto em formato adequado para analise chama-se:`,o:[`A) Backup`,`B) Data wrangling / preparacao de dados (limpeza e transformacao)`,`C) Mineracao`,`D) Indexacao`,`E) Replicacao`],g:`B`,c:`DATA WRANGLING (ou preparacao/limpeza): processo de limpar, estruturar e transformar dados brutos em formato adequado para analise (etapa que consome boa parte do projeto de dados).`},{a:2022,r:`FCC/TI-2022`,q:`Um data lake difere de um data warehouse por armazenar dados:`,o:[`A) So estruturados`,`B) Brutos em diversos formatos (estruturados e nao estruturados), schema-on-read`,`C) So numericos`,`D) Apenas processados`,`E) Em tabelas relacionais`],g:`B`,c:`DATA LAKE: armazena grandes volumes de dados BRUTOS em qualquer formato (schema-on-read). DATA WAREHOUSE: dados estruturados e curados (schema-on-write) para BI.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Numa tabela com indice na coluna 'cpf', uma consulta por cpf tende a ser:`,o:[`A) Mais lenta`,`B) Mais rapida (o indice acelera a busca)`,`C) Impossivel`,`D) Igual sem indice`,`E) Bloqueada`],g:`B`,c:`Um INDICE na coluna acelera as buscas por aquele campo (evita varredura completa da tabela), tornando consultas/filtros por cpf mais rapidos (ao custo de espaco e de escrita mais lenta).`},{a:2023,r:`FCC/Analista-2023`,q:`A normalizacao de banco de dados (3FN) visa:`,o:[`A) Aumentar redundancia`,`B) Reduzir redundancia e anomalias, organizando os dados em tabelas relacionadas`,`C) Eliminar chaves`,`D) Desnormalizar`,`E) Criar data lake`],g:`B`,c:`NORMALIZACAO (ate a 3a Forma Normal): organiza os dados eliminando REDUNDANCIA e anomalias de insercao/atualizacao/exclusao, por meio de decomposicao em tabelas com dependencias adequadas.`},{a:2022,r:`FCC/TI-2022`,q:`Na LGPD, o tratamento de dados pessoais para 'cumprimento de obrigacao legal' pelo Fisco:`,o:[`A) Exige consentimento`,`B) Dispensa o consentimento (base legal propria, art. 7, II)`,`C) E proibido`,`D) So com autorizacao judicial`,`E) Exige anonimizacao total`],g:`B`,c:`O tratamento para CUMPRIMENTO DE OBRIGACAO LEGAL/REGULATORIA (art. 7, II LGPD) DISPENSA o consentimento - base legal aplicavel a fiscalizacao tributaria, que decorre de lei.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O comando SQL UPDATE sem clausula WHERE:`,o:[`A) Atualiza so a 1a linha`,`B) Atualiza TODAS as linhas da tabela (risco)`,`C) Nao executa`,`D) Apaga a tabela`,`E) Cria indice`],g:`B`,c:`UPDATE sem WHERE altera TODAS as linhas da tabela - erro perigoso. A clausula WHERE delimita quais registros serao atualizados.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na LGPD, a anonimizacao de dados resulta em:`,o:[`A) Dados ainda pessoais`,`B) Dados que nao permitem identificar o titular, saindo (em regra) do escopo da LGPD`,`C) Dados sensiveis`,`D) Dados publicos`,`E) Dados criptografados reversiveis`],g:`B`,c:`ANONIMIZACAO: processo que impede a identificacao do titular (sem possibilidade razoavel de reversao). Dado anonimizado, em regra, NAO e dado pessoal e sai do escopo da LGPD.`},{a:2023,r:`FCC/Analista-2023`,q:`Numa consulta SQL, ORDER BY ... DESC ordena:`,o:[`A) Em ordem crescente`,`B) Em ordem decrescente`,`C) Aleatoria`,`D) So texto`,`E) Por grupo`],g:`B`,c:`ORDER BY coluna DESC ordena em ordem DECRESCENTE (do maior para o menor). ASC (padrao) e crescente.`},{a:2022,r:`FCC/TI-2022`,q:`Um indicador de qualidade de dados e a 'completude', que mede:`,o:[`A) A velocidade`,`B) A ausencia de valores faltantes (dados preenchidos)`,`C) O custo`,`D) A seguranca`,`E) O volume`],g:`B`,c:`COMPLETUDE: dimensao de qualidade que mede o grau em que os dados estao PREENCHIDOS (ausencia de valores nulos/faltantes). Outras dimensoes: acuracia, consistencia, atualidade, unicidade.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A camada de um data warehouse que armazena dados ja tratados para consumo analitico e a:`,o:[`A) Staging (area de preparacao)`,`B) Camada de apresentacao/consumo (data marts, modelos dimensionais)`,`C) Fonte`,`D) Backup`,`E) Log`],g:`B`,c:`Apos a STAGING (preparacao) e a integracao, a CAMADA DE APRESENTACAO/CONSUMO (data marts, esquemas dimensionais) disponibiliza os dados tratados para analise e BI.`}],"FPB-1":[{a:2023,r:`FCC/Fiscal-2023`,q:`As tres funcoes do governo (Musgrave) sao:`,o:[`A) Arrecadar, fiscalizar, redistribuir`,`B) Alocativa, distributiva, estabilizadora`,`C) Regulatoria, tributaria, redistributiva`,`D) Planejar, executar, controlar`,`E) Producao, monopolio, externalidade`],g:`B`,c:`Musgrave: ALOCATIVA (falhas de mercado), DISTRIBUTIVA (desigualdade), ESTABILIZADORA (emprego/precos/crescimento).`},{a:2022,r:`FCC/Fiscal-2022`,q:`Os bens publicos PUROS caracterizam-se por:`,o:[`A) Rivalidade e exclusao`,`B) Nao rivalidade e nao exclusao (free rider)`,`C) Rivalidade e nao exclusao`,`D) Nao rivalidade e exclusao`,`E) Alta rivalidade`],g:`B`,c:`Bem publico puro: NAO RIVAL + NAO EXCLUDENTE -> free rider -> mercado falha -> Estado prove. Ex: defesa nacional, iluminacao publica.`},{a:2021,r:`FCC/TCE-2021`,q:`O superavit primario indica que:`,o:[`A) Pagou todos os juros sem deficit`,`B) Receitas nao financeiras > despesas nao financeiras, antes dos juros`,`C) A divida total caiu`,`D) O nominal e positivo`,`E) Nao houve nova divida`],g:`B`,c:`Superavit PRIMARIO: esforco fiscal antes dos juros. Pode coexistir com deficit nominal (se os juros superarem o superavit).`},{a:2020,r:`FCC/Econ-2020`,q:`A externalidade NEGATIVA gera falha porque:`,o:[`A) Produz pouco`,`B) Custo social > privado; mercado produz em excesso`,`C) Empresas nao lucram`,`D) E bem publico`,`E) Exige subsidio`],g:`B`,c:`Externalidade negativa: custo social > privado -> producao acima do otimo. Solucao: imposto pigouviano (poluidor-pagador).`},{a:2019,r:`FCC/Econ-2019`,q:`A NFSP nominal e:`,o:[`A) Primario - juros reais`,`B) Deficit primario + juros nominais`,`C) Receitas - despesas`,`D) Variacao da divida - correcao`,`E) Operacional + cambio`],g:`B`,c:`NFSP nominal = deficit primario + juros nominais (= -resultado primario + juros). Mede a variacao da divida liquida do setor publico.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A funcao DISTRIBUTIVA do governo atua por meio de:`,o:[`A) Controle da inflacao`,`B) Impostos progressivos, transferencias e subsidios`,`C) Provisao de defesa nacional`,`D) Politica monetaria`,`E) Regulacao de monopolios`],g:`B`,c:`Funcao DISTRIBUTIVA: reduzir desigualdade via impostos progressivos, transferencias (programas sociais) e subsidios.`},{a:2022,r:`FCC/Fiscal-2022`,q:`A externalidade POSITIVA (ex: vacinacao):`,o:[`A) Gera producao em excesso`,`B) Gera producao abaixo do otimo; solucao: subsidio`,`C) E um bem privado puro`,`D) Exige imposto`,`E) Cria monopolio`],g:`B`,c:`Externalidade positiva: beneficio social > privado -> producao ABAIXO do otimo. Solucao: subsidio ou provisao publica.`},{a:2021,r:`FCC/TCE-2021`,q:`O resultado NOMINAL do setor publico:`,o:[`A) Exclui os juros`,`B) Inclui os juros nominais (primario - juros)`,`C) E sempre superavitario`,`D) Ignora a divida`,`E) Mede so o PIB`],g:`B`,c:`NOMINAL = primario - juros nominais. Reflete a variacao total da divida. PRIMARIO exclui os juros (mede esforco fiscal).`},{a:2020,r:`FCC/Econ-2020`,q:`O monopolio natural justifica intervencao porque:`,o:[`A) Ha muitos concorrentes`,`B) Custos decrescentes tornam ineficiente a duplicacao -> regulacao`,`C) E bem publico`,`D) Gera externalidade positiva`,`E) Tem demanda elastica`],g:`B`,c:`Monopolio natural: custos medios decrescentes (uma so firma atende com menor custo). Estado regula (preco/qualidade) para evitar abuso.`},{a:2019,r:`FCC/Econ-2019`,q:`O criterio do BENEFICIO na tributacao defende que:`,o:[`A) Paga mais quem tem mais renda`,`B) Paga quem se beneficia do gasto publico, na proporcao do beneficio`,`C) Todos pagam igual`,`D) So empresas pagam`,`E) Tributa-se o consumo`],g:`B`,c:`Criterio do BENEFICIO: o tributo deve ser pago por quem se beneficia do servico publico (ex: taxas, contribuicao de melhoria). Alternativa: capacidade contributiva.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A funcao ESTABILIZADORA do governo busca:`,o:[`A) Reduzir desigualdade`,`B) Manter pleno emprego, estabilidade de precos e crescimento`,`C) Prover bens publicos`,`D) Corrigir externalidades`,`E) Cobrar tributos`],g:`B`,c:`Funcao ESTABILIZADORA (Musgrave): atuar sobre o nivel de emprego, precos e crescimento via politicas fiscal e monetaria (anticiclicas).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Um imposto e REGRESSIVO quando:`,o:[`A) Aumenta com a renda`,`B) Pesa proporcionalmente mais sobre quem tem menor renda`,`C) E proporcional`,`D) So atinge ricos`,`E) E progressivo`],g:`B`,c:`Imposto REGRESSIVO: a carga relativa e MAIOR para os de menor renda (tipico de tributos sobre consumo). Progressivo: aliquota cresce com a base.`},{a:2022,r:`FCC/PGE-2022`,q:`A 'tragedia dos comuns' ilustra a falha de:`,o:[`A) Bens privados`,`B) Recursos comuns (rivais e nao excludentes) sobreexplorados`,`C) Monopolio`,`D) Bens publicos puros`,`E) Informacao perfeita`],g:`B`,c:`Tragedia dos comuns: recursos COMUNS (rivais, mas nao excludentes - ex: pesca, pastagem) tendem a ser superexplorados, pois o custo e coletivo e o beneficio individual.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O principio da capacidade contributiva sustenta a:`,o:[`A) Tributacao pelo beneficio`,`B) Tributacao conforme a possibilidade economica do contribuinte (progressividade)`,`C) Aliquota unica`,`D) Isencao geral`,`E) Tributo fixo`],g:`B`,c:`Capacidade contributiva (art. 145, par.1 CF): cada um contribui conforme sua capacidade economica, fundamentando a progressividade e a pessoalidade dos impostos.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A divida publica BRUTA difere da liquida porque a liquida:`,o:[`A) Inclui mais passivos`,`B) Deduz os ativos financeiros (creditos) do governo`,`C) Ignora a divida externa`,`D) E sempre maior`,`E) Exclui a divida interna`],g:`B`,c:`Divida LIQUIDA = divida bruta - ativos financeiros do setor publico (reservas, creditos). A BRUTA considera apenas os passivos.`},{a:2022,r:`FCC/PGE-2022`,q:`A senhoriagem refere-se a:`,o:[`A) Imposto sobre renda`,`B) Receita do governo decorrente da emissao de moeda`,`C) Divida externa`,`D) Transferencia a estados`,`E) Tarifa publica`],g:`B`,c:`SENHORIAGEM: ganho do governo ao emitir moeda (diferenca entre o valor de face e o custo de producao); em excesso, gera inflacao (imposto inflacionario).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Bens MERITORIOS (meritory goods) sao aqueles que:`,o:[`A) O mercado prove em excesso`,`B) O Estado incentiva por serem socialmente desejaveis (ex: educacao, saude)`,`C) Sao puramente privados`,`D) Geram externalidade negativa`,`E) Nao tem demanda`],g:`B`,c:`Bens MERITORIOS: o Estado estimula seu consumo por gerarem beneficios sociais (educacao, saude, cultura), ainda que os individuos os subvalorizem.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O resultado operacional do setor publico exclui, em relacao ao nominal:`,o:[`A) Os juros reais`,`B) A correcao monetaria/atualizacao da divida`,`C) As receitas`,`D) As despesas primarias`,`E) Os investimentos`],g:`B`,c:`Resultado OPERACIONAL = nominal excluida a correcao monetaria (atualizacao cambial/inflacionaria) da divida. Mede o esforco real sem o efeito inflacao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A funcao ALOCATIVA do governo justifica-se principalmente por:`,o:[`A) Desigualdade de renda`,`B) Falhas de mercado (bens publicos, externalidades, monopolios, assimetria)`,`C) Inflacao`,`D) Desemprego`,`E) Cambio`],g:`B`,c:`Funcao ALOCATIVA: o Estado intervem para corrigir FALHAS DE MERCADO - bens publicos, externalidades, monopolios naturais e assimetria de informacao.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Um sistema tributario progressivo contribui para a funcao:`,o:[`A) Alocativa`,`B) Distributiva (reduz desigualdade)`,`C) Estabilizadora`,`D) Reguladora`,`E) Cambial`],g:`B`,c:`A PROGRESSIVIDADE (quem ganha mais paga proporcionalmente mais) serve a funcao DISTRIBUTIVA, reduzindo a desigualdade de renda.`},{a:2022,r:`FCC/PGE-2022`,q:`O 'imposto inflacionario' refere-se a:`,o:[`A) IR sobre ganhos`,`B) Perda do poder de compra da moeda em poder do publico devido a inflacao`,`C) ICMS`,`D) Tarifa publica`,`E) Contribuicao social`],g:`B`,c:`IMPOSTO INFLACIONARIO: a inflacao corroi o valor da moeda retida pelo publico, transferindo recursos reais ao governo emissor (ligado a senhoriagem).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O equilibrio orcamentario intertemporal preconiza que:`,o:[`A) O orcamento deve fechar todo ano`,`B) Deficits presentes implicam superavits futuros (restricao orcamentaria do governo no tempo)`,`C) Nunca havera deficit`,`D) A divida e irrelevante`,`E) Gastos sao ilimitados`],g:`B`,c:`Restricao orcamentaria INTERTEMPORAL: deficits hoje (mais divida) exigem superavits primarios futuros para manter a solvencia; o governo nao pode rolar divida indefinidamente sem ajuste.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Externalidade negativa de producao gera:`,o:[`A) Custo social menor que o privado`,`B) Custo social maior que o privado, com producao acima do otimo`,`C) Subsidio`,`D) Bem publico`,`E) Producao otima`],g:`B`,c:`Externalidade NEGATIVA (ex: poluicao): custo SOCIAL > custo PRIVADO, levando a producao ACIMA do nivel socialmente otimo. Correcao: imposto de Pigou.`},{a:2022,r:`FCC/PGE-2022`,q:`A teoria da tributacao otima busca:`,o:[`A) Maximizar a carga`,`B) Arrecadar o necessario minimizando as distorcoes (peso morto) e respeitando a equidade`,`C) Eliminar tributos`,`D) Tributar so o consumo`,`E) Aliquota zero`],g:`B`,c:`Tributacao OTIMA: arrecadar a receita necessaria com o MENOR custo de eficiencia (peso morto) possivel, conciliando eficiencia e equidade (trade-off).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A regra de ouro das financas publicas estabelece que o endividamento deve financiar:`,o:[`A) Despesas correntes`,`B) Despesas de capital (investimentos), nao o custeio`,`C) Folha de pagamento`,`D) Juros`,`E) Qualquer despesa`],g:`B`,c:`REGRA DE OURO: as operacoes de credito (divida) nao podem exceder as despesas de CAPITAL - o endividamento financia investimento, nao custeio corrente.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O criterio do beneficio na tributacao associa o tributo ao:`,o:[`A) Patrimonio`,`B) Beneficio que o contribuinte recebe do gasto publico (ex: taxas, pedagio)`,`C) Lucro`,`D) Consumo`,`E) Numero de filhos`],g:`B`,c:`Criterio do BENEFICIO: paga mais quem se beneficia mais do servico publico (taxas, contribuicao de melhoria, pedagio). Alternativa a capacidade contributiva.`},{a:2022,r:`FCC/PGE-2022`,q:`A descentralizacao fiscal (federalismo fiscal) trata de:`,o:[`A) Centralizar tributos na Uniao`,`B) Distribuir competencias tributarias e encargos entre os niveis de governo`,`C) Eliminar estados`,`D) Unificar o orcamento`,`E) Privatizar a arrecadacao`],g:`B`,c:`FEDERALISMO FISCAL: reparticao de competencias tributarias, encargos e transferencias entre Uniao, Estados e Municipios, buscando equilibrio entre autonomia e cooperacao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Bens semipublicos (ou de clube) caracterizam-se por:`,o:[`A) Nao-rivalidade e nao-exclusao`,`B) Nao-rivalidade ate certo ponto, mas com possibilidade de exclusao`,`C) Rivalidade total`,`D) Serem gratuitos`,`E) Ausencia de demanda`],g:`B`,c:`Bens de CLUBE (semipublicos): ha possibilidade de EXCLUSAO (pode-se cobrar/barrar) e a nao-rivalidade vale ate o ponto de congestionamento (ex: TV por assinatura, rodovia com pedagio).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A 'equivalencia ricardiana' sugere que um aumento de gasto financiado por divida:`,o:[`A) Sempre estimula o consumo`,`B) Pode nao estimular, pois agentes poupam prevendo impostos futuros`,`C) Reduz a poupanca`,`D) Elimina a divida`,`E) Gera inflacao certa`],g:`B`,c:`EQUIVALENCIA RICARDIANA: agentes racionais antecipam que a divida de hoje sera paga com IMPOSTOS futuros, entao poupam mais, neutralizando (parcialmente) o estimulo do gasto deficitario.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Um tributo e considerado NEUTRO quando:`,o:[`A) Distorce muito as escolhas`,`B) Nao altera (ou altera minimamente) as decisoes economicas dos agentes`,`C) E progressivo`,`D) Tem aliquota alta`,`E) Gera muito peso morto`],g:`B`,c:`NEUTRALIDADE tributaria: o tributo interfere o MINIMO possivel nas decisoes de producao e consumo (baixa distorcao/peso morto). E um dos objetivos da reforma tributaria (IVA).`},{a:2022,r:`FCC/PGE-2022`,q:`O federalismo fiscal cooperativo caracteriza-se por:`,o:[`A) Total independencia dos entes`,`B) Repartição de receitas e atuacao conjunta entre niveis de governo`,`C) Centralizacao na Uniao`,`D) Ausencia de transferencias`,`E) Competicao predatoria`],g:`B`,c:`Federalismo fiscal COOPERATIVO: os entes atuam de forma articulada, com reparticao de receitas (FPE, FPM) e transferencias, equilibrando autonomia e cooperacao (modelo brasileiro).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A 'restricao orcamentaria intertemporal do governo' implica que a divida atual deve ser igual ao:`,o:[`A) PIB`,`B) Valor presente dos superavits primarios futuros`,`C) Total de impostos`,`D) Gasto corrente`,`E) Deficit nominal`],g:`B`,c:`A solvencia exige que a divida atual seja coberta pelo VALOR PRESENTE dos superavits primarios FUTUROS - condicao de sustentabilidade da divida publica.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O 'peso morto' (carga excedente) de um tributo representa:`,o:[`A) A arrecadacao`,`B) A perda de bem-estar que excede a receita arrecadada (ineficiencia)`,`C) O lucro do governo`,`D) A multa`,`E) O custo administrativo`],g:`B`,c:`PESO MORTO (carga excedente/deadweight loss): perda de excedente (bem-estar) que NAO se converte em arrecadacao, decorrente da distorcao que o tributo causa nas quantidades.`},{a:2022,r:`FCC/PGE-2022`,q:`O principio da progressividade tributaria associa-se a funcao:`,o:[`A) Alocativa`,`B) Distributiva (reduzir desigualdade)`,`C) Estabilizadora`,`D) Reguladora`,`E) Monetaria`],g:`B`,c:`A PROGRESSIVIDADE (aliquotas crescentes com a base) serve a funcao DISTRIBUTIVA, promovendo a justica fiscal e a reducao das desigualdades de renda.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A 'ilusao fiscal' ocorre quando os contribuintes:`,o:[`A) Percebem claramente a carga`,`B) Subestimam o custo dos servicos publicos por nao perceberem a real carga tributaria (ex: tributos indiretos embutidos)`,`C) Pagam menos imposto`,`D) Recebem subsidio`,`E) Sonegam`],g:`B`,c:`ILUSAO FISCAL: os cidadaos SUBESTIMAM o custo real dos servicos publicos porque nao percebem a carga (tributos indiretos embutidos nos precos), o que pode levar a demanda excessiva por gastos.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O imposto de Pigou (pigouviano) tem aliquota ideal igual ao:`,o:[`A) Custo medio`,`B) Custo marginal externo (valor da externalidade negativa na margem)`,`C) Preco de mercado`,`D) Lucro`,`E) Custo fixo`],g:`B`,c:`O imposto de PIGOU ideal iguala-se ao CUSTO MARGINAL EXTERNO (valor do dano causado pela externalidade na margem), internalizando-o e levando a producao ao otimo social.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A 'curva de Lorenz' e utilizada para medir:`,o:[`A) Inflacao`,`B) A desigualdade na distribuicao de renda`,`C) O PIB`,`D) O desemprego`,`E) A divida`],g:`B`,c:`A CURVA DE LORENZ representa graficamente a distribuicao de renda; quanto mais distante da linha de igualdade, maior a desigualdade. Dela deriva o indice de Gini.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Um bem 'tarifado' (clube) admite:`,o:[`A) Nao-exclusao`,`B) Exclusao via preco/tarifa e nao-rivalidade ate o congestionamento`,`C) Rivalidade total`,`D) Provisao so privada`,`E) Ausencia de demanda`],g:`B`,c:`Bem de CLUBE (tarifado): admite EXCLUSAO (cobra-se acesso) e ha nao-rivalidade ate o ponto de congestionamento (ex: rodovia com pedagio, TV por assinatura).`},{a:2022,r:`FCC/PGE-2022`,q:`A descentralizacao de encargos sem a correspondente receita gera:`,o:[`A) Equilibrio`,`B) Desequilibrio vertical no federalismo fiscal`,`C) Superavit`,`D) Reducao da divida`,`E) Mais autonomia plena`],g:`B`,c:`DESEQUILIBRIO VERTICAL: ocorre quando ha descompasso entre os encargos atribuidos a um nivel de governo e as receitas de que dispoe (ex: municipios com muitos encargos e pouca arrecadacao propria).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A tributacao otima de Ramsey-Boiteux aplica-se a:`,o:[`A) Bens publicos puros`,`B) Definicao de aliquotas/precos publicos que minimizem a perda de eficiencia dada uma meta de receita`,`C) Externalidades`,`D) Monopolio natural so`,`E) Renda`],g:`B`,c:`A regra de RAMSEY (e Ramsey-Boiteux para precos publicos): define aliquotas/tarifas que MINIMIZAM a perda de eficiencia (peso morto) sujeita a uma meta de arrecadacao - tributar mais o inelastico.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O 'teorema de Coase' sugere que externalidades podem ser resolvidas por:`,o:[`A) So intervencao estatal`,`B) Negociacao privada entre as partes, se os direitos de propriedade forem bem definidos e os custos de transacao baixos`,`C) Tributos sempre`,`D) Proibicao`,`E) Subsidios`],g:`B`,c:`Teorema de COASE: havendo direitos de propriedade bem definidos e baixos custos de transacao, as partes podem NEGOCIAR privadamente e alcancar a alocacao eficiente, sem necessidade de intervencao estatal.`},{a:2022,r:`FCC/PGE-2022`,q:`A 'lei de Wagner' preconiza que, com o desenvolvimento economico:`,o:[`A) O Estado encolhe`,`B) Os gastos publicos tendem a crescer mais que proporcionalmente a renda`,`C) Os tributos somem`,`D) A divida zera`,`E) Nao ha gasto social`],g:`B`,c:`Lei de WAGNER: a medida que a renda/desenvolvimento cresce, a participacao dos GASTOS PUBLICOS no PIB tende a AUMENTAR (mais demanda por servicos publicos, regulacao e bem-estar).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O efeito 'flypaper' (papel pega-mosca) nas transferencias indica que:`,o:[`A) Transferencias reduzem gastos`,`B) Recursos transferidos tendem a ser gastos pelo ente recebedor, em vez de reduzir tributos locais`,`C) Nao ha efeito`,`D) Aumentam a arrecadacao propria`,`E) Reduzem a divida`],g:`B`,c:`Efeito FLYPAPER: transferencias intergovernamentais tendem a 'grudar' onde chegam, ELEVANDO os gastos do ente recebedor, em vez de serem repassadas aos contribuintes via reducao de tributos locais.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O criterio da capacidade de pagamento (ability to pay) fundamenta a:`,o:[`A) Tributacao pelo beneficio`,`B) Tributacao conforme a capacidade economica (progressividade, equidade vertical)`,`C) Aliquota unica`,`D) Isencao geral`,`E) Taxa de servico`],g:`B`,c:`Criterio da CAPACIDADE DE PAGAMENTO: tributa-se conforme a capacidade economica do contribuinte, base da equidade VERTICAL (quem pode mais paga mais) e da progressividade.`}]},p=e((e=>{var t=Symbol.for(`react.transitional.element`);function n(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.jsx=n,e.jsxs=n})),m=e(((e,t)=>{t.exports=p()}))(),h={bg:`#080e1a`,card:`#0f1829`,card2:`#162035`,border:`#1b2c44`,gold:`#c8a951`,goldL:`#f0d080`,red:`#ef4444`,green:`#22c55e`,blue:`#3b82f6`,purple:`#a855f7`,text:`#e2e8f0`,muted:`#64748b`},g={"LP-1":`LP-1`,"LP-2":`LP-2`,"MAT-1":`MAT-1`,"MAT-2":`MAT-2`,"ADM-1":`ADM-1`,"ADM-2":`ADM-2`,"ECO-1":`ECO-1`,"ECO-2":`ECO-2`,"DCO-1":`DCO-1`,"DAD-1":`DAD-1`,"DCI-1":`DCI-1`,"DFI-1":`DFI-1`,"DFI-2":`DFI-2`,"CGP-1":`CGP-1`,"CGP-2":`CGP-2
