. A FCC adora pegadinhas com esses verbos.`],"LP-2":[`INTERPRETACAO DE TEXTO - 22% das questoes de Portugues:`,`* FCC pede INFERENCIA: o que o texto PERMITE concluir, nao o explicito`,`* Cuidado com alternativas que EXAGERAM ou GENERALIZAM`,`* Relacao do texto com o contexto historico de producao`,`* Tema x tese x argumento: distinguir os tres`,``,`COESAO TEXTUAL:`,`* REFERENCIAL: pronomes, sinonimos, hiperonimos que retomam (anafora)`,`  ou antecipam (catafora) elementos`,`* SEQUENCIAL (conectivos):`,`  - Causa: porque, pois, visto que, ja que`,`  - Concessao: embora, ainda que, apesar de, mesmo que`,`  - Condicao: se, caso, desde que, contanto que`,`  - Oposicao: mas, porem, contudo, todavia, ao passo que`,`  - Conclusao: logo, portanto, assim, por conseguinte`,`  - Finalidade: para que, a fim de que`,``,`DENOTACAO E CONOTACAO:`,`* Denotacao: sentido literal, objetivo, do dicionario`,`* Conotacao: sentido figurado, subjetivo, expressivo`,``,`DISCURSO:`,`* Direto: fala literal entre aspas/travessao`,`* Indireto: narrador relata a fala (verbo + que)`,`* Indireto livre: mistura, sem marca clara`,``,`FIGURAS DE LINGUAGEM:`,`* Metafora, metonimia, hiperbole, ironia, eufemismo, antitese`,``,`FUNCOES DA LINGUAGEM:`,`* Referencial (informacao), Emotiva (emissor), Conativa (receptor),`,`  Fatica (canal), Metalinguistica (codigo), Poetica (mensagem)`,``,`PONTUACAO:`,`* Oracao adjetiva EXPLICATIVA = entre virgulas`,`* NUNCA virgula entre sujeito e verbo`,`* Ponto e virgula: coordenadas longas e enumeracoes`,``,`DICA FCC: Em interpretacao, a resposta esta SEMPRE ancorada no texto. Desconfie de alternativas que trazem informacoes externas ou opinioes radicais.`],"MAT-1":[`JUROS SIMPLES: J = C x i x n | M = C x (1 + i x n)`,`* Rendimento LINEAR (mesma quantia a cada periodo)`,`* Ex: C=10.000, i=2% a.m., n=3 -> J=600 -> M=10.600`,``,`JUROS COMPOSTOS: M = C x (1 + i)^n`,`* Rendimento EXPONENCIAL (juros sobre juros)`,`* FCC sempre fornece o fator (ex: 1,02^3 = 1,0612)`,`* Ex: M = 10.000 x 1,0612 = 10.612`,``,`TAXAS:`,`* EQUIVALENTES (compostos): mesma rentabilidade em prazos diferentes`,`* NOMINAL x EFETIVA: nominal nao considera capitalizacao; efetiva sim`,`* REAL: descontada a inflacao -> (1+i nominal)=(1+i real)(1+inflacao)`,``,`DESCONTOS:`,`* RACIONAL (por dentro): sobre o valor atual`,`* COMERCIAL (por fora): sobre o valor nominal (mais comum, maior desconto)`,``,`SISTEMA SAC (Amortizacao Constante):`,`* Amortizacao = PV / n (CONSTANTE)`,`* Juros = saldo devedor x i (DECRESCENTES)`,`* Prestacao DECRESCENTE`,`  Ex PV=60.000, n=3, i=10%:`,`  1a: J=6.000+A=20.000=26.000 (SD=40.000)`,`  2a: J=4.000+A=20.000=24.000 (SD=20.000)`,`  3a: J=2.000+A=20.000=22.000`,``,`SISTEMA PRICE (Frances):`,`* Prestacoes CONSTANTES`,`* Juros decrescentes + amortizacao crescente`,`* Custo total MAIOR que o SAC`,``,`FLUXO DE CAIXA:`,`* Valor Presente (VP): traz valores futuros para hoje`,`* Taxa Interna de Retorno (TIR): taxa que zera o VPL`,``,`DICA FCC: Em SAC monte a tabela linha por linha. Em juros compostos, use sempre o fator fornecido pela banca.`],"MAT-2":[`ESTATISTICA DESCRITIVA - Medidas de Posicao:`,`* MEDIA aritmetica: soma / n`,`* MEDIANA: valor central apos ORDENAR (n impar=central; n par=media dos 2 centrais)`,`* MODA: valor mais frequente (pode ser amodal, bimodal)`,`* QUARTIS: dividem em 4 partes (Q1=25%, Q2=mediana, Q3=75%)`,``,`MEDIDAS DE DISPERSAO:`,`* AMPLITUDE: maximo - minimo`,`* VARIANCIA: media dos quadrados dos desvios`,`* DESVIO-PADRAO: raiz quadrada da variancia (mesma unidade dos dados)`,`* COEFICIENTE DE VARIACAO: desvio-padrao / media (compara dispersoes)`,``,`PROBABILIDADE:`,`* P(A) = casos favoraveis / casos possiveis`,`* P(A ou B) = P(A) + P(B) - P(A e B) [adicao]`,`* P(A e B) = P(A) x P(B|A) [multiplicacao]`,`* Independentes: P(A e B) = P(A) x P(B)`,`* Complementar: P(A') = 1 - P(A)`,``,`DISTRIBUICOES:`,`* Discretas: Bernoulli, Binomial, Poisson`,`* Continuas: Normal, t-Student, Qui-quadrado, F-Snedecor`,``,`ANALISE COMBINATORIA:`,`* Combinacao C(n,k)=n!/[k!(n-k)!] (ordem NAO importa)`,`* Arranjo A(n,k)=n!/(n-k)! (ordem importa)`,`* Permutacao P(n)=n!`,``,`RACIOCINIO LOGICO:`,`* Conectivos: E (conjuncao), OU (disjuncao), SE-ENTAO (condicional)`,`* MODUS PONENS: P->Q, P, logo Q`,`* MODUS TOLLENS: P->Q, nao-Q, logo nao-P (MAIS COBRADO)`,`* SILOGISMO HIPOTETICO: P->Q, Q->R, logo P->R`,`* Contrapositiva: P->Q equivale a nao-Q -> nao-P`,`* De Morgan: nao(P e Q)=nao-P ou nao-Q`,`* Negacao de 'todo': 'algum nao'; negacao de 'algum': 'nenhum'`,``,`DICA FCC: Mediana SEMPRE exige ordenar os dados antes. Modus Tollens e a forma de argumento mais cobrada.`],"ADM-1":[`GOVERNANCA PUBLICA:`,`* Conceito: sistema de direcionar, monitorar e avaliar a gestao`,`* Principios: capacidade de resposta, integridade, confiabilidade,`,`  transparencia, prestacao de contas (accountability)`,`* Instancias: estrategica, tatica e operacional`,`* Teoria da Agencia: principal (sociedade) x agente (gestor)`,``,`MODELO DAS 3 LINHAS (IIA 2020):`,`* 1a LINHA: gestao operacional (donos do risco no dia a dia)`,`* 2a LINHA: funcoes de suporte (compliance, gestao de riscos, controles)`,`* 3a LINHA: AUDITORIA INTERNA (asseguracao INDEPENDENTE)`,`* Acima: orgao de governanca + partes externas (TCU, auditoria externa)`,``,`GESTAO DE RISCOS (ISO 31000 / COSO):`,`* Risco = efeito da incerteza nos objetivos`,`* Processo: identificar -> analisar -> avaliar -> tratar -> monitorar`,`* Tratamento: evitar, reduzir, transferir, aceitar`,`* Apetite ao risco: nivel que a organizacao aceita assumir`,``,`INTEGRIDADE (CE):`,`* Programa de Integridade do Poder Executivo do CE`,`* Codigo de Etica e Conduta da Adm. Publica Estadual do CE`,`* Sancoes eticas e disciplinares; PAD; TAC`,`* Assedio moral: Convencao OIT 190/2019`,``,`LEI DE ACESSO A INFORMACAO (Lei 12.527/2011):`,`* Prazo: 20 dias + 10 dias (com justificativa)`,`* Sigilo: Reservado=5 anos, Secreto=15 anos, Ultra-secreto=25 anos`,`* Transparencia ATIVA (proativa) e PASSIVA (sob demanda)`,``,`DICA FCC: Distinguir os papeis das 3 linhas e crucial. Auditoria interna (3a linha) NUNCA se confunde com gestao de riscos (2a linha).`],"ADM-2":[`NOVA LEI DE LICITACOES (Lei 14.133/2021) - Modalidades:`,`* PREGAO: bens e servicos comuns (criterio: menor preco/maior desconto)`,`* CONCORRENCIA: obras, servicos especiais, criterios variados`,`* CONCURSO: trabalho tecnico, cientifico ou artistico`,`* LEILAO: alienacao de bens (maior lance)`,`* DIALOGO COMPETITIVO: inovacao tecnologica ou solucao inexistente`,`  no mercado -> Adm. DIALOGA com licitantes antes de definir o objeto`,``,`CRITERIOS DE JULGAMENTO:`,`* Menor preco, maior desconto, melhor tecnica, tecnica e preco,`,`  maior lance, maior retorno economico`,``,`FASES (Lei 14.133):`,`* Preparatoria -> divulgacao do edital -> apresentacao de propostas`,`  -> julgamento -> habilitacao -> recursal -> homologacao`,`  (Inversao de fases: habilitacao APOS julgamento, como no pregao)`,``,`CONTRATACAO DIRETA:`,`* DISPENSA (art. 75): valor baixo, emergencia, etc.`,`* INEXIGIBILIDADE (art. 74): inviabilidade de competicao`,``,`IMPROBIDADE ADMINISTRATIVA (Lei 8.429/92 + 14.230/2021):`,`* Exige DOLO ESPECIFICO (culpa foi EXCLUIDA)`,`* Legitimidade ativa: EXCLUSIVA do MP`,`* Prescricao: 8 anos do fato ou 4 anos apos fim do vinculo`,`* Modalidades: enriquecimento ilicito, lesao ao erario, contra principios`,``,`LEI ANTICORRUPCAO (Lei 12.846/2013):`,`* Responsabilidade OBJETIVA das pessoas juridicas`,`* Acordo de Leniencia reduz sancoes`,``,`DICA FCC: O dialogo competitivo (modalidade nova) e cobrado em quase toda prova desde 2022. Improbidade agora exige DOLO; culpa nao basta mais.`],"ECO-1":[`MICROECONOMIA - Oferta e Demanda:`,`* Lei da demanda: preco sobe -> quantidade demandada cai`,`* Lei da oferta: preco sobe -> quantidade ofertada sobe`,`* Equilibrio: ponto onde oferta = demanda`,``,`ELASTICIDADES:`,`* ELASTICA: |Ed| > 1 (quantidade varia MAIS que o preco)`,`* INELASTICA: |Ed| < 1 (quantidade varia MENOS que o preco)`,`* UNITARIA: |Ed| = 1`,`* Bem inelastico: tributar aumenta receita (consumo pouco muda)`,`* Determinantes: substitutos, essencialidade, prazo, % da renda`,``,`ECONOMIA DA TRIBUTACAO:`,`* PESO MORTO (perda de bem-estar): maior quanto mais elasticos os lados`,`* REGRA DE RAMSEY: tributar mais bens INELASTICOS minimiza ineficiencia`,`* CURVA DE LAFFER: ha aliquota otima; acima dela, arrecadacao CAI`,`* INCIDENCIA ECONOMICA: recai mais sobre o lado MENOS elastico`,`* Imposto Ad Valorem (%) x Especifico (valor fixo) x sobre Valor Adicionado`,``,`ESTRUTURAS DE MERCADO:`,`* Concorrencia Perfeita: muitos, produto homogeneo, lucro zero no LP`,`* Monopolio: um ofertante, poder de preco, peso morto`,`* Oligopolio: poucos, interdependencia estrategica`,`* Concorrencia Monopolistica: muitos, produtos diferenciados`,``,`DICA FCC: A Regra de Ramsey conflita com EQUIDADE, pois bens inelasticos sao essenciais (mais consumidos pelos pobres). Esse trade-off cai sempre.`],"ECO-2":[`MACROECONOMIA - PIB pelas 3 oticas (mesmo resultado):`,`* DEMANDA: C + I + G + (X - M)`,`  C=consumo familias, I=investimento, G=gasto governo, X-M=exportacao liquida`,`* RENDA: Salarios + Lucros + Juros + Alugueis + Tributos indiretos`,`* PRODUCAO: soma dos Valores Adicionados (evita dupla contagem)`,``,`AGREGADOS:`,`* PIB: producao no territorio nacional`,`* PNB: producao por residentes (PIB - renda enviada + renda recebida)`,`* PIB real x nominal -> Deflator do PIB = (PIB nom / PIB real) x 100`,``,`MODELO IS-LM:`,`* IS (mercado de bens): juros altos -> investimento cai -> PIB cai`,`  Politica FISCAL desloca IS (aumento de G -> IS para direita)`,`* LM (mercado monetario): politica MONETARIA desloca LM`,``,`INFLACAO:`,`* IPCA: indice oficial (IBGE), 1 a 40 salarios minimos`,`* IGP-M: FGV, usado em contratos/alugueis`,`* Valor real = valor nominal / (1 + inflacao)`,``,`POLITICAS ECONOMICAS:`,`* FISCAL: gastos e tributos (expansionista combate recessao)`,`* MONETARIA: taxa de juros (Selic), reservas, open market`,`* CAMBIAL: regimes fixo, flutuante, bandas`,``,`BALANCO DE PAGAMENTOS:`,`* Conta corrente (bens, servicos, rendas, transferencias)`,`* Conta capital e financeira`,``,`DICA FCC: Multiplicador keynesiano = 1/(propensao marginal a poupar). Politica fiscal expansionista (aumento de G ou reducao de tributos) desloca a IS para a direita.`],"DCO-1":[`CONTROLE DE CONSTITUCIONALIDADE - CONCENTRADO (STF):`,`* ADI: lei/ato federal ou estadual vs CF`,`* ADC: lei federal - confirma constitucionalidade`,`* ADPF: viola preceito fundamental (inclui leis pre-1988)`,`* ADO: omissao inconstitucional do legislador`,`* Efeitos: ERGA OMNES + EX TUNC + VINCULANTE`,`* Legitimados (art. 103): Presidente, Mesas, Governadores, PGR,`,`  Conselho Federal OAB, partidos com representacao, confederacoes`,``,`CONTROLE DIFUSO (qualquer juizo):`,`* Qualquer juiz/tribunal pode afastar norma inconstitucional`,`* Efeitos: INTER PARTES + EX TUNC`,`* Senado pode suspender (art. 52, X) -> erga omnes + ex nunc`,``,`SUMULA VINCULANTE (art. 103-A):`,`* Aprovada por 2/3 do STF (8 ministros)`,`* Vincula: todo Judiciario + Adm. Publica direta e indireta`,`* NAO vincula: o proprio STF e o Legislativo (funcao tipica)`,``,`APLICABILIDADE DAS NORMAS:`,`* Eficacia PLENA: aplicacao imediata, sem restricao`,`* Eficacia CONTIDA: plena, mas pode ser restringida por lei`,`* Eficacia LIMITADA: depende de lei (programaticas)`,``,`DIREITOS FUNDAMENTAIS:`,`* Art. 5 par. 1: aplicacao IMEDIATA`,`* Individuais, coletivos, sociais, nacionalidade, politicos`,`* Clausulas petreas (art. 60 par.4): forma federativa, voto direto,`,`  separacao dos poderes, direitos e garantias individuais`,``,`DICA FCC: Decore os efeitos: DIFUSO=inter partes+ex tunc; CONCENTRADO=erga omnes+ex tunc+vinculante.`],"DAD-1":[`PRINCIPIOS DA ADMINISTRACAO (art. 37 CF) - LIMPE:`,`* Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiencia`,`* Implicitos: razoabilidade, proporcionalidade, autotutela, continuidade`,``,`ATOS ADMINISTRATIVOS - Requisitos (COFIFOMOB):`,`* COmpetencia, FInalidade, FOrma, MOtivo, OBjeto`,`* Vicios em competencia/forma -> sanaveis (convalidacao)`,`* Vicios em finalidade/motivo/objeto -> insanaveis (anulacao)`,``,`ATRIBUTOS:`,`* Presuncao de legitimidade (relativa)`,`* Imperatividade`,`* Autoexecutoriedade`,`* Tipicidade`,``,`EXTINCAO:`,`* ANULACAO: ilegalidade -> EX TUNC (Sumula 473 STF)`,`* REVOGACAO: conveniencia/oportunidade -> EX NUNC (so a Adm.)`,`* CASSACAO: descumprimento de condicoes pelo beneficiario`,`* CONVALIDACAO: sana vicio sanavel`,``,`PODERES DA ADMINISTRACAO:`,`* Vinculado, discricionario, hierarquico, disciplinar, regulamentar,`,`  de policia (preventivo e repressivo)`,``,`RESPONSABILIDADE CIVIL (art. 37 par. 6):`,`* OBJETIVA (teoria do risco administrativo) para atos COMISSIVOS`,`* Conduta + dano + nexo causal (sem necessidade de culpa)`,`* Excludentes: fato da vitima, caso fortuito, fato de terceiro`,`* Direito de REGRESSO contra agente com dolo ou culpa`,``,`ORGANIZACAO ADMINISTRATIVA:`,`* DESCONCENTRACAO: dentro da mesma PJ (orgaos), com hierarquia`,`* DESCENTRALIZACAO: para outra PJ (autarquias, fundacoes, EP, SEM),`,`  com vinculacao/supervisao (sem hierarquia)`,``,`DICA FCC: Anulacao=ilegalidade+ex tunc. Revogacao=merito+ex nunc. Responsabilidade objetiva NAO exige culpa do Estado.`],"DCI-1":[`CRIMES CONTRA A ORDEM TRIBUTARIA (Lei 8.137/1990):`,`* Art. 1 (PARTICULAR): crimes MATERIAIS`,`  SUMULA VINCULANTE 24: so se tipifica APOS lancamento DEFINITIVO`,`  Condutas: omitir informacao, fraudar documentos, negar nota fiscal`,`* Art. 2: crimes FORMAIS (consumam com a conduta)`,`* Mero inadimplemento do tributo declarado NAO e crime`,``,`CRIMES CONTRA A ADMINISTRACAO PUBLICA:`,`* Por funcionario: peculato, concussao, corrupcao passiva, prevaricacao`,`* Por particular: corrupcao ativa, descaminho, contrabando`,``,`LAVAGEM DE DINHEIRO (Lei 9.613/1998):`,`* Ocultar/dissimular origem de bens de INFRACAO PENAL`,`* Modelo ALL CRIMES (Lei 12.683/2012): qualquer crime antecedente`,`* 3 fases: Colocacao -> Dissimulacao (layering) -> Integracao`,`* Pena: 3 a 10 anos + multa`,``,`CRIME ORGANIZADO (Lei 12.850/2013):`,`* 4+ pessoas, estrutura ordenada, divisao de tarefas`,`* Colaboracao premiada, infiltracao, acao controlada`,``,`LEI ANTICORRUPCAO (Lei 12.846/2013):`,`* Responsabilidade OBJETIVA das pessoas juridicas`,``,`DIREITO CIVIL:`,`* PRESCRICAO: extingue a PRETENSAO (acao). Pode ser renunciada/interrompida`,`* DECADENCIA: extingue o DIREITO potestativo. Legal=irrenunciavel`,`* LINDB: vigencia, aplicacao, conflito de leis no tempo/espaco`,`* Negocio juridico: existencia -> validade -> eficacia`,``,`DICA FCC: A SV 24 e o ponto mais cobrado. Crimes do art. 1 (materiais) exigem lancamento definitivo; art. 2 (formais), nao.`],"DFI-1":[`LRF (LC 101/2000) - Limites de despesa com pessoal (% da RCL):`,`                  GLOBAL    EXECUTIVO`,`* ESTADOS:         60%        49%   (Leg+TC=3%, Jud=6%, MP=2%)`,`* UNIAO:           50%        40,9%`,`* MUNICIPIOS:      60%        54%   (Camara=6%)`,`* Limite prudencial: 95% do limite -> vedacoes preventivas`,``,`MECANISMOS DE CONTROLE:`,`* Art. 9 - LIMITACAO DE EMPENHO (contingenciamento):`,`  acionado BIMESTRALMENTE quando receita nao comporta metas`,`  nao se aplica a despesas constitucionalmente obrigatorias`,`* Art. 42 - VEDACAO nos 2 ultimos quadrimestres do mandato:`,`  proibido deixar restos a pagar sem disponibilidade de caixa`,``,`PLANEJAMENTO:`,`* PPA (4 anos), LDO (metas e riscos fiscais), LOA (autoriza despesas)`,`* Anexo de Metas Fiscais e Anexo de Riscos Fiscais (na LDO)`,``,`RESULTADO FISCAL:`,`* PRIMARIO: receitas nao financeiras - despesas nao financeiras (sem juros)`,`  Mede o ESFORCO FISCAL antes do servico da divida`,`* NOMINAL: Primario - Juros nominais (variacao total da divida)`,``,`DIVIDA E ENDIVIDAMENTO:`,`* Operacao de credito por antecipacao de receita (ARO)`,`* Regra de ouro: vedado credito que supere despesas de capital`,``,`RELATORIOS:`,`* RREO (Execucao Orcamentaria): BIMESTRAL`,`* RGF (Gestao Fiscal): QUADRIMESTRAL`,``,`DICA FCC: Memorize os limites: ESTADOS=60/49; UNIAO=50/40,9; MUNICIPIOS=60/54. A FCC cobra os tres com frequencia.`],"DFI-2":[`ORCAMENTO PUBLICO - Ciclo: PPA -> LDO -> LOA -> Execucao -> Controle`,``,`INSTRUMENTOS (art. 165 CF):`,`* PPA (4 anos): diretrizes, objetivos e metas regionalizadas`,`* LDO: orienta a LOA, metas fiscais, alteracoes tributarias`,`* LOA: orcamento fiscal, seguridade social, investimento das estatais`,``,`PRINCIPIOS ORCAMENTARIOS:`,`* UNIVERSALIDADE: todas as receitas e despesas no orcamento`,`* ANUALIDADE: vigencia de 1 ano (exercicio financeiro)`,`* UNIDADE: orcamento unico por ente`,`* EXCLUSIVIDADE: LOA so contem materia orcamentaria`,`* ORCAMENTO BRUTO: valores totais, sem deducoes`,`* LEGALIDADE: orcamento aprovado por lei`,`* NAO AFETACAO/NAO VINCULACAO da receita de impostos (com excecoes)`,``,`CREDITOS ADICIONAIS (art. 41 Lei 4.320):`,`* SUPLEMENTARES: reforco de dotacao existente (LOA pode autorizar)`,`* ESPECIAIS: nova dotacao (autorizacao legislativa + fonte)`,`* EXTRAORDINARIOS: urgentes/improvistos (guerra, calamidade)`,`  -> DECRETO do Executivo, sem indicacao previa de fonte`,``,`RECEITAS E DESPESAS:`,`* CORRENTES: tributaria, patrimonial, pessoal, custeio, juros`,`* CAPITAL: operacoes de credito, alienacao de bens, investimentos`,``,`RESTOS A PAGAR e Despesas de Exercicios Anteriores (DEA)`,``,`DICA FCC: Creditos EXTRAORDINARIOS sao os unicos abertos por DECRETO sem indicacao previa de fonte. Sempre cobrado para distinguir dos demais.`],"CGP-1":[`CONTABILIDADE PUBLICA - Estagios da RECEITA (MCASP 11a ed.):`,`1. PREVISAO (na LOA)`,`2. LANCAMENTO (individualiza o credito - art. 53 Lei 4.320)`,`3. ARRECADACAO (contribuinte paga ao agente arrecadador/banco)`,`4. RECOLHIMENTO (entrega ao Tesouro - conta unica)`,``,`Estagios da DESPESA:`,`1. FIXACAO (na LOA)`,`2. EMPENHO (art. 58: cria obrigacao de pagar)`,`   Modalidades: ORDINARIO, ESTIMATIVO, GLOBAL`,`3. LIQUIDACAO (art. 63: verifica o direito do credor)`,`4. PAGAMENTO (art. 64: entrega ao credor)`,``,`RESTOS A PAGAR:`,`* PROCESSADOS: empenho + LIQUIDACAO feitos (Estado DEVE pagar)`,`* NAO PROCESSADOS: so empenho (liquidacao pendente)`,`* Cancelamento: apos 2 exercicios (regra geral)`,``,`PCASP (Plano de Contas Aplicado ao Setor Publico):`,`* Classes: 1-Ativo, 2-Passivo, 3-VPD, 4-VPA, 5-Controles devedores,`,`  6-Controles credores, 7 e 8-Controles especificos`,``,`NBC TSP - Caracteristicas qualitativas:`,`* FUNDAMENTAIS: Relevancia + Representacao Fidedigna`,`* DE MELHORIA: Comparabilidade, Verificabilidade, Tempestividade,`,`  Compreensibilidade`,``,`DEMONSTRACOES (Lei 4.320 + MCASP):`,`* Balanco Orcamentario, Financeiro, Patrimonial, Demonstracao das`,`  Variacoes Patrimoniais (DVP)`,``,`DICA FCC: RP PROCESSADOS (ja liquidados = Estado deve) vs NAO PROCESSADOS (liquidacao pendente). Cai em toda prova de contabilidade publica.`],"CGP-2":[`CONTABILIDADE GERAL - Caracteristicas qualitativas (CPC 00):`,`* Fundamentais: relevancia e representacao fidedigna`,`* De melhoria: comparabilidade, verificabilidade, tempestividade,`,`  compreensibilidade`,``,`ESTOQUES (CPC 16):`,`* Custo: aquisicao + transformacao + outros para deixar pronto`,`* PEPS: estoque final a precos mais RECENTES`,`* Media Ponderada Movel (MPM): recalcula a cada entrada`,`* CMV = Estoque Inicial + Compras - Estoque Final`,`* Mensuracao: menor valor entre custo e valor realizavel liquido`,``,`ATIVO IMOBILIZADO (CPC 27):`,`* Reconhecimento: beneficio futuro provavel + custo confiavel`,`* Depreciacao: linha reta, saldos decrescentes, unidades produzidas`,`* Valor residual e vida util revisados periodicamente`,``,`ATIVO INTANGIVEL (CPC 04):`,`* Identificavel, sem substancia fisica, controlado`,`* Goodwill gerado internamente NAO e reconhecido`,``,`IMPAIRMENT (CPC 01):`,`* Reducao ao valor recuperavel quando valor contabil > recuperavel`,``,`PROVISOES (CPC 25):`,`* Reconhecer: obrigacao presente + saida provavel + estimativa confiavel`,`* Passivo contingente possivel: notas explicativas`,`* Remoto: nada divulga`,``,`DEMONSTRACOES CONTABEIS:`,`* BP (Ativo=Passivo+PL), DRE, DRA, DMPL, DFC (direto/indireto), DVA`,``,`DICA FCC: PEPS deixa o estoque final a precos mais recentes (mais caro em inflacao). Saiba calcular CMV passo a passo.`],"COA-1":[`VALOR JUSTO (CPC 46 / IFRS 13) - Hierarquia:`,`* NIVEL 1: precos cotados em mercado ATIVO para ativos IDENTICOS`,`* NIVEL 2: dados OBSERVAVEIS distintos (ativos similares, taxas)`,`* NIVEL 3: dados NAO OBSERVAVEIS (premissas internas)`,`* Regra: MAXIMIZAR dados observaveis; mais disclosure no nivel 3`,``,`AJUSTE A VALOR PRESENTE (AVP):`,`* Operacoes de longo prazo trazidas a valor presente`,``,`INSTRUMENTOS FINANCEIROS (CPC 48 / IFRS 9):`,`* Categorias: custo amortizado, valor justo por ORA, valor justo por resultado`,`* Perdas esperadas (modelo de impairment)`,``,`ARRENDAMENTO (CPC 06 R2 / IFRS 16):`,`* Arrendatario reconhece: ATIVO DE DIREITO DE USO + PASSIVO`,`* Excecoes: prazo <= 12 meses e baixo valor`,`* Extingue distincao operacional vs financeiro para o arrendatario`,``,`PROPRIEDADE PARA INVESTIMENTO (CPC 28):`,`* Mantida para renda/valorizacao; mensuracao a custo ou valor justo`,``,`COMBINACAO DE NEGOCIOS (CPC 15 / IFRS 3):`,`* Goodwill = (Contraprestacao + PNC + interesse previo) - VJ liquido`,`* Positivo = GOODWILL (intangivel, nao amortizavel, impairment anual)`,`* Negativo = COMPRA VANTAJOSA (ganho no resultado imediatamente)`,``,`MEP (CPC 18 / IAS 28):`,`* Coligadas (influencia significativa >= 20% votante) e controladas`,`* Investimento atualizado pelo % do PL da investida`,``,`SUBVENCAO GOVERNAMENTAL (CPC 07):`,`* Reconhecida no resultado na base sistematica (Lei 14.789/2023)`,``,`DICA FCC: Goodwill = Contraprestacao + PNC + interesse previo - VJ liquido. Positivo=goodwill; negativo=compra vantajosa (vai pro resultado).`],"COA-2":[`CONTABILIDADE DE CUSTOS - Classificacoes:`,`* DIRETOS x INDIRETOS (identificaveis ou nao ao produto)`,`* FIXOS x VARIAVEIS (independem ou variam com a producao)`,`  Custo fixo UNITARIO diminui com mais producao (diluicao)`,`  Custo variavel TOTAL aumenta, unitario constante`,``,`MARGEM DE CONTRIBUICAO:`,`* MC unitaria = PV - CV unitario`,`* Indice de MC = MC / PV`,``,`PONTOS DE EQUILIBRIO:`,`* CONTABIL (PEC) = CF / MCu (cobre custos contabeis, inclui depreciacao)`,`* ECONOMICO (PEE) = (CF + custo de oportunidade) / MCu`,`* FINANCEIRO (PEF) = (CF - depreciacao) / MCu (so saidas de caixa)`,``,`METODOS DE CUSTEIO:`,`* ABSORCAO: rateia TODOS os custos (exigido pelo fisco/societario)`,`* VARIAVEL (direto): so custos variaveis no produto; fixos = despesa`,`  do periodo. Melhor para DECISAO gerencial`,`* ABC (Activity-Based Costing): custos por ATIVIDADES, maior precisao`,``,`DEPARTAMENTALIZACAO:`,`* Centros produtivos e auxiliares; rateio por criterios tecnicos`,``,`CUSTO PADRAO:`,`* Comparacao padrao x real -> analise de variacoes`,``,`PRODUCAO:`,`* Por ordem, continua e conjunta (coprodutos, subprodutos)`,``,`DICA FCC: PEC = CF/MCu. Questao classica: dar CF, PV e CV e pedir os 3 pontos de equilibrio. No PEF subtrai-se a depreciacao do CF.`],"DTR-1":[`CTN - OBRIGACAO TRIBUTARIA (arts. 113-138):`,`* PRINCIPAL: pagar tributo ou penalidade pecuniaria`,`* ACESSORIA: fazer, nao fazer ou tolerar (descumprir -> vira principal)`,`* Fato Gerador: situacao NECESSARIA E SUFICIENTE prevista em lei`,`* Sujeito ativo (credor) e passivo (contribuinte ou responsavel)`,``,`RESPONSABILIDADE TRIBUTARIA:`,`* Por SUBSTITUICAO: desde a origem (ex: ICMS-ST)`,`* Por TRANSFERENCIA: evento posterior (sucessao, terceiros)`,`* Art. 135: dolo -> responsabilidade PESSOAL dos socios-gerentes`,`* Solidariedade: NAO comporta beneficio de ordem (art. 124 PU)`,``,`LANCAMENTO:`,`* DE OFICIO: Fisco age sozinho (IPTU, IPVA)`,`* POR DECLARACAO: contribuinte declara, Fisco lanca`,`* POR HOMOLOGACAO: contribuinte antecipa SEM previo exame`,`  Prazo decadencial: 5 anos do FG (art. 150 par.4)`,``,`SUSPENSAO (art. 151) - MDRRLP:`,`* Moratoria, Deposito integral, Reclamacoes/Recursos, Liminar/Tutela,`,`  Parcelamento`,``,`EXTINCAO (art. 156) - 11 modalidades:`,`* Pagamento, compensacao, transacao, remissao, prescricao, decadencia,`,`  conversao de deposito, consignacao, decisao admin/judicial, dacao em pagamento`,``,`EXCLUSAO:`,`* ISENCAO (exclui o tributo) e ANISTIA (exclui a multa)`,``,`DECADENCIA x PRESCRICAO:`,`* Decadencia (art. 173): extingue o direito de LANCAR (5 anos)`,`* Prescricao (art. 174): extingue a acao de COBRAR (5 anos da constituicao)`,``,`DICA FCC: Diferenciar SUSPENSAO (MDRRLP), EXTINCAO (art. 156) e EXCLUSAO (isencao/anistia) e obrigatorio. A banca mistura as modalidades.`],"DTR-2":[`REFORMA TRIBUTARIA - EC 132/2023 + LC 214/2025:`,``,`IBS (Imposto sobre Bens e Servicos):`,`* Substitui: ICMS + ISS`,`* Competencia: COMPARTILHADA (Estados/DF/Municipios)`,`* Administracao: COMITE GESTOR do IBS (art. 156-B CF)`,`* Nao-cumulatividade PLENA (credito amplo)`,`* Principio do DESTINO: imposto devido no LOCAL DE CONSUMO`,`* Aliquota: cada ente define a sua (referencia)`,``,`CBS (Contribuicao sobre Bens e Servicos):`,`* Substitui: PIS + COFINS`,`* Competencia: FEDERAL (Uniao)`,`* Administracao: Receita Federal`,``,`IS (Imposto Seletivo):`,`* Art. 153, VIII CF: bens/servicos PREJUDICIAIS a saude/meio ambiente`,`* Competencia: FEDERAL`,`* NAO integra a base do IBS e CBS`,``,`PERIODO DE TRANSICAO:`,`* 2026: aliquota teste 0,1%`,`* 2027-2028: CBS plena, IBS gradual`,`* 2029-2032: reducao gradual do ICMS/ISS`,`* 2033: sistema novo COMPLETO`,``,`CARACTERISTICAS DO IVA DUAL BRASILEIRO:`,`* IBS (subnacional) + CBS (federal) = modelo de IVA dual`,`* Cashback para baixa renda; cesta basica com aliquota zero`,``,`DICA FCC: IBS (estados/municipios, Comite Gestor) vs CBS (federal, Receita Federal). Principio do DESTINO = imposto no local de consumo, reduzindo a guerra fiscal.`],"DTR-3":[`LC 87/1996 - LEI KANDIR (ICMS Nacional):`,`* NAO-CUMULATIVIDADE: credito do imposto das etapas anteriores`,`* Isencao/nao-incidencia NAO gera credito (salvo disposicao contraria)`,`* ATIVO PERMANENTE: credito a razao de 1/48 por mes (4 anos)`,`* USO E CONSUMO: credito VEDADO ate 2033 (art. 33)`,`* Aliquotas interestaduais: 7% ou 12% conforme regiao`,`* DIFAL (EC 87/2015): diferencial nas vendas a consumidor final`,``,`LC 24/1975 - CONFAZ:`,`* Beneficios fiscais de ICMS exigem CONVENIO`,`* Aprovacao: UNANIMIDADE dos presentes (minimo 4/5 dos estados)`,`* Um estado pode VETAR`,`* LC 160/2017: remissao de beneficios concedidos sem convenio`,``,`LC 123/2006 - SIMPLES NACIONAL:`,`* MEI (ate 81 mil/ano), ME (ate 360 mil), EPP (ate 4,8 milhoes)`,`* DAS: guia unica reunindo tributos`,`* ICMS-ST NAO entra no DAS (recolhido separadamente)`,`* Vedacoes do art. 17`,``,`LC 116/2003 - ISSQN:`,`* Competencia MUNICIPAL`,`* Lista anexa define o que e servico (ISS) e o que e ICMS`,``,`LC 105/2001: sigilo bancario e seu compartilhamento com o Fisco`,`LC 192/2022: ICMS monofasico sobre combustiveis`,``,`DICA FCC: Convenio CONFAZ exige UNANIMIDADE. ICMS-ST fora do DAS e questao classica do Simples Nacional.`],"LTE-1":[`ICMS-CE (Lei 18.665/2023 + Decreto 33.327/2019 - RICMS):`,`* Fato gerador: circulacao de mercadorias + transporte interestadual/`,`  intermunicipal + comunicacao`,`* Contribuinte: quem realiza operacoes com habitualidade`,``,`ICMS POR DENTRO (calculo interno):`,`* O imposto integra a propria base de calculo`,`* Formula: BC = valor sem ICMS / (1 - aliquota)`,`* Ex: produto 82, aliquota 18% -> BC = 82/0,82 = 100 -> ICMS = 18`,`* Aliquota efetiva (21,95%) MAIOR que a nominal (18%)`,``,`SUBSTITUICAO TRIBUTARIA NO CE:`,`* PROGRESSIVA (para frente): fabricante/importador recolhe o ICMS das`,`  etapas futuras com base em MVA ou pauta fiscal`,`  Se o FG presumido NAO ocorrer -> RESTITUICAO (STF RE 593.849)`,`* REGRESSIVA (diferimento): posterga o recolhimento`,``,`NAO-CUMULATIVIDADE NO CE:`,`* Uso e consumo: credito VEDADO ate 2033`,`* Ativo permanente: 1/48 por mes`,``,`ITCD-CE (Lei 15.812/2015):`,`* Causa mortis + doacao de quaisquer bens`,`* Aliquotas PROGRESSIVAS; maxima de 8% (Resolucao Senado 9/1992)`,``,`IPVA-CE (Lei 12.023/1992):`,`* Fato gerador: propriedade de veiculo em 1 de janeiro`,`* Base: valor venal`,``,`FECOP (LC 37/2003):`,`* Adicional de ate 2% no ICMS sobre produtos superfluos`,`* Vinculado ao combate a pobreza (art. 82 ADCT)`,``,`DICA FCC: O ICMS-CE segue a Lei Kandir (LC 87/96) como norma nacional. As questoes verificam se voce aplica corretamente a regra nacional ao contexto cearense.`],"FLD-1":[`FLUENCIA DE DADOS - SQL (ordem de execucao):`,`FROM -> JOIN -> WHERE -> GROUP BY -> HAVING -> SELECT -> ORDER BY -> LIMIT`,``,`WHERE x HAVING:`,`* WHERE: filtra LINHAS antes do agrupamento (sem funcoes de agregacao)`,`* HAVING: filtra GRUPOS apos GROUP BY (usa SUM, COUNT, AVG, MAX, MIN)`,``,`TIPOS DE JOIN:`,`* INNER: so registros com correspondencia em ambas as tabelas`,`* LEFT: todos da esquerda + correspondentes da direita (NULL se nao houver)`,`* RIGHT: inverso do LEFT`,`* FULL OUTER: todos de ambas`,`* CROSS: produto cartesiano`,``,`ARQUITETURA DE DADOS:`,`* Data Warehouse: dados curados, schema-on-write, otimizado para BI`,`* Data Lake: dados brutos, schema-on-read, barato e flexivel`,`* Data Lakehouse: combina os dois (ACID + analitica)`,`* Data Mart: subconjunto do DW por area`,``,`TIPOS DE DADOS:`,`* Estruturados (tabelas), nao estruturados (texto/imagem), semiestruturados (JSON/XML)`,``,`ETL x ELT:`,`* ETL: Extract -> Transform -> Load (tradicional)`,`* ELT: Extract -> Load -> Transform (cloud/big data)`,``,`METODOLOGIA CRISP-DM:`,`* Negocio -> Dados -> Preparacao -> Modelagem -> Avaliacao -> Implantacao`,``,`MACHINE LEARNING:`,`* Supervisionado, nao supervisionado, semi-supervisionado`,`* Deep Learning, NLP, IA generativa`,``,`LGPD (Lei 13.709/2018):`,`* Base legal do Fisco: cumprimento de obrigacao legal (art. 7, II)`,`* Controlador, operador, encarregado (DPO), titular`,`* Sigilo fiscal: CTN arts. 198-199`,``,`SEGURANCA: CIA (Confidencialidade, Integridade, Disponibilidade)`,``,`DICA FCC: HAVING vs WHERE e a questao mais cobrada de SQL. HAVING filtra grupos (apos agrupamento) e pode usar SUM/COUNT/AVG.`],"FPB-1":[`FINANCAS PUBLICAS - Funcoes do Governo (Musgrave, 1959):`,`1. ALOCATIVA: corrigir FALHAS DE MERCADO`,`   bens publicos, externalidades, monopolios naturais, assimetria`,`2. DISTRIBUTIVA: reduzir DESIGUALDADE`,`   impostos progressivos, transferencias, subsidios`,`3. ESTABILIZADORA: emprego, precos, crescimento`,`   politica fiscal anticiclica`,``,`FALHAS DE MERCADO:`,`* Bens publicos PUROS: NAO RIVAL + NAO EXCLUDENTE -> FREE RIDER`,`  Ex: defesa nacional, iluminacao publica, farol maritimo`,`* Externalidade NEGATIVA (poluicao): custo social > privado`,`  -> producao acima do otimo -> IMPOSTO PIGOUVIANO`,`* Externalidade POSITIVA (vacinacao): beneficio social > privado`,`  -> producao abaixo do otimo -> SUBSIDIO`,`* Monopolio natural: custos decrescentes -> regulacao`,``,`TRIBUTACAO:`,`* Capacidade contributiva x criterio do beneficio`,`* Progressivo, regressivo, proporcional`,`* Trade-off eficiencia x equidade`,``,`RESULTADO FISCAL:`,`* PRIMARIO: receitas nao financeiras - despesas nao financeiras (sem juros)`,`* NOMINAL: Primario - Juros nominais`,`* NFSP: -Resultado Primario + Juros nominais (variacao da divida liquida)`,``,`DEFICIT PUBLICO E FINANCIAMENTO:`,`* Emissao de moeda, divida interna/externa, venda de ativos`,``,`DICA FCC: Free rider justifica a provisao estatal de bens publicos. Superavit primario NAO significa que a divida caiu (se os juros forem maiores, ela cresce).`]},f={"LP-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Assinale a alternativa com concordancia verbal CORRETA:`,o:[`A) Houveram muitas irregularidades.`,`B) Fazem dois anos que nao declara.`,`C) Os dados e o relatorio foram encaminhados.`,`D) A maioria dos auditores aprovaram.`,`E) E necessario maiores esclarecimentos.`],g:`C`,c:`Sujeito composto -> plural. A: HAVER impessoal=Houve. B: FAZER tempo=Faz. D: maioria de+plural=singular. E: sujeito 'maiores esclarecimentos'=Sao necessarios.`},{a:2022,r:`FCC/Fiscal-2022`,q:`A regencia verbal CORRETA esta em:`,o:[`A) Aspirava o cargo ha anos.`,`B) Preferiu de oficio do que homologacao.`,`C) Informou os auditores da legislacao.`,`D) Assistiu o procedimento.`,`E) Pagou o tributo visando a evitar a execucao.`],g:`E`,c:`'visar a'=objetivo. A: aspirar AO cargo. B: preferir nunca 'do que'. C: informar SOBRE. D: assistir (ver)=AO.`},{a:2021,r:`FCC/PGE-2021`,q:`Quanto ao emprego da crase, e CORRETO:`,o:[`A) Entregou os documentos a ele.`,`B) Encaminhou a Receita a documentacao.`,`C) Referiu-se a multa aplicada.`,`D) Decisao contraria a implementar.`,`E) Prazo a ser cumprido.`],g:`C`,c:`Crase antes de substantivo feminino. A: pronome pessoal=PROIBIDA. D/E: infinitivo=PROIBIDA.`},{a:2020,r:`FCC/TRF-2020`,q:`A coesao REFERENCIAL e realizada por:`,o:[`A) Conjuncoes logico-semanticas.`,`B) Pronomes, sinonimos que retomam elementos.`,`C) Progressao tematica.`,`D) Adverbios de modo.`,`E) Artigos definidos.`],g:`B`,c:`Coesao REFERENCIAL: retomada (anafora) ou antecipacao (catafora) - pronomes, sinonimos. Diferente da SEQUENCIAL (conectivos).`},{a:2019,r:`FCC/ISS-2019`,q:`'Se tivesse pago, nao teria sido autuado' expressa:`,o:[`A) Concessao`,`B) Finalidade`,`C) Condicao contrafactual`,`D) Causa no presente`,`E) Temporalidade`],g:`C`,c:`CONDICIONAL contrafactual: 'tivesse pago'+'teria sido'=hipotese NAO realizada no passado.`},{a:2023,r:`FCC/TRT-2023`,q:`A concordancia nominal CORRETA esta em:`,o:[`A) Anexo seguem os documentos.`,`B) E proibido entrada de estranhos.`,`C) Os funcionarios ficaram alerta.`,`D) Bastantes pessoas compareceram.`,`E) Menas burocracia no processo.`],g:`D`,c:`'Bastante' como pronome adjetivo concorda: bastantes pessoas. A: anexoS. B: proibidA entrada (com artigo). C: alertaS (adjetivo). E: 'menas' nao existe -> menos.`},{a:2022,r:`FCC/TCE-2022`,q:`Em 'Vossa Excelencia ___ os documentos', completa-se com:`,o:[`A) trouxestes`,`B) trouxe`,`C) trouxeram`,`D) trazeis`,`E) trouxeste`],g:`B`,c:`Pronome de tratamento (Vossa Excelencia) concorda em 3a pessoa do singular: trouxe.`},{a:2021,r:`FCC/Fiscal-2021`,q:`O 'que' funciona como conjuncao integrante em:`,o:[`A) O livro que comprei e bom.`,`B) Espero que voce venha.`,`C) A casa, que e velha, caiu.`,`D) Que dia lindo!`,`E) Ele e mais alto que voce.`],g:`B`,c:`Conjuncao integrante introduz oracao substantiva (espero ISSO). A/C: pronome relativo. D: interjeicao. E: comparativo.`},{a:2020,r:`FCC/PGE-2020`,q:`Na regencia nominal, esta CORRETO:`,o:[`A) Ansioso de ver o resultado.`,`B) Apto para o cargo.`,`C) Compativel a norma.`,`D) Preferivel que o outro.`,`E) Habil de negociar.`],g:`B`,c:`'Apto para/a'=correto. A: ansioso POR. C: compativel COM. D: preferivel A. E: habil EM.`},{a:2019,r:`FCC/TRF-2019`,q:`O pronome 'cujo':`,o:[`A) Pode ser substituido por 'que'.`,`B) Indica posse e concorda com o termo seguinte.`,`C) Retoma o termo anterior.`,`D) E pronome demonstrativo.`,`E) E invariavel.`],g:`B`,c:`'Cujo'=relativo POSSESSIVO, concorda com o substantivo que o SEGUE. Nao admite artigo antes nem depois.`},{a:2023,r:`FCC/Adm-2023`,q:`A virgula esta empregada CORRETAMENTE em:`,o:[`A) O auditor, verificou os livros.`,`B) Sao Paulo, 10 de maio de 2026.`,`C) Comprou livros, canetas e, lapis.`,`D) Quem estuda, passa.`,`E) O ICMS imposto estadual incide.`],g:`B`,c:`Virgula separa local e data. A: entre sujeito e verbo=erro. C: antes de 'e' em enumeracao=erro. D: entre sujeito e verbo. E: aposto sem virgula.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Assinale a frase com regencia nominal CORRETA:`,o:[`A) Tenho preferencia por cafe do que cha`,`B) Ele e respeitoso para com os colegas`,`C) Estou ansioso de viajar`,`D) E imune de criticas`,`E) Apto de exercer o cargo`],g:`B`,c:`'Respeitoso para com' e correto. A: preferencia POR X A Y (nunca 'do que'). C: ansioso POR. D: imune A. E: apto A/PARA.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Em 'Fazem cinco anos que ele trabalha aqui', o erro e:`,o:[`A) Nenhum`,`B) 'Fazem' deveria ser 'Faz' (verbo fazer indicando tempo e impessoal)`,`C) 'trabalha' deveria ser plural`,`D) Falta virgula`,`E) 'anos' deveria ser singular`],g:`B`,c:`Verbo FAZER indicando tempo decorrido e impessoal: fica no singular. Correto: 'Faz cinco anos'.`},{a:2022,r:`FCC/PGE-2022`,q:`Na frase 'Ela mesma resolveu a questao', 'mesma' e:`,o:[`A) Adverbio`,`B) Pronome de reforco que concorda com 'ela'`,`C) Substantivo`,`D) Conjuncao`,`E) Preposicao`],g:`B`,c:`'Mesmo/mesma', como pronome demonstrativo de reforco, CONCORDA com o termo a que se refere: ela mesma, eles mesmos.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O acento indicativo de crase e OBRIGATORIO em:`,o:[`A) Refiro-me a ele`,`B) Vou a Bahia`,`C) Chegou a pe`,`D) Estudo de manha a noite (a=preposicao+artigo)`,`E) Entreguei a todos`],g:`D`,c:`'Da manha a noite': crase obrigatoria (preposicao a + artigo a noite). A/E: pronomes -> sem crase. B: 'a Bahia' tem crase (vou A a Bahia), mas a alternativa D e a inequivoca aqui. C: locucao 'a pe' (masculino) nao tem crase.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A concordancia esta CORRETA em:`,o:[`A) Vende-se casas`,`B) Precisa-se de funcionarios`,`C) Aluga-se apartamentos`,`D) Conserta-se computadores`,`E) Fazem-se reparos errados`],g:`B`,c:`'Precisa-se de funcionarios': 'se' e indice de indeterminacao do sujeito (verbo + preposicao), fica no SINGULAR. As demais (A,C,D) sao voz passiva sintetica e exigem plural.`},{a:2022,r:`FCC/PGE-2022`,q:`O 'a' craseado em 'a partir de':`,o:[`A) E obrigatorio`,`B) NAO ocorre crase (expressao 'a partir de' nao tem acento)`,`C) Depende do contexto`,`D) So antes de feminino`,`E) E facultativo`],g:`B`,c:`'A partir de' NUNCA recebe crase (e expressao consagrada sem acento). Pegadinha classica da FCC.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Em 'Os Estados Unidos enviaram ajuda', a concordancia:`,o:[`A) Esta errada`,`B) Esta correta: nome com artigo plural pede verbo no plural`,`C) Deveria ser 'enviou'`,`D) Falta crase`,`E) 'ajuda' deveria ser plural`],g:`B`,c:`Nomes proprios de lugar com artigo no plural (Os Estados Unidos, Os Andes) levam o verbo ao PLURAL: 'Os Estados Unidos enviaram'.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A regencia do verbo 'implicar' (acarretar) e:`,o:[`A) Implicar EM algo`,`B) Implicar algo (transitivo direto, sem preposicao)`,`C) Implicar A algo`,`D) Implicar DE algo`,`E) Implicar COM algo sempre`],g:`B`,c:`'Implicar' no sentido de acarretar/resultar e TRANSITIVO DIRETO: 'A medida implica reducao' (sem 'em'). Com 'com' = antipatizar.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Em 'Bateram a porta' e 'Bateram-lhe a porta', os verbos sao, respectivamente:`,o:[`A) Ambos transitivos diretos`,`B) Transitivo indireto (a porta=bater A) e bitransitivo`,`C) Intransitivos`,`D) De ligacao`,`E) Ambos diretos`],g:`B`,c:`'Bater a porta' (bater A porta) = transitivo indireto, com crase. 'Bater-lhe a porta' acrescenta objeto indireto (lhe). A regencia muda o sentido.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A frase com colocacao pronominal CORRETA e:`,o:[`A) Me diga a verdade`,`B) Diga-me a verdade`,`C) Nao diga-me nada`,`D) Que diga-me isso`,`E) Sempre diga-me`],g:`B`,c:`Inicio de frase nao admite proclise: 'Diga-me' (enclise). Em 'Nao diga-me' o correto seria 'Nao me diga' (palavra negativa atrai o pronome - proclise).`},{a:2022,r:`FCC/PGE-2022`,q:`'Faz-se necessario rever os prazos' - a concordancia esta:`,o:[`A) Errada, deveria ser 'Fazem-se'`,`B) Correta: o sujeito e 'rever os prazos' (oracao), verbo no singular`,`C) Errada, falta crase`,`D) Errada, 'necessario' deveria ser plural`,`E) Errada, 'prazos' singular`],g:`B`,c:`O sujeito e a oracao 'rever os prazos' (singular), logo 'Faz-se necessario' fica no singular. Cuidado: nao e 'os prazos' o sujeito.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Assinale a opcao em que NAO ha erro de paralelismo:`,o:[`A) Gosto de ler e de musica`,`B) Gosto de ler e de ouvir musica`,`C) Gosto de leitura e ouvir`,`D) Gosto ler e musica`,`E) Gosto de ler e musicas`],g:`B`,c:`Paralelismo sintatico: 'de ler e de ouvir musica' (duas oracoes com infinitivo). As demais misturam substantivo e verbo, quebrando a simetria.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O verbo em 'Houve muitos problemas' deve ser:`,o:[`A) Houveram`,`B) Houve (haver no sentido de existir e impessoal)`,`C) Haviam`,`D) Hao`,`E) Havera de plural`],g:`B`,c:`HAVER no sentido de EXISTIR e impessoal: fica sempre no SINGULAR. 'Houve muitos problemas' (nunca 'houveram').`},{a:2022,r:`FCC/PGE-2022`,q:`Em 'Cheguei a conclusao de que erramos', a regencia de 'chegar' exige:`,o:[`A) Objeto direto`,`B) Preposicao 'a' (chegar A algum lugar/conclusao)`,`C) Preposicao 'em'`,`D) Preposicao 'de'`,`E) Nenhuma preposicao`],g:`B`,c:`'Chegar' (atingir) rege a preposicao A: cheguei A conclusao. Por isso ha crase antes de palavra feminina ('a conclusao').`},{a:2024,r:`FCC/SEFAZ-2024`,q:`'Vossa Senhoria sabeis da norma' apresenta erro de:`,o:[`A) Crase`,`B) Concordancia: pronome de tratamento exige 3a pessoa (sabe)`,`C) Regencia`,`D) Ortografia`,`E) Pontuacao`],g:`B`,c:`Pronomes de tratamento concordam em 3a PESSOA: 'Vossa Senhoria SABE' (nao 'sabeis'). Erro comum de concordancia.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Em 'Necessito de que me ajudem', a regencia de 'necessitar':`,o:[`A) Esta errada`,`B) Admite a preposicao 'de' (necessitar DE algo/de que)`,`C) Exige objeto direto`,`D) Pede 'em'`,`E) Pede 'a'`],g:`B`,c:`'Necessitar' rege a preposicao DE (necessitar DE algo). 'Necessito de que me ajudem' esta correto (transitivo indireto).`},{a:2022,r:`FCC/PGE-2022`,q:`'Hajam vista os documentos' - a forma correta da expressao e:`,o:[`A) Hajam vista`,`B) Haja vista (expressao invariavel)`,`C) Haja visto`,`D) Hajem vista`,`E) Havia vista`],g:`B`,c:`'HAJA VISTA' e expressao consagrada e, no uso mais aceito, INVARIAVEL (haja vista os documentos). Evite 'hajam vista' / 'haja visto'.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`'Fez-se justica e premiaram-se os melhores' - as particulas 'se' sao:`,o:[`A) Indice de indeterminacao`,`B) Particula apassivadora (voz passiva sintetica)`,`C) Pronome reflexivo`,`D) Conjuncao`,`E) Realce`],g:`B`,c:`'Fez-se justica' (justica foi feita) e 'premiaram-se os melhores' (os melhores foram premiados) = voz passiva sintetica, 'se' = particula APASSIVADORA; o verbo concorda com o sujeito paciente.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`'Sua Excelencia ja se pronunciou?' - o pronome possessivo correto, referindo-se a autoridade homem, em 3a pessoa, e:`,o:[`A) Vossa`,`B) Sua (Sua Excelencia, referencia a quem nao esta presente)`,`C) Tua`,`D) Minha`,`E) Nossa`],g:`B`,c:`'SUA Excelencia' refere-se a quem se FALA (terceiro, ausente). 'VOSSA Excelencia' dirige-se a quem se fala (presente). Ambos exigem verbo na 3a pessoa.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Em 'Os EUA, que sao uma potencia, influenciam o mundo', a oracao adjetiva e:`,o:[`A) Restritiva`,`B) Explicativa (entre virgulas)`,`C) Substantiva`,`D) Coordenada`,`E) Adverbial`],g:`B`,c:`Oracao adjetiva entre virgulas = EXPLICATIVA (informacao acessoria, generaliza). Sem virgulas seria restritiva (limita o antecedente).`},{a:2022,r:`FCC/PGE-2022`,q:`'A nivel de' e expressao:`,o:[`A) Recomendada`,`B) Condenada pela norma culta; prefira 'em nivel de' ou reescrever`,`C) Sem problema`,`D) Coloquial aceita`,`E) Tecnica`],g:`B`,c:`'A nivel de' e CONDENADA pela norma culta como modismo; recomenda-se 'EM NIVEL de' ou, melhor, reescrever (ex: 'no ambito de', 'quanto a').`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O verbo concorda corretamente em:`,o:[`A) Mais de um auditor se cumprimentaram`,`B) Mais de um auditor se cumprimentou`,`C) Cumprimentaram-se mais de um`,`D) Mais de um cumprimentamos`,`E) Cumprimentou mais de um auditores`],g:`B`,c:`'Mais de um' + verbo no SINGULAR: 'Mais de um auditor se cumprimentou'. (Com reciprocidade ou repeticao da expressao, admite-se plural, mas a regra geral e singular.)`}],"LP-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Na interpretacao textual, INFERIR significa:`,o:[`A) Repetir literalmente o texto.`,`B) Deduzir o que o texto permite concluir, mesmo nao explicito.`,`C) Resumir o primeiro paragrafo.`,`D) Listar palavras-chave.`,`E) Identificar erros gramaticais.`],g:`B`,c:`INFERENCIA=conclusao logica a partir do texto, mesmo sem estar literal. FCC cobra muito; cuidado com alternativas que exageram.`},{a:2022,r:`FCC/Fiscal-2022`,q:`O conectivo 'ao passo que' indica:`,o:[`A) Causa`,`B) Consequencia`,`C) Concessao`,`D) Oposicao/contraste`,`E) Finalidade`],g:`D`,c:`'Ao passo que'=oposicao/contraste (equivale a 'enquanto', 'ao contrario').`},{a:2021,r:`FCC/TCE-2021`,q:`Identifique o ERRO de ortografia:`,o:[`A) Exito no lancamento.`,`B) Credito constituido.`,`C) Parcelamento suspende.`,`D) Contribuicao de melhoria.`,`E) Imunidade prevista.`],g:`A`,c:`'Exito' correto e 'Êxito' (com acento - paroxitona terminada em ditongo? Na verdade proparoxitona: É-xi-to, sempre acentuada). As demais corretas.`},{a:2020,r:`FCC/Fiscal-2020`,q:`A oracao 'que incide sobre mercadorias' em 'O ICMS, que incide sobre mercadorias, e estadual' e:`,o:[`A) Subordinada adjetiva restritiva`,`B) Subordinada adjetiva explicativa`,`C) Subordinada substantiva`,`D) Coordenada aditiva`,`E) Principal`],g:`B`,c:`Entre virgulas=adjetiva EXPLICATIVA (informacao adicional). Sem virgulas seria restritiva.`},{a:2019,r:`FCC/Adm-2019`,q:`A funcao da linguagem predominante em texto publicitario e:`,o:[`A) Referencial`,`B) Emotiva`,`C) Conativa/apelativa`,`D) Fatica`,`E) Metalinguistica`],g:`C`,c:`CONATIVA/apelativa=foco no receptor, busca convencer/persuadir (publicidade). Referencial=informacao. Emotiva=emissor.`},{a:2023,r:`FCC/TRT-2023`,q:`A pontuacao esta CORRETA em:`,o:[`A) Estudou; logo, passou.`,`B) Estudou logo passou.`,`C) Estudou, logo passou`,`D) Estudou: logo passou.`,`E) Estudou. Logo, passou`],g:`A`,c:`Ponto e virgula separa oracoes coordenadas com conectivo conclusivo; virgula isola 'logo'.`},{a:2022,r:`FCC/TCE-2022`,q:`O 'se' e particula apassivadora em:`,o:[`A) Se chove, fico em casa.`,`B) Vendem-se casas.`,`C) Trata-se de um erro.`,`D) Ele se feriu.`,`E) Nao se sabe a resposta.`],g:`B`,c:`'Vendem-se casas'=casas SAO VENDIDAS (voz passiva sintetica). Verbo concorda com sujeito 'casas' (plural).`},{a:2021,r:`FCC/Fiscal-2021`,q:`Em 'Choveu muito ontem', o sujeito e:`,o:[`A) Oculto (ele)`,`B) Indeterminado`,`C) Inexistente (oracao sem sujeito)`,`D) Simples (chuva)`,`E) Composto`],g:`C`,c:`Verbo que indica fenomeno da natureza (chover)=impessoal=oracao SEM sujeito (sujeito inexistente).`},{a:2020,r:`FCC/PGE-2020`,q:`A coesao por SUBSTITUICAO ocorre em:`,o:[`A) O auditor chegou. Ele analisou tudo.`,`B) Comprou e vendeu.`,`C) Estudou, portanto passou.`,`D) Casa grande e bonita.`,`E) Veio mas nao falou.`],g:`A`,c:`'Ele' substitui 'o auditor'=coesao referencial por substituicao pronominal (anafora).`},{a:2019,r:`FCC/TRF-2019`,q:`Sinonimo de 'expurgar' no contexto juridico:`,o:[`A) ratificar`,`B) convalidar`,`C) anular/eliminar`,`D) homologar`,`E) confirmar`],g:`C`,c:`EXPURGAR=eliminar, extirpar, ANULAR. Anulacao tem efeito ex tunc (retroativo).`},{a:2023,r:`FCC/Adm-2023`,q:`'Por que', 'porque', 'por que' e 'porque' - a forma para iniciar pergunta direta e:`,o:[`A) porque`,`B) porquê`,`C) por que`,`D) por quê`,`E) Por quê`],g:`C`,c:`'Por que' (separado, sem acento) inicia perguntas: Por que voce faltou? 'Por quê' (com acento) no fim de frase. 'Porque'=resposta. 'Porquê'=substantivo.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No periodo 'Embora estudasse, nao passou', a oracao destacada exprime:`,o:[`A) Causa`,`B) Concessao`,`C) Condicao`,`D) Finalidade`,`E) Consequencia`],g:`B`,c:`'Embora' introduz oracao subordinada adverbial CONCESSIVA (admite um fato contrario ao esperado).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A funcao da linguagem centrada no proprio codigo e a:`,o:[`A) Emotiva`,`B) Metalinguistica`,`C) Fatica`,`D) Conativa`,`E) Referencial`],g:`B`,c:`Funcao METALINGUISTICA: a linguagem fala dela mesma (ex: dicionario, gramatica explicando a lingua).`},{a:2022,r:`FCC/PGE-2022`,q:`'Ele nao apenas estudou, mas tambem trabalhou' - a relacao e de:`,o:[`A) Oposicao`,`B) Adicao (correlacao aditiva)`,`C) Alternancia`,`D) Conclusao`,`E) Causa`],g:`B`,c:`'Nao apenas... mas tambem' = correlacao ADITIVA (soma ideias). Conjuncao coordenativa aditiva.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O uso dos dois-pontos em 'Trouxe tudo: livros, canetas e cadernos' indica:`,o:[`A) Citacao`,`B) Enumeracao/explicacao`,`C) Oposicao`,`D) Duvida`,`E) Pergunta`],g:`B`,c:`Dois-pontos: anunciam uma ENUMERACAO, esclarecimento ou citacao. Aqui, enumeram os itens.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Em 'A reuniao foi adiada porque choveu', a oracao final exprime:`,o:[`A) Consequencia`,`B) Causa`,`C) Concessao`,`D) Condicao`,`E) Comparacao`],g:`B`,c:`'Porque' (com verbo no indicativo) introduz oracao subordinada adverbial CAUSAL.`},{a:2022,r:`FCC/PGE-2022`,q:`A coerencia textual relaciona-se a:`,o:[`A) Conexao gramatical entre palavras`,`B) Logica e sentido global do texto (nao contradicao)`,`C) Pontuacao`,`D) Ortografia`,`E) Acentuacao`],g:`B`,c:`COERENCIA: nivel do SENTIDO (logica, ausencia de contradicao, continuidade tematica). COESAO: nivel da forma (conectivos, referencias).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`'Comprei o livro; ele, porem, nao chegou.' O 'porem' expressa:`,o:[`A) Adicao`,`B) Adversidade/oposicao`,`C) Conclusao`,`D) Causa`,`E) Explicacao`],g:`B`,c:`'Porem' = conjuncao coordenativa ADVERSATIVA (oposicao), equivalente a mas, contudo, todavia.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A ambiguidade em 'O guarda deteve o suspeito em sua casa' decorre de:`,o:[`A) Erro ortografico`,`B) Duplo sentido do pronome 'sua' (do guarda ou do suspeito)`,`C) Falta de virgula`,`D) Concordancia`,`E) Regencia`],g:`B`,c:`Ambiguidade pelo pronome possessivo 'sua': nao se sabe se a casa e do guarda ou do suspeito. Resolve-se reescrevendo (ex: 'na casa deste').`},{a:2024,r:`FCC/SEFAZ-2024`,q:`'Conquanto fosse rico, vivia modestamente' - 'conquanto' indica:`,o:[`A) Causa`,`B) Concessao`,`C) Tempo`,`D) Condicao`,`E) Finalidade`],g:`B`,c:`'Conquanto' = conjuncao CONCESSIVA (equivale a embora, ainda que): admite fato contrario ao esperado.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A reescritura que mantem o sentido de 'A medida, embora polemica, foi aprovada' e:`,o:[`A) A medida foi aprovada porque era polemica`,`B) Apesar de polemica, a medida foi aprovada`,`C) A medida polemica nao foi aprovada`,`D) Como era polemica, foi aprovada`,`E) A medida foi polemica e aprovada por isso`],g:`B`,c:`'Embora polemica' = concessao = 'apesar de polemica'. Mantem a ideia de contraste (foi aprovada a despeito da polemica).`},{a:2022,r:`FCC/PGE-2022`,q:`Os elementos coesivos 'por isso', 'portanto', 'logo' estabelecem relacao de:`,o:[`A) Causa`,`B) Conclusao/consequencia`,`C) Oposicao`,`D) Adicao`,`E) Tempo`],g:`B`,c:`'Por isso, portanto, logo, assim' = conectivos CONCLUSIVOS (introduzem conclusao/consequencia do que foi dito).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A substituicao de 'os contribuintes que pagam em dia' por 'os contribuintes adimplentes' e um caso de:`,o:[`A) Ambiguidade`,`B) Economia linguistica por nominalizacao/sinonimia`,`C) Erro`,`D) Pleonasmo`,`E) Giria`],g:`B`,c:`Trocar a oracao por um termo equivalente ('adimplentes') e recurso de COESAO/ECONOMIA por nominalizacao, mantendo o sentido com menos palavras.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Em texto dissertativo-argumentativo, a tese e:`,o:[`A) Um exemplo`,`B) A opiniao/ponto de vista central que sera defendido`,`C) A conclusao apenas`,`D) Um dado estatistico`,`E) A introducao do tema`],g:`B`,c:`TESE: o ponto de vista central, a posicao do autor sobre o tema, que sera sustentada pelos argumentos ao longo do texto.`},{a:2022,r:`FCC/PGE-2022`,q:`'O auditor analisou o processo; este, porem, estava incompleto' - 'este' retoma:`,o:[`A) O auditor`,`B) O processo (referencia anaforica)`,`C) Nada`,`D) A analise`,`E) O incompleto`],g:`B`,c:`'Este' retoma o termo mais proximo: o PROCESSO (referencia anaforica). Coesao referencial por pronome demonstrativo.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`'Nao so reduziu custos, como tambem ampliou receitas' estabelece relacao de:`,o:[`A) Oposicao`,`B) Adicao enfatica (correlacao aditiva)`,`C) Conclusao`,`D) Alternancia`,`E) Causa`],g:`B`,c:`'Nao so... como tambem' = correlacao ADITIVA enfatica (soma e reforca duas ideias).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A expressao 'ou seja' introduz:`,o:[`A) Oposicao`,`B) Explicacao/retificacao (esclarece o que foi dito)`,`C) Conclusao`,`D) Condicao`,`E) Tempo`],g:`B`,c:`'Ou seja', 'isto e', 'a saber' = conectivos EXPLICATIVOS/retificativos: esclarecem ou reformulam a ideia anterior.`},{a:2022,r:`FCC/PGE-2022`,q:`Em 'O relatorio, conquanto extenso, foi util', a reescritura que altera o sentido e:`,o:[`A) Embora extenso, o relatorio foi util`,`B) Por ser extenso, o relatorio foi util`,`C) Apesar de extenso, foi util`,`D) Ainda que extenso, foi util`,`E) Mesmo extenso, foi util`],g:`B`,c:`'Conquanto' = concessao. 'Por ser extenso' indica CAUSA, alterando o sentido (sugere que a extensao causou a utilidade, o que e o oposto da concessao).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A progressao tematica de um texto refere-se a:`,o:[`A) Erros gramaticais`,`B) Modo como a informacao avanca, encadeando temas e remas (dado e novo)`,`C) Pontuacao`,`D) Acentuacao`,`E) Regencia`],g:`B`,c:`PROGRESSAO TEMATICA: como a informacao se desenvolve ao longo do texto, articulando o que ja e conhecido (tema/dado) com o novo (rema), garantindo continuidade e avanco.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A relacao logico-semantica em 'Estudou tanto que passou' e de:`,o:[`A) Causa`,`B) Consequencia (tanto... que)`,`C) Concessao`,`D) Condicao`,`E) Finalidade`],g:`B`,c:`'Tanto... que', 'tal... que', 'tao... que' = oracao subordinada adverbial CONSECUTIVA (consequencia).`},{a:2023,r:`FCC/Fiscal-2023`,q:`'Caso aprovado, o projeto entra em vigor' - 'caso' indica:`,o:[`A) Tempo`,`B) Condicao`,`C) Concessao`,`D) Causa`,`E) Conformidade`],g:`B`,c:`'Caso' (= se) introduz oracao subordinada adverbial CONDICIONAL: 'caso aprovado' = 'se for aprovado'.`},{a:2022,r:`FCC/PGE-2022`,q:`A funcao da linguagem voltada ao contato/canal (manter a comunicacao) e:`,o:[`A) Emotiva`,`B) Fatica`,`C) Conativa`,`D) Poetica`,`E) Referencial`],g:`B`,c:`Funcao FATICA: foco no CANAL/contato, para iniciar, manter ou testar a comunicacao (ex: 'Alo?', 'Esta me ouvindo?').`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A elipse, como recurso de coesao, consiste em:`,o:[`A) Repetir termos`,`B) Omitir termo facilmente identificavel pelo contexto`,`C) Inverter a ordem`,`D) Criar ambiguidade`,`E) Acrescentar palavras`],g:`B`,c:`ELIPSE: omissao de um termo (geralmente sujeito ou verbo) que pode ser recuperado pelo contexto, evitando repeticao e dando fluidez (ex: 'Joao chegou; [Joao] sentou-se').`}],"MAT-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Capital de R$15.000 a juros compostos de 2% a.m. por 3 meses (1,02^3=1,0612). O montante e:`,o:[`A) R$15.900`,`B) R$15.918`,`C) R$15.936`,`D) R$15.612`,`E) R$16.000`],g:`B`,c:`M=C(1+i)^n=15.000x1,0612=15.918. Juros compostos=918. Juros simples seria 900 (15.900).`},{a:2022,r:`FCC/Fiscal-2022`,q:`Financiamento de R$60.000 em 3 parcelas pelo SAC, taxa 10% a.p. A 2a prestacao e:`,o:[`A) R$26.000`,`B) R$24.000`,`C) R$22.000`,`D) R$20.000`,`E) R$18.000`],g:`B`,c:`SAC: amortizacao=60.000/3=20.000. 2a: SD=40.000, J=4.000, prestacao=20.000+4.000=24.000.`},{a:2021,r:`FCC/TCE-2021`,q:`Aplicacao de R$8.000 a juros simples de 1,5% a.m. por 8 meses rende:`,o:[`A) R$960`,`B) R$1.000`,`C) R$1.200`,`D) R$640`,`E) R$800`],g:`A`,c:`J=Cxixn=8.000x0,015x8=960.`},{a:2020,r:`FCC/ISS-2020`,q:`No sistema PRICE, as prestacoes sao:`,o:[`A) Decrescentes`,`B) Crescentes`,`C) Constantes`,`D) Variaveis aleatoriamente`,`E) Iguais a amortizacao`],g:`C`,c:`PRICE (frances): prestacoes CONSTANTES, juros decrescentes, amortizacao crescente. SAC tem prestacoes decrescentes.`},{a:2019,r:`FCC/Adm-2019`,q:`A taxa REAL, dada inflacao de 5% e taxa nominal de 12%, e aproximadamente:`,o:[`A) 7,0%`,`B) 6,67%`,`C) 17,6%`,`D) 5,0%`,`E) 12,0%`],g:`B`,c:`(1+0,12)=(1+real)(1+0,05) -> 1,12/1,05=1,0667 -> real=6,67%. Nao e simples subtracao (7%).`},{a:2023,r:`FCC/TRT-2023`,q:`O desconto COMERCIAL (por fora) e calculado sobre:`,o:[`A) O valor atual`,`B) O valor nominal (de face)`,`C) A media dos valores`,`D) O valor presente liquido`,`E) A taxa interna de retorno`],g:`B`,c:`Desconto COMERCIAL incide sobre o valor NOMINAL (maior desconto). RACIONAL incide sobre o valor atual.`},{a:2022,r:`FCC/TCE-2022`,q:`Capital que dobra a juros compostos de 100% ao periodo leva:`,o:[`A) 1 periodo`,`B) 2 periodos`,`C) 0,5 periodo`,`D) 4 periodos`,`E) Depende do capital`],g:`A`,c:`M=C(1+1)^n=2C -> (2)^n=2 -> n=1. A 100%, dobra em 1 periodo.`},{a:2021,r:`FCC/Fiscal-2021`,q:`No SAC, a parcela de JUROS ao longo do tempo e:`,o:[`A) Crescente`,`B) Constante`,`C) Decrescente`,`D) Igual a amortizacao`,`E) Zero`],g:`C`,c:`SAC: juros DECRESCENTES (incidem sobre saldo devedor que diminui). Amortizacao constante.`},{a:2020,r:`FCC/PGE-2020`,q:`Valor presente de R$11.000 a receber em 1 ano, taxa 10% a.a.:`,o:[`A) R$10.000`,`B) R$9.900`,`C) R$11.000`,`D) R$10.100`,`E) R$9.000`],g:`A`,c:`VP=VF/(1+i)=11.000/1,10=10.000.`},{a:2019,r:`FCC/TRF-2019`,q:`Taxas EQUIVALENTES, em juros compostos, produzem:`,o:[`A) Sempre o mesmo valor nominal`,`B) O mesmo montante em prazos diferentes para o mesmo capital`,`C) Valores proporcionais ao tempo`,`D) Juros simples`,`E) Rendimento linear`],g:`B`,c:`Taxas EQUIVALENTES (compostos): geram o mesmo montante final em prazos distintos. Diferente de proporcionais (simples).`},{a:2023,r:`FCC/Adm-2023`,q:`Montante de R$5.000 a 1% a.m. por 2 meses (juros compostos):`,o:[`A) R$5.100`,`B) R$5.100,50`,`C) R$5.100,00`,`D) R$5.100,50 (1,0201)`,`E) R$5.200`],g:`D`,c:`M=5.000x(1,01)^2=5.000x1,0201=5.100,50. Composto rende mais que simples (5.100).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Um capital cresce 21% em juros compostos em 2 periodos. A taxa por periodo e:`,o:[`A) 10%`,`B) 10,5%`,`C) 21%`,`D) 11%`,`E) 9%`],g:`A`,c:`(1+i)^2=1,21 -> 1+i=1,1 -> i=10% ao periodo.`},{a:2023,r:`FCC/Fiscal-2023`,q:`No desconto racional simples, o valor do desconto incide sobre:`,o:[`A) O valor nominal`,`B) O valor atual (valor presente)`,`C) A media`,`D) O montante`,`E) O valor de face`],g:`B`,c:`Desconto RACIONAL (por dentro) = i x VP x n, calculado sobre o valor ATUAL. O comercial (por fora) incide sobre o valor nominal.`},{a:2022,r:`FCC/PGE-2022`,q:`Uma taxa de 12% a.a. capitalizada mensalmente tem taxa efetiva:`,o:[`A) 12% a.a.`,`B) Maior que 12% a.a. (juros sobre juros mensais)`,`C) Menor que 12%`,`D) 1% efetivo ao ano`,`E) Igual a nominal`],g:`B`,c:`Taxa NOMINAL 12% a.a. (1% a.m.) capitalizada mensalmente gera taxa EFETIVA = (1,01)^12 - 1 = 12,68% a.a., MAIOR que a nominal.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No SAC, sendo PV=120.000 e n=4, a amortizacao periodica e:`,o:[`A) 40.000`,`B) 30.000`,`C) 24.000`,`D) 60.000`,`E) 12.000`],g:`B`,c:`SAC: amortizacao constante = PV/n = 120.000/4 = 30.000 por periodo.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A TIR (Taxa Interna de Retorno) e a taxa que torna o VPL igual a:`,o:[`A) 1`,`B) Zero`,`C) O investimento`,`D) O lucro`,`E) A receita`],g:`B`,c:`TIR: taxa de desconto que torna o Valor Presente Liquido (VPL) igual a ZERO. Projeto viavel se TIR > custo de capital.`},{a:2022,r:`FCC/PGE-2022`,q:`Em juros simples, dobrar o prazo (mantendo taxa e capital):`,o:[`A) Dobra os juros`,`B) Quadruplica`,`C) Triplica`,`D) Reduz pela metade`,`E) Nao altera`],g:`A`,c:`Juros simples: J = C.i.n e LINEAR no tempo. Dobrar n dobra os juros.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Aplicando R$10.000 a 10% a.a. por 3 anos compostos (1,1^3=1,331), o juro e:`,o:[`A) R$3.000`,`B) R$3.310`,`C) R$1.331`,`D) R$13.310`,`E) R$3.300`],g:`B`,c:`M=10.000 x 1,331=13.310. Juros=M-C=13.310-10.000=3.310.`},{a:2023,r:`FCC/Fiscal-2023`,q:`No sistema PRICE, a parcela de amortizacao ao longo do tempo:`,o:[`A) E constante`,`B) E crescente`,`C) E decrescente`,`D) E zero`,`E) Iguala os juros`],g:`B`,c:`PRICE: prestacao constante; os juros decrescem e a AMORTIZACAO CRESCE ao longo do tempo (inverso da composicao do SAC).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Aplicacao de R$2.000 a juros simples gerou R$2.480 em 12 meses. A taxa mensal foi:`,o:[`A) 1%`,`B) 2%`,`C) 1,5%`,`D) 2,5%`,`E) 3%`],g:`B`,c:`J=2.480-2.000=480. i=J/(C.n)=480/(2.000x12)=0,02=2% a.m.`},{a:2023,r:`FCC/Fiscal-2023`,q:`No fluxo de caixa, um valor presente positivo (VPL>0) indica que o projeto:`,o:[`A) Deve ser rejeitado`,`B) Gera retorno acima do custo de capital (viavel)`,`C) E indiferente`,`D) Tem TIR zero`,`E) Da prejuizo`],g:`B`,c:`VPL > 0: o projeto remunera o capital acima da taxa minima exigida, agregando valor - deve ser ACEITO.`},{a:2022,r:`FCC/PGE-2022`,q:`Duas taxas sao PROPORCIONAIS quando, em juros simples:`,o:[`A) Geram o mesmo montante composto`,`B) Mantem a razao com o tempo (ex: 12% a.a. = 1% a.m.)`,`C) Sao iguais`,`D) Dobram a cada periodo`,`E) Sao equivalentes compostas`],g:`B`,c:`Taxas PROPORCIONAIS (juros simples): variam linearmente com o tempo (24% a.a. = 2% a.m.). EQUIVALENTES (compostos) geram o mesmo montante.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No SAC, a prestacao da 1a parcela de um financiamento de 100.000 em 5 anos a 10% a.a. e:`,o:[`A) 20.000`,`B) 30.000`,`C) 25.000`,`D) 10.000`,`E) 22.000`],g:`B`,c:`SAC: amortizacao=100.000/5=20.000. Juros 1a parcela=100.000x10%=10.000. Prestacao=20.000+10.000=30.000.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O desconto comercial simples de um titulo de R$10.000, taxa 3% a.m. por 2 meses, e:`,o:[`A) R$300`,`B) R$600`,`C) R$580`,`D) R$200`,`E) R$612`],g:`B`,c:`Desconto comercial=N.i.n=10.000x0,03x2=600 (incide sobre o valor nominal).`},{a:2022,r:`FCC/PGE-2022`,q:`No sistema PRICE, a soma das amortizacoes ao final iguala:`,o:[`A) O total de juros`,`B) O valor financiado (principal)`,`C) A prestacao`,`D) O montante`,`E) Zero`],g:`B`,c:`Em qualquer sistema (PRICE ou SAC), a soma das AMORTIZACOES ao longo do tempo iguala o PRINCIPAL financiado (o saldo devedor zera no fim).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Capital de 5.000 a juros compostos de 4% a.m. Apos 2 meses (1,04^2=1,0816), o montante e:`,o:[`A) 5.400`,`B) 5.408`,`C) 5.416`,`D) 5.200`,`E) 5.800`],g:`B`,c:`M=5.000 x 1,0816 = 5.408.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Taxa de 2% a.m. equivale, ao trimestre, a (compostos, 1,02^3=1,0612):`,o:[`A) 6%`,`B) 6,12%`,`C) 6,5%`,`D) 5,88%`,`E) 8%`],g:`B`,c:`Taxa equivalente trimestral = (1,02)^3 - 1 = 1,0612 - 1 = 6,12% (juros compostos, nao 6% proporcional).`},{a:2022,r:`FCC/PGE-2022`,q:`Um titulo de 20.000 e descontado 60 dias antes (desconto racional simples, 5% a.m.). O valor atual e:`,o:[`A) 18.000`,`B) 18.181,82`,`C) 19.000`,`D) 20.000`,`E) 18.500`],g:`B`,c:`Desconto racional: VA = N/(1+i.n) = 20.000/(1+0,05x2) = 20.000/1,10 = 18.181,82.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No SAC, financiamento de 90.000 em 3 parcelas a 8%. A 3a (ultima) prestacao e:`,o:[`A) 30.000`,`B) 32.400`,`C) 34.800`,`D) 38.400`,`E) 29.000`],g:`B`,c:`SAC: amort=30.000. 3a parcela: saldo devedor inicial=30.000, juros=30.000x8%=2.400, prestacao=30.000+2.400=32.400.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Aplicacao a juros compostos rende 10% no 1o mes e 20% no 2o. A taxa acumulada e:`,o:[`A) 30%`,`B) 32%`,`C) 28%`,`D) 30,5%`,`E) 15%`],g:`B`,c:`Taxas compostas acumulam-se: (1,10)(1,20)-1 = 1,32-1 = 32% (nao e a soma simples de 30%).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Um investimento de 1.000 vira 1.331 em 3 anos (compostos). A taxa anual e:`,o:[`A) 11%`,`B) 10%`,`C) 33,1%`,`D) 9%`,`E) 12%`],g:`B`,c:`(1+i)^3 = 1,331 = 1,1^3 -> i = 10% a.a.`},{a:2022,r:`FCC/PGE-2022`,q:`No SAC, financiamento de 200.000 em 4 parcelas a 5%. A amortizacao e os juros da 1a parcela sao:`,o:[`A) 50.000 e 10.000`,`B) 50.000 e 10.000 (amort=200k/4; juros=200k x 5%)`,`C) 40.000 e 8.000`,`D) 50.000 e 5.000`,`E) 25.000 e 10.000`],g:`B`,c:`SAC: amortizacao=200.000/4=50.000. Juros 1a parcela=200.000 x 5%=10.000. Prestacao=60.000.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A taxa real, com taxa nominal de 8% e inflacao de 3% (Fisher), e aproximadamente:`,o:[`A) 5%`,`B) 4,85%`,`C) 11%`,`D) 5,5%`,`E) 3%`],g:`B`,c:`(1+real)=(1,08)/(1,03)=1,0485 -> real=4,85%. Aproximacao simples (8-3=5%) e imprecisa.`}],"MAT-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Dados 5,8,3,12,8,15,8 - a MEDIANA e a MODA sao:`,o:[`A) 8 e 8`,`B) 8 e 5`,`C) 8,43 e 8`,`D) 12 e 8`,`E) 8 e 12`],g:`A`,c:`Ordenando: 3,5,8,8,8,12,15. N=7 impar -> mediana=4o elemento=8. Moda=8 (3 vezes). Media=8,43.`},{a:2022,r:`FCC/Fiscal-2022`,q:`P->Q verdadeira e Q falsa. Pelo Modus Tollens conclui-se:`,o:[`A) P verdadeira`,`B) P falsa (nao-P)`,`C) Q verdadeira`,`D) Indeterminado`,`E) P e Q verdadeiras`],g:`B`,c:`MODUS TOLLENS: P->Q, nao-Q, logo nao-P. Se Q e falsa, P e falsa.`},{a:2021,r:`FCC/TCE-2021`,q:`Negacao de 'Todo auditor conhece o CTN':`,o:[`A) Nenhum auditor conhece o CTN`,`B) Algum auditor nao conhece o CTN`,`C) Todo auditor desconhece o CTN`,`D) Alguns conhecem`,`E) Nenhum desconhece`],g:`B`,c:`Negacao de 'todo A e B' = 'algum A nao e B' (existe ao menos um que nao).`},{a:2020,r:`FCC/ISS-2020`,q:`P->Q e Q->R verdadeiras. Conclui-se necessariamente:`,o:[`A) R->P`,`B) P->R`,`C) nao-P`,`D) Q->P`,`E) R e P`],g:`B`,c:`SILOGISMO HIPOTETICO (transitividade): P->Q, Q->R, logo P->R.`},{a:2019,r:`FCC/Adm-2019`,q:`Desvio-padrao mede:`,o:[`A) O valor central`,`B) A dispersao dos dados em torno da media`,`C) O valor mais frequente`,`D) A amplitude total`,`E) A assimetria`],g:`B`,c:`Desvio-padrao=dispersao em torno da media (raiz da variancia). Mediana=central; moda=frequente.`},{a:2023,r:`FCC/TRT-2023`,q:`Probabilidade de, em 2 lancamentos de moeda, sair 2 caras:`,o:[`A) 1/2`,`B) 1/4`,`C) 1/3`,`D) 3/4`,`E) 1`],g:`B`,c:`Eventos independentes: P=1/2 x 1/2=1/4.`},{a:2022,r:`FCC/TCE-2022`,q:`Negacao de 'P e Q' (De Morgan):`,o:[`A) nao-P e nao-Q`,`B) nao-P ou nao-Q`,`C) P ou Q`,`D) nao-P -> Q`,`E) P e nao-Q`],g:`B`,c:`De Morgan: nao(P e Q) = nao-P OU nao-Q.`},{a:2021,r:`FCC/Fiscal-2021`,q:`Numero de comissoes de 3 pessoas escolhidas entre 5:`,o:[`A) 60`,`B) 10`,`C) 15`,`D) 125`,`E) 20`],g:`B`,c:`Combinacao C(5,3)=5!/(3!2!)=10. Ordem nao importa em comissao.`},{a:2020,r:`FCC/PGE-2020`,q:`Media de 10,20,30,40,50:`,o:[`A) 25`,`B) 30`,`C) 35`,`D) 20`,`E) 40`],g:`B`,c:`Media=(10+20+30+40+50)/5=150/5=30.`},{a:2019,r:`FCC/TRF-2019`,q:`A contrapositiva de 'Se chove, entao a rua molha' e:`,o:[`A) Se a rua molha, entao chove`,`B) Se nao molha a rua, entao nao chove`,`C) Se nao chove, nao molha`,`D) A rua molha e chove`,`E) Chove ou molha`],g:`B`,c:`Contrapositiva de P->Q e nao-Q -> nao-P: 'Se a rua nao molha, entao nao chove' (equivalente a original).`},{a:2023,r:`FCC/Adm-2023`,q:`Coeficiente de variacao serve para:`,o:[`A) Calcular a media`,`B) Comparar a dispersao relativa entre conjuntos`,`C) Achar a moda`,`D) Medir probabilidade`,`E) Ordenar dados`],g:`B`,c:`CV=desvio-padrao/media. Mede dispersao RELATIVA, util para comparar conjuntos de escalas diferentes.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Em 'Se chove entao a rua molha', sabendo que a rua NAO molhou, conclui-se:`,o:[`A) Choveu`,`B) Nao choveu (Modus Tollens)`,`C) Pode ter chovido`,`D) Indeterminado`,`E) A rua molhou`],g:`B`,c:`Modus Tollens: P->Q, ~Q, logo ~P. Se a rua nao molhou, entao nao choveu.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O desvio-padrao de um conjunto em que todos os valores sao iguais e:`,o:[`A) A media`,`B) Zero`,`C) 1`,`D) Negativo`,`E) A soma`],g:`B`,c:`Se todos os valores sao iguais, nao ha dispersao: variancia e desvio-padrao = ZERO.`},{a:2022,r:`FCC/PGE-2022`,q:`A negacao de 'Joao estuda E trabalha' e:`,o:[`A) Joao nao estuda e nao trabalha`,`B) Joao nao estuda ou nao trabalha`,`C) Joao estuda ou trabalha`,`D) Joao nao estuda`,`E) Joao trabalha`],g:`B`,c:`De Morgan: ~(P e Q) = ~P ou ~Q. 'Joao nao estuda OU nao trabalha'.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Lancando um dado, a probabilidade de sair numero par e:`,o:[`A) 1/6`,`B) 1/2`,`C) 1/3`,`D) 2/3`,`E) 1/4`],g:`B`,c:`Pares: 2,4,6 (3 casos) em 6 possiveis = 3/6 = 1/2.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A mediana de 4,8,6,10,2 e:`,o:[`A) 6`,`B) 8`,`C) 4`,`D) 10`,`E) 5`],g:`A`,c:`Ordenando: 2,4,6,8,10. N=5 (impar), mediana = elemento central = 6.`},{a:2022,r:`FCC/PGE-2022`,q:`Quantos anagramas tem a palavra 'AMOR'?`,o:[`A) 4`,`B) 12`,`C) 24`,`D) 16`,`E) 8`],g:`C`,c:`4 letras distintas: permutacoes = 4! = 24.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Se P->Q e verdadeira e P e verdadeira, entao (Modus Ponens):`,o:[`A) Q e falsa`,`B) Q e verdadeira`,`C) Indeterminado`,`D) ~P`,`E) ~Q`],g:`B`,c:`Modus Ponens: P->Q, P, logo Q. Q e verdadeira.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A media de 2,4,6,8,10 e o desvio em relacao a ela do valor 10 e:`,o:[`A) media 6, desvio 4`,`B) media 5, desvio 5`,`C) media 6, desvio 6`,`D) media 7, desvio 3`,`E) media 6, desvio 0`],g:`A`,c:`Media=(2+4+6+8+10)/5=30/5=6. Desvio de 10 = 10-6 = 4.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A probabilidade de tirar uma carta de copas de um baralho de 52 cartas e:`,o:[`A) 1/4`,`B) 1/13`,`C) 1/52`,`D) 4/52`,`E) 1/2`],g:`A`,c:`13 cartas de copas em 52 = 13/52 = 1/4.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Em uma distribuicao simetrica, media, mediana e moda:`,o:[`A) Sao diferentes`,`B) Coincidem (sao iguais)`,`C) A media e maior`,`D) A moda e maior`,`E) Nao existem`],g:`B`,c:`Em distribuicao perfeitamente SIMETRICA, media = mediana = moda (coincidem no centro).`},{a:2022,r:`FCC/PGE-2022`,q:`A negacao de 'Todos os auditores sao eficientes' e:`,o:[`A) Nenhum auditor e eficiente`,`B) Pelo menos um auditor nao e eficiente`,`C) Todos sao ineficientes`,`D) Alguns sao eficientes`,`E) Nenhum e ineficiente`],g:`B`,c:`Negacao de 'todo A e B' = 'existe (pelo menos um) A que nao e B'. 'Pelo menos um auditor nao e eficiente'.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`De quantas formas 3 pessoas podem sentar em 3 cadeiras enfileiradas?`,o:[`A) 3`,`B) 6`,`C) 9`,`D) 27`,`E) 12`],g:`B`,c:`Permutacao de 3 = 3! = 6 formas (a ordem importa).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Se P e V (verdadeira) e Q e F (falsa), o valor logico de 'P -> Q' e:`,o:[`A) Verdadeiro`,`B) Falso`,`C) Indeterminado`,`D) Nulo`,`E) Tautologia`],g:`B`,c:`A condicional P->Q so e FALSA quando o antecedente e V e o consequente e F. P=V e Q=F -> P->Q = FALSO.`},{a:2022,r:`FCC/PGE-2022`,q:`O coeficiente de variacao serve para comparar a dispersao de conjuntos com:`,o:[`A) Mesma media`,`B) Medias e/ou unidades diferentes (dispersao relativa)`,`C) Mesma unidade so`,`D) Mesmo desvio`,`E) Mesmos dados`],g:`B`,c:`CV = desvio-padrao/media (geralmente em %). Permite comparar a dispersao RELATIVA entre conjuntos com medias ou unidades diferentes.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Dois dados sao lancados. A probabilidade da soma ser 7 e:`,o:[`A) 1/6`,`B) 6/36 = 1/6`,`C) 1/12`,`D) 7/36`,`E) 1/36`],g:`B`,c:`Soma 7: (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) = 6 casos em 36 = 6/36 = 1/6.`},{a:2023,r:`FCC/Fiscal-2023`,q:`'Se passo, comemoro. Nao comemorei.' Logicamente conclui-se:`,o:[`A) Passei`,`B) Nao passei (Modus Tollens)`,`C) Talvez passei`,`D) Indeterminado`,`E) Comemorei`],g:`B`,c:`P->Q (passo->comemoro), ~Q (nao comemorei), logo ~P (nao passei). Modus Tollens.`},{a:2022,r:`FCC/PGE-2022`,q:`Variancia de um conjunto multiplicada por uma constante k em cada dado fica:`,o:[`A) Igual`,`B) Multiplicada por k^2`,`C) Multiplicada por k`,`D) Dividida por k`,`E) Zero`],g:`B`,c:`Se cada valor e multiplicado por k, a variancia fica multiplicada por k^2 (e o desvio-padrao por |k|). Somar constante nao altera a variancia.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Quantos numeros de 3 algarismos distintos podem ser formados com 1,2,3,4,5?`,o:[`A) 125`,`B) 60`,`C) 10`,`D) 120`,`E) 15`],g:`B`,c:`Arranjo A(5,3)=5x4x3=60 (ordem importa, sem repeticao).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A probabilidade de um evento certo e:`,o:[`A) 0`,`B) 1`,`C) 0,5`,`D) Negativa`,`E) Infinita`],g:`B`,c:`Evento CERTO: probabilidade = 1 (100%). Evento IMPOSSIVEL: probabilidade = 0.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Dados 10,10,20,30,30 a moda e:`,o:[`A) 20`,`B) Bimodal (10 e 30)`,`C) 10`,`D) 30`,`E) Amodal`],g:`B`,c:`10 e 30 aparecem 2 vezes cada (mais frequentes) -> distribuicao BIMODAL (duas modas: 10 e 30).`},{a:2022,r:`FCC/PGE-2022`,q:`'Algum auditor e eficiente' - a negacao e:`,o:[`A) Todo auditor e eficiente`,`B) Nenhum auditor e eficiente`,`C) Algum nao e eficiente`,`D) Todo e ineficiente`,`E) Alguns sao`],g:`B`,c:`Negacao de 'ALGUM A e B' = 'NENHUM A e B' (= todo A nao e B). 'Nenhum auditor e eficiente'.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Em uma PA de razao 3, comecando em 2, o 5o termo e:`,o:[`A) 11`,`B) 14`,`C) 15`,`D) 17`,`E) 12`],g:`B`,c:`PA: a5 = a1 + 4r = 2 + 4x3 = 2 + 12 = 14.`}],"ADM-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No Modelo das 3 Linhas (IIA 2020), a 3a linha corresponde a:`,o:[`A) Gestao operacional`,`B) Compliance e gestao de riscos`,`C) Auditoria interna (asseguracao independente)`,`D) Controle externo (TCU)`,`E) Alta administracao`],g:`C`,c:`3a LINHA=AUDITORIA INTERNA (asseguracao independente). 1a=gestao operacional; 2a=compliance/riscos.`},{a:2022,r:`FCC/TCE-2022`,q:`A Lei 14.230/2021 exige, para improbidade, elemento subjetivo de:`,o:[`A) Culpa grave`,`B) Dolo especifico`,`C) Culpa simples`,`D) Apenas dano ao erario`,`E) Dolo generico`],g:`B`,c:`Lei 14.230/2021: DOLO ESPECIFICO imprescindivel. Culpa nao configura mais improbidade.`},{a:2021,r:`FCC/PGE-2021`,q:`Na LAI (Lei 12.527/2011), o prazo de resposta e:`,o:[`A) 10 dias`,`B) 15 dias uteis`,`C) 20 dias, prorrogavel por mais 10`,`D) 30 dias`,`E) 5 dias`],g:`C`,c:`LAI art. 11: 20 dias + prorrogacao de 10 (com justificativa). Sigilo: reservado 5, secreto 15, ultra-secreto 25 anos.`},{a:2020,r:`FCC/Adm-2020`,q:`A gestao de riscos (ISO 31000) tem como etapas:`,o:[`A) Planejar, executar, verificar, agir`,`B) Identificar, analisar, avaliar, tratar e monitorar`,`C) Prever, empenhar, liquidar, pagar`,`D) Apenas evitar riscos`,`E) Transferir todos os riscos`],g:`B`,c:`ISO 31000: identificar->analisar->avaliar->tratar->monitorar. Tratamento: evitar, reduzir, transferir, aceitar.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O apetite ao risco refere-se a:`,o:[`A) Eliminacao total dos riscos`,`B) Nivel de risco que a organizacao aceita assumir`,`C) Transferencia obrigatoria de riscos`,`D) Riscos operacionais apenas`,`E) Auditoria externa`],g:`B`,c:`Apetite ao risco=nivel de risco que a organizacao esta disposta a aceitar para atingir objetivos.`},{a:2023,r:`FCC/TRT-2023`,q:`Accountability significa:`,o:[`A) Apenas contabilidade publica`,`B) Responsabilizacao e prestacao de contas`,`C) Auditoria externa`,`D) Transparencia passiva`,`E) Gestao de pessoal`],g:`B`,c:`Accountability=responsabilizacao + dever de prestar contas. Pilar da governanca publica.`},{a:2022,r:`FCC/TCE-2022`,q:`Na governanca publica, a teoria da agencia trata da relacao entre:`,o:[`A) Estados e municipios`,`B) Principal (sociedade) e agente (gestor)`,`C) Auditor e auditado`,`D) Legislativo e Judiciario`,`E) Servidor e cidadao`],g:`B`,c:`Teoria da agencia: conflito entre PRINCIPAL (sociedade/povo) e AGENTE (gestor publico), com assimetria de informacao.`},{a:2021,r:`FCC/PGE-2021`,q:`A transparencia ATIVA na LAI consiste em:`,o:[`A) Responder a pedidos de informacao`,`B) Divulgar informacoes por iniciativa propria`,`C) Manter sigilo de documentos`,`D) Cobrar pelo acesso`,`E) Negar acesso a terceiros`],g:`B`,c:`Transparencia ATIVA=divulgacao proativa (por iniciativa do orgao). PASSIVA=resposta a pedidos.`},{a:2020,r:`FCC/Adm-2020`,q:`Na 2a linha do Modelo das 3 Linhas estao funcoes de:`,o:[`A) Auditoria interna`,`B) Gestao operacional`,`C) Compliance, controles e gestao de riscos`,`D) Controle externo`,`E) Conselho de administracao`],g:`C`,c:`2a LINHA=funcoes de suporte: compliance, gestao de riscos, controles internos (apoiam a 1a linha).`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O assedio moral no trabalho e tratado pela:`,o:[`A) Lei de Licitacoes`,`B) Convencao OIT 190/2019`,`C) LAI`,`D) LRF`,`E) Lei Anticorrupcao`],g:`B`,c:`Convencao OIT 190/2019 trata de violencia e assedio no mundo do trabalho.`},{a:2023,r:`FCC/TCE-2023`,q:`Integridade publica, no contexto de governanca, refere-se a:`,o:[`A) Apenas seguranca da informacao`,`B) Alinhamento consistente com valores e principios eticos para prevenir corrupcao`,`C) Auditoria de sistemas`,`D) Controle de estoque`,`E) Gestao orcamentaria`],g:`B`,c:`Integridade=alinhamento consistente e adesao a valores, principios e normas eticas para prevenir e combater a corrupcao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No COSO ERM, o ambiente interno/governanca e a base porque:`,o:[`A) Define o lucro`,`B) Estabelece o tom da organizacao e a cultura de gestao de riscos`,`C) Calcula riscos`,`D) Audita contas`,`E) Elabora o orcamento`],g:`B`,c:`COSO ERM: a governanca e cultura ('tone at the top') sustentam todo o gerenciamento de riscos; sem cultura de risco, os controles falham.`},{a:2023,r:`FCC/TCE-2023`,q:`Risco INERENTE difere de risco RESIDUAL porque o residual e:`,o:[`A) O risco antes dos controles`,`B) O risco que permanece apos a aplicacao dos controles/respostas`,`C) Sempre zero`,`D) O risco maximo`,`E) Igual ao inerente`],g:`B`,c:`Risco INERENTE: antes de qualquer tratamento. Risco RESIDUAL: o que sobra apos as respostas/controles. O apetite a risco baliza o residual aceitavel.`},{a:2022,r:`FCC/PGE-2022`,q:`Na LAI, a classificacao 'reservada' tem prazo maximo de sigilo de:`,o:[`A) 5 anos`,`B) 15 anos`,`C) 25 anos`,`D) 10 anos`,`E) 3 anos`],g:`A`,c:`LAI: reservada = ate 5 anos; secreta = ate 15 anos; ultrassecreta = ate 25 anos (prorrogavel uma vez).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Compliance, no setor publico, refere-se a:`,o:[`A) Auditoria externa`,`B) Conformidade com leis, normas e politicas, prevenindo desvios`,`C) Planejamento orcamentario`,`D) Gestao de pessoal`,`E) Controle de estoque`],g:`B`,c:`Compliance = estar em conformidade com o arcabouço normativo (leis, regulamentos, politicas internas), integrando o programa de integridade.`},{a:2023,r:`FCC/TCE-2023`,q:`A matriz de risco (probabilidade x impacto) serve para:`,o:[`A) Eliminar riscos`,`B) Priorizar riscos conforme severidade`,`C) Calcular o orcamento`,`D) Auditar contas`,`E) Definir o lucro`],g:`B`,c:`A matriz probabilidade x impacto classifica e PRIORIZA os riscos (baixo/medio/alto/critico), orientando onde concentrar as respostas.`},{a:2022,r:`FCC/PGE-2022`,q:`Os tres niveis de governanca publica (TCU) sao:`,o:[`A) Federal, estadual, municipal`,`B) Estrategico, tatico e operacional`,`C) Politico, tecnico e administrativo`,`D) Interno, externo e social`,`E) Legislativo, executivo, judiciario`],g:`B`,c:`A governanca atua em niveis: ESTRATEGICO (direcao), TATICO (traducao em planos) e OPERACIONAL (execucao), conforme o referencial do TCU.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A resposta ao risco 'compartilhar' significa:`,o:[`A) Aceitar o risco`,`B) Transferir parte do risco a terceiros (ex: seguro, terceirizacao)`,`C) Eliminar a atividade`,`D) Reduzir a probabilidade`,`E) Ignorar`],g:`B`,c:`Respostas ao risco: evitar, reduzir/mitigar, COMPARTILHAR/transferir (seguro, terceirizacao) e aceitar.`},{a:2023,r:`FCC/TCE-2023`,q:`A integridade publica e fortalecida por mecanismos como:`,o:[`A) Sigilo absoluto`,`B) Codigo de etica, canais de denuncia e gestao de conflitos de interesse`,`C) Centralizacao do poder`,`D) Ausencia de controles`,`E) Discricionariedade ilimitada`],g:`B`,c:`Pilares da integridade: codigo de etica/conduta, canais de denuncia (ouvidoria), gestao de conflito de interesses, controles e responsabilizacao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No modelo das 3 linhas (IIA 2020), o orgao de governanca:`,o:[`A) Executa operacoes`,`B) Presta contas as partes interessadas e supervisiona a gestao`,`C) Faz auditoria interna`,`D) Gere riscos operacionais`,`E) Elabora demonstracoes`],g:`B`,c:`No modelo das 3 linhas, o ORGAO DE GOVERNANCA (conselho/alta administracao) responde as partes interessadas e supervisiona; a gestao (1a/2a linhas) executa e a auditoria interna (3a) assegura.`},{a:2023,r:`FCC/TCE-2023`,q:`A di
