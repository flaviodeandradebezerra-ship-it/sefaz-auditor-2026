22,r:`FCC/PGE-2022`,q:`Quando o pais tem superavit em conta corrente:`,o:[`A) Importa mais que exporta`,`B) As receitas externas (exportacoes, rendas) superam as despesas`,`C) Aumenta a divida externa`,`D) Ha deficit comercial`,`E) Cai a reserva`],g:`B`,c:`Superavit em conta corrente: as entradas (exportacoes, rendas, transferencias) superam as saidas; o pais e exportador liquido de poupanca.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O cambio FLUTUANTE caracteriza-se por:`,o:[`A) Taxa fixada pelo governo`,`B) Taxa definida pelo mercado (oferta e demanda de divisas)`,`C) Bandas cambiais rigidas`,`D) Paridade com o ouro`,`E) Controle de capitais total`],g:`B`,c:`Cambio FLUTUANTE: a taxa e determinada livremente pelo mercado. FIXO: o BC fixa e defende a paridade. Brasil adota flutuante (com intervencoes).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O efeito multiplicador dos gastos publicos e maior quando:`,o:[`A) A propensao marginal a consumir e baixa`,`B) A propensao marginal a consumir e alta`,`C) Nao ha consumo`,`D) Os impostos sao altos`,`E) A poupanca e total`],g:`B`,c:`Multiplicador = 1/(1-PMgC). Quanto MAIOR a propensao a consumir, maior o multiplicador (cada real gasto reverbera mais na economia).`}],"DCO-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No controle CONCENTRADO (ADI), os efeitos da decisao sao:`,o:[`A) Inter partes e ex nunc`,`B) Erga omnes, ex tunc e vinculante`,`C) Inter partes e ex tunc`,`D) Erga omnes e ex nunc apenas`,`E) Vinculante so para a Adm.`],g:`B`,c:`ADI/ADC/ADPF: erga omnes + ex tunc + vinculante (Judiciario e Adm. Publica). Modulacao temporal por 2/3 do STF.`},{a:2022,r:`FCC/TCE-2022`,q:`A ADPF e cabivel para:`,o:[`A) Qualquer lei federal`,`B) Atos do poder publico que violem preceito fundamental, inclusive leis pre-1988`,`C) So leis municipais`,`D) Contratos administrativos`,`E) Atos de particulares`],g:`B`,c:`ADPF (Lei 9.882/99): viola preceito fundamental; cabe contra leis PRE-constitucionais e atos municipais. Carater subsidiario.`},{a:2021,r:`FCC/PGE-2021`,q:`A Sumula Vinculante vincula:`,o:[`A) So o STF`,`B) Todo o Judiciario e a Adm. Publica direta e indireta`,`C) Apenas a Adm. federal`,`D) Tambem o Legislativo (funcao tipica)`,`E) So instancias inferiores`],g:`B`,c:`SV (art. 103-A): vincula todo o Judiciario + Adm. Publica direta e indireta. NAO vincula o STF nem o Legislativo (funcao tipica).`},{a:2020,r:`FCC/ISS-2020`,q:`Os direitos fundamentais do art. 5 CF tem aplicacao:`,o:[`A) Diferida`,`B) Imediata (art. 5 par.1)`,`C) Condicionada a lei`,`D) Programatica`,`E) So para natos`],g:`B`,c:`Art. 5 par. 1: normas de direitos e garantias fundamentais tem aplicacao IMEDIATA.`},{a:2019,r:`FCC/TRF-2019`,q:`No controle DIFUSO, os efeitos sao:`,o:[`A) Erga omnes`,`B) Inter partes e ex tunc`,`C) Vinculantes`,`D) Ex nunc obrigatorio`,`E) So prospectivos`],g:`B`,c:`Difuso: INTER PARTES + ex tunc. Senado pode suspender (art. 52, X) para erga omnes + ex nunc.`},{a:2023,r:`FCC/TRT-2023`,q:`Sao legitimados para propor ADI (art. 103 CF), EXCETO:`,o:[`A) Presidente da Republica`,`B) Procurador-Geral da Republica`,`C) Conselho Federal da OAB`,`D) Qualquer cidadao`,`E) Governador de Estado`],g:`D`,c:`Cidadao NAO e legitimado para ADI (so para acao popular). Legitimados: Presidente, Mesas, Governadores, PGR, OAB, partidos, confederacoes.`},{a:2022,r:`FCC/TCE-2022`,q:`A clausula petrea NAO inclui:`,o:[`A) Forma federativa de Estado`,`B) Voto direto, secreto, universal e periodico`,`C) Separacao dos Poderes`,`D) Direitos e garantias individuais`,`E) A taxa de juros constitucional`],g:`E`,c:`Clausulas petreas (art. 60 par.4): forma federativa, voto direto/secreto, separacao dos poderes, direitos individuais. Taxa de juros nao e clausula petrea.`},{a:2021,r:`FCC/PGE-2021`,q:`Norma constitucional de eficacia CONTIDA caracteriza-se por:`,o:[`A) Depender totalmente de lei`,`B) Ser plena, mas poder ser restringida por lei posterior`,`C) Nunca produzir efeitos`,`D) Ser apenas programatica`,`E) Nao admitir restricao`],g:`B`,c:`Eficacia CONTIDA: aplicacao imediata e plena, mas pode ser RESTRINGIDA por lei (ex: liberdade profissional).`},{a:2020,r:`FCC/ISS-2020`,q:`A ADO (Acao Direta de Inconstitucionalidade por Omissao) combate:`,o:[`A) Lei inconstitucional`,`B) Omissao do legislador em regulamentar a CF`,`C) Ato administrativo`,`D) Decisao judicial`,`E) Conflito entre estados`],g:`B`,c:`ADO: combate a OMISSAO inconstitucional (falta de norma regulamentadora). Da-se ciencia ao orgao omisso.`},{a:2019,r:`FCC/TRF-2019`,q:`O efeito vinculante da ADI alcanca:`,o:[`A) O proprio STF`,`B) O Poder Legislativo na funcao de legislar`,`C) Os demais orgaos do Judiciario e a Adm. Publica`,`D) Apenas as partes do processo`,`E) So a Uniao`],g:`C`,c:`Efeito vinculante: demais orgaos do Judiciario + Adm. Publica direta e indireta. NAO vincula o STF nem o Legislativo (funcao tipica).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A modulacao de efeitos na ADI exige quorum de:`,o:[`A) Maioria simples`,`B) Maioria absoluta`,`C) 2/3 dos membros do STF`,`D) Unanimidade`,`E) 3/5`],g:`C`,c:`Art. 27 Lei 9.868/99: a modulacao temporal dos efeitos (restringir/alterar o marco) exige maioria de 2/3 dos membros do STF (8 ministros).`},{a:2023,r:`FCC/TCE-2023`,q:`No controle difuso, a clausula de reserva de plenario (art. 97 CF) exige:`,o:[`A) Decisao monocratica`,`B) Que a inconstitucionalidade so seja declarada pela maioria absoluta do tribunal ou do orgao especial`,`C) Voto unanime`,`D) Decisao do STF sempre`,`E) Quorum simples`],g:`B`,c:`Art. 97 (full bench): tribunais so declaram inconstitucionalidade pela maioria absoluta do plenario ou do orgao especial (SV 10 reforca).`},{a:2022,r:`FCC/PGE-2022`,q:`A acao declaratoria de constitucionalidade (ADC) tem por objeto:`,o:[`A) Lei estadual`,`B) Lei ou ato normativo FEDERAL, para afastar controversia relevante`,`C) Ato municipal`,`D) Emenda constitucional`,`E) Decreto autonomo estadual`],g:`B`,c:`ADC: cabivel apenas contra lei/ato normativo FEDERAL, exigindo demonstracao de controversia judicial relevante. Efeitos: erga omnes, vinculante, ex tunc.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Norma de eficacia LIMITADA:`,o:[`A) Produz todos os efeitos desde a promulgacao`,`B) Depende de regulamentacao para produzir plenos efeitos`,`C) Pode ser restringida por lei`,`D) E autoaplicavel`,`E) E clausula petrea`],g:`B`,c:`Eficacia LIMITADA: depende de lei integradora para produzir todos os efeitos (programaticas/institutivas). Tem eficacia minima (revoga normas contrarias, vincula o legislador).`},{a:2023,r:`FCC/TCE-2023`,q:`Sao direitos sociais (art. 6 CF), EXCETO:`,o:[`A) Educacao`,`B) Saude`,`C) Propriedade privada`,`D) Moradia`,`E) Trabalho`],g:`C`,c:`Direitos sociais (art. 6): educacao, saude, alimentacao, trabalho, moradia, transporte, lazer, seguranca, previdencia, protecao a maternidade/infancia e assistencia. Propriedade e direito individual (art. 5).`},{a:2022,r:`FCC/PGE-2022`,q:`A acao popular pode ser proposta por:`,o:[`A) Qualquer cidadao, para anular ato lesivo ao patrimonio publico`,`B) Apenas o MP`,`C) So partidos politicos`,`D) O PGR`,`E) Pessoas juridicas`],g:`A`,c:`Acao popular (art. 5, LXXIII): qualquer CIDADAO (eleitor) pode anular ato lesivo ao patrimonio publico, a moralidade, ao meio ambiente e ao patrimonio historico.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O principio da legalidade tributaria (art. 150, I CF) exige:`,o:[`A) Decreto`,`B) Lei para instituir ou majorar tributos`,`C) Portaria`,`D) Convenio`,`E) Resolucao do Senado sempre`],g:`B`,c:`Legalidade tributaria: tributo so e instituido ou majorado por LEI (em regra). Excecoes de aliquota (II, IE, IPI, IOF) podem ser alteradas por ato do Executivo, nos limites legais.`},{a:2023,r:`FCC/TCE-2023`,q:`A imunidade reciproca (art. 150, VI, 'a') veda:`,o:[`A) Cobranca de taxas`,`B) Instituicao de IMPOSTOS sobre patrimonio, renda e servicos entre os entes federativos`,`C) Contribuicoes`,`D) Tarifas`,`E) ICMS sobre empresas`],g:`B`,c:`Imunidade reciproca: veda a Uniao, Estados, DF e Municipios instituirem IMPOSTOS sobre patrimonio, renda ou servicos uns dos outros (protege o pacto federativo).`}],"DAD-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`O ato com vicio de COMPETENCIA (em razao da pessoa):`,o:[`A) E sempre nulo`,`B) Pode ser convalidado/ratificado pela autoridade competente`,`C) E inexistente`,`D) E revogavel`,`E) Nao produz efeitos`],g:`B`,c:`Vicio de competencia (em razao da pessoa) e SANAVEL -> admite convalidacao/ratificacao. Exceto competencia exclusiva ou em razao da materia.`},{a:2022,r:`FCC/TCE-2022`,q:`A ANULACAO de ato administrativo produz efeitos:`,o:[`A) Ex nunc`,`B) Ex tunc (retroativos)`,`C) So futuros`,`D) Vinculantes`,`E) Prospectivos`],g:`B`,c:`ANULACAO (ilegalidade): efeitos EX TUNC (retroage). REVOGACAO (merito): ex nunc. Sumula 473 STF.`},{a:2021,r:`FCC/PGE-2021`,q:`A responsabilidade civil do Estado (art. 37 par.6) por atos comissivos e:`,o:[`A) Subjetiva`,`B) Objetiva (teoria do risco administrativo)`,`C) Por culpa presumida apenas`,`D) Penal`,`E) Inexistente`],g:`B`,c:`Atos comissivos: responsabilidade OBJETIVA (risco administrativo). Basta conduta+dano+nexo. Regresso contra agente com dolo/culpa.`},{a:2020,r:`FCC/ISS-2020`,q:`A REVOGACAO de ato administrativo:`,o:[`A) Decorre de ilegalidade`,`B) Funda-se em conveniencia e oportunidade, efeitos ex nunc, so pela Adm.`,`C) Tem efeitos ex tunc`,`D) Pode ser feita pelo Judiciario`,`E) E vinculada`],g:`B`,c:`REVOGACAO: motivo de merito (conveniencia/oportunidade), efeitos EX NUNC, exclusiva da Administracao.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`DESCENTRALIZACAO administrativa significa:`,o:[`A) Distribuir competencias dentro do mesmo orgao`,`B) Transferir competencias para outra pessoa juridica`,`C) Criar hierarquia interna`,`D) Concentrar poder`,`E) Extinguir orgaos`],g:`B`,c:`DESCENTRALIZACAO: transfere para OUTRA PJ (autarquia, fundacao, EP, SEM) ou particular. DESCONCENTRACAO: dentro da mesma PJ (orgaos).`},{a:2023,r:`FCC/TRT-2023`,q:`Atributo do ato administrativo que permite execucao sem intervencao judicial:`,o:[`A) Presuncao de legitimidade`,`B) Imperatividade`,`C) Autoexecutoriedade`,`D) Tipicidade`,`E) Discricionariedade`],g:`C`,c:`AUTOEXECUTORIEDADE: a Adm. executa o ato diretamente, sem precisar do Judiciario (ex: demolicao, apreensao).`},{a:2022,r:`FCC/TCE-2022`,q:`O poder de POLICIA caracteriza-se por:`,o:[`A) Punir servidores`,`B) Limitar direitos individuais em favor do interesse publico`,`C) Editar regulamentos internos`,`D) Organizar a hierarquia`,`E) Anular atos`],g:`B`,c:`Poder de POLICIA: condiciona/limita direitos e liberdades em prol do interesse publico (preventivo e repressivo).`},{a:2021,r:`FCC/PGE-2021`,q:`Sao requisitos do ato administrativo (COFIFOMOB):`,o:[`A) Competencia, finalidade, forma, motivo e objeto`,`B) Capacidade, forma e objeto licito`,`C) Apenas competencia e objeto`,`D) Legalidade e moralidade`,`E) Forma e publicidade`],g:`A`,c:`Requisitos: COmpetencia, FInalidade, FOrma, MOtivo, OBjeto. Vicios em competencia/forma sao sanaveis.`},{a:2020,r:`FCC/ISS-2020`,q:`Excludente da responsabilidade civil do Estado:`,o:[`A) Dolo do agente`,`B) Culpa exclusiva da vitima`,`C) Conduta comissiva`,`D) Nexo causal`,`E) Dano material`],g:`B`,c:`Excludentes (rompem o nexo): culpa exclusiva da vitima, caso fortuito/forca maior, fato exclusivo de terceiro.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`A administracao INDIRETA e composta por:`,o:[`A) Ministerios e secretarias`,`B) Autarquias, fundacoes publicas, empresas publicas e sociedades de economia mista`,`C) Orgaos sem personalidade`,`D) So autarquias`,`E) Particulares delegatarios`],g:`B`,c:`Adm. INDIRETA: autarquias, fundacoes publicas, empresas publicas, sociedades de economia mista (todas com personalidade juridica propria).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A convalidacao do ato administrativo:`,o:[`A) Tem efeitos ex nunc`,`B) Tem efeitos ex tunc (retroativos), sanando vicio sanavel`,`C) E sempre vedada`,`D) Equivale a revogacao`,`E) So o Judiciario faz`],g:`B`,c:`Convalidacao: sana vicio SANAVEL (competencia/forma) com efeitos EX TUNC (retroage a origem do ato).`},{a:2023,r:`FCC/TCE-2023`,q:`O atributo da presuncao de legitimidade implica que:`,o:[`A) O ato e sempre valido`,`B) O onus de provar o vicio recai sobre quem alega (inversao)`,`C) O ato nao pode ser anulado`,`D) A Adm. nao erra`,`E) O ato e imutavel`],g:`B`,c:`Presuncao de legitimidade (relativa/juris tantum): presume-se que o ato nasceu conforme a lei; o ONUS DA PROVA do vicio cabe ao administrado.`},{a:2022,r:`FCC/PGE-2022`,q:`A responsabilidade do Estado por OMISSAO e, segundo o STF, em regra:`,o:[`A) Objetiva`,`B) Subjetiva (exige culpa do servico - faute du service)`,`C) Inexistente`,`D) Solidaria`,`E) Penal`],g:`B`,c:`Para a corrente majoritaria/STF, a responsabilidade por omissao e SUBJETIVA: exige demonstrar a falha/culpa do servico (faute du service). Atos comissivos: objetiva.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A autotutela administrativa (Sumulas 346 e 473 STF) permite a Adm.:`,o:[`A) Julgar acoes`,`B) Anular seus atos ilegais e revogar os inconvenientes, sem o Judiciario`,`C) Criar tributos`,`D) Legislar`,`E) Punir terceiros sem processo`],g:`B`,c:`Autotutela: a Adm. pode ANULAR atos ilegais e REVOGAR atos inconvenientes/inoportunos, respeitados direitos adquiridos e o devido processo (Sumulas 346 e 473 STF).`},{a:2023,r:`FCC/TCE-2023`,q:`O poder discricionario submete-se a controle judicial quanto a:`,o:[`A) Conveniencia e oportunidade (merito)`,`B) Legalidade, razoabilidade e proporcionalidade`,`C) Nada`,`D) So a forma`,`E) So o motivo`],g:`B`,c:`O Judiciario controla a LEGALIDADE do ato discricionario (inclusive razoabilidade/proporcionalidade), mas NAO substitui o MERITO (conveniencia/oportunidade) do administrador.`},{a:2022,r:`FCC/PGE-2022`,q:`A teoria dos motivos determinantes estabelece que:`,o:[`A) O motivo e irrelevante`,`B) Os motivos declarados vinculam o ato; se falsos/inexistentes, ele e invalido`,`C) So o objeto importa`,`D) A forma e livre`,`E) A competencia e delegavel sempre`],g:`B`,c:`Teoria dos motivos determinantes: a validade do ato fica vinculada aos motivos que o fundamentaram; se inexistentes ou falsos, o ato e nulo.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A delegacao de competencia administrativa:`,o:[`A) E sempre proibida`,`B) E possivel, salvo competencia exclusiva, decisao de recurso e edicao de ato normativo`,`C) Transfere a titularidade`,`D) Independe de publicacao`,`E) E irrevogavel`],g:`B`,c:`Lei 9.784/99: a delegacao e admitida, salvo: competencia exclusiva, decisao de recursos administrativos e edicao de atos normativos. E revogavel e exige publicacao.`},{a:2023,r:`FCC/TCE-2023`,q:`O servico publico prestado sob regime de concessao:`,o:[`A) Dispensa licitacao`,`B) Exige licitacao e e remunerado por tarifa do usuario`,`C) E gratuito sempre`,`D) Nao admite reajuste`,`E) E executado direto pela Adm.`],g:`B`,c:`Concessao (Lei 8.987/95): delegacao mediante LICITACAO (concorrencia), por conta e risco do concessionario, remunerada por TARIFA, preservado o equilibrio economico-financeiro.`}],"DCI-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`A SV 24 do STF estabelece que crime material contra a ordem tributaria:`,o:[`A) Independe de lancamento`,`B) So se tipifica apos o lancamento definitivo do tributo`,`C) Prescreve em 3 anos`,`D) Inclui o mero inadimplemento`,`E) E acao penal privada`],g:`B`,c:`SV 24: nao se tipifica crime material (art. 1, I-IV, Lei 8.137/90) antes do lancamento DEFINITIVO do tributo.`},{a:2022,r:`FCC/TRF-2022`,q:`A lavagem de dinheiro (Lei 9.613/98) ocorre quando:`,o:[`A) Ha evasao acima de 5 milhoes`,`B) Bens de infracao penal sao ocultados/dissimulados`,`C) Empresa nao recolhe contribuicao`,`D) Funcionario aceita propina`,`E) Ha exportacao ficticia`],g:`B`,c:`Lavagem: ocultar/dissimular origem de bens de INFRACAO PENAL. Modelo all crimes (Lei 12.683/2012). 3 fases: colocacao, dissimulacao, integracao.`},{a:2021,r:`FCC/PGE-2021`,q:`A Lei Anticorrupcao (12.846/2013) responsabiliza:`,o:[`A) So pessoas fisicas`,`B) Pessoas juridicas objetivamente por atos contra a Adm. nacional e estrangeira`,`C) So servidores`,`D) PJ so se condenada criminalmente`,`E) So transnacionais`],g:`B`,c:`Lei 12.846/2013: responsabilidade OBJETIVA das PJ por atos lesivos a Adm. Publica nacional ou estrangeira. Acordo de leniencia reduz sancoes.`},{a:2020,r:`FCC/ISS-2020`,q:`No Direito Civil, a PRESCRICAO extingue:`,o:[`A) O direito material em si`,`B) A pretensao (direito de exigir judicialmente)`,`C) O negocio juridico`,`D) Contratos a termo`,`E) O direito potestativo`],g:`B`,c:`PRESCRICAO: extingue a PRETENSAO (acao). O direito subjetivo persiste. DECADENCIA: extingue o proprio direito potestativo.`},{a:2019,r:`FCC/TRT-2019`,q:`O crime FORMAL caracteriza-se por:`,o:[`A) Exigir resultado naturalistico`,`B) Consumar-se com a conduta, independente do resultado`,`C) So por funcionario publico`,`D) Exigir dois agentes`,`E) Depender de condicao objetiva`],g:`B`,c:`Crime FORMAL: consuma-se com a CONDUTA, o resultado e mero exaurimento. MATERIAL exige resultado; mera conduta nao preve resultado.`},{a:2023,r:`FCC/TRT-2023`,q:`O art. 2 da Lei 8.137/90 (crimes formais) inclui:`,o:[`A) Omitir informacao as autoridades`,`B) Falta de recolhimento de tributo descontado de terceiros`,`C) Fraudar a fiscalizacao`,`D) Negar nota fiscal`,`E) Alterar documento`],g:`B`,c:`Art. 2 (formais): ex. deixar de recolher tributo descontado/cobrado de terceiros. Consuma com a conduta, sem exigir lancamento definitivo.`},{a:2022,r:`FCC/TCE-2022`,q:`A DECADENCIA, no Direito Civil:`,o:[`A) Pode ser renunciada quando legal`,`B) Extingue o direito potestativo e, sendo legal, e irrenunciavel`,`C) Sempre se interrompe`,`D) So atinge a pretensao`,`E) Depende de acao judicial`],g:`B`,c:`DECADENCIA legal: extingue o DIREITO potestativo, e IRRENUNCIAVEL e pode ser reconhecida de oficio.`},{a:2021,r:`FCC/PGE-2021`,q:`No crime organizado (Lei 12.850/2013), a organizacao exige:`,o:[`A) 2 pessoas`,`B) 4 ou mais pessoas com estrutura ordenada e divisao de tarefas`,`C) 10 pessoas`,`D) Vinculo familiar`,`E) Apenas crimes tributarios`],g:`B`,c:`Lei 12.850/2013: organizacao criminosa = 4+ pessoas, estrutura ordenada, divisao de tarefas, vantagem ilicita. Colaboracao premiada e instrumento.`},{a:2020,r:`FCC/ISS-2020`,q:`No negocio juridico, o plano da VALIDADE exige:`,o:[`A) Apenas manifestacao de vontade`,`B) Agente capaz, objeto licito/possivel e forma prescrita ou nao defesa em lei`,`C) Registro em cartorio`,`D) Eficacia imediata`,`E) Ausencia de condicao`],g:`B`,c:`Validade (art. 104 CC): agente capaz + objeto licito, possivel, determinado + forma prescrita ou nao defesa em lei.`},{a:2019,r:`FCC/TRF-2019`,q:`O peculato (crime contra a Adm. Publica) e praticado por:`,o:[`A) Qualquer particular`,`B) Funcionario publico que se apropria de bem de que tem posse em razao do cargo`,`C) So por agentes politicos`,`D) Empresas`,`E) So em licitacoes`],g:`B`,c:`PECULATO: funcionario publico apropria-se de dinheiro/bem de que tem posse em razao do cargo (crime proprio).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No crime de excesso de exacao (art. 316, par.1 CP), o funcionario:`,o:[`A) Deixa de cobrar tributo`,`B) Exige tributo que sabe indevido ou cobra de modo vexatorio`,`C) Apropria-se de verba`,`D) Falsifica documento`,`E) Frauda licitacao`],g:`B`,c:`Excesso de exacao: o funcionario exige tributo/contribuicao que sabe indevido, ou, devido, emprega meio vexatorio/gravoso nao autorizado em lei.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A Sumula Vinculante 24 NAO se aplica aos crimes:`,o:[`A) Materiais do art. 1, I a IV da Lei 8.137/90`,`B) Formais (art. 2), que independem do lancamento definitivo`,`C) De sonegacao`,`D) De supressao de tributo`,`E) Contra a ordem tributaria em geral`],g:`B`,c:`SV 24 condiciona ao lancamento definitivo apenas os crimes MATERIAIS (art. 1, I-IV). Os FORMAIS (art. 2) consumam-se com a conduta, independentemente do lancamento.`},{a:2022,r:`FCC/PGE-2022`,q:`Na lavagem de dinheiro, a fase de 'ocultacao' (layering) busca:`,o:[`A) Inserir o dinheiro no sistema`,`B) Distanciar os recursos da origem por meio de varias transacoes`,`C) Reintegrar o dinheiro a economia`,`D) Pagar tributos`,`E) Declarar a renda`],g:`B`,c:`Lavagem em 3 fases: COLOCACAO (introducao), OCULTACAO/layering (varias operacoes para esconder a origem) e INTEGRACAO (retorno aparentemente licito).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O peculato culposo (art. 312, par.2 CP):`,o:[`A) Nunca admite reparacao`,`B) Extingue a punibilidade se o dano for reparado antes da sentenca irrecorrivel`,`C) E inafiancavel`,`D) Independe de culpa`,`E) So ocorre com dolo`],g:`B`,c:`Peculato culposo: se a reparacao do dano ocorre ANTES da sentenca irrecorrivel, extingue-se a punibilidade; se posterior, reduz a pena pela metade.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Corrupcao passiva (art. 317 CP) consuma-se quando o funcionario:`,o:[`A) Pratica o ato de oficio`,`B) Solicita ou recebe vantagem indevida, ou aceita promessa`,`C) Apenas pensa em receber`,`D) Comunica o superior`,`E) Recusa a propina`],g:`B`,c:`Corrupcao passiva consuma-se com SOLICITAR, RECEBER ou ACEITAR PROMESSA de vantagem indevida em razao da funcao, mesmo sem praticar o ato.`},{a:2022,r:`FCC/PGE-2022`,q:`A prescricao penal, em regra, comeca a correr:`,o:[`A) Da denuncia`,`B) Do dia em que o crime se consumou`,`C) Da sentenca`,`D) Do inquerito`,`E) Do transito em julgado`],g:`B`,c:`Art. 111 CP: a prescricao da pretensao punitiva, em regra, comeca a correr do dia da CONSUMACAO do crime (ou cessacao, nos permanentes).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No Direito Civil, a fraude contra credores e:`,o:[`A) Um ato nulo`,`B) Um vicio social que torna o negocio anulavel`,`C) Erro`,`D) Coacao fisica`,`E) Simulacao`],g:`B`,c:`Fraude contra credores: vicio SOCIAL do negocio juridico (devedor insolvente dilapida patrimonio em prejuizo do credor); o negocio e ANULAVEL (acao pauliana).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O contrabando difere do descaminho porque o contrabando envolve:`,o:[`A) Tributos nao pagos`,`B) Mercadoria proibida (ilicita)`,`C) Importacao regular`,`D) Exportacao isenta`,`E) Apenas multa`],g:`B`,c:`DESCAMINHO (art. 334): elidir tributo de mercadoria PERMITIDA. CONTRABANDO (art. 334-A): importar/exportar mercadoria PROIBIDA.`}],"DFI-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`O limite de despesa com pessoal para os ESTADOS (LRF) e:`,o:[`A) 50% da RCL; Executivo 40,9%`,`B) 60% da RCL; Executivo 49%`,`C) 60% da RCL; Executivo 54%`,`D) 65%; Executivo 49%`,`E) 60%; Executivo 45%`],g:`B`,c:`Estados=60% da RCL, Executivo=49% (Leg+TC 3%, Jud 6%, MP 2%). Uniao=50/40,9. Municipios=60/54.`},{a:2022,r:`FCC/TCE-2022`,q:`A limitacao de empenho (art. 9 LRF) e acionada:`,o:[`A) No inicio do exercicio`,`B) Bimestralmente, quando a receita nao comporta as metas de resultado primario`,`C) So por lei`,`D) Em qualquer despesa`,`E) Pelo TCU`],g:`B`,c:`Art. 9: bimestralmente, se a receita nao comportar as metas fiscais -> contingenciamento. Nao atinge despesas constitucionalmente obrigatorias.`},{a:2021,r:`FCC/SEFAZ-2021`,q:`O Resultado Primario e:`,o:[`A) Receitas totais - despesas totais`,`B) Receitas nao financeiras - despesas nao financeiras (sem juros)`,`C) Resultado nominal + correcao`,`D) Receita tributaria - pessoal`,`E) Superavit / PIB`],g:`B`,c:`PRIMARIO: receitas nao financeiras - despesas nao financeiras (exclui juros). Mede o esforco fiscal. NOMINAL=primario - juros.`},{a:2020,r:`FCC/TRT-2020`,q:`O limite PRUDENCIAL de despesa com pessoal corresponde a:`,o:[`A) 90% do limite`,`B) 95% do limite legal`,`C) 100%`,`D) 50%`,`E) 60% da RCL`],g:`B`,c:`Limite prudencial=95% do limite legal. Atingido, vedam-se aumentos, criacao de cargos, horas extras (medidas preventivas).`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O RGF (Relatorio de Gestao Fiscal) e publicado:`,o:[`A) Mensalmente`,`B) Bimestralmente`,`C) Quadrimestralmente`,`D) Anualmente`,`E) Semestralmente`],g:`C`,c:`RGF=QUADRIMESTRAL. RREO (Relatorio Resumido de Execucao Orcamentaria)=BIMESTRAL.`},{a:2023,r:`FCC/TRT-2023`,q:`O art. 42 da LRF veda, nos 2 ultimos quadrimestres do mandato:`,o:[`A) Pagar servidores`,`B) Contrair obrigacao de despesa sem disponibilidade de caixa`,`C) Realizar licitacoes`,`D) Arrecadar tributos`,`E) Editar a LDO`],g:`B`,c:`Art. 42: vedado contrair, nos 2 ultimos quadrimestres, obrigacao de despesa que nao possa ser paga no mandato sem disponibilidade de caixa.`},{a:2022,r:`FCC/TCE-2022`,q:`O Resultado NOMINAL difere do PRIMARIO porque:`,o:[`A) Inclui os juros nominais da divida`,`B) Exclui as receitas`,`C) So considera o PIB`,`D) Ignora as despesas`,`E) E sempre positivo`],g:`A`,c:`NOMINAL=Primario - Juros nominais. Mede a variacao total da divida. Pode haver superavit primario e deficit nominal.`},{a:2021,r:`FCC/SEFAZ-2021`,q:`A regra de ouro (CF/LRF) veda:`,o:[`A) Qualquer endividamento`,`B) Operacoes de credito que superem as despesas de capital`,`C) Pagar juros`,`D) Investir`,`E) Arrecadar acima da meta`],g:`B`,c:`Regra de ouro (art. 167, III CF): veda operacoes de credito que excedam as despesas de capital (evita financiar custeio com divida).`},{a:2020,r:`FCC/TRT-2020`,q:`A RCL (Receita Corrente Liquida) e a base para:`,o:[`A) Calcular o PIB`,`B) Os limites de pessoal e divida na LRF`,`C) A inflacao`,`D) O cambio`,`E) A taxa Selic`],g:`B`,c:`RCL=base de calculo dos limites da LRF (pessoal, divida, garantias). Soma das receitas correntes com deducoes legais.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`A ARO (operacao de credito por antecipacao de receita):`,o:[`A) E proibida`,`B) Destina-se a atender insuficiencia de caixa e deve ser quitada ate 10/12`,`C) Nao tem prazo`,`D) E permanente`,`E) Independe de autorizacao`],g:`B`,c:`ARO: cobre insuficiencia de caixa no exercicio, liquidada ate 10 de dezembro. Vedada no ultimo ano de mandato.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na LRF, despesa obrigatoria de carater continuado (DOCC) e a que:`,o:[`A) Dura menos de 1 ano`,`B) Fixa obrigacao legal de execucao por periodo superior a 2 exercicios`,`C) E facultativa`,`D) E de capital`,`E) Nao tem fonte`],g:`B`,c:`Art. 17 LRF: DOCC = despesa corrente derivada de lei/ato que fixe obrigacao por mais de 2 exercicios; exige estimativa de impacto e compensacao.`},{a:2023,r:`FCC/TCE-2023`,q:`A Receita Corrente Liquida (RCL) e apurada somando as receitas dos:`,o:[`A) Ultimos 6 meses`,`B) Mes de referencia e os 11 anteriores (12 meses)`,`C) Ano civil`,`D) Mandato`,`E) Quadrimestre`],g:`B`,c:`RCL = somatorio das receitas correntes do mes de referencia + os 11 meses anteriores, com as deducoes legais (periodo movel de 12 meses).`},{a:2022,r:`FCC/PGE-2022`,q:`Atingido o limite de despesa com pessoal, se nao houver reconducao em 2 quadrimestres:`,o:[`A) Nada ocorre`,`B) Aplicam-se vedacoes como suspensao de transferencias voluntarias e contratacao de operacoes de credito`,`C) O ente e extinto`,`D) Aumenta-se a RCL`,`E) Suspende-se a LOA`],g:`B`,c:`Ultrapassado o limite e nao recomposto nos 2 quadrimestres seguintes, ha vedacoes: transferencias voluntarias, operacoes de credito (salvo refinanciamento) e garantias.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O Anexo de Metas Fiscais integra a:`,o:[`A) LOA`,`B) LDO`,`C) PPA`,`D) CF`,`E) Lei de crimes fiscais`],g:`B`,c:`O Anexo de Metas Fiscais (receitas, despesas, resultados nominal e primario, divida) integra a LDO (art. 4, par.1 LRF).`},{a:2023,r:`FCC/TCE-2023`,q:`A 'regra de ouro' constitucional veda:`,o:[`A) Deficit primario`,`B) Operacoes de credito que excedam as despesas de capital`,`C) Superavit nominal`,`D) Endividamento externo`,`E) Pagamento de juros`],g:`B`,c:`Art. 167, III CF (regra de ouro): proibe operacoes de credito que superem as despesas de capital, salvo creditos suplementares/especiais autorizados por maioria absoluta.`},{a:2022,r:`FCC/PGE-2022`,q:`A reserva de contingencia na LOA destina-se a:`,o:[`A) Pagar pessoal`,`B) Atender passivos contingentes e riscos/eventos fiscais imprevistos`,`C) Investimentos`,`D) Amortizar divida`,`E) Distribuir a estados`],g:`B`,c:`Reserva de contingencia (art. 5, III LRF): definida na LOA com base na RCL, para passivos contingentes e outros riscos/eventos fiscais imprevistos.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A transferencia voluntaria, segundo a LRF, exige do ente recebedor:`,o:[`A) Apenas o pedido`,`B) Comprovacao de regularidade (tributos, contas, limites) e contrapartida`,`C) Nada`,`D) Autorizacao do TCU`,`E) Operacao de credito`],g:`B`,c:`Art. 25 LRF: transferencia voluntaria exige do beneficiario regularidade fiscal/previdenciaria, observancia dos limites e previsao de contrapartida no orcamento.`},{a:2023,r:`FCC/TCE-2023`,q:`O resultado primario superavitario contribui para:`,o:[`A) Aumentar a divida`,`B) Reduzir a necessidade de financiamento e estabilizar/abater a divida`,`C) Elevar os juros`,`D) Reduzir a RCL`,`E) Aumentar o deficit nominal sempre`],g:`B`,c:`Superavit primario reduz a necessidade de novo endividamento e ajuda a abater a divida; se superar os juros, a divida liquida cai.`}],"DFI-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Os estagios da DESPESA (Lei 4.320) sao:`,o:[`A) Previsao, lancamento, arrecadacao, recolhimento`,`B) Fixacao, empenho, liquidacao, pagamento`,`C) Programacao, reserva, empenho, quitacao`,`D) Dotacao, contingenciamento, empenho`,`E) Orcamentacao, cobranca, recebimento`],g:`B`,c:`Despesa: FIXACAO, EMPENHO (art. 58), LIQUIDACAO (art. 63), PAGAMENTO (art. 64).`},{a:2022,r:`FCC/TCE-2022`,q:`Creditos EXTRAORDINARIOS sao abertos:`,o:[`A) Por lei especifica`,`B) Por decreto do Executivo para despesas urgentes e improvistos, sem fonte previa`,`C) So com autorizacao legislativa previa`,`D) Para reforcar dotacoes`,`E) Com indicacao de fonte obrigatoria`],g:`B`,c:`EXTRAORDINARIOS: urgentes/improvistos (guerra, calamidade) -> decreto do Executivo, comunicacao posterior, SEM indicacao previa de fonte.`},{a:2021,r:`FCC/PGE-2021`,q:`A LDO tem por finalidade:`,o:[`A) Autorizar despesas do exercicio`,`B) Orientar a elaboracao da LOA, metas e riscos fiscais`,`C) Detalhar o PPA`,`D) Criar fundos`,`E) Estabelecer prioridades sem conteudo fiscal`],g:`B`,c:`LDO: orienta a LOA, fixa metas fiscais (anexo de metas) e riscos fiscais, criterios de limitacao de empenho. PPA=longo prazo; LOA=autoriza despesas.`},{a:2020,r:`FCC/TRT-2020`,q:`O principio orcamentario da UNIVERSALIDADE exige que:`,o:[`A) O orcamento dure 1 ano`,`B) Todas as receitas e despesas constem do orcamento`,`C) Haja um unico orcamento`,`D) Valores liquidos`,`E) Especificacao detalhada`],g:`B`,c:`UNIVERSALIDADE: o orcamento deve conter TODAS as receitas e despesas. ANUALIDADE=1 ano; UNIDADE=orcamento unico.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`Creditos SUPLEMENTARES destinam-se a:`,o:[`A) Novas dotacoes`,`B) Reforco de dotacao orcamentaria existente`,`C) Despesas urgentes`,`D) Calamidade`,`E) Guerra`],g:`B`,c:`SUPLEMENTARES: reforco de dotacao JA existente (a LOA pode ja autorizar). ESPECIAIS: novas dotacoes. EXTRAORDINARIOS: urgentes.`},{a:2023,r:`FCC/TRT-2023`,q:`O EMPENHO da despesa (art. 58):`,o:[`A) Verifica o direito do credor`,`B) Cria para o Estado obrigacao de pagamento`,`C) Entrega o recurso ao credor`,`D) Fixa a dotacao`,`E) Arrecada a receita`],g:`B`,c:`EMPENHO: ato que cria para o Estado obrigacao de pagamento. LIQUIDACAO verifica o direito; PAGAMENTO entrega o recurso.`},{a:2022,r:`FCC/TCE-2022`,q:`Sao receitas de CAPITAL:`,o:[`A) Receita tributaria`,`B) Operacoes de credito, alienacao de bens, transferencias de capital`,`C) Receita patrimonial`,`D) Receita de servicos`,`E) Contribuicoes`],g:`B`,c:`Receitas de CAPITAL: operacoes de credito, alienacao de bens, amortizacao de emprestimos, transferencias de capital. Tributaria=corrente.`},{a:2021,r:`FCC/PGE-2021`,q:`O principio da EXCLUSIVIDADE orcamentaria significa que:`,o:[`A) Ha um unico orcamento`,`B) A LOA nao contem materia estranha a fixacao da despesa e previsao da receita`,`C) O orcamento e anual`,`D) Valores brutos`,`E) Receita vinculada`],g:`B`,c:`EXCLUSIVIDADE: a LOA so trata de receita e despesa (excecao: autorizacao de credito suplementar e operacoes de credito/ARO).`},{a:2020,r:`FCC/TRT-2020`,q:`A LIQUIDACAO da despesa (art. 63) consiste em:`,o:[`A) Criar a obrigacao`,`B) Verificar o direito do credor com base nos titulos e documentos`,`C) Pagar ao credor`,`D) Fixar dotacao`,`E) Empenhar`],g:`B`,c:`LIQUIDACAO: verificacao do direito do credor (apuracao da origem, importancia e a quem pagar), com base em documentos comprobatorios.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O PPA (Plano Plurianual) tem vigencia de:`,o:[`A) 1 ano`,`B) 2 anos`,`C) 4 anos`,`D) 5 anos`,`E) 8 anos`],g:`C`,c:`PPA: 4 anos (do 2o ano de um mandato ao 1o do mandato seguinte). Estabelece diretrizes, objetivos e metas regionalizadas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O credito ESPECIAL destina-se a:`,o:[`A) Reforcar dotacao existente`,`B) Despesas para as quais nao haja dotacao orcamentaria especifica`,`C) Guerra e calamidade`,`D) Pagar pessoal`,`E) Amortizar divida`],g:`B`,c:`Credito ESPECIAL: para despesas sem dotacao especifica (cria nova rubrica), depende de autorizacao legislativa e indicacao de fonte.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O principio da NAO AFETACAO da receita de impostos veda:`,o:[`A) Cobrar impostos`,`B) Vincular receita de impostos a orgao, fundo ou despesa, salvo excecoes constitucionais`,`C) Arrecadar taxas`,`D) Criar fundos`,`E) Transferir a estados`],g:`B`,c:`Art. 167, IV CF: veda a vinculacao de receita de IMPOSTOS, salvo excecoes (saude, educacao, FPE/FPM, garantias a Uniao etc.). Taxas e contribuicoes podem ser vinculadas.`},{a:2022,r:`FCC/PGE-2022`,q:`O orcamento-programa caracteriza-se por:`,o:[`A) Listar so despesas por objeto`,`B) Vincular recursos a programas, objetivos e metas (enfase em resultados)`,`C) Ser anual apenas`,`D) Nao ter planejamento`,`E) Ser incremental`],g:`B`,c:`Orcamento-PROGRAMA: organiza os gastos por programas/acoes com objetivos e metas, integrando planejamento e orcamento (base do PPA-LDO-LOA brasileiro).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A vedacao do estorno de verbas (art. 167, VI CF) impede:`,o:[`A) Empenhar despesas`,`B) Transpor, remanejar ou transferir recursos de uma categoria para outra sem autorizacao legislativa`,`C) Arrecadar`,`D) Pagar credores`,`E) Abrir creditos extraordinarios`],g:`B`,c:`Art. 167, VI: veda a transposicao, remanejamento ou transferencia de recursos de uma categoria de programacao para outra SEM previa autorizacao legislativa.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O ciclo orcamentario compreende as fases de:`,o:[`A) So execucao`,`B) Elaboracao, aprovacao (apreciacao legislativa), execucao e controle/avaliacao`,`C) Apenas planejamento`,`D) So controle`,`E) Empenho e pagamento`],g:`B`,c:`Ciclo orcamentario: ELABORACAO (Executivo) -> APRECIACAO/APROVACAO (Legislativo) -> EXECUCAO -> CONTROLE e avaliacao.`},{a:2022,r:`FCC/PGE-2022`,q:`As transferencias constitucionais (FPE, FPM) sao:`,o:[`A) Voluntarias`,`B) Obrigatorias, decorrentes de mandamento constitucional`,`C) Facultativas`,`D) Convenios`,`E) Operacoes de credito`],g:`B`,c:`FPE/FPM e demais repartições de receitas sao transferencias OBRIGATORIAS (constitucionais), distintas das transferencias VOLUNTARIAS (convenios).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O principio do EQUILIBRIO orcamentario preconiza:`,o:[`A) Mais despesa que receita`,`B) Equivalencia entre receitas e despesas previstas`,`C) Superavit obrigatorio`,`D) Deficit permanente`,`E) Ausencia de planejamento`],g:`B`,c:`Principio do EQUILIBRIO: as despesas fixadas devem guardar equivalencia com as receitas previstas, reforcado pela LRF (gestao fiscal responsavel).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A despesa de capital denominada 'inversao financeira' inclui:`,o:[`A) Pagamento de pessoal`,`B) Aquisicao de imoveis ja em uso ou de titulos representativos de capital`,`C) Juros da divida`,`D) Material de consumo`,`E) Diarias`],g:`B`,c:`INVERSOES FINANCEIRAS: aquisicao de imoveis/bens ja em utilizacao, de participacoes acionarias, concessao de emprestimos. Diferente de INVESTIMENTOS (bens novos).`}],"CGP-1":[{a:2023,r:`FCC/TCE-2023`,q:`Os estagios da RECEITA orcamentaria (MCASP) sao:`,o:[`A) Empenho, liquidacao, pagamento, recolhimento`,`B) Previsao, lancamento, arrecadacao, recolhimento`,`C) Fixacao, empenho, arrecadacao`,`D) Programacao, reserva, movimentacao`,`E) Orcamentacao, cobranca, deposito`],g:`B`,c:`Receita: PREVISAO (LOA), LANCAMENTO (art. 53), ARRECADACAO (banco), RECOLHIMENTO (Tesouro/conta unica).`},{a:2022,r:`FCC/TCE-2022`,q:`Os Restos a Pagar PROCESSADOS sao aqueles com:`,o:[`A) Apenas empenho`,`B) Empenho e liquidacao realizados (direito verificado)`,`C) Pagamento efetuado`,`D) So dotacao`,`E) Liquidacao cancelada`],g:`B`,c:`RP PROCESSADOS: empenho + liquidacao feitos -> Estado deve pagar. NAO PROCESSADOS: so empenho (liquidacao pendente).`},{a:2021,r:`FCC/PGE-2021`,q:`As caracteristicas qualitativas FUNDAMENTAIS (NBC TSP) sao:`,o:[`A) Comparabilidade e verificabilidade`,`B) Relevancia e representacao fidedigna`,`C) Tempestividade e compreensibilidade`,`D) Objetividade e consistencia`,`E) Neutralidade e prudencia`],g:`B`,c:`FUNDAMENTAIS: relevancia + representacao fidedigna. DE MELHORIA: comparabilidade, verificabilidade, tempestividade, compreensibilidade.`},{a:2020,r:`FCC/TCM-2020`,q:`No PCASP, a classe que registra Variacoes Patrimoniais Diminutivas (VPD) e:`,o:[`A) Classe 1 (Ativo)`,`B) Classe 3 (VPD)`,`C) Classe 4 (VPA)`,`D) Classe 2 (Passivo)`,`E) Classe 5`],g:`B`,c:`PCASP: 1-Ativo, 2-Passivo, 3-VPD (diminutivas), 4-VPA (aumentativas), 5/6-controles, 7/8-especificos.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O EMPENHO ESTIMATIVO e utilizado quando:`,o:[`A) O valor e exato`,`B) Nao se conhece previamente o valor exato (ex: agua, energia)`,`C) E contrato parcelado`,`D) Ha calamidade`,`E) E despesa de capital`],g:`B`,c:`EMPENHO ESTIMATIVO: valor nao exatamente determinado (servicos continuados como agua/energia). ORDINARIO=valor certo; GLOBAL=parcelado.`},{a:2023,r:`FCC/TRT-2023`,q:`A Demonstracao das Variacoes Patrimoniais (DVP) evidencia:`,o:[`A) Apenas o orcamento`,`B) As variacoes quantitativas e qualitativas do patrimonio`,`C) Os restos a pagar`,`D) A divida ativa`,`E) O fluxo de caixa`],g:`B`,c:`DVP: variacoes patrimoniais aumentativas (VPA) e diminutivas (VPD), apurando o resultado patrimonial do periodo.`},{a:2022,r:`FCC/TCE-2022`,q:`O regime contabil adotado para a RECEITA no setor publico (Lei 4.320) e:`,o:[`A) Competencia integral`,`B) Caixa para a receita`,`C) Competencia para receita e despesa`,`D) Misto invertido`,`E) So competencia para despesa`],g:`B`,c:`Lei 4.320: regime de CAIXA para a receita (reconhecida na arrecadacao) e COMPETENCIA para a despesa (empenhada). MCASP avanca para competencia patrimonial.`},{a:2021,r:`FCC/PGE-2021`,q:`O RECOLHIMENTO, ultimo estagio da receita, consiste em:`,o:[`A) Prever na LOA`,`B) Entregar os valores arrecadados ao Tesouro (conta unica)`,`C) Lancar o credito`,`D) Pagar o credor`,`E) Empenhar`],g:`B`,c:`RECOLHIMENTO: transferencia dos valores arrecadados pelos agentes para a conta unica do Tesouro (principio da unidade de tesouraria).`},{a:2020,r:`FCC/TCM-2020`,q:`Os Restos a Pagar sao inscritos em:`,o:[`A) 1 de janeiro`,`B) 31 de dezembro (despesas empenhadas e nao pagas)`,`C) 30 de junho`,`D) Qualquer data`,`E) Inicio do mandato`],g:`B`,c:`RP: despesas empenhadas e nao pagas ate 31/12. Processados (liquidados) e nao processados (so empenhados).`},{a:2019,r:`FCC/SEFAZ-2019`,q:`A NBC TSP 01 trata de:`,o:[`A) Estoques`,`B) Apresentacao das demonstracoes contabeis`,`C) Receita de tributos`,`D) Ativo imobilizado`,`E) Provisoes`],g:`B`,c:`NBC TSP 01: apresentacao das demonstracoes contabeis (equivale a IPSAS 1): BP, DVP, DFC, DMPL e notas explicativas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No regime orcamentario da Lei 4.320, pertencem ao exercicio financeiro:`,o:[`A) As receitas arrecadadas e as despesas legalmente empenhadas`,`B) So o que foi pago`,`C) Apenas a previsao`,`D) Receitas e despesas de competencia`,`E) Somente os restos a pagar`],g:`A`,c:`Art. 35 Lei 4.320: pertencem ao exercicio as RECEITAS nele arrecadadas (caixa) e as DESPESAS nele legalmente EMPENHADAS (compromisso).`},{a:2023,r:`FCC/TCE-2023`,q:`A divida ativa tributaria e inscrita apos:`,o:[`A) O fato gerador`,`B) Esgotado o prazo de pagamento e apurada a liquidez e certeza do credito`,`C) O empenho`,`D) A previsao na LOA`,`E) O lancamento provisorio`],g:`B`,c:`A inscricao em divida ativa ocorre apos esgotado o prazo para pagamento, conferindo liquidez e certeza ao credito e gerando a CDA (titulo executivo).`},{a:2022,r:`FCC/TCM-2022`,q:`No PCASP, a conta 'Variacao Patrimonial Aumentativa' representa:`,o:[`A) Reducao do patrimonio`,`B) Aumento da situacao liquida (ex: receita de impostos)`,`C) Despesa orcamentaria`,`D) Passivo`,`E) Restos a pagar`],g:`B`,c:`VPA (classe 4): aumentos da situacao patrimonial liquida (impostos, contribuicoes, exploracao de bens) - regime de competencia patrimonial.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A despesa publica, quanto a categoria economica, divide-se em:`,o:[`A) Tributaria e patrimonial`,`B) Correntes e de capital`,`C) Ordinaria e extraordinaria`,`D) Fixa e variavel`,`E) Direta e indireta`],g:`B`,c:`Despesas: CORRENTES (custeio, pessoal, juros) e de CAPITAL (investimentos, inversoes financeiras, amortizacao da divida). Igual classificacao para receitas.`},{a:2023,r:`FCC/TCE-2023`,q:`O superavit financeiro apurado no Balanco Patrimonial:`,o:[`A) Nao pode ser usado`,`B) E fonte para abertura de creditos adicionais`,`C) E despesa`,`D) Compoe a divida`,`E) E receita tributaria`],g:`B`,c:`Art. 43 Lei 4.320: o superavit financeiro (ativo financeiro - passivo financeiro) e fonte para abertura de creditos suplementares e especiais.`},{a:2022,r:`FCC/TCM-2022`,q:`A natureza da receita orcamentaria por categoria economica inclui:`,o:[`A) Receitas correntes e de capital`,`B) Receitas fixas`,`C) Receitas extraordinarias`,`D) Receitas vinculadas apenas`,`E) Receitas diretas`],g:`A`,c:`Receitas: CORRENTES (tributaria, contribuicoes, patrimonial, servicos, transferencias correntes) e de CAPITAL (operacoes de credito, alienacao, transferencias de capital).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na contabilidade aplicada ao setor publico, o reconhecimento da despesa por competencia ocorre:`,o:[`A) No pagamento`,`B) Na liquidacao (fato gerador da VPD)`,`C) No empenho`,`D) Na previsao`,`E) Na inscricao em RP`],g:`B`,c:`Sob a otica patrimonial, a Variacao Patrimonial Diminutiva (despesa por competencia) e reconhecida na LIQUIDACAO, quando ocorre o fato gerador. O empenho e etapa orcamentaria.`},{a:2023,r:`FCC/TCE-2023`,q:`O Balanco Financeiro evidencia:`,o:[`A) Ativos e passivos`,`B) Receitas e despesas orcamentarias + recebimentos e pagamentos extraorcamentarios + saldos`,`C) So o resultado patrimonial`,`D) Apenas a divida ativa`,`E) As VPA e VPD`],g:`B`,c:`Balanco Financeiro (art. 103 Lei 4.320): receita e despesa orcamentarias, recebimentos e pagamentos extraorcamentarios, conjugados com os saldos de caixa inicial e final.`}],"CGP-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No metodo PEPS, o estoque final fica valorado a:`,o:[`A) Precos mais antigos`,`B) Precos mais recentes`,`C) Media das compras`,`D) Custo padrao`,`E) Valor de venda`],g:`B`,c:`PEPS (primeiro a entrar, primeiro a sair): saidas pelos precos antigos -> estoque final pelos precos mais RECENTES. Em inflacao, estoque final maior.`},{a:2022,r:`FCC/RS-2022`,q:`O CMV (Custo da Mercadoria Vendida) e calculado por:`,o:[`A) EI + Compras - EF`,`B) EF - EI`,`C) Compras - EI`,`D) EI + EF`,`E) Vendas - Compras`],g:`A`,c:`CMV = Estoque Inicial + Compras - Estoque Final.`},{a:2021,r:`FCC/ISS-2021`,q:`A DEPRECIACAO pelo metodo linear (linha reta):`,o:[`A) Cresce ao longo do tempo`,`B) E constante em cada periodo`,`C) Decresce`,`D) Depende da producao`,`E) E zero no 1o ano`],g:`B`,c:`Linha reta: cota de depreciacao CONSTANTE por periodo = (custo - valor residual)/vida util.`},{a:2020,r:`FCC/Adm-2020`,q:`Provisao (CPC 25) deve ser reconhecida quando:`,o:[`A) Ha possibilidade remota de saida`,`B) Ha obrigacao presente, saida provavel e estimativa confiavel`,`C) Apenas se houver acao judicial`,`D) Sempre que houver risco`,`E) So por exigencia fiscal`],g:`B`,c:`Provisao: obrigacao presente + saida provavel de recursos + estimativa confiavel. Passivo contingente possivel=notas; remoto=nada.`},{a:2019,r:`FCC/BA-2019`,q:`O Ativo Intangivel (CPC 04) caracteriza-se por:`,o:[`A) Ter substancia fisica`,`B) Ser identificavel, sem substancia fisica e controlado pela entidade`,`C) Ser sempre o goodwill`,`D) Nao gerar beneficios`,`E) Ser circulante`],g:`B`,c:`Intangivel: identificavel, sem substancia fisica, controlado, gera beneficios futuros. Goodwill gerado internamente NAO e reconhecido.`},{a:2023,r:`FCC/TRT-2023`,q:`O teste de IMPAIRMENT (CPC 01) reduz o ativo quando:`,o:[`A) O valor contabil e menor que o recuperavel`,`B) O valor contabil supera o valor recuperavel`,`C) Ha valorizacao`,`D) Ocorre venda`,`E) Sempre no fim do ano`],g:`B`,c:`Impairment: se valor contabil > valor recuperavel, reconhece-se perda por reducao ao valor recuperavel.`},{a:2022,r:`FCC/TCE-2022`,q:`A Media Ponderada Movel (MPM):`,o:[`A) Mantem o preco da 1a compra`,`B) Recalcula o custo medio a cada nova entrada`,`C) Usa o preco mais recente`,`D) Ignora as compras`,`E) E igual ao PEPS`],g:`B`,c:`MPM: recalcula o custo medio unitario A CADA ENTRADA de mercadoria. Suaviza variacoes de preco.`},{a:2021,r:`FCC/ISS-2021`,q:`A DRE apura:`,o:[`A) A posicao patrimonial`,`B) O resultado (lucro ou prejuizo) do periodo`,`C) Os fluxos de caixa`,`D) As mutacoes do PL`,`E) A riqueza distribuida`],g:`B`,c:`DRE: confronta receitas e despesas, apurando o RESULTADO (lucro/prejuizo). BP=posicao; DFC=caixa; DMPL=PL; DVA=riqueza.`},{a:2020,r:`FCC/Adm-2020`,q:`Os estoques sao mensurados pelo:`,o:[`A) Valor de venda`,`B) Menor valor entre custo e valor realizavel liquido`,`C) Custo de reposicao`,`D) Valor justo sempre`,`E) Valor presente`],g:`B`,c:`CPC 16: estoques pelo MENOR valor entre o custo e o valor realizavel liquido (VRL).`},{a:2019,r:`FCC/BA-2019`,q:`A Demonstracao do Valor Adicionado (DVA) evidencia:`,o:[`A) O lucro liquido apenas`,`B) A riqueza gerada pela entidade e sua distribuicao`,`C) Os fluxos de caixa`,`D) As provisoes`,`E) O ativo imobilizado`],g:`B`,c:`DVA: riqueza criada pela entidade e como foi distribuida (pessoal, governo, financiadores, socios). Obrigatoria para companhias abertas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Pelo regime de competencia, a receita e reconhecida:`,o:[`A) No recebimento`,`B) Quando ganha (transferido o controle do bem/servico), independente do recebimento`,`C) No pedido`,`D) Na emissao da proposta`,`E) No fim do ano`],g:`B`,c:`Regime de COMPETENCIA: a receita e reconhecida quando GANHA (controle transferido - CPC 47), e a despesa quando incorrida, independente do caixa.`},{a:2023,r:`FCC/RS-2023`,q:`Uma duplicata descontada no banco representa:`,o:[`A) Receita`,`B) Passivo (obrigacao), pois a empresa responde pelo titulo`,`C) Reducao do ativo permanente`,`D) Despesa antecipada`,`E) Patrimonio liquido`],g:`B`,c:`Duplicatas descontadas: o risco permanece com a empresa, sendo classificadas como PASSIVO (conta redutora de contas a receber / obrigacao com o banco).`},{a:2022,r:`FCC/ISS-2022`,q:`No Balanco Patrimonial, o Ativo e ordenado por:`,o:[`A) Ordem alfabetica`,`B) Grau decrescente de liquidez`,`C) Valor crescente`,`D) Data de aquisicao`,`E) Natureza juridica`],g:`B`,c:`O Ativo e apresentado em ordem DECRESCENTE de liquidez (Circulante antes do Nao Circulante). O Passivo, por ordem de exigibilidade.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A Reserva de Lucros a Realizar destina-se a:`,o:[`A) Distribuir dividendos`,`B) Reter parcela do lucro ainda nao financeiramente realizada`,`C) Cobrir prejuizos`,`D) Aumentar capital`,`E) Pagar tributos`],g:`B`,c:`Reserva de Lucros a Realizar: retem a parcela do lucro do exercicio decorrente de ganhos ainda nao realizados financeiramente (ex: equivalencia, vendas a prazo de LP).`},{a:2023,r:`FCC/RS-2023`,q:`O metodo de equivalencia patrimonial reconhece, no resultado:`,o:[`A) Dividendos recebidos`,`B) A participacao da investidora no resultado da investida`,`C) O valor de mercado`,`D) So o custo`,`E) O valor justo`],g:`B`,c:`MEP: a investidora reconhece em RESULTADO sua participacao no lucro/prejuizo da investida (nao os dividendos, que reduzem o investimento).`},{a:2022,r:`FCC/ISS-2022`,q:`Na DFC pelo metodo indireto, parte-se do:`,o:[`A) Caixa inicial`,`B) Lucro liquido, ajustado por itens que nao afetam o caixa`,`C) Total de receitas`,`D) Saldo de clientes`,`E) Patrimonio liquido`],g:`B`,c:`DFC indireto: parte do LUCRO LIQUIDO e ajusta por depreciacao, variacoes de capital de giro e itens nao-caixa, para chegar ao caixa das operacoes.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A despesa com depreciacao:`,o:[`A) Reduz o caixa`,`B) Reduz o resultado mas nao afeta o caixa diretamente`,`C) Aumenta o ativo`,`D) E uma receita`,`E) E um passivo`],g:`B`,c:`Depreciacao e despesa que NAO afeta o caixa (item nao-caixa). Por isso e somada de volta na DFC indireta.`},{a:2023,r:`FCC/RS-2023`,q:`O Capital Circulante Liquido (CCL) e:`,o:[`A) Ativo total - Passivo total`,`B) Ativo Circulante - Passivo Circulante`,`C) Patrimonio Liquido`,`D) Ativo Permanente`,`E) Receita - Despesa`],g:`B`,c:`CCL = Ativo Circulante - Passivo Circulante. Indica a folga financeira de curto prazo da entidade.`}],"COA-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No CPC 46, os dados de NIVEL 1 da hierarquia de valor justo sao:`,o:[`A) Dados nao observaveis`,`B) Premissas da entidade`,`C) Precos cotados em mercado ativo para ativos identicos`,`D) Ativos similares`,`E) Fluxo de caixa descontado`],g:`C`,c:`Nivel 1: precos cotados em mercado ATIVO para ativos IDENTICOS (maior confiabilidade). Nivel 3: nao observaveis (premissas internas).`},{a:2022,r:`FCC/RS-2022`,q:`No CPC 06 R2 (IFRS 16), o arrendatario reconhece:`,o:[`A) Apenas despesa linear`,`B) Ativo de direito de uso e passivo de arrendamento`,`C) Passivo contingente`,`D) Receita diferida`,`E) Apenas nas notas`],g:`B`,c:`CPC 06 R2: arrendatario reconhece ATIVO DE DIREITO DE USO + PASSIVO DE ARRENDAMENTO. Excecoes: <=12 meses e baixo valor.`},{a:2021,r:`FCC/ISS-2021`,q:`O GOODWILL positivo (CPC 15) ocorre quando:`,o:[`A) VJ liquido > contraprestacao`,`B) Contraprestacao+PNC+interesse previo > VJ liquido dos ativos/passivos`,`C) A adquirida tem prejuizo`,`D) Valor contabil > mercado`,`E) Ha marca famosa`],g:`B`,c:`Goodwill = (contraprestacao + PNC + interesse previo) - VJ liquido. Positivo=goodwill (intangivel, impairment anual); negativo=compra vantajosa (resultado).`},{a:2020,r:`FCC/Adm-2020`,q:`O MEP (CPC 18) aplica-se a:`,o:[`A) Qualquer investimento acima de 1%`,`B) Coligadas (influencia significativa >=20% votante) e controladas`,`C) So controladas >50% total`,`D) Ativos ao valor justo`,`E) Todas as listadas`],g:`B`,c:`MEP: coligadas (influencia significativa, presuncao >=20% do votante) e controladas. Atualiza o investimento pelo % do PL da investida.`},{a:2019,r:`FCC/BA-2019`,q:`A COMPRA VANTAJOSA (goodwill negativo) e reconhecida:`,o:[`A) No ativo intangivel`,`B) Como ganho no resultado do periodo`,`C) No PL diretamente`,`D) Como passivo`,`E) Amortizada em 10 anos`],g:`B`,c:`Goodwill NEGATIVO (compra vantajosa): ganho reconhecido no RESULTADO imediatamente (apos revisao das mensuracoes).`},{a:2023,r:`FCC/TRT-2023`,q:`No CPC 48 (IFRS 9), os instrumentos financeiros sao classificados em:`,o:[`A) So custo historico`,`B) Custo amortizado, valor justo por ORA e valor justo por resultado`,`C) Apenas valor de mercado`,`D) Valor nominal`,`E) So circulante e nao circulante`],g:`B`,c:`CPC 48: custo amortizado; valor justo por outros resultados abrangentes (ORA); valor justo por resultado (VJR). Modelo de perdas esperadas.`},{a:2022,r:`FCC/RS-2022`,q:`O Ajuste a Valor Presente (AVP) aplica-se a:`,o:[`A) Operacoes a vista`,`B) Ativos e passivos de longo prazo (e relevantes de curto prazo)`,`C) So o imobilizado`,`D) Apenas receitas`,`E) Estoques sempre`],g:`B`,c:`AVP: elementos de longo prazo (e relevantes de curto prazo) trazidos a valor presente, reconhecendo encargo financeiro pro rata.`},{a:2021,r:`FCC/ISS-2021`,q:`A hierarquia do valor justo busca:`,o:[`A) Minimizar disclosure`,`B) Maximizar o uso de dados observaveis e minimizar nao observaveis`,`C) Usar so premissas internas`,`D) Ignorar o mercado`,`E) Adotar custo historico`],g:`B`,c:`CPC 46: MAXIMIZAR dados observaveis (niveis 1 e 2) e minimizar dados nao observaveis (nivel 3).`},{a:2020,r:`FCC/Adm-2020`,q:`O goodwill reconhecido em combinacao de negocios:`,o:[`A) E amortizado em 5 anos`,`B) Nao e amortizado, mas testado por impairment anualmente`,`C) E baixado no resultado`,`D) Vai para o PL`,`E) E reavaliado a valor justo`],g:`B`,c:`Goodwill: NAO amortizado; submetido a teste de IMPAIRMENT anual (ou quando houver indicio de perda).`},{a:2019,r:`FCC/BA-2019`,q:`A subvencao governamental (CPC 07) deve ser:`,o:[`A) Reconhecida direto no PL`,`B) Reconhecida no resultado em base sistematica confrontada com as despesas`,`C) Ignorada`,`D) Tratada como passivo permanente`,`E) Distribuida como dividendo obrigatorio`],g:`B`,c:`CPC 07: subvencao reconhecida no resultado de forma sistematica, confrontada com as despesas que pretende compensar.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No CPC 47 (Receita de Contrato com Cliente), a receita e reconhecida quando:`,o:[`A) O caixa e recebido`,`B) A entidade satisfaz a obrigacao de desempenho (transfere o controle)`,`C) O contrato e assinado`,`D) A nota e emitida`,`E) No fim do periodo`],g:`B`,c:`CPC 47/IFRS 15: 5 passos; a receita e reconhecida quando (ou a medida que) a obrigacao de desempenho e satisfeita, com a transferencia do controle do bem/servico.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O custo de emprestimos (CPC 20) atribuivel a ativo qualificavel deve ser:`,o:[`A) Sempre despesa`,`B) Capitalizado como parte do custo do ativo`,`C) Reconhecido no PL`,`D) Ignorado`,`E) Levado a reserva`],g:`B`,c:`CPC 20: custos de emprestimos diretamente atribuiveis a aquisicao/construcao de ativo qualificavel sao CAPITALIZADOS; os demais sao despesa.`},{a:2022,r:`FCC/PGE-2022`,q:`No CPC 27, a reavaliacao de imobilizado (quando adotada):`,o:[`A) E vedada no Brasil`,`B) Permite mensurar pelo valor justo, com aumento em outros resultados abrangentes`,`C) Vai sempre ao resultado`,`D) Reduz o capital`,`E) Nao afeta a depreciacao`],g:`B`,c:`O modelo de reavaliacao (CPC 27) mensura pelo valor justo; o aumento vai a ORA (reserva de reavaliacao). No Brasil societario o uso e restrito, mas o conceito e cobrado.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No CPC 32 (Tributos sobre o Lucro), o imposto diferido surge de:`,o:[`A) Diferencas permanentes`,`B) Diferencas temporarias entre base contabil e fiscal`,`C) Multas fiscais`,`D) Subvencoes`,`E) Dividendos`],g:`B`,c:`CPC 32: o tributo diferido decorre de DIFERENCAS TEMPORARIAS (tributaveis -> passivo diferido; dedutiveis -> ativo diferido) e de prejuizos fiscais a compensar.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O valor recuperavel de um ativo (CPC 01) e o:`,o:[`A) Custo historico`,`B) Maior valor entre o valor justo liquido de despesas e o valor em uso`,`C) Valor contabil`,`D) Valor de mercado apenas`,`E) Custo de reposicao`],g:`B`,c:`CPC 01: valor recuperavel = MAIOR entre (valor justo - despesas de venda) e (valor em uso = VP dos fluxos futuros). Se contabil > recuperavel, ha impairment.`},{a:2022,r:`FCC/PGE-2022`,q:`No CPC 16, NAO integra o custo dos estoques:`,o:[`A) Custo de aquisicao`,`B) Custos de transformacao`,`C) Gastos gerais de administracao nao relacionados a producao`,`D) Fretes de compra`,`E) Impostos nao recuperaveis`],g:`C`,c:`CPC 16: despesas administrativas gerais e perdas anormais NAO integram o custo do estoque (vao a resultado). Integram: aquisicao, transformacao e outros para deixar pronto.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A mensuracao a valor justo prioriza, na hierarquia (CPC 46):`,o:[`A) Premissas internas`,`B) Precos cotados em mercado ativo (nivel 1)`,`C) Custo historico`,`D) Fluxo de caixa`,`E) Valor de reposicao`],g:`B`,c:`CPC 46: a hierarquia prioriza o Nivel 1 (precos cotados em mercado ativo para ativos identicos), depois Nivel 2 (observaveis) e por ultimo Nivel 3 (nao observaveis).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Provisao difere de passivo contingente porque a provisao:`,o:[`A) Nunca e reconhecida`,`B) E reconhecida no passivo (obrigacao presente provavel e mensuravel)`,`C) So vai em nota explicativa`,`D) E um ativo`,`E) Depende de acao judicial transitada`],g:`B`,c:`CPC 25: PROVISAO e passivo de prazo/valor incertos, reconhecida quando provavel e mensuravel. Passivo CONTINGENTE (possivel) so e divulgado em nota; remoto nao se divulga.`}],"COA-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`CF=400.000, PV=200, CV=120. O Ponto de Equilibrio Contabil e:`,o:[`A) 2.000 un`,`B) 3.333 un`,`C) 4.000 un`,`D) 5.000 un`,`E) 6.667 un`],g:`D`,c:`MC=200-120=80. PEC=CF/MC=400.000/80=5.000 unidades.`},{a:2022,r:`FCC/RS-2022`,q:`No custeio por ABSORCAO, os custos fixos sao:`,o:[`A) Tratados como despesa do periodo`,`B) Rateados aos produtos`,`C) Ignorados`,`D) Levados ao PL`,`E) Sempre variaveis`],g:`B`,c:`ABSORCAO: TODOS os custos (fixos+variaveis) sao alocados aos produtos. Exigido pelo fisco e societario.`},{a:2021,r:`FCC/ISS-2021`,q:`A Margem de Contribuicao unitaria e:`,o:[`A) PV - custo fixo unitario`,`B) Preco de venda - custo/despesa variavel unitario`,`C) PV - custo total`,`D) Custo fixo / quantidade`,`E) Lucro / PV`],g:`B`,c:`MC unitaria = Preco de Venda - Custos e Despesas Variaveis unitarios. Cobre os custos fixos e forma o lucro.`},{a:2020,r:`FCC/Adm-2020`,q:`O custeio VARIAVEL e mais adequado para:`,o:[`A) Atender o fisco`,`B) Decisoes gerenciais (nao rateia fixos aos produtos)`,`C) Avaliacao de estoques fiscal`,`D) Demonstracoes societarias`,`E) Auditoria externa`],g:`B`,c:`Custeio VARIAVEL: apenas custos variaveis no produto; fixos sao despesa do periodo. Melhor para DECISAO gerencial. Nao aceito pelo fisco.`},{a:2019,r:`FCC/BA-2019`,q:`O Ponto de Equilibrio FINANCEIRO:`,o:[`A) Inclui o custo de oportunidade`,`B) Exclui a depreciacao dos custos fixos`,`C) E igual ao contabil`,`D) Ignora a MC`,`E) E sempre maior que o economico`],g:`B`,c:`PEF = (CF - depreciacao)/MCu. Considera so as saidas de CAIXA. PEC inclui depreciacao; PEE soma custo de oportunidade.`},{a:2023,r:`FCC/TRT-2023`,q:`O custeio ABC (Activity-Based Costing) aloca custos indiretos por:`,o:[`A) Volume de producao apenas`,`B) Atividades e seus direcionadores de custo`,`C) Rateio simples`,`D) Mao de obra direta`,`E) Material direto`],g:`B`,c:`ABC: rastreia custos indiretos por ATIVIDADES e direcionadores (cost drivers), oferecendo maior precisao em ambientes diversificados.`},{a:2022,r:`FCC/RS-2022`,q:`Custo fixo unitario, com aumento da producao:`,o:[`A) Aumenta`,`B) Diminui (diluicao)`,`C) Permanece constante`,`D) Torna-se variavel`,`E) Zera`],g:`B`,c:`Custo fixo TOTAL e constante; o custo fixo UNITARIO DIMINUI com mais producao (diluicao). Variavel: total cresce, unitario constante.`},{a:2021,r:`FCC/ISS-2021`,q:`O Ponto de Equilibrio ECONOMICO considera:`,o:[`A) So custos contabeis`,`B) Os custos fixos mais o custo de oportunidade do capital`,`C) Menos a depreciacao`,`D) Apenas o caixa`,`E) So custos variaveis`],g:`B`,c:`PEE = (CF + custo de oportunidade)/MCu. Garante remunerar o capital proprio (lucro minimo desejado).`},{a:2020,r:`FCC/Adm-2020`,q:`Custos DIRETOS sao aqueles que:`,o:[`A) Nao podem ser identificados ao produto`,`B) Sao apropriados diretamente ao produto sem rateio`,`C) Sao sempre fixos`,`D) Independem da producao`,`E) Sao despesas administrativas`],g:`B`,c:`Custos DIRETOS: identificados e apropriados diretamente ao produto (materia-prima, MO direta). INDIRETOS exigem rateio.`},{a:2019,r:`FCC/BA-2019`,q:`Na producao conjunta, os subprodutos:`,o:[`A) Tem valor de venda elevado e objetivo principal`,`B) Sao secundarios, de valor reduzido, surgidos naturalmente do processo`,`C) Nao existem`,`D) Sao iguais aos coprodutos`,`E) Geram so prejuizo`],g:`B`,c:`SUBPRODUTOS: itens secundarios, de pequeno valor, surgidos naturalmente. COPRODUTOS: objetivos principais. Sucata: residuo sem processo.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`CF=600.000, MCu=150. O ponto de equilibrio contabil em unidades e:`,o:[`A) 3.000`,`B) 4.000`,`C) 5.000`,`D) 6.000`,`E) 4.500`],g:`B`,c:`PEC = CF/MCu = 600.000/150 = 4.000 unidades.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A margem de seguranca operacional indica:`,o:[`A) O lucro maximo`,`B) O quanto as vendas podem cair antes de atingir o ponto de equilibrio`,`C) O custo fixo`,`D) A margem de contribuicao`,`E) O preco minimo`],g:`B`,c:`Margem de seguranca = (vendas atuais - vendas no PE) / vendas atuais. Mostra a folga antes de comecar a ter prejuizo.`},{a:2022,r:`FCC/ISS-2022`,q:`No custeio variavel, o resultado e influenciado por:`,o:[`A) Volume de producao`,`B) Volume de VENDAS (custos fixos sao do periodo)`,`C) Nivel de estoque`,`D) Rateio dos fixos`,`E) Depreciacao alocada`],g:`B`,c:`No custeio VARIAVEL, o lucro varia com as VENDAS (fixos sao despesa do periodo). No absorcao, estocar producao 'segura' custo fixo no estoque e altera o resultado.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O grau de alavancagem operacional (GAO) mede:`,o:[`A) O endividamento`,`B) A variacao percentual do lucro para cada 1% de variacao nas vendas`,`C) A liquidez`,`D) O custo de capital`,`E) A margem bruta`],g:`B`,c:`GAO = variacao % do lucro operacional / variacao % das vendas = MC total / lucro operacional. Quanto maior o custo fixo, maior a alavancagem.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Custos de transformacao compreendem:`,o:[`A) Apenas materia-prima`,`B) Mao de obra direta + custos indiretos de fabricacao`,`C) Despesas de venda`,`D) Comissoes`,`E) Fretes de entrega`],g:`B`,c:`Custos de transformacao = MOD + CIF (custos indiretos de fabricacao), aplicados para transformar a materia-prima em produto acabado.`},{a:2022,r:`FCC/ISS-2022`,q:`No metodo ABC, os direcionadores de custo (cost drivers) servem para:`,o:[`A) Reduzir custos`,`B) Alocar custos indiretos as atividades e destas aos produtos`,`C) Calcular o preco`,`D) Definir o lucro`,`E) Ratear receitas`],g:`B`,c:`ABC: os cost drivers medem o consumo de cada atividade pelos produtos, permitindo alocar os custos indiretos com mais precisao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na producao conjunta, o ponto de separacao (split-off) e:`,o:[`A) O fim da producao`,`B) O momento em que os coprodutos passam a ser identificaveis separadamente`,`C) O inicio do processo`,`D) A venda`,`E) O rateio do lucro`],g:`B`,c:`Ponto de separacao: estagio do processo conjunto em que os produtos se tornam individualmente identificaveis. Custos conjuntos sao rateados ate ali.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O custo-padrao serve para:`,o:[`A) Substituir o custo real`,`B) Servir de referencia e permitir analise de variacoes (real x padrao)`,`C) Calcular tributos`,`D) Definir o preco de venda obrigatorio`,`E) Eliminar custos indiretos`],g:`B`,c:`Custo-padrao: meta cientificamente estabelecida; compara-se com o real para apurar VARIACOES (de preco e de quantidade) e tomar acoes corretivas.`}],"DTR-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`A obrigacao tributaria ACESSORIA tem por objeto:`,o:[`A) Pagamento de tributo ou penalidade`,`B) Prestacoes positivas ou negativas no interesse da arrecadacao/fiscalizacao`,`C) So o pagamento do tributo`,`D) Entrega em cartorio`,`E) Recolhimento antecipado`],g:`B`,c:`Art. 113 par.2: acessoria=prestacoes positivas (emitir NF, escriturar) ou negativas (nao obstruir). Descumprir converte em principal (multa).`},{a:2022,r:`FCC/Fiscal-2022`,q:`Sao causas de SUSPENSAO do credito (art. 151):`,o:[`A) Pagamento, compensacao, remissao`,`B) Moratoria, deposito integral, reclamacoes/recursos, liminar/tutela, parcelamento`,`C) Isencao e anistia`,`D) Decadencia e prescricao`,`E) Dacao em pagamento`],g:`B`,c:`Art. 151 (MDRRLP): Moratoria, Deposito integral, Reclamacoes/Recursos, Liminar/Tutela, Parcelamento.`},{a:2021,r:`FCC/GO-2021`,q:`O lancamento por HOMOLOGACAO caracteriza-se por:`,o:[`A) Fisco agir sozinho`,`B) Contribuinte declarar e Fisco lancar`,`C) Contribuinte antecipar o pagamento sem previo exame`,`D) Ser usado no IPTU`,`E) Dispensar pagamento`],g:`C`,c:`Art. 150: por HOMOLOGACAO, o sujeito passivo antecipa o pagamento sem previo exame. Decadencia: 5 anos do FG. Ex: ICMS, IR, IPI.`},{a:2020,r:`FCC/TRF-2020`,q:`A DECADENCIA tributaria extingue:`,o:[`A) A pretensao de cobrar`,`B) O direito de a Fazenda constituir o credito pelo lancamento`,`C) A execucao fiscal`,`D) O direito de repetir indebito`,`E) O parcelamento`],g:`B`,c:`DECADENCIA (art. 173): extingue o direito de LANCAR. PRESCRICAO (art. 174): extingue a acao de COBRAR. Ambas: 5 anos.`},{a:2019,r:`FCC/RJ-2019`,q:`Sao modalidades de EXTINCAO do credito (art. 156):`,o:[`A) Moratoria e parcelamento`,`B) Pagamento, compensacao, transacao, remissao, prescricao, decadencia`,`C) Isencao e anistia`,`D) Reclamacoes e recursos`,`E) Liminar em MS`],g:`B`,c:`Art. 156 (extincao): pagamento, compensacao, transacao, remissao, prescricao, decadencia, dacao em pagamento etc. Isencao/anistia=exclusao.`},{a:2023,r:`FCC/TRT-2023`,q:`A responsabilidade por SUBSTITUICAO tributaria:`,o:[`A) Surge apos o fato gerador`,`B) Atribui ao substituto a obrigacao desde a origem`,`C) E sempre subsidiaria`,`D) Depende de sucessao`,`E) Exige dolo`],g:`B`,c:`SUBSTITUICAO: o responsavel (substituto) ocupa o lugar do contribuinte desde a origem (ex: ICMS-ST). TRANSFERENCIA: por evento posterior.`},{a:2022,r:`FCC/Fiscal-2022`,q:`A ISENCAO, como causa de EXCLUSAO:`,o:[`A) Extingue o credito`,`B) Dispensa o pagamento do tributo (antes do lancamento)`,`C) Suspende a exigibilidade`,`D) Perdoa a multa`,`E) E o mesmo que imunidade`],g:`B`,c:`ISENCAO: exclui o credito tributario (dispensa o tributo), decorre de lei. ANISTIA: exclui a multa. IMUNIDADE: limitacao constitucional.`},{a:2021,r:`FCC/GO-2021`,q:`A solidariedade tributaria (art. 124):`,o:[`A) Comporta beneficio de ordem`,`B) Nao comporta beneficio de ordem`,`C) Exige contrato`,`D) So entre entes publicos`,`E) Depende de homologacao`],g:`B`,c:`Art. 124 PU: a solidariedade tributaria NAO comporta beneficio de ordem (o Fisco cobra de qualquer um integralmente).`},{a:2020,r:`FCC/TRF-2020`,q:`A responsabilidade do art. 135 (socios-gerentes) ocorre quando:`,o:[`A) Ha mero inadimplemento`,`B) Ha atos com excesso de poderes ou infracao de lei/contrato (dolo)`,`C) Sempre que a empresa deve`,`D) Ha dissolucao regular`,`E) Por culpa leve`],g:`B`,c:`Art. 135: responsabilidade PESSOAL por atos com excesso de poderes/infracao de lei. Sumula 430 STJ: mero inadimplemento nao gera responsabilidade do socio.`},{a:2019,r:`FCC/RJ-2019`,q:`O Fato Gerador da obrigacao principal e:`,o:[`A) Qualquer ato administrativo`,`B) A situacao definida em lei como necessaria e suficiente a sua ocorrencia`,`C) O lancamento`,`D) A inscricao em divida ativa`,`E) O pagamento`],g:`B`,c:`Art. 114: FG da obrigacao principal = situacao definida em lei como NECESSARIA E SUFICIENTE a sua ocorrencia.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A capacidade tributaria PASSIVA independe de:`,o:[`A) Estar a pessoa juridica regularmente constituida`,`B) Achar-se a pessoa sujeita a medidas que importem privacao de direitos`,`C) Estar a pessoa natural sujeita a incapacidade civil`,`D) Todas as anteriores (independe de tudo isso)`,`E) Apenas da capacidade civil`],g:`D`,c:`Art. 126 CTN: a capacidade tributaria passiva independe da capacidade civil, de restricoes ao exercicio de atividades e da regular constituicao da PJ.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A denuncia espontanea (art. 138 CTN) afasta:`,o:[`A) O tributo devido`,`B) A responsabilidade por infracoes, se acompanhada do pagamento do tributo e juros`,`C) Os juros de mora`,`D) A correcao monetaria`,`E) Sempre todas as penalidades, mesmo sem pagamento`],g:`B`,c:`Art. 138: a denuncia espontanea, com pagamento do tributo + juros antes de qualquer procedimento fiscal, exclui a responsabilidade por infracoes (multa). Sumula 360 STJ: nao se aplica a tributo declarado e nao pago.`},{a:2022,r:`FCC/PGE-2022`,q:`Na solidariedade tributaria, o pagamento por um dos obrigados:`,o:[`A) Nao aproveita aos demais`,`B) Aproveita aos demais`,`C) Extingue so a parte dele`,`D) Depende de convenio`,`E) Exige autorizacao judicial`],g:`B`,c:`Art. 125, I: o pagamento efetuado por um dos obrigados APROVEITA aos demais. A isencao/remissao tambem, salvo se outorgada pessoalmente.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A moratoria, quando em carater individual:`,o:[`A) Gera direito adquirido`,`B) NAO gera direito adquirido e pode ser revogada se cessadas as condicoes`,`C) E irrevogavel`,`D) Independe de lei`,`E) Extingue o credito`],g:`B`,c:`Art. 155: a moratoria individual NAO gera direito adquirido; revoga-se de oficio se o beneficiario nao satisfazia as condicoes (cobranca com juros).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A consignacao em pagamento (art. 164) cabe quando:`,o:[`A) O contribuinte quer parcelar`,`B) Ha recusa de recebimento ou exigencia de tributo indevido por mais de um ente`,`C) Ha decadencia`,`D) Ocorre remissao`,`E) Ha isencao`],g:`B`,c:`Art. 164: cabe consignacao em caso de recusa de recebimento, subordinacao a outra exigencia, ou exigencia por mais de uma PJ sobre o mesmo fato gerador.`},{a:2022,r:`FCC/PGE-2022`,q:`A isencao concedida por prazo certo e sob condicao onerosa:`,o:[`A) Pode ser revogada a qualquer tempo`,`B) Nao pode ser livremente revogada (Sumula 544 STF)`,`C) Independe de lei`,`D) E o mesmo que imunidade`,`E) Atinge a obrigacao acessoria`],g:`B`,c:`Sumula 544 STF: isencoes tributarias concedidas sob condicao onerosa e por prazo certo NAO podem ser livremente suprimidas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O lancamento reporta-se a data:`,o:[`A) Do lancamento`,`B) Da ocorrencia do fato gerador, regendo-se pela lei entao vigente`,`C) Da inscricao em divida ativa`,`D) Do pagamento`,`E) Da notificacao`],g:`B`,c:`Art. 144: o lancamento reporta-se a data do FATO GERADOR e rege-se pela lei entao vigente, ainda que posteriormente modificada ou revogada.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A decadencia do direito de lancar, no lancamento de oficio, conta-se:`,o:[`A) Do fato gerador`,`B) Do 1o dia do exercicio seguinte aquele em que poderia ter sido lancado`,`C) Da inscricao em divida ativa`,`D) Da notificacao`,`E) Do pagamento antecipado`],g:`B`,c:`Art. 173, I: 5 anos contados do 1o dia do exercicio seguinte aquele em que o lancamento poderia ter sido efetuado (regra geral/oficio).`}],"DTR-2":[{a:2024,r:`FCC/RT-2024`,q:`A EC 132/2023 criou o IBS, de competencia:`,o:[`A) Federal`,`B) Estadual`,`C) Compartilhada entre estados, DF e municipios`,`D) Municipal`,`E) Uniao e estados`],g:`C`,c:`EC 132/2023: IBS=competencia COMPARTILHADA (estados, DF, municipios), substitui ICMS+ISS, gerido pelo Comite Gestor (art. 156-B).`},{a:2024,r:`FCC-estilo-2024`,q:`O Comite Gestor do IBS tem como funcao:`,o:[`A) Politica monetaria`,`B) Administrar, arrecadar, fiscalizar e cobrar o IBS`,`C) Substituir o CONFAZ totalmente`,`D) Definir o IR`,`E) Regular o ISS municipal isolado`],g:`B`,c:`Art. 156-B: Comite Gestor administra, arrecada, fiscaliza, cobra e representa o IBS. Colegiado de estados, DF e municipios.`},{a:2024,r:`FCC-estilo-2024`,q:`O principio do DESTINO no IBS significa:`,o:[`A) Imposto no local de producao`,`B) Imposto devido no local de consumo`,`C) Aliquota por destino economico`,`D) So importacoes`,`E) Partilha 50/50`],g:`B`,c:`DESTINO: imposto devido no local de CONSUMO, nao de producao. Reduz a guerra fiscal, alinha-se ao IVA internacional.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A CBS substitui:`,o:[`A) IPI e ICMS`,`B) PIS e COFINS`,`C) IRPJ e CSLL`,`D) IOF e ITR`,`E) IPI e IOF`],g:`B`,c:`CBS=Contribuicao sobre Bens e Servicos: substitui PIS e COFINS. Competencia FEDERAL, administracao pela Receita Federal.`},{a:2023,r:`FCC/SEFAZ-2023`,q:`O Imposto Seletivo (IS) incide sobre:`,o:[`A) Exportacoes`,`B) Operacoes financeiras`,`C) Bens/servicos prejudiciais a saude ou ao meio ambiente`,`D) Combustiveis substituindo o ICMS`,`E) Todo consumo a 1%`],g:`C`,c:`IS (art. 153, VIII): bens/servicos PREJUDICIAIS a saude ou ao meio ambiente. Federal. Nao integra a base do IBS/CBS.`},{a:2024,r:`FCC-estilo-2024`,q:`O modelo de tributacao sobre consumo da reforma e do tipo:`,o:[`A) Cumulativo`,`B) IVA dual (IBS subnacional + CBS federal)`,`C) Monofasico geral`,`D) Imposto unico federal`,`E) So estadual`],g:`B`,c:`Reforma adota IVA DUAL: IBS (estados/municipios) + CBS (federal), com nao-cumulatividade plena e principio do destino.`},{a:2024,r:`FCC-estilo-2024`,q:`A nao-cumulatividade PLENA do IBS significa:`,o:[`A) Credito so fisico`,`B) Credito amplo de todo IBS pago nas etapas anteriores`,`C) Sem direito a credito`,`D) Credito so do ativo`,`E) Credito so de insumos industriais`],g:`B`,c:`Nao-cumulatividade PLENA: credito amplo de todo o IBS que onerou as aquisicoes, com poucas excecoes (uso/consumo pessoal).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A transicao da reforma tributaria conclui-se em:`,o:[`A) 2026`,`B) 2027`,`C) 2029`,`D) 2033`,`E) 2040`],g:`D`,c:`Transicao: inicio em 2026 (teste 0,1%), CBS plena em 2027, reducao gradual do ICMS/ISS 2029-2032, sistema completo em 2033.`},{a:2024,r:`FCC-estilo-2024`,q:`O cashback previsto na reforma destina-se a:`,o:[`A) Grandes empresas`,`B) Devolucao de tributo a familias de baixa renda`,`C) Exportadores`,`D) Estados deficitarios`,`E) Importadores`],g:`B`,c:`Cashback: devolucao de parte do IBS/CBS a familias de BAIXA RENDA, reduzindo a regressividade do consumo.`},{a:2023,r:`FCC/SEFAZ-2023`,q:`A CBS sera administrada pela:`,o:[`A) Comite Gestor do IBS`,`B) Receita Federal do Brasil`,`C) Secretarias estaduais`,`D) CONFAZ`,`E) Banco Central`],g:`B`,c:`CBS (federal): administrada pela RECEITA FEDERAL. O IBS (subnacional) e administrado pelo Comite Gestor.`},{a:2024,r:`FCC/RT-2024`,q:`A EC 132/2023 instituiu o principio da:`,o:[`A) Cumulatividade`,`B) Neutralidade e simplicidade tributaria`,`C) Tributacao na origem`,`D) Anterioridade nonagesimal apenas`,`E) Progressividade do consumo`],g:`B`,c:`A EC 132 trouxe os principios da SIMPLICIDADE, TRANSPARENCIA, JUSTICA TRIBUTARIA, COOPERACAO e DEFESA DO MEIO AMBIENTE, alem da NEUTRALIDADE do IVA.`},{a:2024,r:`FCC-estilo-2024`,q:`A cesta basica nacional de alimentos, na reforma:`,o:[`A) Tera aliquota dobrada`,`B) Tera aliquota ZERO de IBS e CBS`,`C) Sera tributada normalmente`,`D) So tera reducao de 50%`,`E) Sera isenta apenas de CBS`],g:`B`,c:`A LC define a Cesta Basica Nacional de Alimentos com aliquota ZERO de IBS e CBS, para reduzir a regressividade.`},{a:2024,r:`FCC-estilo-2024`,q:`O 'split payment' previsto na reforma consiste em:`,o:[`A) Dividir o pagamento em parcelas`,`B) Recolhimento do imposto no momento da liquidacao financeira da operacao`,`C) Pagar metade do imposto`,`D) Parcelar o IBS`,`E) Dividir entre estados`],g:`B`,c:`Split payment: o imposto e segregado e recolhido automaticamente no momento da liquidacao financeira (pagamento), reduzindo a sonegacao.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Na reforma, os setores com regimes ESPECIFICOS incluem:`,o:[`A) Apenas industria`,`B) Combustiveis, servicos financeiros, planos de saude, entre outros`,`C) Somente exportadores`,`D) So o agronegocio`,`E) Nenhum setor`],g:`B`,c:`A EC 132 preve regimes especificos para combustiveis (monofasico), servicos financeiros, seguros, planos de saude, operacoes imobiliarias, cooperativas etc.`},{a:2024,r:`FCC-estilo-2024`,q:`O Fundo de Desenvolvimento Regional, criado pela reforma:`,o:[`A) Foi extinto`,`B) Visa reduzir desigualdades regionais com recursos da Uniao`,`C) E custeado pelos municipios`,`D) So atende o Sul`,`E) Substitui o FPE`],g:`B`,c:`A EC 132 criou o Fundo Nacional de Desenvolvimento Regional (FNDR), com aportes da Uniao, para reduzir desigualdades regionais apos o fim da guerra fiscal.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Durante a transicao, em 2026, a aliquota-teste de CBS e IBS:`,o:[`A) 1% cada`,`B) CBS 0,9% e IBS 0,1%`,`C) 5%`,`D) 12%`,`E) Zero`],g:`B`,c:`Em 2026: aliquota-teste com CBS de 0,9% e IBS de 0,1% (compensaveis com PIS/COFINS), para calibrar o sistema.`},{a:2024,r:`FCC-estilo-2024`,q:`O Imposto Seletivo NAO incidira sobre:`,o:[`A) Cigarros`,`B) Bebidas alcoolicas`,`C) Exportacoes`,`D) Veiculos poluentes`,`E) Bens prejudiciais a saude`],g:`C`,c:`O IS NAO incide sobre exportacoes (imunidade). Incide sobre bens/servicos prejudiciais a saude e ao meio ambiente, como tabaco e alcool.`},{a:2024,r:`FCC-estilo-2024`,q:`A nao-cumulatividade plena do IBS/CBS difere do ICMS atual porque:`,o:[`A) Veda totalmente o credito`,`B) Permite credito amplo, inclusive de bens de uso e consumo da atividade`,`C) So permite credito fisico`,`D) E cumulativa`,`E) Exige convenio`],g:`B`,c:`Na reforma, a nao-cumulatividade e PLENA: credita-se de praticamente tudo que foi onerado (inclusive uso/consumo da atividade), exceto uso pessoal. Hoje o ICMS limita o credito de uso e consumo.`}],"DTR-3":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Na LC 87/96, o credito do ICMS sobre ATIVO PERMANENTE:`,o:[`A) E integral no mes`,`B) E a razao de 1/48 por mes`,`C) Nao gera credito`,`D) So para industria`,`E) Em qualquer prazo`],g:`B`,c:`LC 87/96 art. 20 par.5: ativo permanente -> credito a razao de 1/48 por mes (4 anos).`},{a:2022,r:`FCC/Fiscal-2022`,q:`Os convenios CONFAZ (LC 24/75) sao aprovados por:`,o:[`A) Maioria simples`,`B) Unanimidade dos estados presentes`,`C) 2/3 dos estados`,`D) Decisao do STF`,`E) Maioria absoluta`],g:`B`,c:`LC 24/75: convenios de ICMS exigem UNANIMIDADE dos presentes (minimo 4/5). Um estado pode vetar.`},{a:2021,r:`FCC/SEFAZ-2021`,q:`No Simples Nacional (LC 123/2006), o ICMS-ST:`,o:[`A) Entra no DAS`,`B) E recolhido separadamente, fora do DAS`,`C) E isento`,`D) Tem aliquota zero`,`E) E facultativo`],g:`B`,c:`ICMS-ST NAO entra no DAS: recolhido SEPARADAMENTE. O DAS reune os demais tributos do Simples em guia unica.`},{a:2020,r:`FCC/Adm-2020`,q:`A nao-cumulatividade do ICMS (LC 87/96) permite:`,o:[`A) Credito so na industria`,`B) Compensar o imposto devido com o cobrado nas etapas anteriores`,`C) Credito de uso e consumo ja`,`D) Credito ilimitado`,`E) Nenhum credito`],g:`B`,c:`Nao-cumulatividade: compensa-se o ICMS devido com o montante cobrado nas operacoes anteriores. Uso e consumo: vedado ate 2033.`},{a:2019,r:`FCC/RS-2019`,q:`As aliquotas interestaduais de ICMS sao:`,o:[`A) Sempre 18%`,`B) 7% ou 12% conforme a regiao de destino`,`C) 25%`,`D) Definidas por cada estado`,`E) Zero`],g:`B`,c:`Aliquotas interestaduais: 7% (Sul/Sudeste -> Norte/Nordeste/CO/ES) e 12% (demais). Fixadas por Resolucao do Senado.`},{a:2023,r:`FCC/TRT-2023`,q:`A LC 116/2003 trata do:`,o:[`A) ICMS`,`B) ISS (Imposto Sobre Servicos) - competencia municipal`,`C) IPVA`,`D) ITCD`,`E) IPI`],g:`B`,c:`LC 116/2003: normas gerais do ISSQN, competencia MUNICIPAL. Lista anexa define os servicos tributaveis pelo ISS.`},{a:2022,r:`FCC/Fiscal-2022`,q:`O DIFAL (EC 87/2015) e cobrado:`,o:[`A) So nas importacoes`,`B) Na operacao interestadual destinada a consumidor final`,`C) Em todas as vendas internas`,`D) So no Simples`,`E) Nunca`],g:`B`,c:`DIFAL: diferencial de aliquota nas operacoes interestaduais destinadas a consumidor final (contribuinte ou nao do imposto).`},{a:2021,r:`FCC/SEFAZ-2021`,q:`A LC 160/2017 tratou de:`,o:[`A) Criar o IBS`,`B) Remissao/convalidacao de beneficios de ICMS concedidos sem convenio`,`C) Extinguir o ICMS`,`D) Aumentar aliquotas`,`E) Criar o Simples`],g:`B`,c:`LC 160/2017: permitiu a remissao e convalidacao de beneficios fiscais de ICMS concedidos sem convenio (guerra fiscal pretérita).`},{a:2020,r:`FCC/Adm-2020`,q:`No Simples Nacional, os limites de receita sao (anual):`,o:[`A) MEI 81 mil, ME 360 mil, EPP 4,8 milhoes`,`B) MEI 60 mil, ME 300 mil, EPP 3,6 milhoes`,`C) MEI 100 mil, ME 500 mil, EPP 5 milhoes`,`D) Sem limite`,`E) ME 1 milhao`],g:`A`,c:`LC 123: MEI ate 81 mil/ano, ME ate 360 mil, EPP ate 4,8 milhoes. Acima -> exclusao do
