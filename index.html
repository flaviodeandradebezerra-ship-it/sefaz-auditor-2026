 que ja geraram direitos adquiridos`,`C) Atos vigentes`,`D) Atos de merito`,`E) Atos validos`],g:`B`,c:`A REVOGACAO (por conveniencia/oportunidade) nao pode atingir DIREITOS ADQUIRIDOS (Sumula 473 STF) nem atos vinculados, atos consumados ou ja apreciados por instancia superior.`},{a:2022,r:`FCC/PGE-2022`,q:`O abuso de poder, na forma de DESVIO de poder, ocorre quando o agente:`,o:[`A) Age sem competencia`,`B) Atua dentro da competencia, mas com finalidade diversa do interesse publico`,`C) Erra na forma`,`D) Nao motiva`,`E) Atrasa o ato`],g:`B`,c:`Abuso de poder: EXCESSO de poder (extrapola a competencia) ou DESVIO de poder/finalidade (age na competencia, mas com finalidade estranha ao interesse publico).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Servidor pratica ato com excesso de poder. Trata-se de vicio no elemento:`,o:[`A) Objeto`,`B) Competencia (atua alem dos limites de sua atribuicao)`,`C) Forma`,`D) Motivo`,`E) Finalidade`],g:`B`,c:`EXCESSO DE PODER: o agente atua ALEM dos limites de sua COMPETENCIA. E especie de abuso de poder; vicio no elemento competencia (sanavel ou nao, conforme o caso).`},{a:2023,r:`FCC/TCE-2023`,q:`A responsabilidade civil do Estado por ato de notario/registrador (delegatario), apos o STF (RE 842.846):`,o:[`A) E sempre do notario`,`B) E objetiva do Estado, com direito de regresso contra o delegatario que agiu com dolo/culpa`,`C) Inexiste`,`D) E subjetiva`,`E) E penal`],g:`B`,c:`STF (RE 842.846): o Estado responde OBJETIVAMENTE pelos danos causados por notarios/registradores no exercicio da funcao, assegurado o regresso contra o delegatario em caso de dolo ou culpa.`},{a:2022,r:`FCC/PGE-2022`,q:`A convalidacao e VEDADA quando:`,o:[`A) O vicio e de competencia`,`B) O vicio e insanavel (finalidade, motivo, objeto) ou ha lesao ao interesse publico/prejuizo a terceiros`,`C) O vicio e de forma`,`D) Ha boa-fe`,`E) O ato e discricionario`],g:`B`,c:`A convalidacao so e cabivel para vicios SANAVEIS (competencia nao exclusiva e forma). E vedada para vicios INSANAVEIS (motivo, objeto, finalidade) e quando houver prejuizo a terceiros ou ao interesse publico.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Prazo decadencial para a Administracao anular atos de que decorram efeitos favoraveis, salvo ma-fe (Lei 9.784):`,o:[`A) 2 anos`,`B) 5 anos`,`C) 10 anos`,`D) 1 ano`,`E) Imprescritivel`],g:`B`,c:`Art. 54 Lei 9.784: o direito da Administracao de ANULAR atos de que decorram efeitos favoraveis aos destinatarios decai em 5 ANOS (contados da pratica), salvo comprovada MA-FE.`},{a:2023,r:`FCC/TCE-2023`,q:`Concessao de servico publico: a tarifa e fixada considerando o:`,o:[`A) Lucro maximo da concessionaria`,`B) Equilibrio economico-financeiro do contrato (preservacao das condicoes da proposta)`,`C) Custo do usuario`,`D) Valor de mercado livre`,`E) IPCA apenas`],g:`B`,c:`Na concessao, a tarifa preserva o EQUILIBRIO ECONOMICO-FINANCEIRO do contrato (as condicoes efetivas da proposta), com revisoes/reajustes para manter a equacao original.`},{a:2022,r:`FCC/PGE-2022`,q:`O ato administrativo composto difere do complexo porque, no composto:`,o:[`A) Duas vontades de orgaos diferentes se fundem`,`B) Ha uma vontade principal e outra acessoria (ratificacao/visto) do mesmo ou outro orgao`,`C) Nao ha vontade`,`D) E sempre vinculado`,`E) E discricionario`],g:`B`,c:`Ato COMPOSTO: uma vontade principal e outra ACESSORIA/instrumental (ex: ato que depende de visto/homologacao). Ato COMPLEXO: fusao de vontades de orgaos diferentes formando um unico ato.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A 'teoria do orgao' (imputacao) explica que:`,o:[`A) O agente responde pessoalmente sempre`,`B) A atuacao do agente e imputada diretamente a pessoa juridica (Estado)`,`C) O orgao tem personalidade`,`D) O agente e terceiro`,`E) Nao ha responsabilidade`],g:`B`,c:`TEORIA DO ORGAO (imputacao volitiva, de Otto Gierke): a vontade/atuacao do agente publico e IMPUTADA diretamente a pessoa juridica estatal, pois o orgao e parte dela (nao ha relacao de representacao externa).`},{a:2023,r:`FCC/TCE-2023`,q:`A intervencao do Estado na propriedade por 'servidao administrativa' caracteriza-se por:`,o:[`A) Perda da propriedade`,`B) Direito real de uso sobre bem alheio para fim publico, sem perda da propriedade (indenizacao se houver dano)`,`C) Confisco`,`D) Tombamento`,`E) Requisicao`],g:`B`,c:`SERVIDAO ADMINISTRATIVA: direito real publico que impoe onus sobre bem ALHEIO para utilidade publica (ex: passagem de fios), sem retirar a propriedade; indeniza-se apenas o dano efetivo comprovado.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O regime juridico-administrativo apoia-se em dois pilares:`,o:[`A) Legalidade e moralidade`,`B) Supremacia do interesse publico e indisponibilidade do interesse publico`,`C) Eficiencia e economia`,`D) Publicidade e sigilo`,`E) Discricionariedade e vinculacao`],g:`B`,c:`O REGIME JURIDICO-ADMINISTRATIVO assenta-se em dois pilares: SUPREMACIA do interesse publico sobre o privado e INDISPONIBILIDADE do interesse publico (a Adm. nao dispoe livremente dele).`},{a:2023,r:`FCC/TCE-2023`,q:`A discricionariedade administrativa encontra limites em:`,o:[`A) Nenhum`,`B) Lei, razoabilidade, proporcionalidade e moralidade (controle de juridicidade)`,`C) So na vontade do gestor`,`D) Apenas no orcamento`,`E) Na hierarquia so`],g:`B`,c:`A discricionariedade NAO e arbitrio: submete-se a LEI e aos principios (razoabilidade, proporcionalidade, moralidade). O Judiciario controla a juridicidade, sem invadir o merito legitimo.`},{a:2022,r:`FCC/PGE-2022`,q:`O ato administrativo perfeito e aquele que:`,o:[`A) Nao tem vicios`,`B) Concluiu seu ciclo de formacao (existe), podendo ser valido ou invalido, eficaz ou nao`,`C) E sempre valido`,`D) Produz efeitos`,`E) E discricionario`],g:`B`,c:`Ato PERFEITO: completou seu CICLO DE FORMACAO (existe juridicamente). Perfeicao (existencia) nao se confunde com validade (conformidade) nem com eficacia (producao de efeitos).`}],"DCI-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`A SV 24 do STF estabelece que crime material contra a ordem tributaria:`,o:[`A) Independe de lancamento`,`B) So se tipifica apos o lancamento definitivo do tributo`,`C) Prescreve em 3 anos`,`D) Inclui o mero inadimplemento`,`E) E acao penal privada`],g:`B`,c:`SV 24: nao se tipifica crime material (art. 1, I-IV, Lei 8.137/90) antes do lancamento DEFINITIVO do tributo.`},{a:2022,r:`FCC/TRF-2022`,q:`A lavagem de dinheiro (Lei 9.613/98) ocorre quando:`,o:[`A) Ha evasao acima de 5 milhoes`,`B) Bens de infracao penal sao ocultados/dissimulados`,`C) Empresa nao recolhe contribuicao`,`D) Funcionario aceita propina`,`E) Ha exportacao ficticia`],g:`B`,c:`Lavagem: ocultar/dissimular origem de bens de INFRACAO PENAL. Modelo all crimes (Lei 12.683/2012). 3 fases: colocacao, dissimulacao, integracao.`},{a:2021,r:`FCC/PGE-2021`,q:`A Lei Anticorrupcao (12.846/2013) responsabiliza:`,o:[`A) So pessoas fisicas`,`B) Pessoas juridicas objetivamente por atos contra a Adm. nacional e estrangeira`,`C) So servidores`,`D) PJ so se condenada criminalmente`,`E) So transnacionais`],g:`B`,c:`Lei 12.846/2013: responsabilidade OBJETIVA das PJ por atos lesivos a Adm. Publica nacional ou estrangeira. Acordo de leniencia reduz sancoes.`},{a:2020,r:`FCC/ISS-2020`,q:`No Direito Civil, a PRESCRICAO extingue:`,o:[`A) O direito material em si`,`B) A pretensao (direito de exigir judicialmente)`,`C) O negocio juridico`,`D) Contratos a termo`,`E) O direito potestativo`],g:`B`,c:`PRESCRICAO: extingue a PRETENSAO (acao). O direito subjetivo persiste. DECADENCIA: extingue o proprio direito potestativo.`},{a:2019,r:`FCC/TRT-2019`,q:`O crime FORMAL caracteriza-se por:`,o:[`A) Exigir resultado naturalistico`,`B) Consumar-se com a conduta, independente do resultado`,`C) So por funcionario publico`,`D) Exigir dois agentes`,`E) Depender de condicao objetiva`],g:`B`,c:`Crime FORMAL: consuma-se com a CONDUTA, o resultado e mero exaurimento. MATERIAL exige resultado; mera conduta nao preve resultado.`},{a:2023,r:`FCC/TRT-2023`,q:`O art. 2 da Lei 8.137/90 (crimes formais) inclui:`,o:[`A) Omitir informacao as autoridades`,`B) Falta de recolhimento de tributo descontado de terceiros`,`C) Fraudar a fiscalizacao`,`D) Negar nota fiscal`,`E) Alterar documento`],g:`B`,c:`Art. 2 (formais): ex. deixar de recolher tributo descontado/cobrado de terceiros. Consuma com a conduta, sem exigir lancamento definitivo.`},{a:2022,r:`FCC/TCE-2022`,q:`A DECADENCIA, no Direito Civil:`,o:[`A) Pode ser renunciada quando legal`,`B) Extingue o direito potestativo e, sendo legal, e irrenunciavel`,`C) Sempre se interrompe`,`D) So atinge a pretensao`,`E) Depende de acao judicial`],g:`B`,c:`DECADENCIA legal: extingue o DIREITO potestativo, e IRRENUNCIAVEL e pode ser reconhecida de oficio.`},{a:2021,r:`FCC/PGE-2021`,q:`No crime organizado (Lei 12.850/2013), a organizacao exige:`,o:[`A) 2 pessoas`,`B) 4 ou mais pessoas com estrutura ordenada e divisao de tarefas`,`C) 10 pessoas`,`D) Vinculo familiar`,`E) Apenas crimes tributarios`],g:`B`,c:`Lei 12.850/2013: organizacao criminosa = 4+ pessoas, estrutura ordenada, divisao de tarefas, vantagem ilicita. Colaboracao premiada e instrumento.`},{a:2020,r:`FCC/ISS-2020`,q:`No negocio juridico, o plano da VALIDADE exige:`,o:[`A) Apenas manifestacao de vontade`,`B) Agente capaz, objeto licito/possivel e forma prescrita ou nao defesa em lei`,`C) Registro em cartorio`,`D) Eficacia imediata`,`E) Ausencia de condicao`],g:`B`,c:`Validade (art. 104 CC): agente capaz + objeto licito, possivel, determinado + forma prescrita ou nao defesa em lei.`},{a:2019,r:`FCC/TRF-2019`,q:`O peculato (crime contra a Adm. Publica) e praticado por:`,o:[`A) Qualquer particular`,`B) Funcionario publico que se apropria de bem de que tem posse em razao do cargo`,`C) So por agentes politicos`,`D) Empresas`,`E) So em licitacoes`],g:`B`,c:`PECULATO: funcionario publico apropria-se de dinheiro/bem de que tem posse em razao do cargo (crime proprio).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No crime de excesso de exacao (art. 316, par.1 CP), o funcionario:`,o:[`A) Deixa de cobrar tributo`,`B) Exige tributo que sabe indevido ou cobra de modo vexatorio`,`C) Apropria-se de verba`,`D) Falsifica documento`,`E) Frauda licitacao`],g:`B`,c:`Excesso de exacao: o funcionario exige tributo/contribuicao que sabe indevido, ou, devido, emprega meio vexatorio/gravoso nao autorizado em lei.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A Sumula Vinculante 24 NAO se aplica aos crimes:`,o:[`A) Materiais do art. 1, I a IV da Lei 8.137/90`,`B) Formais (art. 2), que independem do lancamento definitivo`,`C) De sonegacao`,`D) De supressao de tributo`,`E) Contra a ordem tributaria em geral`],g:`B`,c:`SV 24 condiciona ao lancamento definitivo apenas os crimes MATERIAIS (art. 1, I-IV). Os FORMAIS (art. 2) consumam-se com a conduta, independentemente do lancamento.`},{a:2022,r:`FCC/PGE-2022`,q:`Na lavagem de dinheiro, a fase de 'ocultacao' (layering) busca:`,o:[`A) Inserir o dinheiro no sistema`,`B) Distanciar os recursos da origem por meio de varias transacoes`,`C) Reintegrar o dinheiro a economia`,`D) Pagar tributos`,`E) Declarar a renda`],g:`B`,c:`Lavagem em 3 fases: COLOCACAO (introducao), OCULTACAO/layering (varias operacoes para esconder a origem) e INTEGRACAO (retorno aparentemente licito).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O peculato culposo (art. 312, par.2 CP):`,o:[`A) Nunca admite reparacao`,`B) Extingue a punibilidade se o dano for reparado antes da sentenca irrecorrivel`,`C) E inafiancavel`,`D) Independe de culpa`,`E) So ocorre com dolo`],g:`B`,c:`Peculato culposo: se a reparacao do dano ocorre ANTES da sentenca irrecorrivel, extingue-se a punibilidade; se posterior, reduz a pena pela metade.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Corrupcao passiva (art. 317 CP) consuma-se quando o funcionario:`,o:[`A) Pratica o ato de oficio`,`B) Solicita ou recebe vantagem indevida, ou aceita promessa`,`C) Apenas pensa em receber`,`D) Comunica o superior`,`E) Recusa a propina`],g:`B`,c:`Corrupcao passiva consuma-se com SOLICITAR, RECEBER ou ACEITAR PROMESSA de vantagem indevida em razao da funcao, mesmo sem praticar o ato.`},{a:2022,r:`FCC/PGE-2022`,q:`A prescricao penal, em regra, comeca a correr:`,o:[`A) Da denuncia`,`B) Do dia em que o crime se consumou`,`C) Da sentenca`,`D) Do inquerito`,`E) Do transito em julgado`],g:`B`,c:`Art. 111 CP: a prescricao da pretensao punitiva, em regra, comeca a correr do dia da CONSUMACAO do crime (ou cessacao, nos permanentes).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No Direito Civil, a fraude contra credores e:`,o:[`A) Um ato nulo`,`B) Um vicio social que torna o negocio anulavel`,`C) Erro`,`D) Coacao fisica`,`E) Simulacao`],g:`B`,c:`Fraude contra credores: vicio SOCIAL do negocio juridico (devedor insolvente dilapida patrimonio em prejuizo do credor); o negocio e ANULAVEL (acao pauliana).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O contrabando difere do descaminho porque o contrabando envolve:`,o:[`A) Tributos nao pagos`,`B) Mercadoria proibida (ilicita)`,`C) Importacao regular`,`D) Exportacao isenta`,`E) Apenas multa`],g:`B`,c:`DESCAMINHO (art. 334): elidir tributo de mercadoria PERMITIDA. CONTRABANDO (art. 334-A): importar/exportar mercadoria PROIBIDA.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A apropriacao indebita previdenciaria (art. 168-A CP) consiste em:`,o:[`A) Nao declarar tributo`,`B) Deixar de repassar a previdencia contribuicoes recolhidas dos segurados`,`C) Fraudar nota fiscal`,`D) Corromper agente`,`E) Sonegar IR`],g:`B`,c:`Art. 168-A CP: deixar de REPASSAR a previdencia as contribuicoes descontadas/recolhidas dos contribuintes no prazo legal (crime omissivo proprio).`},{a:2023,r:`FCC/Fiscal-2023`,q:`No concurso de pessoas, a participacao de menor importancia:`,o:[`A) Aumenta a pena`,`B) Pode reduzir a pena de 1/6 a 1/3`,`C) Isenta de pena`,`D) Dobra a pena`,`E) E irrelevante`],g:`B`,c:`Art. 29, par.1 CP: se a participacao for de MENOR IMPORTANCIA, a pena pode ser diminuida de 1/6 a 1/3.`},{a:2022,r:`FCC/PGE-2022`,q:`A acao penal nos crimes contra a ordem tributaria e:`,o:[`A) Privada`,`B) Publica incondicionada (titularidade do MP)`,`C) Condicionada a representacao`,`D) Da vitima`,`E) Subsidiaria`],g:`B`,c:`Os crimes contra a ordem tributaria (Lei 8.137) sao de acao penal PUBLICA INCONDICIONADA: o MP age independentemente de provocacao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O erro de tipo (art. 20 CP):`,o:[`A) Aumenta a pena`,`B) Exclui o dolo (e, se inevitavel, tambem a culpa)`,`C) E irrelevante`,`D) E causa de aumento`,`E) Configura crime doloso`],g:`B`,c:`ERRO DE TIPO: falsa percepcao da realidade sobre elemento do tipo. EXCLUI O DOLO; se inevitavel, exclui tambem a culpa; se evitavel, pune-se a titulo de culpa (se prevista).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A simulacao, no Direito Civil, torna o negocio juridico:`,o:[`A) Anulavel`,`B) Nulo (art. 167 CC)`,`C) Valido`,`D) Ineficaz apenas`,`E) Inexistente`],g:`B`,c:`Art. 167 CC: a SIMULACAO torna o negocio juridico NULO (vicio social), mas subsiste o que se dissimulou se valido na substancia e forma.`},{a:2022,r:`FCC/PGE-2022`,q:`A reincidencia, no Direito Penal, ocorre quando o agente:`,o:[`A) Comete o primeiro crime`,`B) Pratica novo crime apos transito em julgado de condenacao anterior`,`C) Confessa`,`D) Repara o dano`,`E) E primario`],g:`B`,c:`REINCIDENCIA (art. 63 CP): cometer NOVO crime depois do TRANSITO EM JULGADO de sentenca condenatoria por crime anterior (no Brasil ou exterior). Agrava a pena.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Funcionario que retarda ato de oficio para satisfazer interesse pessoal comete:`,o:[`A) Corrupcao`,`B) Prevaricacao (art. 319 CP)`,`C) Concussao`,`D) Peculato`,`E) Excesso de exacao`],g:`B`,c:`PREVARICACAO (art. 319): retardar/deixar de praticar ou praticar ato contra disposicao legal, para satisfazer INTERESSE ou SENTIMENTO PESSOAL (sem vantagem economica, que caracterizaria corrupcao).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Concussao (art. 316 CP) diferencia-se da corrupcao passiva porque na concussao o funcionario:`,o:[`A) Aceita propina oferecida`,`B) EXIGE a vantagem indevida (impoe)`,`C) Solicita timidamente`,`D) Recusa`,`E) Comunica o superior`],g:`B`,c:`CONCUSSAO: o funcionario EXIGE (impoe, com poder do cargo) a vantagem indevida. Na corrupcao passiva, ele SOLICITA, recebe ou aceita - sem a imposicao caracteristica da concussao.`},{a:2022,r:`FCC/PGE-2022`,q:`No erro de proibicao (art. 21 CP), o agente:`,o:[`A) Erra sobre fato`,`B) Desconhece a ilicitude da conduta (se inevitavel, isenta de pena)`,`C) E inimputavel`,`D) Age em legitima defesa`,`E) Tem dolo`],g:`B`,c:`ERRO DE PROIBICAO: o agente supoe LICITA conduta proibida (erro sobre a ilicitude). Se INEVITAVEL, isenta de pena (exclui a culpabilidade); se evitavel, reduz a pena. Difere do erro de tipo (sobre fato).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A sonegacao fiscal (omitir informacao para suprimir tributo) configura, em regra, crime do:`,o:[`A) Codigo Penal so`,`B) Art. 1 da Lei 8.137/90 (crime material contra a ordem tributaria)`,`C) Crime de lavagem`,`D) Improbidade apenas`,`E) Ilicito civil`],g:`B`,c:`Suprimir/reduzir tributo mediante omissao de informacao, fraude ou falsificacao = crime MATERIAL do art. 1 da Lei 8.137/90 (consuma-se com o resultado: supressao apos lancamento definitivo - SV 24).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O principio da insignificancia (bagatela), nos crimes tributarios, segundo o STF/STJ:`,o:[`A) Nunca se aplica`,`B) Pode afastar a tipicidade material quando o valor sonegado e irrisorio (patamares definidos pela jurisprudencia)`,`C) Aplica-se a qualquer valor`,`D) So a crimes violentos`,`E) Depende da vitima`],g:`B`,c:`STF/STJ admitem o PRINCIPIO DA INSIGNIFICANCIA nos crimes tributarios federais quando o valor sonegado nao supera certos patamares (jurisprudencia), afastando a tipicidade material por ausencia de lesao relevante.`},{a:2022,r:`FCC/PGE-2022`,q:`A extincao da punibilidade pelo pagamento integral do tributo, nos crimes tributarios:`,o:[`A) Nunca ocorre`,`B) Ocorre, podendo ser ate apos o recebimento da denuncia, conforme a legislacao`,`C) So antes do lancamento`,`D) E vedada`,`E) Depende da vitima`],g:`B`,c:`Nos crimes contra a ordem tributaria, o PAGAMENTO INTEGRAL do debito (tributo + acessorios) EXTINGUE A PUNIBILIDADE, podendo ocorrer mesmo apos o recebimento da denuncia (Lei 10.684/03 e jurisprudencia).`}],"DFI-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`O limite de despesa com pessoal para os ESTADOS (LRF) e:`,o:[`A) 50% da RCL; Executivo 40,9%`,`B) 60% da RCL; Executivo 49%`,`C) 60% da RCL; Executivo 54%`,`D) 65%; Executivo 49%`,`E) 60%; Executivo 45%`],g:`B`,c:`Estados=60% da RCL, Executivo=49% (Leg+TC 3%, Jud 6%, MP 2%). Uniao=50/40,9. Municipios=60/54.`},{a:2022,r:`FCC/TCE-2022`,q:`A limitacao de empenho (art. 9 LRF) e acionada:`,o:[`A) No inicio do exercicio`,`B) Bimestralmente, quando a receita nao comporta as metas de resultado primario`,`C) So por lei`,`D) Em qualquer despesa`,`E) Pelo TCU`],g:`B`,c:`Art. 9: bimestralmente, se a receita nao comportar as metas fiscais -> contingenciamento. Nao atinge despesas constitucionalmente obrigatorias.`},{a:2021,r:`FCC/SEFAZ-2021`,q:`O Resultado Primario e:`,o:[`A) Receitas totais - despesas totais`,`B) Receitas nao financeiras - despesas nao financeiras (sem juros)`,`C) Resultado nominal + correcao`,`D) Receita tributaria - pessoal`,`E) Superavit / PIB`],g:`B`,c:`PRIMARIO: receitas nao financeiras - despesas nao financeiras (exclui juros). Mede o esforco fiscal. NOMINAL=primario - juros.`},{a:2020,r:`FCC/TRT-2020`,q:`O limite PRUDENCIAL de despesa com pessoal corresponde a:`,o:[`A) 90% do limite`,`B) 95% do limite legal`,`C) 100%`,`D) 50%`,`E) 60% da RCL`],g:`B`,c:`Limite prudencial=95% do limite legal. Atingido, vedam-se aumentos, criacao de cargos, horas extras (medidas preventivas).`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O RGF (Relatorio de Gestao Fiscal) e publicado:`,o:[`A) Mensalmente`,`B) Bimestralmente`,`C) Quadrimestralmente`,`D) Anualmente`,`E) Semestralmente`],g:`C`,c:`RGF=QUADRIMESTRAL. RREO (Relatorio Resumido de Execucao Orcamentaria)=BIMESTRAL.`},{a:2023,r:`FCC/TRT-2023`,q:`O art. 42 da LRF veda, nos 2 ultimos quadrimestres do mandato:`,o:[`A) Pagar servidores`,`B) Contrair obrigacao de despesa sem disponibilidade de caixa`,`C) Realizar licitacoes`,`D) Arrecadar tributos`,`E) Editar a LDO`],g:`B`,c:`Art. 42: vedado contrair, nos 2 ultimos quadrimestres, obrigacao de despesa que nao possa ser paga no mandato sem disponibilidade de caixa.`},{a:2022,r:`FCC/TCE-2022`,q:`O Resultado NOMINAL difere do PRIMARIO porque:`,o:[`A) Inclui os juros nominais da divida`,`B) Exclui as receitas`,`C) So considera o PIB`,`D) Ignora as despesas`,`E) E sempre positivo`],g:`A`,c:`NOMINAL=Primario - Juros nominais. Mede a variacao total da divida. Pode haver superavit primario e deficit nominal.`},{a:2021,r:`FCC/SEFAZ-2021`,q:`A regra de ouro (CF/LRF) veda:`,o:[`A) Qualquer endividamento`,`B) Operacoes de credito que superem as despesas de capital`,`C) Pagar juros`,`D) Investir`,`E) Arrecadar acima da meta`],g:`B`,c:`Regra de ouro (art. 167, III CF): veda operacoes de credito que excedam as despesas de capital (evita financiar custeio com divida).`},{a:2020,r:`FCC/TRT-2020`,q:`A RCL (Receita Corrente Liquida) e a base para:`,o:[`A) Calcular o PIB`,`B) Os limites de pessoal e divida na LRF`,`C) A inflacao`,`D) O cambio`,`E) A taxa Selic`],g:`B`,c:`RCL=base de calculo dos limites da LRF (pessoal, divida, garantias). Soma das receitas correntes com deducoes legais.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`A ARO (operacao de credito por antecipacao de receita):`,o:[`A) E proibida`,`B) Destina-se a atender insuficiencia de caixa e deve ser quitada ate 10/12`,`C) Nao tem prazo`,`D) E permanente`,`E) Independe de autorizacao`],g:`B`,c:`ARO: cobre insuficiencia de caixa no exercicio, liquidada ate 10 de dezembro. Vedada no ultimo ano de mandato.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na LRF, despesa obrigatoria de carater continuado (DOCC) e a que:`,o:[`A) Dura menos de 1 ano`,`B) Fixa obrigacao legal de execucao por periodo superior a 2 exercicios`,`C) E facultativa`,`D) E de capital`,`E) Nao tem fonte`],g:`B`,c:`Art. 17 LRF: DOCC = despesa corrente derivada de lei/ato que fixe obrigacao por mais de 2 exercicios; exige estimativa de impacto e compensacao.`},{a:2023,r:`FCC/TCE-2023`,q:`A Receita Corrente Liquida (RCL) e apurada somando as receitas dos:`,o:[`A) Ultimos 6 meses`,`B) Mes de referencia e os 11 anteriores (12 meses)`,`C) Ano civil`,`D) Mandato`,`E) Quadrimestre`],g:`B`,c:`RCL = somatorio das receitas correntes do mes de referencia + os 11 meses anteriores, com as deducoes legais (periodo movel de 12 meses).`},{a:2022,r:`FCC/PGE-2022`,q:`Atingido o limite de despesa com pessoal, se nao houver reconducao em 2 quadrimestres:`,o:[`A) Nada ocorre`,`B) Aplicam-se vedacoes como suspensao de transferencias voluntarias e contratacao de operacoes de credito`,`C) O ente e extinto`,`D) Aumenta-se a RCL`,`E) Suspende-se a LOA`],g:`B`,c:`Ultrapassado o limite e nao recomposto nos 2 quadrimestres seguintes, ha vedacoes: transferencias voluntarias, operacoes de credito (salvo refinanciamento) e garantias.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O Anexo de Metas Fiscais integra a:`,o:[`A) LOA`,`B) LDO`,`C) PPA`,`D) CF`,`E) Lei de crimes fiscais`],g:`B`,c:`O Anexo de Metas Fiscais (receitas, despesas, resultados nominal e primario, divida) integra a LDO (art. 4, par.1 LRF).`},{a:2023,r:`FCC/TCE-2023`,q:`A 'regra de ouro' constitucional veda:`,o:[`A) Deficit primario`,`B) Operacoes de credito que excedam as despesas de capital`,`C) Superavit nominal`,`D) Endividamento externo`,`E) Pagamento de juros`],g:`B`,c:`Art. 167, III CF (regra de ouro): proibe operacoes de credito que superem as despesas de capital, salvo creditos suplementares/especiais autorizados por maioria absoluta.`},{a:2022,r:`FCC/PGE-2022`,q:`A reserva de contingencia na LOA destina-se a:`,o:[`A) Pagar pessoal`,`B) Atender passivos contingentes e riscos/eventos fiscais imprevistos`,`C) Investimentos`,`D) Amortizar divida`,`E) Distribuir a estados`],g:`B`,c:`Reserva de contingencia (art. 5, III LRF): definida na LOA com base na RCL, para passivos contingentes e outros riscos/eventos fiscais imprevistos.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A transferencia voluntaria, segundo a LRF, exige do ente recebedor:`,o:[`A) Apenas o pedido`,`B) Comprovacao de regularidade (tributos, contas, limites) e contrapartida`,`C) Nada`,`D) Autorizacao do TCU`,`E) Operacao de credito`],g:`B`,c:`Art. 25 LRF: transferencia voluntaria exige do beneficiario regularidade fiscal/previdenciaria, observancia dos limites e previsao de contrapartida no orcamento.`},{a:2023,r:`FCC/TCE-2023`,q:`O resultado primario superavitario contribui para:`,o:[`A) Aumentar a divida`,`B) Reduzir a necessidade de financiamento e estabilizar/abater a divida`,`C) Elevar os juros`,`D) Reduzir a RCL`,`E) Aumentar o deficit nominal sempre`],g:`B`,c:`Superavit primario reduz a necessidade de novo endividamento e ajuda a abater a divida; se superar os juros, a divida liquida cai.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A LRF veda ao titular de Poder, nos ultimos 180 dias do mandato:`,o:[`A) Pagar fornecedores`,`B) Aumentar despesa com pessoal (ato que resulte aumento)`,`C) Arrecadar`,`D) Empenhar despesas correntes`,`E) Editar a LDO`],g:`B`,c:`Art. 21, PU LRF: e NULO o ato que resulte aumento de despesa com pessoal expedido nos 180 dias anteriores ao fim do mandato do titular do Poder/orgao.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O limite de gastos com pessoal para o Poder Judiciario estadual e de:`,o:[`A) 49% da RCL`,`B) 6% da RCL`,`C) 3% da RCL`,`D) 2% da RCL`,`E) 60% da RCL`],g:`B`,c:`Reparticao do limite de pessoal nos Estados (60% total): Executivo 49%, Legislativo+TC 3%, JUDICIARIO 6%, Ministerio Publico 2%.`},{a:2022,r:`FCC/PGE-2022`,q:`A operacao de credito por antecipacao de receita orcamentaria (ARO):`,o:[`A) Pode ser feita no ultimo ano de mandato`,`B) E vedada no ultimo ano de mandato do chefe do Executivo`,`C) Nao tem prazo de quitacao`,`D) Independe de juros`,`E) E permanente`],g:`B`,c:`Art. 38 LRF: a ARO deve ser liquidada ate 10/dez do mesmo exercicio e e VEDADA no ULTIMO ANO de mandato do chefe do Poder Executivo.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A renuncia de receita (LRF) exige:`,o:[`A) Apenas decreto`,`B) Estimativa do impacto e medidas de compensacao ou demonstracao de que nao afeta as metas`,`C) Autorizacao do TCU`,`D) Aprovacao popular`,`E) Nada`],g:`B`,c:`Art. 14 LRF: a concessao de beneficio que renuncie receita exige estimativa de impacto orcamentario-financeiro e medidas de COMPENSACAO (ou demonstracao de nao afetar as metas).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O Relatorio Resumido da Execucao Orcamentaria (RREO) e publicado:`,o:[`A) Anualmente`,`B) Bimestralmente, ate 30 dias apos o bimestre`,`C) Quadrimestralmente`,`D) Mensalmente`,`E) Semestralmente`],g:`B`,c:`RREO: BIMESTRAL, publicado em ate 30 dias apos o encerramento do bimestre (art. 52-53 LRF). O RGF e quadrimestral.`},{a:2022,r:`FCC/PGE-2022`,q:`A despesa total com pessoal abrange:`,o:[`A) Apenas vencimentos`,`B) Vencimentos, vantagens, encargos sociais, aposentadorias e pensoes`,`C) So aposentadorias`,`D) Material de consumo`,`E) Investimentos`],g:`B`,c:`Art. 18 LRF: despesa com pessoal = somatorio de vencimentos, vantagens, subsidios, proventos de aposentadoria, pensoes, encargos sociais e contribuicoes.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A meta de resultado primario e estabelecida:`,o:[`A) Na LOA`,`B) No Anexo de Metas Fiscais da LDO`,`C) No PPA`,`D) Na CF`,`E) Em decreto`],g:`B`,c:`A meta de resultado primario consta do ANEXO DE METAS FISCAIS da LDO (art. 4 LRF), orientando a execucao orcamentaria do exercicio.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Se a despesa com pessoal exceder 95% do limite (prudencial), veda-se:`,o:[`A) Nada`,`B) Concessao de vantagem, criacao de cargo, contratacao e horas extras`,`C) Pagamento de salarios`,`D) Arrecadacao`,`E) Empenho de custeio`],g:`B`,c:`Atingido o limite PRUDENCIAL (95% do limite), vedam-se: aumento/reajuste, criacao de cargo, alteracao de estrutura que eleve gasto, contratacao (salvo reposicao) e horas extras (com ressalvas).`},{a:2022,r:`FCC/PGE-2022`,q:`O resultado nominal mede:`,o:[`A) O esforco fiscal sem juros`,`B) A variacao da divida fiscal liquida (inclui juros)`,`C) So as receitas`,`D) O PIB`,`E) O superavit primario`],g:`B`,c:`Resultado NOMINAL = variacao da divida fiscal liquida no periodo = resultado primario - juros nominais. Mede o endividamento total.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A transparencia na gestao fiscal (LRF) inclui:`,o:[`A) Sigilo das contas`,`B) Divulgacao ampla, inclusive em meios eletronicos, e incentivo a participacao popular`,`C) Restricao de acesso`,`D) Publicacao so anual`,`E) Apenas relatorio interno`],g:`B`,c:`Art. 48 LRF: a transparencia fiscal preve divulgacao ampla (inclusive internet/portais), versoes simplificadas e incentivo a participacao popular em audiencias publicas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`RCL de um Estado = 10 bilhoes. O limite MAXIMO de despesa com pessoal do Executivo (49%) e:`,o:[`A) 6 bilhoes`,`B) 4,9 bilhoes`,`C) 6,9 bilhoes`,`D) 5 bilhoes`,`E) 4 bilhoes`],g:`B`,c:`Executivo estadual: 49% da RCL = 0,49 x 10 bi = 4,9 bilhoes. O limite global do Estado e 60% (6 bi).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Atingido o limite, o ente tem prazo para reconducao de:`,o:[`A) 1 ano`,`B) Dois quadrimestres, eliminando o excedente (ao menos 1/3 no primeiro)`,`C) 5 anos`,`D) Imediato`,`E) Um exercicio completo`],g:`B`,c:`Art. 23 LRF: o excedente deve ser eliminado em ate DOIS QUADRIMESTRES subsequentes, sendo pelo menos 1/3 no primeiro. Nao cumprido, aplicam-se as vedacoes do art. 23, par.3.`},{a:2022,r:`FCC/PGE-2022`,q:`O resultado primario de um ente: receitas nao financeiras 100; despesas nao financeiras 90; juros 15. O primario e:`,o:[`A) -5`,`B) +10`,`C) -15`,`D) +25`,`E) +90`],g:`B`,c:`Primario = receitas nao financeiras - despesas nao financeiras = 100 - 90 = +10 (superavit primario). Os juros (15) entram so no resultado nominal.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Com o primario de +10 e juros de 15, o resultado NOMINAL e:`,o:[`A) +25`,`B) -5`,`C) +10`,`D) -15`,`E) +5`],g:`B`,c:`Nominal = primario - juros = 10 - 15 = -5 (deficit nominal). Ha superavit primario, mas o pagamento de juros gera deficit nominal (a divida cresce).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A LRF veda transferencia voluntaria a ente que:`,o:[`A) Tenha superavit`,`B) Esteja em descumprimento de limites (pessoal, divida) ou irregular, exceto para saude, educacao e assistencia`,`C) Pague em dia`,`D) Tenha RCL alta`,`E) Seja municipio`],g:`B`,c:`Art. 25, par.3: descumpridos os limites/condicoes, suspendem-se transferencias voluntarias, EXCETO as destinadas a saude, educacao e assistencia social (areas essenciais).`},{a:2022,r:`FCC/PGE-2022`,q:`A insuficiencia financeira para inscricao de restos a pagar no fim do mandato (art. 42) caracteriza:`,o:[`A) Boa gestao`,`B) Conduta vedada - deixar despesa sem disponibilidade de caixa para o sucessor`,`C) Superavit`,`D) Credito adicional`,`E) Renuncia de receita`],g:`B`,c:`Art. 42 LRF: nos 2 ultimos quadrimestres do mandato, e VEDADO contrair obrigacao de despesa que nao possa ser paga no exercicio ou que deixe restos a pagar sem disponibilidade de caixa.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Divida consolidada liquida acima do limite do Senado obriga o ente a:`,o:[`A) Nada`,`B) Reconduzi-la ao limite em ate 3 quadrimestres, com vedacao de novas operacoes de credito enquanto excedida`,`C) Aumentar gastos`,`D) Reduzir a RCL`,`E) Suspender a LOA`],g:`B`,c:`Excedido o limite da divida consolidada (Resolucoes do Senado), o ente deve reconduzi-la em ate 3 quadrimestres, ficando proibido de contrair novas operacoes de credito (salvo refinanciamento) enquanto durar o excesso.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O 'waiver' (dispensa) de limites por calamidade publica reconhecida:`,o:[`A) Nunca ocorre`,`B) Pode suspender prazos e vedacoes da LRF enquanto perdurar a calamidade`,`C) Aumenta os limites permanentemente`,`D) Extingue a divida`,`E) E automatico todo ano`],g:`B`,c:`Em estado de CALAMIDADE PUBLICA reconhecido, a LRF (art. 65) permite a suspensao de prazos de reconducao e de vedacoes/sancoes enquanto perdurar a situacao, flexibilizando temporariamente as regras.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O conceito de 'despesa obrigatoria de carater continuado' e relevante porque exige:`,o:[`A) Apenas previsao na LOA`,`B) Compensacao (aumento de receita ou reducao de despesa) ao ser criada/aumentada`,`C) Decreto`,`D) Convenio`,`E) Nada`],g:`B`,c:`DOCC (art. 17 LRF): ao criar/aumentar despesa obrigatoria continuada, exige-se estimativa de impacto trienal e medidas de COMPENSACAO (elevacao de receita ou reducao permanente de outra despesa).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A LRF aplica-se:`,o:[`A) So a Uniao`,`B) A Uniao, Estados, DF e Municipios (todos os entes), abrangendo os tres Poderes e o MP`,`C) So ao Executivo`,`D) So a estatais`,`E) Apenas a municipios`],g:`B`,c:`A LRF (art. 1) alcanca a Uniao, Estados, DF e Municipios, abrangendo os Poderes Executivo, Legislativo e Judiciario, o Ministerio Publico e a administracao direta e indireta.`},{a:2022,r:`FCC/PGE-2022`,q:`O contingenciamento (limitacao de empenho) NAO pode atingir:`,o:[`A) Investimentos`,`B) Despesas que constituam obrigacoes constitucionais/legais e o servico da divida`,`C) Custeio`,`D) Publicidade`,`E) Diarias`],g:`B`,c:`Art. 9, par.2 LRF: a limitacao de empenho NAO incide sobre despesas que constituam OBRIGACOES CONSTITUCIONAIS E LEGAIS (inclusive servico da divida) e as ressalvadas pela LDO.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O Relatorio de Gestao Fiscal (RGF) e assinado pelo:`,o:[`A) Contador apenas`,`B) Titular de cada Poder/orgao (e demais responsaveis pela administracao financeira/controle interno)`,`C) Governador so`,`D) TCU`,`E) Ministro`],g:`B`,c:`O RGF e assinado pelo TITULAR de cada Poder/orgao e tambem pelas autoridades responsaveis pela administracao financeira e pelo controle interno (art. 54 LRF).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A previsao e a efetiva arrecadacao de TODOS os tributos da competencia constitucional do ente sao, na LRF:`,o:[`A) Facultativas`,`B) Requisitos essenciais da responsabilidade na gestao fiscal`,`C) Vedadas`,`D) Opcionais para municipios`,`E) Irrelevantes`],g:`B`,c:`Art. 11 LRF: constituem requisitos ESSENCIAIS da responsabilidade fiscal a instituicao, previsao e efetiva ARRECADACAO de todos os tributos da competencia do ente (veda transferencias voluntarias a quem nao arrecada seus impostos).`},{a:2022,r:`FCC/PGE-2022`,q:`O resultado primario alvo nao alcancado obriga a:`,o:[`A) Aumentar gastos`,`B) Limitacao de empenho e movimentacao financeira (contingenciamento) no bimestre seguinte`,`C) Reduzir a RCL`,`D) Suspender a LOA`,`E) Demitir servidores`],g:`B`,c:`Se a realizacao da receita nao comportar as metas de resultado primario/nominal, os Poderes/MP promovem, por ato proprio, a LIMITACAO DE EMPENHO e movimentacao financeira (art. 9, contingenciamento).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A divida mobiliaria refere-se a:`,o:[`A) Emprestimos contratuais`,`B) Divida representada por TITULOS emitidos pelo ente (ex: titulos do Tesouro)`,`C) Restos a pagar`,`D) Precatorios`,`E) Caucao`],g:`B`,c:`Divida MOBILIARIA: representada por TITULOS emitidos pela Uniao, Estados ou Municipios (ex: titulos publicos). Difere da divida contratual (contratos de emprestimo).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O principio do equilibrio fiscal sustentavel na LRF busca:`,o:[`A) Gastar o maximo`,`B) Acao planejada e transparente, prevenindo riscos e corrigindo desvios que afetem o equilibrio das contas`,`C) Aumentar a divida`,`D) Reduzir a arrecadacao`,`E) Eliminar o planejamento`],g:`B`,c:`A LRF (art. 1, par.1) define gestao fiscal responsavel como acao PLANEJADA E TRANSPARENTE, que previne riscos e corrige desvios, mantendo o equilibrio das contas publicas.`}],"DFI-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Os estagios da DESPESA (Lei 4.320) sao:`,o:[`A) Previsao, lancamento, arrecadacao, recolhimento`,`B) Fixacao, empenho, liquidacao, pagamento`,`C) Programacao, reserva, empenho, quitacao`,`D) Dotacao, contingenciamento, empenho`,`E) Orcamentacao, cobranca, recebimento`],g:`B`,c:`Despesa: FIXACAO, EMPENHO (art. 58), LIQUIDACAO (art. 63), PAGAMENTO (art. 64).`},{a:2022,r:`FCC/TCE-2022`,q:`Creditos EXTRAORDINARIOS sao abertos:`,o:[`A) Por lei especifica`,`B) Por decreto do Executivo para despesas urgentes e improvistos, sem fonte previa`,`C) So com autorizacao legislativa previa`,`D) Para reforcar dotacoes`,`E) Com indicacao de fonte obrigatoria`],g:`B`,c:`EXTRAORDINARIOS: urgentes/improvistos (guerra, calamidade) -> decreto do Executivo, comunicacao posterior, SEM indicacao previa de fonte.`},{a:2021,r:`FCC/PGE-2021`,q:`A LDO tem por finalidade:`,o:[`A) Autorizar despesas do exercicio`,`B) Orientar a elaboracao da LOA, metas e riscos fiscais`,`C) Detalhar o PPA`,`D) Criar fundos`,`E) Estabelecer prioridades sem conteudo fiscal`],g:`B`,c:`LDO: orienta a LOA, fixa metas fiscais (anexo de metas) e riscos fiscais, criterios de limitacao de empenho. PPA=longo prazo; LOA=autoriza despesas.`},{a:2020,r:`FCC/TRT-2020`,q:`O principio orcamentario da UNIVERSALIDADE exige que:`,o:[`A) O orcamento dure 1 ano`,`B) Todas as receitas e despesas constem do orcamento`,`C) Haja um unico orcamento`,`D) Valores liquidos`,`E) Especificacao detalhada`],g:`B`,c:`UNIVERSALIDADE: o orcamento deve conter TODAS as receitas e despesas. ANUALIDADE=1 ano; UNIDADE=orcamento unico.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`Creditos SUPLEMENTARES destinam-se a:`,o:[`A) Novas dotacoes`,`B) Reforco de dotacao orcamentaria existente`,`C) Despesas urgentes`,`D) Calamidade`,`E) Guerra`],g:`B`,c:`SUPLEMENTARES: reforco de dotacao JA existente (a LOA pode ja autorizar). ESPECIAIS: novas dotacoes. EXTRAORDINARIOS: urgentes.`},{a:2023,r:`FCC/TRT-2023`,q:`O EMPENHO da despesa (art. 58):`,o:[`A) Verifica o direito do credor`,`B) Cria para o Estado obrigacao de pagamento`,`C) Entrega o recurso ao credor`,`D) Fixa a dotacao`,`E) Arrecada a receita`],g:`B`,c:`EMPENHO: ato que cria para o Estado obrigacao de pagamento. LIQUIDACAO verifica o direito; PAGAMENTO entrega o recurso.`},{a:2022,r:`FCC/TCE-2022`,q:`Sao receitas de CAPITAL:`,o:[`A) Receita tributaria`,`B) Operacoes de credito, alienacao de bens, transferencias de capital`,`C) Receita patrimonial`,`D) Receita de servicos`,`E) Contribuicoes`],g:`B`,c:`Receitas de CAPITAL: operacoes de credito, alienacao de bens, amortizacao de emprestimos, transferencias de capital. Tributaria=corrente.`},{a:2021,r:`FCC/PGE-2021`,q:`O principio da EXCLUSIVIDADE orcamentaria significa que:`,o:[`A) Ha um unico orcamento`,`B) A LOA nao contem materia estranha a fixacao da despesa e previsao da receita`,`C) O orcamento e anual`,`D) Valores brutos`,`E) Receita vinculada`],g:`B`,c:`EXCLUSIVIDADE: a LOA so trata de receita e despesa (excecao: autorizacao de credito suplementar e operacoes de credito/ARO).`},{a:2020,r:`FCC/TRT-2020`,q:`A LIQUIDACAO da despesa (art. 63) consiste em:`,o:[`A) Criar a obrigacao`,`B) Verificar o direito do credor com base nos titulos e documentos`,`C) Pagar ao credor`,`D) Fixar dotacao`,`E) Empenhar`],g:`B`,c:`LIQUIDACAO: verificacao do direito do credor (apuracao da origem, importancia e a quem pagar), com base em documentos comprobatorios.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O PPA (Plano Plurianual) tem vigencia de:`,o:[`A) 1 ano`,`B) 2 anos`,`C) 4 anos`,`D) 5 anos`,`E) 8 anos`],g:`C`,c:`PPA: 4 anos (do 2o ano de um mandato ao 1o do mandato seguinte). Estabelece diretrizes, objetivos e metas regionalizadas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O credito ESPECIAL destina-se a:`,o:[`A) Reforcar dotacao existente`,`B) Despesas para as quais nao haja dotacao orcamentaria especifica`,`C) Guerra e calamidade`,`D) Pagar pessoal`,`E) Amortizar divida`],g:`B`,c:`Credito ESPECIAL: para despesas sem dotacao especifica (cria nova rubrica), depende de autorizacao legislativa e indicacao de fonte.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O principio da NAO AFETACAO da receita de impostos veda:`,o:[`A) Cobrar impostos`,`B) Vincular receita de impostos a orgao, fundo ou despesa, salvo excecoes constitucionais`,`C) Arrecadar taxas`,`D) Criar fundos`,`E) Transferir a estados`],g:`B`,c:`Art. 167, IV CF: veda a vinculacao de receita de IMPOSTOS, salvo excecoes (saude, educacao, FPE/FPM, garantias a Uniao etc.). Taxas e contribuicoes podem ser vinculadas.`},{a:2022,r:`FCC/PGE-2022`,q:`O orcamento-programa caracteriza-se por:`,o:[`A) Listar so despesas por objeto`,`B) Vincular recursos a programas, objetivos e metas (enfase em resultados)`,`C) Ser anual apenas`,`D) Nao ter planejamento`,`E) Ser incremental`],g:`B`,c:`Orcamento-PROGRAMA: organiza os gastos por programas/acoes com objetivos e metas, integrando planejamento e orcamento (base do PPA-LDO-LOA brasileiro).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A vedacao do estorno de verbas (art. 167, VI CF) impede:`,o:[`A) Empenhar despesas`,`B) Transpor, remanejar ou transferir recursos de uma categoria para outra sem autorizacao legislativa`,`C) Arrecadar`,`D) Pagar credores`,`E) Abrir creditos extraordinarios`],g:`B`,c:`Art. 167, VI: veda a transposicao, remanejamento ou transferencia de recursos de uma categoria de programacao para outra SEM previa autorizacao legislativa.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O ciclo orcamentario compreende as fases de:`,o:[`A) So execucao`,`B) Elaboracao, aprovacao (apreciacao legislativa), execucao e controle/avaliacao`,`C) Apenas planejamento`,`D) So controle`,`E) Empenho e pagamento`],g:`B`,c:`Ciclo orcamentario: ELABORACAO (Executivo) -> APRECIACAO/APROVACAO (Legislativo) -> EXECUCAO -> CONTROLE e avaliacao.`},{a:2022,r:`FCC/PGE-2022`,q:`As transferencias constitucionais (FPE, FPM) sao:`,o:[`A) Voluntarias`,`B) Obrigatorias, decorrentes de mandamento constitucional`,`C) Facultativas`,`D) Convenios`,`E) Operacoes de credito`],g:`B`,c:`FPE/FPM e demais repartições de receitas sao transferencias OBRIGATORIAS (constitucionais), distintas das transferencias VOLUNTARIAS (convenios).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O principio do EQUILIBRIO orcamentario preconiza:`,o:[`A) Mais despesa que receita`,`B) Equivalencia entre receitas e despesas previstas`,`C) Superavit obrigatorio`,`D) Deficit permanente`,`E) Ausencia de planejamento`],g:`B`,c:`Principio do EQUILIBRIO: as despesas fixadas devem guardar equivalencia com as receitas previstas, reforcado pela LRF (gestao fiscal responsavel).`},{a:2023,r:`FCC/Fiscal-2023`,q:`A despesa de capital denominada 'inversao financeira' inclui:`,o:[`A) Pagamento de pessoal`,`B) Aquisicao de imoveis ja em uso ou de titulos representativos de capital`,`C) Juros da divida`,`D) Material de consumo`,`E) Diarias`],g:`B`,c:`INVERSOES FINANCEIRAS: aquisicao de imoveis/bens ja em utilizacao, de participacoes acionarias, concessao de emprestimos. Diferente de INVESTIMENTOS (bens novos).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O credito SUPLEMENTAR pode ser autorizado:`,o:[`A) Apenas por lei especifica`,`B) Na propria LOA (ate certo limite), aberto por decreto do Executivo`,`C) So por MP`,`D) Por convenio`,`E) Por resolucao`],g:`B`,c:`O credito SUPLEMENTAR (reforco de dotacao) pode ser previamente autorizado na LOA ate um limite/percentual, sendo aberto por DECRETO do Executivo dentro desse limite.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O principio orcamentario da PROGRAMACAO exige que o orcamento:`,o:[`A) Seja so uma lista de gastos`,`B) Contenha objetivos e metas, vinculando recursos a programas`,`C) Seja anual apenas`,`D) Tenha valores liquidos`,`E) Seja unico`],g:`B`,c:`Principio da PROGRAMACAO: o orcamento deve expressar objetivos, metas e programas (orcamento-programa), nao apenas autorizar gastos por objeto.`},{a:2022,r:`FCC/PGE-2022`,q:`Receita extraorcamentaria caracteriza-se por:`,o:[`A) Constar da LOA`,`B) Ingressos transitorios que nao pertencem ao ente (ex: cauções, depositos)`,`C) Ser tributo`,`D) Ser permanente`,`E) Financiar despesas`],g:`B`,c:`Receita EXTRAORCAMENTARIA: ingressos transitorios (cauções, depositos, retencoes) que NAO pertencem definitivamente ao ente e serao devolvidos; nao constam da LOA.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A LOA compreende os orcamentos:`,o:[`A) Apenas fiscal`,`B) Fiscal, da seguridade social e de investimento das estatais`,`C) So da seguridade`,`D) Municipal apenas`,`E) De capital`],g:`B`,c:`Art. 165, par.5 CF: a LOA compreende o orcamento FISCAL, o da SEGURIDADE SOCIAL e o de INVESTIMENTO das empresas estatais.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O estagio do empenho pode ser dispensado:`,o:[`A) Sempre`,`B) Em casos previstos em lei especifica (excecao), nao como regra`,`C) Nas despesas de capital`,`D) No pagamento`,`E) Na liquidacao`],g:`B`,c:`Em regra o empenho e obrigatorio (art. 60 Lei 4.320: e vedada despesa sem empenho). Apenas casos especificos previstos em lei admitem dispensa/empenho por estimativa.`},{a:2022,r:`FCC/PGE-2022`,q:`A despesa de exercicios anteriores (DEA) refere-se a:`,o:[`A) Despesa do ano corrente`,`B) Despesas de exercicios encerrados, nao processadas na epoca propria, pagas a conta de dotacao do exercicio vigente`,`C) Restos a pagar`,`D) Investimento`,`E) Receita`],g:`B`,c:`DEA: dividas de exercicios ENCERRADOS, que nao foram processadas na epoca propria, reconhecidas e pagas a conta de dotacao especifica do orcamento vigente.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Credito ADICIONAL aberto por decreto, sem autorizacao legislativa previa nem indicacao de fonte, so e admitido na modalidade:`,o:[`A) Suplementar`,`B) Extraordinario (despesas urgentes e imprevisiveis)`,`C) Especial`,`D) Ordinario`,`E) Nenhuma`],g:`B`,c:`O credito EXTRAORDINARIO (guerra, comocao, calamidade) e o unico aberto por DECRETO/MP, sem autorizacao previa nem indicacao de fonte, dada a urgencia (art. 167, par.3 CF; art. 44 Lei 4.320).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Os creditos especiais e extraordinarios autorizados nos ultimos 4 meses do exercicio:`,o:[`A) Perdem a validade`,`B) Podem ser reabertos no exercicio seguinte, nos limites de seus saldos`,`C) Viram suplementares`,`D) Sao cancelados`,`E) Dobram de valor`],g:`B`,c:`Art. 167, par.2 CF: os creditos ESPECIAIS e EXTRAORDINARIOS autorizados nos ultimos 4 meses do exercicio podem ser REABERTOS no exercicio seguinte, ate o limite de seus saldos, incorporando-se ao novo orcamento.`},{a:2022,r:`FCC/PGE-2022`,q:`A vinculacao de receita de impostos a saude e educacao e:`,o:[`A) Vedada`,`B) Excecao constitucional permitida ao principio da nao afetacao`,`C) Facultativa`,`D) Aplicavel a taxas`,`E) Inconstitucional`],g:`B`,c:`A nao-afetacao (art. 167, IV) veda vincular receita de impostos, MAS a propria CF excepciona: saude, educacao (MDE), FPE/FPM, administracao tributaria e garantias a Uniao podem ser vinculadas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O orcamento impositivo (emendas individuais obrigatorias) determina que:`,o:[`A) Sao facultativas`,`B) Parte das emendas parlamentares e de execucao obrigatoria pelo Executivo`,`C) Nao existem emendas`,`D) So o Executivo emenda`,`E) Sao vedadas`],g:`B`,c:`O ORCAMENTO IMPOSITIVO (EC 86/2015 e seguintes) tornou de execucao OBRIGATORIA parte das emendas parlamentares individuais e de bancada, limitando a discricionariedade do Executivo.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O principio da especificacao (especializacao) orcamentaria exige:`,o:[`A) Valores globais`,`B) Discriminacao das despesas por orgaos, funcoes e programas (evitar dotacoes genericas)`,`C) Orcamento unico`,`D) Vinculacao total`,`E) Anualidade`],g:`B`,c:`Principio da ESPECIFICACAO/ESPECIALIZACAO: as receitas e despesas devem ser DISCRIMINADAS (por orgao, funcao, programa, natureza), vedadas dotacoes globais/genericas (art. 5 e 15 Lei 4.320).`},{a:2022,r:`FCC/PGE-2022`,q:`A Lei 4.320/64 estabelece normas gerais de:`,o:[`A) Licitacao`,`B) Direito financeiro para elaboracao e controle dos orcamentos e balancos`,`C) Tributacao`,`D) Improbidade`,`E) Servidores`],g:`B`,c:`A Lei 4.320/64 estatui normas gerais de DIREITO FINANCEIRO para elaboracao e controle dos ORCAMENTOS e BALANCOS da Uniao, Estados, Municipios e DF (recepcionada como LC).`}],"CGP-1":[{a:2023,r:`FCC/TCE-2023`,q:`Os estagios da RECEITA orcamentaria (MCASP) sao:`,o:[`A) Empenho, liquidacao, pagamento, recolhimento`,`B) Previsao, lancamento, arrecadacao, recolhimento`,`C) Fixacao, empenho, arrecadacao`,`D) Programacao, reserva, movimentacao`,`E) Orcamentacao, cobranca, deposito`],g:`B`,c:`Receita: PREVISAO (LOA), LANCAMENTO (art. 53), ARRECADACAO (banco), RECOLHIMENTO (Tesouro/conta unica).`},{a:2022,r:`FCC/TCE-2022`,q:`Os Restos a Pagar PROCESSADOS sao aqueles com:`,o:[`A) Apenas empenho`,`B) Empenho e liquidacao realizados (direito verificado)`,`C) Pagamento efetuado`,`D) So dotacao`,`E) Liquidacao cancelada`],g:`B`,c:`RP PROCESSADOS: empenho + liquidacao feitos -> Estado deve pagar. NAO PROCESSADOS: so empenho (liquidacao pendente).`},{a:2021,r:`FCC/PGE-2021`,q:`As caracteristicas qualitativas FUNDAMENTAIS (NBC TSP) sao:`,o:[`A) Comparabilidade e verificabilidade`,`B) Relevancia e representacao fidedigna`,`C) Tempestividade e compreensibilidade`,`D) Objetividade e consistencia`,`E) Neutralidade e prudencia`],g:`B`,c:`FUNDAMENTAIS: relevancia + representacao fidedigna. DE MELHORIA: comparabilidade, verificabilidade, tempestividade, compreensibilidade.`},{a:2020,r:`FCC/TCM-2020`,q:`No PCASP, a classe que registra Variacoes Patrimoniais Diminutivas (VPD) e:`,o:[`A) Classe 1 (Ativo)`,`B) Classe 3 (VPD)`,`C) Classe 4 (VPA)`,`D) Classe 2 (Passivo)`,`E) Classe 5`],g:`B`,c:`PCASP: 1-Ativo, 2-Passivo, 3-VPD (diminutivas), 4-VPA (aumentativas), 5/6-controles, 7/8-especificos.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O EMPENHO ESTIMATIVO e utilizado quando:`,o:[`A) O valor e exato`,`B) Nao se conhece previamente o valor exato (ex: agua, energia)`,`C) E contrato parcelado`,`D) Ha calamidade`,`E) E despesa de capital`],g:`B`,c:`EMPENHO ESTIMATIVO: valor nao exatamente determinado (servicos continuados como agua/energia). ORDINARIO=valor certo; GLOBAL=parcelado.`},{a:2023,r:`FCC/TRT-2023`,q:`A Demonstracao das Variacoes Patrimoniais (DVP) evidencia:`,o:[`A) Apenas o orcamento`,`B) As variacoes quantitativas e qualitativas do patrimonio`,`C) Os restos a pagar`,`D) A divida ativa`,`E) O fluxo de caixa`],g:`B`,c:`DVP: variacoes patrimoniais aumentativas (VPA) e diminutivas (VPD), apurando o resultado patrimonial do periodo.`},{a:2022,r:`FCC/TCE-2022`,q:`O regime contabil adotado para a RECEITA no setor publico (Lei 4.320) e:`,o:[`A) Competencia integral`,`B) Caixa para a receita`,`C) Competencia para receita e despesa`,`D) Misto invertido`,`E) So competencia para despesa`],g:`B`,c:`Lei 4.320: regime de CAIXA para a receita (reconhecida na arrecadacao) e COMPETENCIA para a despesa (empenhada). MCASP avanca para competencia patrimonial.`},{a:2021,r:`FCC/PGE-2021`,q:`O RECOLHIMENTO, ultimo estagio da receita, consiste em:`,o:[`A) Prever na LOA`,`B) Entregar os valores arrecadados ao Tesouro (conta unica)`,`C) Lancar o credito`,`D) Pagar o credor`,`E) Empenhar`],g:`B`,c:`RECOLHIMENTO: transferencia dos valores arrecadados pelos agentes para a conta unica do Tesouro (principio da unidade de tesouraria).`},{a:2020,r:`FCC/TCM-2020`,q:`Os Restos a Pagar sao inscritos em:`,o:[`A) 1 de janeiro`,`B) 31 de dezembro (despesas empenhadas e nao pagas)`,`C) 30 de junho`,`D) Qualquer data`,`E) Inicio do mandato`],g:`B`,c:`RP: despesas empenhadas e nao pagas ate 31/12. Processados (liquidados) e nao processados (so empenhados).`},{a:2019,r:`FCC/SEFAZ-2019`,q:`A NBC TSP 01 trata de:`,o:[`A) Estoques`,`B) Apresentacao das demonstracoes contabeis`,`C) Receita de tributos`,`D) Ativo imobilizado`,`E) Provisoes`],g:`B`,c:`NBC TSP 01: apresentacao das demonstracoes contabeis (equivale a IPSAS 1): BP, DVP, DFC, DMPL e notas explicativas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No regime orcamentario da Lei 4.320, pertencem ao exercicio financeiro:`,o:[`A) As receitas arrecadadas e as despesas legalmente empenhadas`,`B) So o que foi pago`,`C) Apenas a previsao`,`D) Receitas e despesas de competencia`,`E) Somente os restos a pagar`],g:`A`,c:`Art. 35 Lei 4.320: pertencem ao exercicio as RECEITAS nele arrecadadas (caixa) e as DESPESAS nele legalmente EMPENHADAS (compromisso).`},{a:2023,r:`FCC/TCE-2023`,q:`A divida ativa tributaria e inscrita apos:`,o:[`A) O fato gerador`,`B) Esgotado o prazo de pagamento e apurada a liquidez e certeza do credito`,`C) O empenho`,`D) A previsao na LOA`,`E) O lancamento provisorio`],g:`B`,c:`A inscricao em divida ativa ocorre apos esgotado o prazo para pagamento, conferindo liquidez e certeza ao credito e gerando a CDA (titulo executivo).`},{a:2022,r:`FCC/TCM-2022`,q:`No PCASP, a conta 'Variacao Patrimonial Aumentativa' representa:`,o:[`A) Reducao do patrimonio`,`B) Aumento da situacao liquida (ex: receita de impostos)`,`C) Despesa orcamentaria`,`D) Passivo`,`E) Restos a pagar`],g:`B`,c:`VPA (classe 4): aumentos da situacao patrimonial liquida (impostos, contribuicoes, exploracao de bens) - regime de competencia patrimonial.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A despesa publica, quanto a categoria economica, divide-se em:`,o:[`A) Tributaria e patrimonial`,`B) Correntes e de capital`,`C) Ordinaria e extraordinaria`,`D) Fixa e variavel`,`E) Direta e indireta`],g:`B`,c:`Despesas: CORRENTES (custeio, pessoal, juros) e de CAPITAL (investimentos, inversoes financeiras, amortizacao da divida). Igual classificacao para receitas.`},{a:2023,r:`FCC/TCE-2023`,q:`O superavit financeiro apurado no Balanco Patrimonial:`,o:[`A) Nao pode ser usado`,`B) E fonte para abertura de creditos adicionais`,`C) E despesa`,`D) Compoe a divida`,`E) E receita tributaria`],g:`B`,c:`Art. 43 Lei 4.320: o superavit financeiro (ativo financeiro - passivo financeiro) e fonte para abertura de creditos suplementares e especiais.`},{a:2022,r:`FCC/TCM-2022`,q:`A natureza da receita orcamentaria por categoria economica inclui:`,o:[`A) Receitas correntes e de capital`,`B) Receitas fixas`,`C) Receitas extraordinarias`,`D) Receitas vinculadas apenas`,`E) Receitas diretas`],g:`A`,c:`Receitas: CORRENTES (tributaria, contribuicoes, patrimonial, servicos, transferencias correntes) e de CAPITAL (operacoes de credito, alienacao, transferencias de capital).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na contabilidade aplicada ao setor publico, o reconhecimento da despesa por competencia ocorre:`,o:[`A) No pagamento`,`B) Na liquidacao (fato gerador da VPD)`,`C) No empenho`,`D) Na previsao`,`E) Na inscricao em RP`],g:`B`,c:`Sob a otica patrimonial, a Variacao Patrimonial Diminutiva (despesa por competencia) e reconhecida na LIQUIDACAO, quando ocorre o fato gerador. O empenho e etapa orcamentaria.`},{a:2023,r:`FCC/TCE-2023`,q:`O Balanco Financeiro evidencia:`,o:[`A) Ativos e passivos`,`B) Receitas e despesas orcamentarias + recebimentos e pagamentos extraorcamentarios + saldos`,`C) So o resultado patrimonial`,`D) Apenas a divida ativa`,`E) As VPA e VPD`],g:`B`,c:`Balanco Financeiro (art. 103 Lei 4.320): receita e despesa orcamentarias, recebimentos e pagamentos extraorcamentarios, conjugados com os saldos de caixa inicial e final.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A receita orcamentaria sob a otica patrimonial e reconhecida:`,o:[`A) So na arrecadacao`,`B) Pelo regime de competencia, no fato gerador (ex: lancamento do tributo)`,`C) No recolhimento`,`D) Na previsao`,`E) No empenho`],g:`B`,c:`Sob a otica PATRIMONIAL (MCASP), a Variacao Patrimonial Aumentativa (receita) e reconhecida por COMPETENCIA, no fato gerador. A otica orcamentaria usa o regime de caixa para a receita.`},{a:2023,r:`FCC/TCE-2023`,q:`A despesa empenhada e nao liquidada ate 31/12 inscreve-se em:`,o:[`A) Restos a pagar processados`,`B) Restos a pagar NAO processados`,`C) Despesa de exercicios anteriores`,`D) Divida ativa`,`E) Superavit financeiro`],g:`B`,c:`RP NAO PROCESSADOS: empenho realizado, mas liquidacao pendente ao fim do exercicio. Processados: ja liquidados (Estado deve pagar).`},{a:2022,r:`FCC/TCM-2022`,q:`O ativo imobilizado no setor publico sofre:`,o:[`A) Apenas reavaliacao`,`B) Depreciacao, amortizacao ou exaustao, conforme o caso`,`C) Nenhum ajuste`,`D) So impairment`,`E) Correcao monetaria obrigatoria`],g:`B`,c:`No setor publico (MCASP), os bens sofrem DEPRECIACAO (bens moveis/imoveis), AMORTIZACAO (intangiveis) ou EXAUSTAO (recursos naturais), pelo regime de competencia.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A conta unica do Tesouro tem como principio a:`,o:[`A) Pluralidade de caixas`,`B) Unidade de tesouraria (centralizacao dos recursos)`,`C) Descentralizacao total`,`D) Vinculacao integral`,`E) Autonomia dos orgaos`],g:`B`,c:`Art. 56 Lei 4.320: principio da UNIDADE DE TESOURARIA - todos os recursos sao recolhidos a conta unica, vedada a fragmentacao em caixas especiais.`},{a:2023,r:`FCC/TCE-2023`,q:`A divida fundada (consolidada) compreende:`,o:[`A) Restos a pagar do exercicio`,`B) Compromissos de prazo superior a 12 meses`,`C) Despesas correntes`,`D) Receitas`,`E) Creditos extraordinarios`],g:`B`,c:`Divida FUNDADA/CONSOLIDADA: obrigacoes financeiras com prazo SUPERIOR A 12 MESES (e as de prazo inferior incluidas por lei orcamentaria). Flutuante: ate 12 meses.`},{a:2022,r:`FCC/TCM-2022`,q:`No PCASP, as contas de controle (classes 5 e 6) registram:`,o:[`A) Ativos e passivos`,`B) Atos potenciais e a execucao orcamentaria (controles devedores e credores)`,`C) Receitas`,`D) Despesas`,`E) Patrimonio liquido`],g:`B`,c:`Classes 5 (controles DEVEDORES) e 6 (controles CREDORES) registram atos potenciais e o controle da execucao orcamentaria (ex: previsao, fixacao, empenho).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O resultado patrimonial do exercicio e apurado na:`,o:[`A) Balanco Orcamentario`,`B) Demonstracao das Variacoes Patrimoniais (VPA - VPD)`,`C) Balanco Financeiro`,`D) DFC`,`E) Divida ativa`],g:`B`,c:`A DVP confronta as VPA (aumentativas) e VPD (diminutivas), apurando o RESULTADO PATRIMONIAL do periodo (superavit/deficit patrimonial).`},{a:2023,r:`FCC/TCE-2023`,q:`A fixacao da despesa ocorre na:`,o:[`A) Liquidacao`,`B) Lei Orcamentaria Anual (LOA)`,`C) No empenho`,`D) No pagamento`,`E) Na inscricao em RP`],g:`B`,c:`A FIXACAO da despesa (1o estagio) ocorre na LOA, que autoriza os gastos. Depois vem empenho, liquidacao e pagamento (execucao).`},{a:2022,r:`FCC/TCM-2022`,q:`A receita de capital 'operacoes de credito' representa:`,o:[`A) Tributos`,`B) Recursos captados por emprestimos/financiamentos (endividamento)`,`C) Aluguel de bens`,`D) Multas`,`E) Transferencias correntes`],g:`B`,c:`Operacoes de credito (receita de CAPITAL): ingressos provenientes de emprestimos e financiamentos (colocacao de titulos, contratos), aumentando a divida publica.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A inscricao de um credito tributario em divida ativa gera:`,o:[`A) Variacao patrimonial diminutiva`,`B) Variacao patrimonial aumentativa (reconhecimento de um ativo)`,`C) Despesa`,`D) Passivo`,`E) Nenhum efeito patrimonial`],g:`B`,c:`A inscricao em divida ativa reconhece um ATIVO (direito a receber), gerando VARIACAO PATRIMONIAL AUMENTATIVA na contabilidade patrimonial.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Empenho de 50.000, liquidado 30.000 e pago 20.000 no exercicio. Inscreve-se em RP processados e nao processados, respectivamente:`,o:[`A) 30.000 e 20.000`,`B) 10.000 processados e 20.000 nao processados`,`C) 20.000 e 30.000`,`D) 50.000 e 0`,`E) 0 e 50.000`],g:`B`,c:`Liquidado 30.000, pago 20.000 -> RP PROCESSADOS (liquidado e nao pago) = 10.000. Empenhado nao liquidado = 50.000-30.000 = 20.000 -> RP NAO PROCESSADOS.`},{a:2023,r:`FCC/TCE-2023`,q:`Sob a otica patrimonial, o reconhecimento de provisao para riscos fiscais gera:`,o:[`A) Despesa orcamentaria`,`B) Variacao patrimonial diminutiva (VPD) e um passivo`,`C) Receita`,`D) Ativo`,`E) Nenhum efeito`],g:`B`,c:`A constituicao de uma provisao (passivo de prazo/valor incertos) gera uma VPD (despesa por competencia patrimonial) e o reconhecimento de um PASSIVO, independentemente da execucao orcamentaria.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A depreciacao de um bem publico, na contabilidade patrimonial, e registrada como:`,o:[`A) Despesa orcamentaria (empenho)`,`B) Variacao patrimonial diminutiva, sem execucao orcamentaria`,`C) Receita`,`D) Passivo`,`E) Restos a pagar`],g:`B`,c:`A depreciacao e VPD (reduz o patrimonio por competencia), mas NAO tem natureza orcamentaria (nao ha empenho/pagamento). Afeta o resultado patrimonial, nao o orcamentario.`},{a:2023,r:`FCC/TCE-2023`,q:`O ingresso de uma caucao em garantia (deposito de terceiros) representa:`,o:[`A) Receita orcamentaria`,`B) Ingresso extraorcamentario (passivo a devolver)`,`C) VPA`,`D) Despesa`,`E) Divida ativa`],g:`B`,c:`Caucao/deposito de terceiros e ingresso EXTRAORCAMENTARIO: nao pertence ao ente, gera um passivo (obrigacao de devolver), nao transitando como receita orcamentaria.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Receita prevista 1.000.000, arrecadada 1.150.000. O excesso de arrecadacao de 150.000:`,o:[`A) Nao pode ser usado`,`B) E fonte para abertura de creditos adicionais (suplementar/especial)`,`C) Vira despesa`,`D) E devolvido`,`E) Compoe a divida`],g:`B`,c:`Art. 43 Lei 4.320: o EXCESSO DE ARRECADACAO (arrecadado acima do previsto) e fonte para abertura de creditos suplementares e especiais no exercicio.`},{a:2023,r:`FCC/TCE-2023`,q:`No PCASP, a baixa de um bem por alienacao com ganho gera:`,o:[`A) Apenas VPD`,`B) VPD (baixa do ativo pelo valor contabil) e VPA (ganho/receita de alienacao)`,`C) So receita orcamentaria`,`D) So passivo`,`E) Nenhum efeito patrimonial`],g:`B`,c:`Na alienacao com ganho: reconhece-se a VPD (baixa do valor contabil do ativo) e a VPA correspondente ao valor recebido; a diferenca positiva e o ganho patrimonial. Orcamentariamente, ha receita de capital.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A diferenca entre o regime orcamentario e o patrimonial para a DESPESA e que o orcamentario reconhece no:`,o:[`A) Pagamento; o patrimonial na liquidacao`,`B) Empenho; o patrimonial no fato gerador (competencia)`,`C) Mesmo momento`,`D) Recolhimento`,`E) Lancamento`],g:`B`,c:`Orcamentariamente a despesa percorre empenho-liquidacao-pagamento; patrimonialmente (competencia), a VPD e reconhecida no FATO GERADOR (geralmente na liquidacao/consumo), podendo divergir do momento orcamentario.`},{a:2023,r:`FCC/TCE-2023`,q:`Divida ativa nao tributaria inclui:`,o:[`A) Apenas tributos`,`B) Creditos nao tributarios (multas administrativas, alugueis, ressarcimentos) inscritos`,`C) Empenhos`,`D) Receitas correntes`,`E) Restos a pagar`],g:`B`,c:`Divida ativa NAO TRIBUTARIA: creditos da Fazenda de natureza nao tributaria (multas de poder de policia, alugueis, foros, ressarcimentos, contratos) regularmente inscritos apos o prazo de pagamento.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na contabilidade publica, a 'fonte/destinacao de recursos' serve para:`,o:[`A) Calcular o lucro`,`B) Identificar a origem e a vinculacao dos recursos que financiam as despesas`,`C) Apurar o PIB`,`D) Definir aliquotas`,`E) Medir a inflacao`],g:`B`,c:`A FONTE/DESTINACAO DE RECURSOS identifica a origem (ex: recursos ordinarios, vinculados, transferencias) e a vinculacao dos valores, controlando se a despesa respeita a destinacao legal.`},{a:2023,r:`FCC/TCE-2023`,q:`O regime contabil PLENO de competencia no setor publico aplica-se:`,o:[`A) So a receita`,`B) Ao reconhecimento de ativos, passivos, VPA e VPD na otica patrimonial`,`C) Apenas a despesa`,`D) Ao orcamento`,`E) Aos restos a pagar`],g:`B`,c:`A contabilidade patrimonial publica (MCASP) adota o regime de COMPETENCIA PLENO para ativos, passivos e variacoes patrimoniais (VPA/VPD), independentemente da execucao orcamentaria.`},{a:2022,r:`FCC/TCM-2022`,q:`A reavaliacao e a depreciacao de bens publicos afetam:`,o:[`A) Apenas o orcamento`,`B) O patrimonio (contabilidade patrimonial), nao a execucao orcamentaria`,`C) A receita tributaria`,`D) A divida ativa`,`E) Os restos a pagar`],g:`B`,c:`Reavaliacao e depreciacao sao eventos PATRIMONIAIS (ajustam o valor dos ativos e geram VPA/VPD), sem reflexo na execucao orcamentaria (nao ha empenho/pagamento).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O Balanco Orcamentario confronta:`,o:[`A) Ativo e passivo`,`B) Receita prevista x arrecadada e despesa fixada x executada`,`C) VPA e VPD`,`D) Caixa inicial e final`,`E) Divida e creditos`],g:`B`,c:`O Balanco ORCAMENTARIO (art. 102 Lei 4.320) confronta a receita PREVISTA com a ARRECADADA e a despesa FIXADA (dotacao) com a EXECUTADA (empenhada/liquidada/paga).`},{a:2023,r:`FCC/TCE-2023`,q:`A conta 'Resultado do exercicio' na DVP corresponde a:`,o:[`A) Lucro liquido societario`,`B) Superavit ou deficit patrimonial (VPA - VPD)`,`C) Resultado orcamentario`,`D) Saldo de caixa`,`E) Divida liquida`],g:`B`,c:`Na DVP, o resultado patrimonial = VPA - VPD, gerando SUPERAVIT (VPA>VPD) ou DEFICIT (VPD>VPA) patrimonial do exercicio, que altera o patrimonio liquido.`},{a:2022,r:`FCC/TCM-2022`,q:`O 'detalhamento da despesa' por natureza inclui:`,o:[`A) So a categoria economica`,`B) Categoria economica, grupo, modalidade de aplicacao e elemento`,`C) Apenas o orgao`,`D) A funcao apenas`,`E) A fonte so`],g:`B`,c:`A natureza da despesa detalha-se em: categoria economica (corrente/capital), GRUPO (pessoal, juros, investimentos...), MODALIDADE DE APLICACAO (direta, transferencia) e ELEMENTO (objeto do gasto).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O superavit financeiro do exercicio anterior, como fonte de credito adicional, e apurado:`,o:[`A) Na DRE`,`B) No Balanco Patrimonial (ativo financeiro - passivo financeiro)`,`C) No orcamento`,`D) Na DVP`,`E) No Balanco Orcamentario`],g:`B`,c:`Art. 43, par.2 Lei 4.320: o superavit financeiro = diferenca positiva entre ativo financeiro e passivo financeiro, apurada no BALANCO PATRIMONIAL, conjugada com os creditos adicionais.`},{a:2023,r:`FCC/TCE-2023`,q:`Os bens de uso comum do povo (ruas, pracas) no balanco publico:`,o:[`A) Nao sao reconhecidos`,`B) Integram o patrimonio publico e podem ser registrados conforme as normas (MCASP)`,`C) Sao passivos`,`D) Sao receitas`,`E) Sao restos a pagar`],g:`B`,c:`Os bens de uso comum do povo integram o patrimonio publico e, conforme o MCASP, podem ser reconhecidos/evidenciados (com criterios proprios de mensuracao), refletindo o patrimonio do ente.`}],"CGP-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No metodo PEPS, o estoque final fica valorado a:`,o:[`A) Precos mais antigos`,`B) Precos mais recentes`,`C) Media das compras`,`D) Custo padrao`,`E) Valor de venda`],g:`B`,c:`PEPS (primeiro a entrar, primeiro a sair): saidas pelos precos antigos -> estoque final pelos precos mais RECENTES. Em inflacao, estoque final maior.`},{a:2022,r:`FCC/RS-2022`,q:`O CMV (Custo da Mercadoria Vendida) e calculado por:`,o:[`A) EI + Compras - EF`,`B) EF - EI`,`C) Compras - EI`,`D) EI + EF`,`E) Vendas - Compras`],g:`A`,c:`CMV = Estoque Inicial + Compras - Estoque Final.`},{a:2021,r:`FCC/ISS-2021`,q:`A DEPRECIACAO pelo metodo linear (linha reta):`,o:[`A) Cresce ao longo do tempo`,`B) E constante em cada periodo`,`C) Decresce`,`D) Depende da producao`,`E) E zero no 1o ano`],g:`B`,c:`Linha reta: cota de depreciacao CONSTANTE por periodo = (custo - valor residual)/vida util.`},{a:2020,r:`FCC/Adm-2020`,q:`Provisao (CPC 25) deve ser reconhecida quando:`,o:[`A) Ha possibilidade remota de saida`,`B) Ha obrigacao presente, saida provavel e estimativa confiavel`,`C) Apenas se houver acao judicial`,`D) Sempre que houver risco`,`E) So por exigencia fiscal`],g:`B`,c:`Provisao: obrigacao presente + saida provavel de recursos + estimativa confiavel. Passivo contingente possivel=notas; remoto=nada.`},{a:2019,r:`FCC/BA-2019`,q:`O Ativo Intangivel (CPC 04) caracteriza-se por:`,o:[`A) Ter substancia fisica`,`B) Ser identificavel, sem substancia fisica e controlado pela entidade`,`C) Ser sempre o goodwill`,`D) Nao gerar beneficios`,`E) Ser circulante`],g:`B`,c:`Intangivel: identificavel, sem substancia fisica, controlado, gera beneficios futuros. Goodwill gerado internamente NAO e reconhecido.`},{a:2023,r:`FCC/TRT-2023`,q:`O teste de IMPAIRMENT (CPC 01) reduz o ativo quando:`,o:[`A) O valor contabil e menor que o recuperavel`,`B) O valor contabil supera o valor recuperavel`,`C) Ha valorizacao`,`D) Ocorre venda`,`E) Sempre no fim do ano`],g:`B`,c:`Impairment: se valor contabil > valor recuperavel, reconhece-se perda por reducao ao valor recuperavel.`},{a:2022,r:`FCC/TCE-2022`,q:`A Media Ponderada Movel (MPM):`,o:[`A) Mantem o preco da 1a compra`,`B) Recalcula o custo medio a cada nova entrada`,`C) Usa o preco mais recente`,`D) Ignora as compras`,`E) E igual ao PEPS`],g:`B`,c:`MPM: recalcula o custo medio unitario A CADA ENTRADA de mercadoria. Suaviza variacoes de preco.`},{a:2021,r:`FCC/ISS-2021`,q:`A DRE apura:`,o:[`A) A posicao patrimonial`,`B) O resultado (lucro ou prejuizo) do periodo`,`C) Os fluxos de caixa`,`D) As mutacoes do PL`,`E) A riqueza distribuida`],g:`B`,c:`DRE: confronta receitas e despesas, apurando o RESULTADO (lucro/prejuizo). BP=posicao; DFC=caixa; DMPL=PL; DVA=riqueza.`},{a:2020,r:`FCC/Adm-2020`,q:`Os estoques sao mensurados pelo:`,o:[`A) Valor de venda`,`B) Menor valor entre custo e valor realizavel liquido`,`C) Custo de reposicao`,`D) Valor justo sempre`,`E) Valor presente`],g:`B`,c:`CPC 16: estoques pelo MENOR valor entre o custo e o valor realizavel liquido (VRL).`},{a:2019,r:`FCC/BA-2019`,q:`A Demonstracao do Valor Adicionado (DVA) evidencia:`,o:[`A) O lucro liquido apenas`,`B) A riqueza gerada pela entidade e sua distribuicao`,`C) Os fluxos de caixa`,`D) As provisoes`,`E) O ativo imobilizado`],g:`B`,c:`DVA: riqueza criada pela entidade e como foi distribuida (pessoal, governo, financiadores, socios). Obrigatoria para companhias abertas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Pelo regime de competencia, a receita e reconhecida:`,o:[`A) No recebimento`,`B) Quando ganha (transferido o controle do bem/servico), independente do recebimento`,`C) No pedido`,`D) Na emissao da proposta`,`E) No fim do ano`],g:`B`,c:`Regime de COMPETENCIA: a receita e reconhecida quando GANHA (controle transferido - CPC 47), e a despesa quando incorrida, independente do caixa.`},{a:2023,r:`FCC/RS-2023`,q:`Uma duplicata descontada no banco representa:`,o:[`A) Receita`,`B) Passivo (obrigacao), pois a empresa responde pelo titulo`,`C) Reducao do ativo permanente`,`D) Despesa antecipada`,`E) Patrimonio liquido`],g:`B`,c:`Duplicatas descontadas: o risco permanece com a empresa, sendo classificadas como PASSIVO (conta redutora de contas a receber / obrigacao com o banco).`},{a:2022,r:`FCC/ISS-2022`,q:`No Balanco Patrimonial, o Ativo e ordenado por:`,o:[`A) Ordem alfabetica`,`B) Grau decrescente de liquidez`,`C) Valor crescente`,`D) Data de aquisicao`,`E) Natureza juridica`],g:`B`,c:`O Ativo e apresentado em ordem DECRESCENTE de liquidez (Circulante antes do Nao Circulante). O Passivo, por ordem de exigibilidade.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A Reserva de Lucros a Realizar destina-se a:`,o:[`A) Distribuir dividendos`,`B) Reter parcela do lucro ainda nao financeiramente realizada`,`C) Cobrir prejuizos`,`D) Aumentar capital`,`E) Pagar tributos`],g:`B`,c:`Reserva de Lucros a Realizar: retem a parcela do lucro do exercicio decorrente de ganhos ainda nao realizados financeiramente (ex: equivalencia, vendas a prazo de LP).`},{a:2023,r:`FCC/RS-2023`,q:`O metodo de equivalencia patrimonial reconhece, no resultado:`,o:[`A) Dividendos recebidos`,`B) A participacao da investidora no resultado da investida`,`C) O valor de mercado`,`D) So o custo`,`E) O valor justo`],g:`B`,c:`MEP: a investidora reconhece em RESULTADO sua participacao no lucro/prejuizo da investida (nao os dividendos, que reduzem o investimento).`},{a:2022,r:`FCC/ISS-2022`,q:`Na DFC pelo metodo indireto, parte-se do:`,o:[`A) Caixa inicial`,`B) Lucro liquido, ajustado por itens que nao afetam o caixa`,`C) Total de receitas`,`D) Saldo de clientes`,`E) Patrimonio liquido`],g:`B`,c:`DFC indireto: parte do LUCRO LIQUIDO e ajusta por depreciacao, variacoes de capital de giro e itens nao-caixa, para chegar ao caixa das operacoes.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A despesa com depreciacao:`,o:[`A) Reduz o caixa`,`B) Reduz o resultado mas nao afeta o caixa diretamente`,`C) Aumenta o ativo`,`D) E uma receita`,`E) E um passivo`],g:`B`,c:`Depreciacao e despesa que NAO afeta o caixa (item nao-caixa). Por isso e somada de volta na DFC indireta.`},{a:2023,r:`FCC/RS-2023`,q:`O Capital Circulante Liquido (CCL) e:`,o:[`A) Ativo total - Passivo total`,`B) Ativo Circulante - Passivo Circulante`,`C) Patrimonio Liquido`,`D) Ativo Permanente`,`E) Receita - Despesa`],g:`B`,c:`CCL = Ativo Circulante - Passivo Circulante. Indica a folga financeira de curto prazo da entidade.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Pelo principio da entidade, o patrimonio da empresa:`,o:[`A) Confunde-se com o dos socios`,`B) Nao se confunde com o dos socios (separacao patrimonial)`,`C) Pertence ao Estado`,`D) E sempre dos credores`,`E) Nao existe`],g:`B`,c:`Principio da ENTIDADE: o patrimonio da empresa e distinto e nao se confunde com o dos socios/proprietarios (separacao patrimonial).`},{a:2023,r:`FCC/RS-2023`,q:`Uma despesa paga antecipadamente (ex: seguro anual) e classificada como:`,o:[`A) Receita`,`B) Ativo (despesa antecipada), apropriada ao resultado pela competencia`,`C) Passivo`,`D) Patrimonio liquido`,`E) Custo do produto`],g:`B`,c:`Despesa ANTECIPADA: paga mas ainda nao incorrida, e ATIVO (circulante); apropria-se ao resultado conforme o periodo a que se refere (competencia).`},{a:2022,r:`FCC/ISS-2022`,q:`O lucro bruto na DRE corresponde a:`,o:[`A) Receita liquida - CMV/CPV`,`B) Receita bruta - impostos`,`C) Lucro liquido + despesas`,`D) Receita - todas as despesas`,`E) EBITDA`],g:`A`,c:`Lucro BRUTO = Receita Liquida de Vendas - Custo das Mercadorias/Produtos Vendidos (CMV/CPV). Depois deduzem-se despesas operacionais para o resultado.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A Reserva Legal e constituida com:`,o:[`A) 10% do capital`,`B) 5% do lucro liquido, ate atingir 20% do capital social`,`C) Todo o lucro`,`D) Dividendos`,`E) Agio na emissao`],g:`B`,c:`Lei 6.404/76: a Reserva Legal e formada por 5% do LUCRO LIQUIDO do exercicio, ate o limite de 20% do capital social (pode parar antes se reservas + capital = 30%).`},{a:2023,r:`FCC/RS-2023`,q:`No regime de competencia, vender a prazo gera reconhecimento de:`,o:[`A) Receita so no recebimento`,`B) Receita na venda (transferencia do controle), com contas a receber no ativo`,`C) Despesa`,`D) Passivo`,`E) Nenhuma receita`],g:`B`,c:`Competencia: a receita e reconhecida na VENDA (transferencia do controle), registrando-se duplicatas/contas a receber no ativo, independente do recebimento.`},{a:2022,r:`FCC/ISS-2022`,q:`O indice de liquidez corrente e calculado por:`,o:[`A) Ativo total / Passivo total`,`B) Ativo Circulante / Passivo Circulante`,`C) PL / Ativo`,`D) Lucro / Vendas`,`E) Disponivel / Passivo`],g:`B`,c:`Liquidez CORRENTE = Ativo Circulante / Passivo Circulante. Mede a capacidade de pagar obrigacoes de curto prazo. >1 indica folga.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O agio na emissao de acoes (acima do valor nominal) e registrado em:`,o:[`A) Receita`,`B) Reserva de capital`,`C) Reserva de lucros`,`D) Capital social`,`E) Passivo`],g:`B`,c:`O agio na emissao de acoes/bonus de subscricao e RESERVA DE CAPITAL (nao transita pelo resultado), pois decorre de aporte dos socios, nao de operacao.`},{a:2023,r:`FCC/RS-2023`,q:`A baixa de um bem do imobilizado com valor contabil de 8.000, vendido por 10.000, gera:`,o:[`A) Prejuizo de 2.000`,`B) Ganho de 2.000 (outras receitas)`,`C) Receita de 10.000`,`D) Despesa de 8.000`,`E) Nenhum efeito`],g:`B`,c:`Venda por 10.000 de bem com valor contabil liquido de 8.000 gera GANHO de 2.000 (resultado na alienacao de ativo - outras receitas/despesas operacionais).`},{a:2022,r:`FCC/ISS-2022`,q:`A conta 'Depreciacao Acumulada' e:`,o:[`A) Ativo`,`B) Conta redutora do ativo imobilizado (retificadora)`,`C) Despesa`,`D) Passivo`,`E) Patrimonio liquido`],g:`B`,c:`Depreciacao Acumulada e conta RETIFICADORA (redutora) do ativo imobilizado; subtrai do custo para chegar ao valor contabil liquido.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O CMV, dado EI=20.000, Compras=80.000 e EF=30.000, e:`,o:[`A) 70.000`,`B) 90.000`,`C) 130.000`,`D) 50.000`,`E) 110.000`],g:`A`,c:`CMV = EI + Compras - EF = 20.000 + 80.000 - 30.000 = 70.000.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Lucro liquido 200.000; depreciacao 30.000; aumento de clientes 25.000; aumento de fornecedores 15.000. O caixa das operacoes (metodo indireto) e:`,o:[`A) 200.000`,`B) 220.000`,`C) 180.000`,`D) 230.000`,`E) 270.000`],g:`B`,c:`Caixa operacional = LL 200.000 + depreciacao 30.000 (nao-caixa) - aumento de clientes 25.000 (uso de caixa) + aumento de fornecedores 15.000 (fonte) = 220.000.`},{a:2023,r:`FCC/RS-2023`,q:`Compra de estoque a prazo de 50.000. No Balanco, o efeito imediato e:`,o:[`A) Reduz o caixa`,`B) Aumenta o ativo (estoque) e o passivo (fornecedores) em 50.000`,`C) Reduz o PL`,`D) Aumenta a receita`,`E) Gera despesa`],g:`B`,c:`Compra a prazo: ATIVO (estoque) +50.000 e PASSIVO (fornecedores) +50.000. Nao afeta o caixa nem o resultado no momento da compra (apenas no consumo/venda).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Uma empresa tem AC=300.000, Estoques=120.000, PC=150.000. A liquidez SECA e:`,o:[`A) 2,0`,`B) 1,2`,`C) 0,8`,`D) 1,5`,`E) 2,4`],g:`B`,c:`Liquidez Seca = (AC - Estoques)/PC = (300.000-120.000)/150.000 = 180.000/150.000 = 1,2.`},{a:2023,r:`FCC/RS-2023`,q:`Ao reconhecer PDD (perda estimada com creditos de liquidacao duvidosa), ocorre:`,o:[`A) Aumento do ativo`,`B) Despesa no resultado e conta redutora de contas a receber`,`C) Receita`,`D) Aumento do PL`,`E) Reducao do passivo`],g:`B`,c:`A PCLD/PDD gera DESPESA no resultado e uma conta RETIFICADORA (redutora) de clientes/contas a receber no ativo, ajustando-o ao valor recuperavel esperado.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Capital social 500.000, reservas 100.000, prejuizos acumulados 80.000. O patrimonio liquido e:`,o:[`A) 680.000`,`B) 520.000`,`C) 600.000`,`D) 420.000`,`E) 480.000`],g:`B`,c:`PL = Capital 500.000 + Reservas 100.000 - Prejuizos acumulados 80.000 = 520.000.`},{a:2023,r:`FCC/RS-2023`,q:`O grau de endividamento (Capital de terceiros / PL) elevado indica:`,o:[`A) Baixa dependencia de terceiros`,`B) Maior dependencia de recursos de terceiros (mais risco financeiro)`,`C) Liquidez alta`,`D) Lucro alto`,`E) Mais ativos`],g:`B`,c:`Endividamento alto (capital de terceiros >> PL) indica maior DEPENDENCIA de recursos de terceiros e maior risco financeiro (alavancagem).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Receita de venda 1.000.000; CMV 600.000; despesas operacionais 250.000; despesas financeiras 50.000. O lucro operacional (antes do resultado financeiro) e:`,o:[`A) 400.000`,`B) 150.000`,`C) 100.000`,`D) 350.000`,`E) 200.000`],g:`B`,c:`Lucro bruto = 1.000.000-600.000=400.000. Lucro operacional = 400.000 - 250.000 (desp. operacionais) = 150.000 (o resultado financeiro de -50.000 e considerado a parte).`},{a:2023,r:`FCC/RS-2023`,q:`A reavaliacao de ativos foi, em regra, no Brasil, apos a Lei 11.638/07:`,o:[`A) Mantida livremente`,`B) Vedada para as empresas em geral (substituida pelo ajuste a valor justo em casos especificos)`,`C) Obrigatoria`,`D) So para imoveis`,`E) Aplicada ao estoque`],g:`B`,c:`A Lei 11.638/2007 EXTINGUIU a reavaliacao espontanea de ativos no Brasil para as companhias; admite-se o ajuste a valor justo apenas em situacoes especificas previstas nos CPCs.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na equacao patrimonial basica, Ativo = `,o:[`A) Receita + Despesa`,`B) Passivo + Patrimonio Liquido`,`C) Lucro - Prejuizo`,`D) Capital - Reservas`,`E) Disponivel + Estoque`],g:`B`,c:`Equacao fundamental: ATIVO = PASSIVO + PATRIMONIO LIQUIDO (bens e direitos = obrigacoes com terceiros + recursos proprios).`},{a:2023,r:`FCC/RS-2023`,q:`Uma despesa incorrida e ainda nao paga gera:`,o:[`A) Reducao do ativo`,`B) Despesa no resultado e um passivo (obrigacao a pagar)`,`C) Receita`,`D) Aumento do PL`,`E) Estoque`],g:`B`,c:`Pela competencia, a despesa incorrida (mesmo nao paga) e reconhecida no RESULTADO e gera um PASSIVO (ex: s
