). A FCC adora pegadinhas com esses verbos.`],"LP-2":[`INTERPRETACAO DE TEXTO - 22% das questoes de Portugues:`,`* FCC pede INFERENCIA: o que o texto PERMITE concluir, nao o explicito`,`* Cuidado com alternativas que EXAGERAM ou GENERALIZAM`,`* Relacao do texto com o contexto historico de producao`,`* Tema x tese x argumento: distinguir os tres`,``,`COESAO TEXTUAL:`,`* REFERENCIAL: pronomes, sinonimos, hiperonimos que retomam (anafora)`,`  ou antecipam (catafora) elementos`,`* SEQUENCIAL (conectivos):`,`  - Causa: porque, pois, visto que, ja que`,`  - Concessao: embora, ainda que, apesar de, mesmo que`,`  - Condicao: se, caso, desde que, contanto que`,`  - Oposicao: mas, porem, contudo, todavia, ao passo que`,`  - Conclusao: logo, portanto, assim, por conseguinte`,`  - Finalidade: para que, a fim de que`,``,`DENOTACAO E CONOTACAO:`,`* Denotacao: sentido literal, objetivo, do dicionario`,`* Conotacao: sentido figurado, subjetivo, expressivo`,``,`DISCURSO:`,`* Direto: fala literal entre aspas/travessao`,`* Indireto: narrador relata a fala (verbo + que)`,`* Indireto livre: mistura, sem marca clara`,``,`FIGURAS DE LINGUAGEM:`,`* Metafora, metonimia, hiperbole, ironia, eufemismo, antitese`,``,`FUNCOES DA LINGUAGEM:`,`* Referencial (informacao), Emotiva (emissor), Conativa (receptor),`,`  Fatica (canal), Metalinguistica (codigo), Poetica (mensagem)`,``,`PONTUACAO:`,`* Oracao adjetiva EXPLICATIVA = entre virgulas`,`* NUNCA virgula entre sujeito e verbo`,`* Ponto e virgula: coordenadas longas e enumeracoes`,``,`DICA FCC: Em interpretacao, a resposta esta SEMPRE ancorada no texto. Desconfie de alternativas que trazem informacoes externas ou opinioes radicais.`],"MAT-1":[`JUROS SIMPLES: J = C x i x n | M = C x (1 + i x n)`,`* Rendimento LINEAR (mesma quantia a cada periodo)`,`* Ex: C=10.000, i=2% a.m., n=3 -> J=600 -> M=10.600`,``,`JUROS COMPOSTOS: M = C x (1 + i)^n`,`* Rendimento EXPONENCIAL (juros sobre juros)`,`* FCC sempre fornece o fator (ex: 1,02^3 = 1,0612)`,`* Ex: M = 10.000 x 1,0612 = 10.612`,``,`TAXAS:`,`* EQUIVALENTES (compostos): mesma rentabilidade em prazos diferentes`,`* NOMINAL x EFETIVA: nominal nao considera capitalizacao; efetiva sim`,`* REAL: descontada a inflacao -> (1+i nominal)=(1+i real)(1+inflacao)`,``,`DESCONTOS:`,`* RACIONAL (por dentro): sobre o valor atual`,`* COMERCIAL (por fora): sobre o valor nominal (mais comum, maior desconto)`,``,`SISTEMA SAC (Amortizacao Constante):`,`* Amortizacao = PV / n (CONSTANTE)`,`* Juros = saldo devedor x i (DECRESCENTES)`,`* Prestacao DECRESCENTE`,`  Ex PV=60.000, n=3, i=10%:`,`  1a: J=6.000+A=20.000=26.000 (SD=40.000)`,`  2a: J=4.000+A=20.000=24.000 (SD=20.000)`,`  3a: J=2.000+A=20.000=22.000`,``,`SISTEMA PRICE (Frances):`,`* Prestacoes CONSTANTES`,`* Juros decrescentes + amortizacao crescente`,`* Custo total MAIOR que o SAC`,``,`FLUXO DE CAIXA:`,`* Valor Presente (VP): traz valores futuros para hoje`,`* Taxa Interna de Retorno (TIR): taxa que zera o VPL`,``,`DICA FCC: Em SAC monte a tabela linha por linha. Em juros compostos, use sempre o fator fornecido pela banca.`],"MAT-2":[`ESTATISTICA DESCRITIVA - Medidas de Posicao:`,`* MEDIA aritmetica: soma / n`,`* MEDIANA: valor central apos ORDENAR (n impar=central; n par=media dos 2 centrais)`,`* MODA: valor mais frequente (pode ser amodal, bimodal)`,`* QUARTIS: dividem em 4 partes (Q1=25%, Q2=mediana, Q3=75%)`,``,`MEDIDAS DE DISPERSAO:`,`* AMPLITUDE: maximo - minimo`,`* VARIANCIA: media dos quadrados dos desvios`,`* DESVIO-PADRAO: raiz quadrada da variancia (mesma unidade dos dados)`,`* COEFICIENTE DE VARIACAO: desvio-padrao / media (compara dispersoes)`,``,`PROBABILIDADE:`,`* P(A) = casos favoraveis / casos possiveis`,`* P(A ou B) = P(A) + P(B) - P(A e B) [adicao]`,`* P(A e B) = P(A) x P(B|A) [multiplicacao]`,`* Independentes: P(A e B) = P(A) x P(B)`,`* Complementar: P(A') = 1 - P(A)`,``,`DISTRIBUICOES:`,`* Discretas: Bernoulli, Binomial, Poisson`,`* Continuas: Normal, t-Student, Qui-quadrado, F-Snedecor`,``,`ANALISE COMBINATORIA:`,`* Combinacao C(n,k)=n!/[k!(n-k)!] (ordem NAO importa)`,`* Arranjo A(n,k)=n!/(n-k)! (ordem importa)`,`* Permutacao P(n)=n!`,``,`RACIOCINIO LOGICO:`,`* Conectivos: E (conjuncao), OU (disjuncao), SE-ENTAO (condicional)`,`* MODUS PONENS: P->Q, P, logo Q`,`* MODUS TOLLENS: P->Q, nao-Q, logo nao-P (MAIS COBRADO)`,`* SILOGISMO HIPOTETICO: P->Q, Q->R, logo P->R`,`* Contrapositiva: P->Q equivale a nao-Q -> nao-P`,`* De Morgan: nao(P e Q)=nao-P ou nao-Q`,`* Negacao de 'todo': 'algum nao'; negacao de 'algum': 'nenhum'`,``,`DICA FCC: Mediana SEMPRE exige ordenar os dados antes. Modus Tollens e a forma de argumento mais cobrada.`],"ADM-1":[`GOVERNANCA PUBLICA:`,`* Conceito: sistema de direcionar, monitorar e avaliar a gestao`,`* Principios: capacidade de resposta, integridade, confiabilidade,`,`  transparencia, prestacao de contas (accountability)`,`* Instancias: estrategica, tatica e operacional`,`* Teoria da Agencia: principal (sociedade) x agente (gestor)`,``,`MODELO DAS 3 LINHAS (IIA 2020):`,`* 1a LINHA: gestao operacional (donos do risco no dia a dia)`,`* 2a LINHA: funcoes de suporte (compliance, gestao de riscos, controles)`,`* 3a LINHA: AUDITORIA INTERNA (asseguracao INDEPENDENTE)`,`* Acima: orgao de governanca + partes externas (TCU, auditoria externa)`,``,`GESTAO DE RISCOS (ISO 31000 / COSO):`,`* Risco = efeito da incerteza nos objetivos`,`* Processo: identificar -> analisar -> avaliar -> tratar -> monitorar`,`* Tratamento: evitar, reduzir, transferir, aceitar`,`* Apetite ao risco: nivel que a organizacao aceita assumir`,``,`INTEGRIDADE (CE):`,`* Programa de Integridade do Poder Executivo do CE`,`* Codigo de Etica e Conduta da Adm. Publica Estadual do CE`,`* Sancoes eticas e disciplinares; PAD; TAC`,`* Assedio moral: Convencao OIT 190/2019`,``,`LEI DE ACESSO A INFORMACAO (Lei 12.527/2011):`,`* Prazo: 20 dias + 10 dias (com justificativa)`,`* Sigilo: Reservado=5 anos, Secreto=15 anos, Ultra-secreto=25 anos`,`* Transparencia ATIVA (proativa) e PASSIVA (sob demanda)`,``,`DICA FCC: Distinguir os papeis das 3 linhas e crucial. Auditoria interna (3a linha) NUNCA se confunde com gestao de riscos (2a linha).`],"ADM-2":[`NOVA LEI DE LICITACOES (Lei 14.133/2021) - Modalidades:`,`* PREGAO: bens e servicos comuns (criterio: menor preco/maior desconto)`,`* CONCORRENCIA: obras, servicos especiais, criterios variados`,`* CONCURSO: trabalho tecnico, cientifico ou artistico`,`* LEILAO: alienacao de bens (maior lance)`,`* DIALOGO COMPETITIVO: inovacao tecnologica ou solucao inexistente`,`  no mercado -> Adm. DIALOGA com licitantes antes de definir o objeto`,``,`CRITERIOS DE JULGAMENTO:`,`* Menor preco, maior desconto, melhor tecnica, tecnica e preco,`,`  maior lance, maior retorno economico`,``,`FASES (Lei 14.133):`,`* Preparatoria -> divulgacao do edital -> apresentacao de propostas`,`  -> julgamento -> habilitacao -> recursal -> homologacao`,`  (Inversao de fases: habilitacao APOS julgamento, como no pregao)`,``,`CONTRATACAO DIRETA:`,`* DISPENSA (art. 75): valor baixo, emergencia, etc.`,`* INEXIGIBILIDADE (art. 74): inviabilidade de competicao`,``,`IMPROBIDADE ADMINISTRATIVA (Lei 8.429/92 + 14.230/2021):`,`* Exige DOLO ESPECIFICO (culpa foi EXCLUIDA)`,`* Legitimidade ativa: EXCLUSIVA do MP`,`* Prescricao: 8 anos do fato ou 4 anos apos fim do vinculo`,`* Modalidades: enriquecimento ilicito, lesao ao erario, contra principios`,``,`LEI ANTICORRUPCAO (Lei 12.846/2013):`,`* Responsabilidade OBJETIVA das pessoas juridicas`,`* Acordo de Leniencia reduz sancoes`,``,`DICA FCC: O dialogo competitivo (modalidade nova) e cobrado em quase toda prova desde 2022. Improbidade agora exige DOLO; culpa nao basta mais.`],"ECO-1":[`MICROECONOMIA - Oferta e Demanda:`,`* Lei da demanda: preco sobe -> quantidade demandada cai`,`* Lei da oferta: preco sobe -> quantidade ofertada sobe`,`* Equilibrio: ponto onde oferta = demanda`,``,`ELASTICIDADES:`,`* ELASTICA: |Ed| > 1 (quantidade varia MAIS que o preco)`,`* INELASTICA: |Ed| < 1 (quantidade varia MENOS que o preco)`,`* UNITARIA: |Ed| = 1`,`* Bem inelastico: tributar aumenta receita (consumo pouco muda)`,`* Determinantes: substitutos, essencialidade, prazo, % da renda`,``,`ECONOMIA DA TRIBUTACAO:`,`* PESO MORTO (perda de bem-estar): maior quanto mais elasticos os lados`,`* REGRA DE RAMSEY: tributar mais bens INELASTICOS minimiza ineficiencia`,`* CURVA DE LAFFER: ha aliquota otima; acima dela, arrecadacao CAI`,`* INCIDENCIA ECONOMICA: recai mais sobre o lado MENOS elastico`,`* Imposto Ad Valorem (%) x Especifico (valor fixo) x sobre Valor Adicionado`,``,`ESTRUTURAS DE MERCADO:`,`* Concorrencia Perfeita: muitos, produto homogeneo, lucro zero no LP`,`* Monopolio: um ofertante, poder de preco, peso morto`,`* Oligopolio: poucos, interdependencia estrategica`,`* Concorrencia Monopolistica: muitos, produtos diferenciados`,``,`DICA FCC: A Regra de Ramsey conflita com EQUIDADE, pois bens inelasticos sao essenciais (mais consumidos pelos pobres). Esse trade-off cai sempre.`],"ECO-2":[`MACROECONOMIA - PIB pelas 3 oticas (mesmo resultado):`,`* DEMANDA: C + I + G + (X - M)`,`  C=consumo familias, I=investimento, G=gasto governo, X-M=exportacao liquida`,`* RENDA: Salarios + Lucros + Juros + Alugueis + Tributos indiretos`,`* PRODUCAO: soma dos Valores Adicionados (evita dupla contagem)`,``,`AGREGADOS:`,`* PIB: producao no territorio nacional`,`* PNB: producao por residentes (PIB - renda enviada + renda recebida)`,`* PIB real x nominal -> Deflator do PIB = (PIB nom / PIB real) x 100`,``,`MODELO IS-LM:`,`* IS (mercado de bens): juros altos -> investimento cai -> PIB cai`,`  Politica FISCAL desloca IS (aumento de G -> IS para direita)`,`* LM (mercado monetario): politica MONETARIA desloca LM`,``,`INFLACAO:`,`* IPCA: indice oficial (IBGE), 1 a 40 salarios minimos`,`* IGP-M: FGV, usado em contratos/alugueis`,`* Valor real = valor nominal / (1 + inflacao)`,``,`POLITICAS ECONOMICAS:`,`* FISCAL: gastos e tributos (expansionista combate recessao)`,`* MONETARIA: taxa de juros (Selic), reservas, open market`,`* CAMBIAL: regimes fixo, flutuante, bandas`,``,`BALANCO DE PAGAMENTOS:`,`* Conta corrente (bens, servicos, rendas, transferencias)`,`* Conta capital e financeira`,``,`DICA FCC: Multiplicador keynesiano = 1/(propensao marginal a poupar). Politica fiscal expansionista (aumento de G ou reducao de tributos) desloca a IS para a direita.`],"DCO-1":[`CONTROLE DE CONSTITUCIONALIDADE - CONCENTRADO (STF):`,`* ADI: lei/ato federal ou estadual vs CF`,`* ADC: lei federal - confirma constitucionalidade`,`* ADPF: viola preceito fundamental (inclui leis pre-1988)`,`* ADO: omissao inconstitucional do legislador`,`* Efeitos: ERGA OMNES + EX TUNC + VINCULANTE`,`* Legitimados (art. 103): Presidente, Mesas, Governadores, PGR,`,`  Conselho Federal OAB, partidos com representacao, confederacoes`,``,`CONTROLE DIFUSO (qualquer juizo):`,`* Qualquer juiz/tribunal pode afastar norma inconstitucional`,`* Efeitos: INTER PARTES + EX TUNC`,`* Senado pode suspender (art. 52, X) -> erga omnes + ex nunc`,``,`SUMULA VINCULANTE (art. 103-A):`,`* Aprovada por 2/3 do STF (8 ministros)`,`* Vincula: todo Judiciario + Adm. Publica direta e indireta`,`* NAO vincula: o proprio STF e o Legislativo (funcao tipica)`,``,`APLICABILIDADE DAS NORMAS:`,`* Eficacia PLENA: aplicacao imediata, sem restricao`,`* Eficacia CONTIDA: plena, mas pode ser restringida por lei`,`* Eficacia LIMITADA: depende de lei (programaticas)`,``,`DIREITOS FUNDAMENTAIS:`,`* Art. 5 par. 1: aplicacao IMEDIATA`,`* Individuais, coletivos, sociais, nacionalidade, politicos`,`* Clausulas petreas (art. 60 par.4): forma federativa, voto direto,`,`  separacao dos poderes, direitos e garantias individuais`,``,`DICA FCC: Decore os efeitos: DIFUSO=inter partes+ex tunc; CONCENTRADO=erga omnes+ex tunc+vinculante.`],"DAD-1":[`PRINCIPIOS DA ADMINISTRACAO (art. 37 CF) - LIMPE:`,`* Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiencia`,`* Implicitos: razoabilidade, proporcionalidade, autotutela, continuidade`,``,`ATOS ADMINISTRATIVOS - Requisitos (COFIFOMOB):`,`* COmpetencia, FInalidade, FOrma, MOtivo, OBjeto`,`* Vicios em competencia/forma -> sanaveis (convalidacao)`,`* Vicios em finalidade/motivo/objeto -> insanaveis (anulacao)`,``,`ATRIBUTOS:`,`* Presuncao de legitimidade (relativa)`,`* Imperatividade`,`* Autoexecutoriedade`,`* Tipicidade`,``,`EXTINCAO:`,`* ANULACAO: ilegalidade -> EX TUNC (Sumula 473 STF)`,`* REVOGACAO: conveniencia/oportunidade -> EX NUNC (so a Adm.)`,`* CASSACAO: descumprimento de condicoes pelo beneficiario`,`* CONVALIDACAO: sana vicio sanavel`,``,`PODERES DA ADMINISTRACAO:`,`* Vinculado, discricionario, hierarquico, disciplinar, regulamentar,`,`  de policia (preventivo e repressivo)`,``,`RESPONSABILIDADE CIVIL (art. 37 par. 6):`,`* OBJETIVA (teoria do risco administrativo) para atos COMISSIVOS`,`* Conduta + dano + nexo causal (sem necessidade de culpa)`,`* Excludentes: fato da vitima, caso fortuito, fato de terceiro`,`* Direito de REGRESSO contra agente com dolo ou culpa`,``,`ORGANIZACAO ADMINISTRATIVA:`,`* DESCONCENTRACAO: dentro da mesma PJ (orgaos), com hierarquia`,`* DESCENTRALIZACAO: para outra PJ (autarquias, fundacoes, EP, SEM),`,`  com vinculacao/supervisao (sem hierarquia)`,``,`DICA FCC: Anulacao=ilegalidade+ex tunc. Revogacao=merito+ex nunc. Responsabilidade objetiva NAO exige culpa do Estado.`],"DCI-1":[`CRIMES CONTRA A ORDEM TRIBUTARIA (Lei 8.137/1990):`,`* Art. 1 (PARTICULAR): crimes MATERIAIS`,`  SUMULA VINCULANTE 24: so se tipifica APOS lancamento DEFINITIVO`,`  Condutas: omitir informacao, fraudar documentos, negar nota fiscal`,`* Art. 2: crimes FORMAIS (consumam com a conduta)`,`* Mero inadimplemento do tributo declarado NAO e crime`,``,`CRIMES CONTRA A ADMINISTRACAO PUBLICA:`,`* Por funcionario: peculato, concussao, corrupcao passiva, prevaricacao`,`* Por particular: corrupcao ativa, descaminho, contrabando`,``,`LAVAGEM DE DINHEIRO (Lei 9.613/1998):`,`* Ocultar/dissimular origem de bens de INFRACAO PENAL`,`* Modelo ALL CRIMES (Lei 12.683/2012): qualquer crime antecedente`,`* 3 fases: Colocacao -> Dissimulacao (layering) -> Integracao`,`* Pena: 3 a 10 anos + multa`,``,`CRIME ORGANIZADO (Lei 12.850/2013):`,`* 4+ pessoas, estrutura ordenada, divisao de tarefas`,`* Colaboracao premiada, infiltracao, acao controlada`,``,`LEI ANTICORRUPCAO (Lei 12.846/2013):`,`* Responsabilidade OBJETIVA das pessoas juridicas`,``,`DIREITO CIVIL:`,`* PRESCRICAO: extingue a PRETENSAO (acao). Pode ser renunciada/interrompida`,`* DECADENCIA: extingue o DIREITO potestativo. Legal=irrenunciavel`,`* LINDB: vigencia, aplicacao, conflito de leis no tempo/espaco`,`* Negocio juridico: existencia -> validade -> eficacia`,``,`DICA FCC: A SV 24 e o ponto mais cobrado. Crimes do art. 1 (materiais) exigem lancamento definitivo; art. 2 (formais), nao.`],"DFI-1":[`LRF (LC 101/2000) - Limites de despesa com pessoal (% da RCL):`,`                  GLOBAL    EXECUTIVO`,`* ESTADOS:         60%        49%   (Leg+TC=3%, Jud=6%, MP=2%)`,`* UNIAO:           50%        40,9%`,`* MUNICIPIOS:      60%        54%   (Camara=6%)`,`* Limite prudencial: 95% do limite -> vedacoes preventivas`,``,`MECANISMOS DE CONTROLE:`,`* Art. 9 - LIMITACAO DE EMPENHO (contingenciamento):`,`  acionado BIMESTRALMENTE quando receita nao comporta metas`,`  nao se aplica a despesas constitucionalmente obrigatorias`,`* Art. 42 - VEDACAO nos 2 ultimos quadrimestres do mandato:`,`  proibido deixar restos a pagar sem disponibilidade de caixa`,``,`PLANEJAMENTO:`,`* PPA (4 anos), LDO (metas e riscos fiscais), LOA (autoriza despesas)`,`* Anexo de Metas Fiscais e Anexo de Riscos Fiscais (na LDO)`,``,`RESULTADO FISCAL:`,`* PRIMARIO: receitas nao financeiras - despesas nao financeiras (sem juros)`,`  Mede o ESFORCO FISCAL antes do servico da divida`,`* NOMINAL: Primario - Juros nominais (variacao total da divida)`,``,`DIVIDA E ENDIVIDAMENTO:`,`* Operacao de credito por antecipacao de receita (ARO)`,`* Regra de ouro: vedado credito que supere despesas de capital`,``,`RELATORIOS:`,`* RREO (Execucao Orcamentaria): BIMESTRAL`,`* RGF (Gestao Fiscal): QUADRIMESTRAL`,``,`DICA FCC: Memorize os limites: ESTADOS=60/49; UNIAO=50/40,9; MUNICIPIOS=60/54. A FCC cobra os tres com frequencia.`],"DFI-2":[`ORCAMENTO PUBLICO - Ciclo: PPA -> LDO -> LOA -> Execucao -> Controle`,``,`INSTRUMENTOS (art. 165 CF):`,`* PPA (4 anos): diretrizes, objetivos e metas regionalizadas`,`* LDO: orienta a LOA, metas fiscais, alteracoes tributarias`,`* LOA: orcamento fiscal, seguridade social, investimento das estatais`,``,`PRINCIPIOS ORCAMENTARIOS:`,`* UNIVERSALIDADE: todas as receitas e despesas no orcamento`,`* ANUALIDADE: vigencia de 1 ano (exercicio financeiro)`,`* UNIDADE: orcamento unico por ente`,`* EXCLUSIVIDADE: LOA so contem materia orcamentaria`,`* ORCAMENTO BRUTO: valores totais, sem deducoes`,`* LEGALIDADE: orcamento aprovado por lei`,`* NAO AFETACAO/NAO VINCULACAO da receita de impostos (com excecoes)`,``,`CREDITOS ADICIONAIS (art. 41 Lei 4.320):`,`* SUPLEMENTARES: reforco de dotacao existente (LOA pode autorizar)`,`* ESPECIAIS: nova dotacao (autorizacao legislativa + fonte)`,`* EXTRAORDINARIOS: urgentes/improvistos (guerra, calamidade)`,`  -> DECRETO do Executivo, sem indicacao previa de fonte`,``,`RECEITAS E DESPESAS:`,`* CORRENTES: tributaria, patrimonial, pessoal, custeio, juros`,`* CAPITAL: operacoes de credito, alienacao de bens, investimentos`,``,`RESTOS A PAGAR e Despesas de Exercicios Anteriores (DEA)`,``,`DICA FCC: Creditos EXTRAORDINARIOS sao os unicos abertos por DECRETO sem indicacao previa de fonte. Sempre cobrado para distinguir dos demais.`],"CGP-1":[`CONTABILIDADE PUBLICA - Estagios da RECEITA (MCASP 11a ed.):`,`1. PREVISAO (na LOA)`,`2. LANCAMENTO (individualiza o credito - art. 53 Lei 4.320)`,`3. ARRECADACAO (contribuinte paga ao agente arrecadador/banco)`,`4. RECOLHIMENTO (entrega ao Tesouro - conta unica)`,``,`Estagios da DESPESA:`,`1. FIXACAO (na LOA)`,`2. EMPENHO (art. 58: cria obrigacao de pagar)`,`   Modalidades: ORDINARIO, ESTIMATIVO, GLOBAL`,`3. LIQUIDACAO (art. 63: verifica o direito do credor)`,`4. PAGAMENTO (art. 64: entrega ao credor)`,``,`RESTOS A PAGAR:`,`* PROCESSADOS: empenho + LIQUIDACAO feitos (Estado DEVE pagar)`,`* NAO PROCESSADOS: so empenho (liquidacao pendente)`,`* Cancelamento: apos 2 exercicios (regra geral)`,``,`PCASP (Plano de Contas Aplicado ao Setor Publico):`,`* Classes: 1-Ativo, 2-Passivo, 3-VPD, 4-VPA, 5-Controles devedores,`,`  6-Controles credores, 7 e 8-Controles especificos`,``,`NBC TSP - Caracteristicas qualitativas:`,`* FUNDAMENTAIS: Relevancia + Representacao Fidedigna`,`* DE MELHORIA: Comparabilidade, Verificabilidade, Tempestividade,`,`  Compreensibilidade`,``,`DEMONSTRACOES (Lei 4.320 + MCASP):`,`* Balanco Orcamentario, Financeiro, Patrimonial, Demonstracao das`,`  Variacoes Patrimoniais (DVP)`,``,`DICA FCC: RP PROCESSADOS (ja liquidados = Estado deve) vs NAO PROCESSADOS (liquidacao pendente). Cai em toda prova de contabilidade publica.`],"CGP-2":[`CONTABILIDADE GERAL - Caracteristicas qualitativas (CPC 00):`,`* Fundamentais: relevancia e representacao fidedigna`,`* De melhoria: comparabilidade, verificabilidade, tempestividade,`,`  compreensibilidade`,``,`ESTOQUES (CPC 16):`,`* Custo: aquisicao + transformacao + outros para deixar pronto`,`* PEPS: estoque final a precos mais RECENTES`,`* Media Ponderada Movel (MPM): recalcula a cada entrada`,`* CMV = Estoque Inicial + Compras - Estoque Final`,`* Mensuracao: menor valor entre custo e valor realizavel liquido`,``,`ATIVO IMOBILIZADO (CPC 27):`,`* Reconhecimento: beneficio futuro provavel + custo confiavel`,`* Depreciacao: linha reta, saldos decrescentes, unidades produzidas`,`* Valor residual e vida util revisados periodicamente`,``,`ATIVO INTANGIVEL (CPC 04):`,`* Identificavel, sem substancia fisica, controlado`,`* Goodwill gerado internamente NAO e reconhecido`,``,`IMPAIRMENT (CPC 01):`,`* Reducao ao valor recuperavel quando valor contabil > recuperavel`,``,`PROVISOES (CPC 25):`,`* Reconhecer: obrigacao presente + saida provavel + estimativa confiavel`,`* Passivo contingente possivel: notas explicativas`,`* Remoto: nada divulga`,``,`DEMONSTRACOES CONTABEIS:`,`* BP (Ativo=Passivo+PL), DRE, DRA, DMPL, DFC (direto/indireto), DVA`,``,`DICA FCC: PEPS deixa o estoque final a precos mais recentes (mais caro em inflacao). Saiba calcular CMV passo a passo.`],"COA-1":[`VALOR JUSTO (CPC 46 / IFRS 13) - Hierarquia:`,`* NIVEL 1: precos cotados em mercado ATIVO para ativos IDENTICOS`,`* NIVEL 2: dados OBSERVAVEIS distintos (ativos similares, taxas)`,`* NIVEL 3: dados NAO OBSERVAVEIS (premissas internas)`,`* Regra: MAXIMIZAR dados observaveis; mais disclosure no nivel 3`,``,`AJUSTE A VALOR PRESENTE (AVP):`,`* Operacoes de longo prazo trazidas a valor presente`,``,`INSTRUMENTOS FINANCEIROS (CPC 48 / IFRS 9):`,`* Categorias: custo amortizado, valor justo por ORA, valor justo por resultado`,`* Perdas esperadas (modelo de impairment)`,``,`ARRENDAMENTO (CPC 06 R2 / IFRS 16):`,`* Arrendatario reconhece: ATIVO DE DIREITO DE USO + PASSIVO`,`* Excecoes: prazo <= 12 meses e baixo valor`,`* Extingue distincao operacional vs financeiro para o arrendatario`,``,`PROPRIEDADE PARA INVESTIMENTO (CPC 28):`,`* Mantida para renda/valorizacao; mensuracao a custo ou valor justo`,``,`COMBINACAO DE NEGOCIOS (CPC 15 / IFRS 3):`,`* Goodwill = (Contraprestacao + PNC + interesse previo) - VJ liquido`,`* Positivo = GOODWILL (intangivel, nao amortizavel, impairment anual)`,`* Negativo = COMPRA VANTAJOSA (ganho no resultado imediatamente)`,``,`MEP (CPC 18 / IAS 28):`,`* Coligadas (influencia significativa >= 20% votante) e controladas`,`* Investimento atualizado pelo % do PL da investida`,``,`SUBVENCAO GOVERNAMENTAL (CPC 07):`,`* Reconhecida no resultado na base sistematica (Lei 14.789/2023)`,``,`DICA FCC: Goodwill = Contraprestacao + PNC + interesse previo - VJ liquido. Positivo=goodwill; negativo=compra vantajosa (vai pro resultado).`],"COA-2":[`CONTABILIDADE DE CUSTOS - Classificacoes:`,`* DIRETOS x INDIRETOS (identificaveis ou nao ao produto)`,`* FIXOS x VARIAVEIS (independem ou variam com a producao)`,`  Custo fixo UNITARIO diminui com mais producao (diluicao)`,`  Custo variavel TOTAL aumenta, unitario constante`,``,`MARGEM DE CONTRIBUICAO:`,`* MC unitaria = PV - CV unitario`,`* Indice de MC = MC / PV`,``,`PONTOS DE EQUILIBRIO:`,`* CONTABIL (PEC) = CF / MCu (cobre custos contabeis, inclui depreciacao)`,`* ECONOMICO (PEE) = (CF + custo de oportunidade) / MCu`,`* FINANCEIRO (PEF) = (CF - depreciacao) / MCu (so saidas de caixa)`,``,`METODOS DE CUSTEIO:`,`* ABSORCAO: rateia TODOS os custos (exigido pelo fisco/societario)`,`* VARIAVEL (direto): so custos variaveis no produto; fixos = despesa`,`  do periodo. Melhor para DECISAO gerencial`,`* ABC (Activity-Based Costing): custos por ATIVIDADES, maior precisao`,``,`DEPARTAMENTALIZACAO:`,`* Centros produtivos e auxiliares; rateio por criterios tecnicos`,``,`CUSTO PADRAO:`,`* Comparacao padrao x real -> analise de variacoes`,``,`PRODUCAO:`,`* Por ordem, continua e conjunta (coprodutos, subprodutos)`,``,`DICA FCC: PEC = CF/MCu. Questao classica: dar CF, PV e CV e pedir os 3 pontos de equilibrio. No PEF subtrai-se a depreciacao do CF.`],"DTR-1":[`CTN - OBRIGACAO TRIBUTARIA (arts. 113-138):`,`* PRINCIPAL: pagar tributo ou penalidade pecuniaria`,`* ACESSORIA: fazer, nao fazer ou tolerar (descumprir -> vira principal)`,`* Fato Gerador: situacao NECESSARIA E SUFICIENTE prevista em lei`,`* Sujeito ativo (credor) e passivo (contribuinte ou responsavel)`,``,`RESPONSABILIDADE TRIBUTARIA:`,`* Por SUBSTITUICAO: desde a origem (ex: ICMS-ST)`,`* Por TRANSFERENCIA: evento posterior (sucessao, terceiros)`,`* Art. 135: dolo -> responsabilidade PESSOAL dos socios-gerentes`,`* Solidariedade: NAO comporta beneficio de ordem (art. 124 PU)`,``,`LANCAMENTO:`,`* DE OFICIO: Fisco age sozinho (IPTU, IPVA)`,`* POR DECLARACAO: contribuinte declara, Fisco lanca`,`* POR HOMOLOGACAO: contribuinte antecipa SEM previo exame`,`  Prazo decadencial: 5 anos do FG (art. 150 par.4)`,``,`SUSPENSAO (art. 151) - MDRRLP:`,`* Moratoria, Deposito integral, Reclamacoes/Recursos, Liminar/Tutela,`,`  Parcelamento`,``,`EXTINCAO (art. 156) - 11 modalidades:`,`* Pagamento, compensacao, transacao, remissao, prescricao, decadencia,`,`  conversao de deposito, consignacao, decisao admin/judicial, dacao em pagamento`,``,`EXCLUSAO:`,`* ISENCAO (exclui o tributo) e ANISTIA (exclui a multa)`,``,`DECADENCIA x PRESCRICAO:`,`* Decadencia (art. 173): extingue o direito de LANCAR (5 anos)`,`* Prescricao (art. 174): extingue a acao de COBRAR (5 anos da constituicao)`,``,`DICA FCC: Diferenciar SUSPENSAO (MDRRLP), EXTINCAO (art. 156) e EXCLUSAO (isencao/anistia) e obrigatorio. A banca mistura as modalidades.`],"DTR-2":[`REFORMA TRIBUTARIA - EC 132/2023 + LC 214/2025:`,``,`IBS (Imposto sobre Bens e Servicos):`,`* Substitui: ICMS + ISS`,`* Competencia: COMPARTILHADA (Estados/DF/Municipios)`,`* Administracao: COMITE GESTOR do IBS (art. 156-B CF)`,`* Nao-cumulatividade PLENA (credito amplo)`,`* Principio do DESTINO: imposto devido no LOCAL DE CONSUMO`,`* Aliquota: cada ente define a sua (referencia)`,``,`CBS (Contribuicao sobre Bens e Servicos):`,`* Substitui: PIS + COFINS`,`* Competencia: FEDERAL (Uniao)`,`* Administracao: Receita Federal`,``,`IS (Imposto Seletivo):`,`* Art. 153, VIII CF: bens/servicos PREJUDICIAIS a saude/meio ambiente`,`* Competencia: FEDERAL`,`* NAO integra a base do IBS e CBS`,``,`PERIODO DE TRANSICAO:`,`* 2026: aliquota teste 0,1%`,`* 2027-2028: CBS plena, IBS gradual`,`* 2029-2032: reducao gradual do ICMS/ISS`,`* 2033: sistema novo COMPLETO`,``,`CARACTERISTICAS DO IVA DUAL BRASILEIRO:`,`* IBS (subnacional) + CBS (federal) = modelo de IVA dual`,`* Cashback para baixa renda; cesta basica com aliquota zero`,``,`DICA FCC: IBS (estados/municipios, Comite Gestor) vs CBS (federal, Receita Federal). Principio do DESTINO = imposto no local de consumo, reduzindo a guerra fiscal.`],"DTR-3":[`LC 87/1996 - LEI KANDIR (ICMS Nacional):`,`* NAO-CUMULATIVIDADE: credito do imposto das etapas anteriores`,`* Isencao/nao-incidencia NAO gera credito (salvo disposicao contraria)`,`* ATIVO PERMANENTE: credito a razao de 1/48 por mes (4 anos)`,`* USO E CONSUMO: credito VEDADO ate 2033 (art. 33)`,`* Aliquotas interestaduais: 7% ou 12% conforme regiao`,`* DIFAL (EC 87/2015): diferencial nas vendas a consumidor final`,``,`LC 24/1975 - CONFAZ:`,`* Beneficios fiscais de ICMS exigem CONVENIO`,`* Aprovacao: UNANIMIDADE dos presentes (minimo 4/5 dos estados)`,`* Um estado pode VETAR`,`* LC 160/2017: remissao de beneficios concedidos sem convenio`,``,`LC 123/2006 - SIMPLES NACIONAL:`,`* MEI (ate 81 mil/ano), ME (ate 360 mil), EPP (ate 4,8 milhoes)`,`* DAS: guia unica reunindo tributos`,`* ICMS-ST NAO entra no DAS (recolhido separadamente)`,`* Vedacoes do art. 17`,``,`LC 116/2003 - ISSQN:`,`* Competencia MUNICIPAL`,`* Lista anexa define o que e servico (ISS) e o que e ICMS`,``,`LC 105/2001: sigilo bancario e seu compartilhamento com o Fisco`,`LC 192/2022: ICMS monofasico sobre combustiveis`,``,`DICA FCC: Convenio CONFAZ exige UNANIMIDADE. ICMS-ST fora do DAS e questao classica do Simples Nacional.`],"LTE-1":[`ICMS-CE (Lei 18.665/2023 + Decreto 33.327/2019 - RICMS):`,`* Fato gerador: circulacao de mercadorias + transporte interestadual/`,`  intermunicipal + comunicacao`,`* Contribuinte: quem realiza operacoes com habitualidade`,``,`ICMS POR DENTRO (calculo interno):`,`* O imposto integra a propria base de calculo`,`* Formula: BC = valor sem ICMS / (1 - aliquota)`,`* Ex: produto 82, aliquota 18% -> BC = 82/0,82 = 100 -> ICMS = 18`,`* Aliquota efetiva (21,95%) MAIOR que a nominal (18%)`,``,`SUBSTITUICAO TRIBUTARIA NO CE:`,`* PROGRESSIVA (para frente): fabricante/importador recolhe o ICMS das`,`  etapas futuras com base em MVA ou pauta fiscal`,`  Se o FG presumido NAO ocorrer -> RESTITUICAO (STF RE 593.849)`,`* REGRESSIVA (diferimento): posterga o recolhimento`,``,`NAO-CUMULATIVIDADE NO CE:`,`* Uso e consumo: credito VEDADO ate 2033`,`* Ativo permanente: 1/48 por mes`,``,`ITCD-CE (Lei 15.812/2015):`,`* Causa mortis + doacao de quaisquer bens`,`* Aliquotas PROGRESSIVAS; maxima de 8% (Resolucao Senado 9/1992)`,``,`IPVA-CE (Lei 12.023/1992):`,`* Fato gerador: propriedade de veiculo em 1 de janeiro`,`* Base: valor venal`,``,`FECOP (LC 37/2003):`,`* Adicional de ate 2% no ICMS sobre produtos superfluos`,`* Vinculado ao combate a pobreza (art. 82 ADCT)`,``,`DICA FCC: O ICMS-CE segue a Lei Kandir (LC 87/96) como norma nacional. As questoes verificam se voce aplica corretamente a regra nacional ao contexto cearense.`],"FLD-1":[`FLUENCIA DE DADOS - SQL (ordem de execucao):`,`FROM -> JOIN -> WHERE -> GROUP BY -> HAVING -> SELECT -> ORDER BY -> LIMIT`,``,`WHERE x HAVING:`,`* WHERE: filtra LINHAS antes do agrupamento (sem funcoes de agregacao)`,`* HAVING: filtra GRUPOS apos GROUP BY (usa SUM, COUNT, AVG, MAX, MIN)`,``,`TIPOS DE JOIN:`,`* INNER: so registros com correspondencia em ambas as tabelas`,`* LEFT: todos da esquerda + correspondentes da direita (NULL se nao houver)`,`* RIGHT: inverso do LEFT`,`* FULL OUTER: todos de ambas`,`* CROSS: produto cartesiano`,``,`ARQUITETURA DE DADOS:`,`* Data Warehouse: dados curados, schema-on-write, otimizado para BI`,`* Data Lake: dados brutos, schema-on-read, barato e flexivel`,`* Data Lakehouse: combina os dois (ACID + analitica)`,`* Data Mart: subconjunto do DW por area`,``,`TIPOS DE DADOS:`,`* Estruturados (tabelas), nao estruturados (texto/imagem), semiestruturados (JSON/XML)`,``,`ETL x ELT:`,`* ETL: Extract -> Transform -> Load (tradicional)`,`* ELT: Extract -> Load -> Transform (cloud/big data)`,``,`METODOLOGIA CRISP-DM:`,`* Negocio -> Dados -> Preparacao -> Modelagem -> Avaliacao -> Implantacao`,``,`MACHINE LEARNING:`,`* Supervisionado, nao supervisionado, semi-supervisionado`,`* Deep Learning, NLP, IA generativa`,``,`LGPD (Lei 13.709/2018):`,`* Base legal do Fisco: cumprimento de obrigacao legal (art. 7, II)`,`* Controlador, operador, encarregado (DPO), titular`,`* Sigilo fiscal: CTN arts. 198-199`,``,`SEGURANCA: CIA (Confidencialidade, Integridade, Disponibilidade)`,``,`DICA FCC: HAVING vs WHERE e a questao mais cobrada de SQL. HAVING filtra grupos (apos agrupamento) e pode usar SUM/COUNT/AVG.`],"FPB-1":[`FINANCAS PUBLICAS - Funcoes do Governo (Musgrave, 1959):`,`1. ALOCATIVA: corrigir FALHAS DE MERCADO`,`   bens publicos, externalidades, monopolios naturais, assimetria`,`2. DISTRIBUTIVA: reduzir DESIGUALDADE`,`   impostos progressivos, transferencias, subsidios`,`3. ESTABILIZADORA: emprego, precos, crescimento`,`   politica fiscal anticiclica`,``,`FALHAS DE MERCADO:`,`* Bens publicos PUROS: NAO RIVAL + NAO EXCLUDENTE -> FREE RIDER`,`  Ex: defesa nacional, iluminacao publica, farol maritimo`,`* Externalidade NEGATIVA (poluicao): custo social > privado`,`  -> producao acima do otimo -> IMPOSTO PIGOUVIANO`,`* Externalidade POSITIVA (vacinacao): beneficio social > privado`,`  -> producao abaixo do otimo -> SUBSIDIO`,`* Monopolio natural: custos decrescentes -> regulacao`,``,`TRIBUTACAO:`,`* Capacidade contributiva x criterio do beneficio`,`* Progressivo, regressivo, proporcional`,`* Trade-off eficiencia x equidade`,``,`RESULTADO FISCAL:`,`* PRIMARIO: receitas nao financeiras - despesas nao financeiras (sem juros)`,`* NOMINAL: Primario - Juros nominais`,`* NFSP: -Resultado Primario + Juros nominais (variacao da divida liquida)`,``,`DEFICIT PUBLICO E FINANCIAMENTO:`,`* Emissao de moeda, divida interna/externa, venda de ativos`,``,`DICA FCC: Free rider justifica a provisao estatal de bens publicos. Superavit primario NAO significa que a divida caiu (se os juros forem maiores, ela cresce).`]},f={"LP-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Assinale a alternativa com concordancia verbal CORRETA:`,o:[`A) Houveram muitas irregularidades.`,`B) Fazem dois anos que nao declara.`,`C) Os dados e o relatorio foram encaminhados.`,`D) A maioria dos auditores aprovaram.`,`E) E necessario maiores esclarecimentos.`],g:`C`,c:`Sujeito composto -> plural. A: HAVER impessoal=Houve. B: FAZER tempo=Faz. D: maioria de+plural=singular. E: sujeito 'maiores esclarecimentos'=Sao necessarios.`},{a:2022,r:`FCC/Fiscal-2022`,q:`A regencia verbal CORRETA esta em:`,o:[`A) Aspirava o cargo ha anos.`,`B) Preferiu de oficio do que homologacao.`,`C) Informou os auditores da legislacao.`,`D) Assistiu o procedimento.`,`E) Pagou o tributo visando a evitar a execucao.`],g:`E`,c:`'visar a'=objetivo. A: aspirar AO cargo. B: preferir nunca 'do que'. C: informar SOBRE. D: assistir (ver)=AO.`},{a:2021,r:`FCC/PGE-2021`,q:`Quanto ao emprego da crase, e CORRETO:`,o:[`A) Entregou os documentos a ele.`,`B) Encaminhou a Receita a documentacao.`,`C) Referiu-se a multa aplicada.`,`D) Decisao contraria a implementar.`,`E) Prazo a ser cumprido.`],g:`C`,c:`Crase antes de substantivo feminino. A: pronome pessoal=PROIBIDA. D/E: infinitivo=PROIBIDA.`},{a:2020,r:`FCC/TRF-2020`,q:`A coesao REFERENCIAL e realizada por:`,o:[`A) Conjuncoes logico-semanticas.`,`B) Pronomes, sinonimos que retomam elementos.`,`C) Progressao tematica.`,`D) Adverbios de modo.`,`E) Artigos definidos.`],g:`B`,c:`Coesao REFERENCIAL: retomada (anafora) ou antecipacao (catafora) - pronomes, sinonimos. Diferente da SEQUENCIAL (conectivos).`},{a:2019,r:`FCC/ISS-2019`,q:`'Se tivesse pago, nao teria sido autuado' expressa:`,o:[`A) Concessao`,`B) Finalidade`,`C) Condicao contrafactual`,`D) Causa no presente`,`E) Temporalidade`],g:`C`,c:`CONDICIONAL contrafactual: 'tivesse pago'+'teria sido'=hipotese NAO realizada no passado.`},{a:2023,r:`FCC/TRT-2023`,q:`A concordancia nominal CORRETA esta em:`,o:[`A) Anexo seguem os documentos.`,`B) E proibido entrada de estranhos.`,`C) Os funcionarios ficaram alerta.`,`D) Bastantes pessoas compareceram.`,`E) Menas burocracia no processo.`],g:`D`,c:`'Bastante' como pronome adjetivo concorda: bastantes pessoas. A: anexoS. B: proibidA entrada (com artigo). C: alertaS (adjetivo). E: 'menas' nao existe -> menos.`},{a:2022,r:`FCC/TCE-2022`,q:`Em 'Vossa Excelencia ___ os documentos', completa-se com:`,o:[`A) trouxestes`,`B) trouxe`,`C) trouxeram`,`D) trazeis`,`E) trouxeste`],g:`B`,c:`Pronome de tratamento (Vossa Excelencia) concorda em 3a pessoa do singular: trouxe.`},{a:2021,r:`FCC/Fiscal-2021`,q:`O 'que' funciona como conjuncao integrante em:`,o:[`A) O livro que comprei e bom.`,`B) Espero que voce venha.`,`C) A casa, que e velha, caiu.`,`D) Que dia lindo!`,`E) Ele e mais alto que voce.`],g:`B`,c:`Conjuncao integrante introduz oracao substantiva (espero ISSO). A/C: pronome relativo. D: interjeicao. E: comparativo.`},{a:2020,r:`FCC/PGE-2020`,q:`Na regencia nominal, esta CORRETO:`,o:[`A) Ansioso de ver o resultado.`,`B) Apto para o cargo.`,`C) Compativel a norma.`,`D) Preferivel que o outro.`,`E) Habil de negociar.`],g:`B`,c:`'Apto para/a'=correto. A: ansioso POR. C: compativel COM. D: preferivel A. E: habil EM.`},{a:2019,r:`FCC/TRF-2019`,q:`O pronome 'cujo':`,o:[`A) Pode ser substituido por 'que'.`,`B) Indica posse e concorda com o termo seguinte.`,`C) Retoma o termo anterior.`,`D) E pronome demonstrativo.`,`E) E invariavel.`],g:`B`,c:`'Cujo'=relativo POSSESSIVO, concorda com o substantivo que o SEGUE. Nao admite artigo antes nem depois.`},{a:2023,r:`FCC/Adm-2023`,q:`A virgula esta empregada CORRETAMENTE em:`,o:[`A) O auditor, verificou os livros.`,`B) Sao Paulo, 10 de maio de 2026.`,`C) Comprou livros, canetas e, lapis.`,`D) Quem estuda, passa.`,`E) O ICMS imposto estadual incide.`],g:`B`,c:`Virgula separa local e data. A: entre sujeito e verbo=erro. C: antes de 'e' em enumeracao=erro. D: entre sujeito e verbo. E: aposto sem virgula.`}],"LP-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Na interpretacao textual, INFERIR significa:`,o:[`A) Repetir literalmente o texto.`,`B) Deduzir o que o texto permite concluir, mesmo nao explicito.`,`C) Resumir o primeiro paragrafo.`,`D) Listar palavras-chave.`,`E) Identificar erros gramaticais.`],g:`B`,c:`INFERENCIA=conclusao logica a partir do texto, mesmo sem estar literal. FCC cobra muito; cuidado com alternativas que exageram.`},{a:2022,r:`FCC/Fiscal-2022`,q:`O conectivo 'ao passo que' indica:`,o:[`A) Causa`,`B) Consequencia`,`C) Concessao`,`D) Oposicao/contraste`,`E) Finalidade`],g:`D`,c:`'Ao passo que'=oposicao/contraste (equivale a 'enquanto', 'ao contrario').`},{a:2021,r:`FCC/TCE-2021`,q:`Identifique o ERRO de ortografia:`,o:[`A) Exito no lancamento.`,`B) Credito constituido.`,`C) Parcelamento suspende.`,`D) Contribuicao de melhoria.`,`E) Imunidade prevista.`],g:`A`,c:`'Exito' correto e 'Êxito' (com acento - paroxitona terminada em ditongo? Na verdade proparoxitona: É-xi-to, sempre acentuada). As demais corretas.`},{a:2020,r:`FCC/Fiscal-2020`,q:`A oracao 'que incide sobre mercadorias' em 'O ICMS, que incide sobre mercadorias, e estadual' e:`,o:[`A) Subordinada adjetiva restritiva`,`B) Subordinada adjetiva explicativa`,`C) Subordinada substantiva`,`D) Coordenada aditiva`,`E) Principal`],g:`B`,c:`Entre virgulas=adjetiva EXPLICATIVA (informacao adicional). Sem virgulas seria restritiva.`},{a:2019,r:`FCC/Adm-2019`,q:`A funcao da linguagem predominante em texto publicitario e:`,o:[`A) Referencial`,`B) Emotiva`,`C) Conativa/apelativa`,`D) Fatica`,`E) Metalinguistica`],g:`C`,c:`CONATIVA/apelativa=foco no receptor, busca convencer/persuadir (publicidade). Referencial=informacao. Emotiva=emissor.`},{a:2023,r:`FCC/TRT-2023`,q:`A pontuacao esta CORRETA em:`,o:[`A) Estudou; logo, passou.`,`B) Estudou logo passou.`,`C) Estudou, logo passou`,`D) Estudou: logo passou.`,`E) Estudou. Logo, passou`],g:`A`,c:`Ponto e virgula separa oracoes coordenadas com conectivo conclusivo; virgula isola 'logo'.`},{a:2022,r:`FCC/TCE-2022`,q:`O 'se' e particula apassivadora em:`,o:[`A) Se chove, fico em casa.`,`B) Vendem-se casas.`,`C) Trata-se de um erro.`,`D) Ele se feriu.`,`E) Nao se sabe a resposta.`],g:`B`,c:`'Vendem-se casas'=casas SAO VENDIDAS (voz passiva sintetica). Verbo concorda com sujeito 'casas' (plural).`},{a:2021,r:`FCC/Fiscal-2021`,q:`Em 'Choveu muito ontem', o sujeito e:`,o:[`A) Oculto (ele)`,`B) Indeterminado`,`C) Inexistente (oracao sem sujeito)`,`D) Simples (chuva)`,`E) Composto`],g:`C`,c:`Verbo que indica fenomeno da natureza (chover)=impessoal=oracao SEM sujeito (sujeito inexistente).`},{a:2020,r:`FCC/PGE-2020`,q:`A coesao por SUBSTITUICAO ocorre em:`,o:[`A) O auditor chegou. Ele analisou tudo.`,`B) Comprou e vendeu.`,`C) Estudou, portanto passou.`,`D) Casa grande e bonita.`,`E) Veio mas nao falou.`],g:`A`,c:`'Ele' substitui 'o auditor'=coesao referencial por substituicao pronominal (anafora).`},{a:2019,r:`FCC/TRF-2019`,q:`Sinonimo de 'expurgar' no contexto juridico:`,o:[`A) ratificar`,`B) convalidar`,`C) anular/eliminar`,`D) homologar`,`E) confirmar`],g:`C`,c:`EXPURGAR=eliminar, extirpar, ANULAR. Anulacao tem efeito ex tunc (retroativo).`},{a:2023,r:`FCC/Adm-2023`,q:`'Por que', 'porque', 'por que' e 'porque' - a forma para iniciar pergunta direta e:`,o:[`A) porque`,`B) porquê`,`C) por que`,`D) por quê`,`E) Por quê`],g:`C`,c:`'Por que' (separado, sem acento) inicia perguntas: Por que voce faltou? 'Por quê' (com acento) no fim de frase. 'Porque'=resposta. 'Porquê'=substantivo.`}],"MAT-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Capital de R$15.000 a juros compostos de 2% a.m. por 3 meses (1,02^3=1,0612). O montante e:`,o:[`A) R$15.900`,`B) R$15.918`,`C) R$15.936`,`D) R$15.612`,`E) R$16.000`],g:`B`,c:`M=C(1+i)^n=15.000x1,0612=15.918. Juros compostos=918. Juros simples seria 900 (15.900).`},{a:2022,r:`FCC/Fiscal-2022`,q:`Financiamento de R$60.000 em 3 parcelas pelo SAC, taxa 10% a.p. A 2a prestacao e:`,o:[`A) R$26.000`,`B) R$24.000`,`C) R$22.000`,`D) R$20.000`,`E) R$18.000`],g:`B`,c:`SAC: amortizacao=60.000/3=20.000. 2a: SD=40.000, J=4.000, prestacao=20.000+4.000=24.000.`},{a:2021,r:`FCC/TCE-2021`,q:`Aplicacao de R$8.000 a juros simples de 1,5% a.m. por 8 meses rende:`,o:[`A) R$960`,`B) R$1.000`,`C) R$1.200`,`D) R$640`,`E) R$800`],g:`A`,c:`J=Cxixn=8.000x0,015x8=960.`},{a:2020,r:`FCC/ISS-2020`,q:`No sistema PRICE, as prestacoes sao:`,o:[`A) Decrescentes`,`B) Crescentes`,`C) Constantes`,`D) Variaveis aleatoriamente`,`E) Iguais a amortizacao`],g:`C`,c:`PRICE (frances): prestacoes CONSTANTES, juros decrescentes, amortizacao crescente. SAC tem prestacoes decrescentes.`},{a:2019,r:`FCC/Adm-2019`,q:`A taxa REAL, dada inflacao de 5% e taxa nominal de 12%, e aproximadamente:`,o:[`A) 7,0%`,`B) 6,67%`,`C) 17,6%`,`D) 5,0%`,`E) 12,0%`],g:`B`,c:`(1+0,12)=(1+real)(1+0,05) -> 1,12/1,05=1,0667 -> real=6,67%. Nao e simples subtracao (7%).`},{a:2023,r:`FCC/TRT-2023`,q:`O desconto COMERCIAL (por fora) e calculado sobre:`,o:[`A) O valor atual`,`B) O valor nominal (de face)`,`C) A media dos valores`,`D) O valor presente liquido`,`E) A taxa interna de retorno`],g:`B`,c:`Desconto COMERCIAL incide sobre o valor NOMINAL (maior desconto). RACIONAL incide sobre o valor atual.`},{a:2022,r:`FCC/TCE-2022`,q:`Capital que dobra a juros compostos de 100% ao periodo leva:`,o:[`A) 1 periodo`,`B) 2 periodos`,`C) 0,5 periodo`,`D) 4 periodos`,`E) Depende do capital`],g:`A`,c:`M=C(1+1)^n=2C -> (2)^n=2 -> n=1. A 100%, dobra em 1 periodo.`},{a:2021,r:`FCC/Fiscal-2021`,q:`No SAC, a parcela de JUROS ao longo do tempo e:`,o:[`A) Crescente`,`B) Constante`,`C) Decrescente`,`D) Igual a amortizacao`,`E) Zero`],g:`C`,c:`SAC: juros DECRESCENTES (incidem sobre saldo devedor que diminui). Amortizacao constante.`},{a:2020,r:`FCC/PGE-2020`,q:`Valor presente de R$11.000 a receber em 1 ano, taxa 10% a.a.:`,o:[`A) R$10.000`,`B) R$9.900`,`C) R$11.000`,`D) R$10.100`,`E) R$9.000`],g:`A`,c:`VP=VF/(1+i)=11.000/1,10=10.000.`},{a:2019,r:`FCC/TRF-2019`,q:`Taxas EQUIVALENTES, em juros compostos, produzem:`,o:[`A) Sempre o mesmo valor nominal`,`B) O mesmo montante em prazos diferentes para o mesmo capital`,`C) Valores proporcionais ao tempo`,`D) Juros simples`,`E) Rendimento linear`],g:`B`,c:`Taxas EQUIVALENTES (compostos): geram o mesmo montante final em prazos distintos. Diferente de proporcionais (simples).`},{a:2023,r:`FCC/Adm-2023`,q:`Montante de R$5.000 a 1% a.m. por 2 meses (juros compostos):`,o:[`A) R$5.100`,`B) R$5.100,50`,`C) R$5.100,00`,`D) R$5.100,50 (1,0201)`,`E) R$5.200`],g:`D`,c:`M=5.000x(1,01)^2=5.000x1,0201=5.100,50. Composto rende mais que simples (5.100).`}],"MAT-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Dados 5,8,3,12,8,15,8 - a MEDIANA e a MODA sao:`,o:[`A) 8 e 8`,`B) 8 e 5`,`C) 8,43 e 8`,`D) 12 e 8`,`E) 8 e 12`],g:`A`,c:`Ordenando: 3,5,8,8,8,12,15. N=7 impar -> mediana=4o elemento=8. Moda=8 (3 vezes). Media=8,43.`},{a:2022,r:`FCC/Fiscal-2022`,q:`P->Q verdadeira e Q falsa. Pelo Modus Tollens conclui-se:`,o:[`A) P verdadeira`,`B) P falsa (nao-P)`,`C) Q verdadeira`,`D) Indeterminado`,`E) P e Q verdadeiras`],g:`B`,c:`MODUS TOLLENS: P->Q, nao-Q, logo nao-P. Se Q e falsa, P e falsa.`},{a:2021,r:`FCC/TCE-2021`,q:`Negacao de 'Todo auditor conhece o CTN':`,o:[`A) Nenhum auditor conhece o CTN`,`B) Algum auditor nao conhece o CTN`,`C) Todo auditor desconhece o CTN`,`D) Alguns conhecem`,`E) Nenhum desconhece`],g:`B`,c:`Negacao de 'todo A e B' = 'algum A nao e B' (existe ao menos um que nao).`},{a:2020,r:`FCC/ISS-2020`,q:`P->Q e Q->R verdadeiras. Conclui-se necessariamente:`,o:[`A) R->P`,`B) P->R`,`C) nao-P`,`D) Q->P`,`E) R e P`],g:`B`,c:`SILOGISMO HIPOTETICO (transitividade): P->Q, Q->R, logo P->R.`},{a:2019,r:`FCC/Adm-2019`,q:`Desvio-padrao mede:`,o:[`A) O valor central`,`B) A dispersao dos dados em torno da media`,`C) O valor mais frequente`,`D) A amplitude total`,`E) A assimetria`],g:`B`,c:`Desvio-padrao=dispersao em torno da media (raiz da variancia). Mediana=central; moda=frequente.`},{a:2023,r:`FCC/TRT-2023`,q:`Probabilidade de, em 2 lancamentos de moeda, sair 2 caras:`,o:[`A) 1/2`,`B) 1/4`,`C) 1/3`,`D) 3/4`,`E) 1`],g:`B`,c:`Eventos independentes: P=1/2 x 1/2=1/4.`},{a:2022,r:`FCC/TCE-2022`,q:`Negacao de 'P e Q' (De Morgan):`,o:[`A) nao-P e nao-Q`,`B) nao-P ou nao-Q`,`C) P ou Q`,`D) nao-P -> Q`,`E) P e nao-Q`],g:`B`,c:`De Morgan: nao(P e Q) = nao-P OU nao-Q.`},{a:2021,r:`FCC/Fiscal-2021`,q:`Numero de comissoes de 3 pessoas escolhidas entre 5:`,o:[`A) 60`,`B) 10`,`C) 15`,`D) 125`,`E) 20`],g:`B`,c:`Combinacao C(5,3)=5!/(3!2!)=10. Ordem nao importa em comissao.`},{a:2020,r:`FCC/PGE-2020`,q:`Media de 10,20,30,40,50:`,o:[`A) 25`,`B) 30`,`C) 35`,`D) 20`,`E) 40`],g:`B`,c:`Media=(10+20+30+40+50)/5=150/5=30.`},{a:2019,r:`FCC/TRF-2019`,q:`A contrapositiva de 'Se chove, entao a rua molha' e:`,o:[`A) Se a rua molha, entao chove`,`B) Se nao molha a rua, entao nao chove`,`C) Se nao chove, nao molha`,`D) A rua molha e chove`,`E) Chove ou molha`],g:`B`,c:`Contrapositiva de P->Q e nao-Q -> nao-P: 'Se a rua nao molha, entao nao chove' (equivalente a original).`},{a:2023,r:`FCC/Adm-2023`,q:`Coeficiente de variacao serve para:`,o:[`A) Calcular a media`,`B) Comparar a dispersao relativa entre conjuntos`,`C) Achar a moda`,`D) Medir probabilidade`,`E) Ordenar dados`],g:`B`,c:`CV=desvio-padrao/media. Mede dispersao RELATIVA, util para comparar conjuntos de escalas diferentes.`}],"ADM-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No Modelo das 3 Linhas (IIA 2020), a 3a linha corresponde a:`,o:[`A) Gestao operacional`,`B) Compliance e gestao de riscos`,`C) Auditoria interna (asseguracao independente)`,`D) Controle externo (TCU)`,`E) Alta administracao`],g:`C`,c:`3a LINHA=AUDITORIA INTERNA (asseguracao independente). 1a=gestao operacional; 2a=compliance/riscos.`},{a:2022,r:`FCC/TCE-2022`,q:`A Lei 14.230/2021 exige, para improbidade, elemento subjetivo de:`,o:[`A) Culpa grave`,`B) Dolo especifico`,`C) Culpa simples`,`D) Apenas dano ao erario`,`E) Dolo generico`],g:`B`,c:`Lei 14.230/2021: DOLO ESPECIFICO imprescindivel. Culpa nao configura mais improbidade.`},{a:2021,r:`FCC/PGE-2021`,q:`Na LAI (Lei 12.527/2011), o prazo de resposta e:`,o:[`A) 10 dias`,`B) 15 dias uteis`,`C) 20 dias, prorrogavel por mais 10`,`D) 30 dias`,`E) 5 dias`],g:`C`,c:`LAI art. 11: 20 dias + prorrogacao de 10 (com justificativa). Sigilo: reservado 5, secreto 15, ultra-secreto 25 anos.`},{a:2020,r:`FCC/Adm-2020`,q:`A gestao de riscos (ISO 31000) tem como etapas:`,o:[`A) Planejar, executar, verificar, agir`,`B) Identificar, analisar, avaliar, tratar e monitorar`,`C) Prever, empenhar, liquidar, pagar`,`D) Apenas evitar riscos`,`E) Transferir todos os riscos`],g:`B`,c:`ISO 31000: identificar->analisar->avaliar->tratar->monitorar. Tratamento: evitar, reduzir, transferir, aceitar.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O apetite ao risco refere-se a:`,o:[`A) Eliminacao total dos riscos`,`B) Nivel de risco que a organizacao aceita assumir`,`C) Transferencia obrigatoria de riscos`,`D) Riscos operacionais apenas`,`E) Auditoria externa`],g:`B`,c:`Apetite ao risco=nivel de risco que a organizacao esta disposta a aceitar para atingir objetivos.`},{a:2023,r:`FCC/TRT-2023`,q:`Accountability significa:`,o:[`A) Apenas contabilidade publica`,`B) Responsabilizacao e prestacao de contas`,`C) Auditoria externa`,`D) Transparencia passiva`,`E) Gestao de pessoal`],g:`B`,c:`Accountability=responsabilizacao + dever de prestar contas. Pilar da governanca publica.`},{a:2022,r:`FCC/TCE-2022`,q:`Na governanca publica, a teoria da agencia trata da relacao entre:`,o:[`A) Estados e municipios`,`B) Principal (sociedade) e agente (gestor)`,`C) Auditor e auditado`,`D) Legislativo e Judiciario`,`E) Servidor e cidadao`],g:`B`,c:`Teoria da agencia: conflito entre PRINCIPAL (sociedade/povo) e AGENTE (gestor publico), com assimetria de informacao.`},{a:2021,r:`FCC/PGE-2021`,q:`A transparencia ATIVA na LAI consiste em:`,o:[`A) Responder a pedidos de informacao`,`B) Divulgar informacoes por iniciativa propria`,`C) Manter sigilo de documentos`,`D) Cobrar pelo acesso`,`E) Negar acesso a terceiros`],g:`B`,c:`Transparencia ATIVA=divulgacao proativa (por iniciativa do orgao). PASSIVA=resposta a pedidos.`},{a:2020,r:`FCC/Adm-2020`,q:`Na 2a linha do Modelo das 3 Linhas estao funcoes de:`,o:[`A) Auditoria interna`,`B) Gestao operacional`,`C) Compliance, controles e gestao de riscos`,`D) Controle externo`,`E) Conselho de administracao`],g:`C`,c:`2a LINHA=funcoes de suporte: compliance, gestao de riscos, controles internos (apoiam a 1a linha).`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O assedio moral no trabalho e tratado pela:`,o:[`A) Lei de Licitacoes`,`B) Convencao OIT 190/2019`,`C) LAI`,`D) LRF`,`E) Lei Anticorrupcao`],g:`B`,c:`Convencao OIT 190/2019 trata de violencia e assedio no mundo do trabalho.`},{a:2023,r:`FCC/TCE-2023`,q:`Integridade publica, no contexto de governanca, refere-se a:`,o:[`A) Apenas seguranca da informacao`,`B) Alinhamento consistente com valores e principios eticos para prevenir corrupcao`,`C) Auditoria de sistemas`,`D) Controle de estoque`,`E) Gestao orcamentaria`],g:`B`,c:`Integridade=alinhamento consistente e adesao a valores, principios e normas eticas para prevenir e combater a corrupcao.`}],"ADM-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`A modalidade DIALOGO COMPETITIVO (Lei 14.133/2021) aplica-se quando:`,o:[`A) O valor supera o limite do pregao`,`B) Ha 5 fornecedores cadastrados`,`C) Necessita-se de inovacao ou solucao inexistente no mercado`,`D) O objeto e intelectual`,`E) A licitacao e eletronica`],g:`C`,c:`Art. 32: dialogo competitivo para inovacao tecnologica ou solucao inexistente no mercado. A Adm. dialoga com licitantes antes de definir o objeto.`},{a:2022,r:`FCC/TCE-2022`,q:`Na Lei 14.133/2021, o criterio de julgamento por MENOR PRECO e tipico de:`,o:[`A) Concurso`,`B) Pregao (bens e servicos comuns)`,`C) Leilao`,`D) Dialogo competitivo`,`E) Concorrencia para obras especiais`],g:`B`,c:`PREGAO: bens e servicos comuns, criterio menor preco ou maior desconto.`},{a:2021,r:`FCC/PGE-2021`,q:`A improbidade que importa enriquecimento ilicito (Lei 8.429/92):`,o:[`A) Dispensa dolo`,`B) Exige dolo especifico apos a Lei 14.230/2021`,`C) Admite culpa`,`D) E imprescritivel`,`E) So atinge particulares`],g:`B`,c:`Apos Lei 14.230/2021, TODAS as modalidades de improbidade exigem DOLO ESPECIFICO, inclusive enriquecimento ilicito.`},{a:2020,r:`FCC/Adm-2020`,q:`A INEXIGIBILIDADE de licitacao ocorre quando:`,o:[`A) O valor e baixo`,`B) Ha inviabilidade de competicao`,`C) Ha emergencia`,`D) E guerra`,`E) Ha calamidade`],g:`B`,c:`INEXIGIBILIDADE (art. 74): inviabilidade de competicao (fornecedor exclusivo, artista consagrado). DISPENSA: competicao viavel mas a lei dispensa.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`Os principios da Adm. Publica no art. 37 CF sao (LIMPE):`,o:[`A) Legalidade, razoabilidade, moralidade, publicidade, eficiencia`,`B) Legalidade, impessoalidade, moralidade, publicidade, eficiencia`,`C) Legitimidade, economicidade, moralidade, publicidade, eficiencia`,`D) Supremacia, indisponibilidade, moralidade, publicidade`,`E) Legalidade, proporcionalidade, moralidade, publicidade`],g:`B`,c:`LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiencia (EC 19/98).`},{a:2023,r:`FCC/TRT-2023`,q:`A prescricao na improbidade (Lei 14.230/2021) e de:`,o:[`A) 5 anos`,`B) 8 anos do fato ou 4 anos apos fim do vinculo`,`C) 10 anos`,`D) 3 anos`,`E) Imprescritivel`],g:`B`,c:`Lei 14.230/2021: prescricao de 8 anos do fato; ou 4 anos apos o fim do vinculo (prescricao intercorrente).`},{a:2022,r:`FCC/TCE-2022`,q:`Na Lei 14.133/2021, a fase de habilitacao ocorre:`,o:[`A) Antes do julgamento das propostas`,`B) Apos o julgamento das propostas (regra geral)`,`C) Antes do edital`,`D) Apos a homologacao`,`E) Junto com a fase recursal apenas`],g:`B`,c:`Lei 14.133: regra geral inverte fases - habilitacao APOS julgamento das propostas (como no pregao).`},{a:2021,r:`FCC/PGE-2021`,q:`A legitimidade para propor acao de improbidade e:`,o:[`A) Concorrente entre MP e pessoa juridica lesada`,`B) Exclusiva do MP (Lei 14.230/2021)`,`C) De qualquer cidadao`,`D) Do Tribunal de Contas`,`E) Da Defensoria Publica`],g:`B`,c:`Lei 14.230/2021: legitimidade EXCLUSIVA do Ministerio Publico (extinguiu a legitimidade da pessoa juridica).`},{a:2020,r:`FCC/Adm-2020`,q:`A Lei Anticorrupcao (12.846/2013) responsabiliza pessoas juridicas de forma:`,o:[`A) Subjetiva`,`B) Objetiva`,`C) Solidaria apenas`,`D) Penal`,`E) Apenas civil mediante culpa`],g:`B`,c:`Lei 12.846/2013: responsabilidade OBJETIVA (independe de dolo/culpa) das pessoas juridicas por atos lesivos a Adm. nacional ou estrangeira.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O LEILAO, na Lei 14.133/2021, destina-se a:`,o:[`A) Servicos comuns`,`B) Trabalho tecnico`,`C) Alienacao de bens (maior lance)`,`D) Inovacao tecnologica`,`E) Obras de engenharia`],g:`C`,c:`LEILAO: alienacao de bens moveis/imoveis inserviveis ou legalmente apreendidos, criterio maior lance.`}],"ECO-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Se |Ed|=0,3, a demanda e:`,o:[`A) Elastica`,`B) Inelastica: aumento de preco eleva a receita`,`C) Unitaria`,`D) Perfeitamente inelastica`,`E) Perfeitamente elastica`],g:`B`,c:`|Ed|=0,3<1 -> INELASTICA. Aumento de preco eleva a receita total (quantidade cai pouco).`},{a:2022,r:`FCC/Fiscal-2022`,q:`A Curva de Laffer demonstra que:`,o:[`A) Mais aliquota sempre eleva arrecadacao`,`B) Ha aliquota otima; acima dela, mais tributacao reduz arrecadacao`,`C) Arrecadacao maxima com aliquota zero`,`D) Relacao linear aliquota-arrecadacao`,`E) Reduzir aliquota sempre eleva arrecadacao`],g:`B`,c:`Laffer: aliquota 0%=arrecadacao 0; 100%=arrecadacao 0. Ha ponto OTIMO; acima dele, evasao/informalidade reduzem a arrecadacao.`},{a:2021,r:`FCC/ISS-2021`,q:`A Regra de Ramsey, na tributacao otima, recomenda:`,o:[`A) Mesma aliquota para todos os bens`,`B) Aliquotas maiores em bens inelasticos para minimizar o peso morto`,`C) Aliquotas menores em bens de luxo`,`D) Maximizar arrecadacao ignorando eficiencia`,`E) Tributar so servicos`],g:`B`,c:`Regra de RAMSEY: aliquotas inversamente proporcionais a elasticidade. Bens INELASTICOS -> aliquota maior (menor distorcao).`},{a:2020,r:`FCC/TRF-2020`,q:`A externalidade NEGATIVA provoca falha de mercado porque:`,o:[`A) Produz quantidade insuficiente`,`B) Custo social > custo privado; mercado produz em excesso`,`C) Empresas nao lucram`,`D) E bem publico`,`E) Exige subsidio`],g:`B`,c:`Externalidade NEGATIVA: custo social > privado -> producao ACIMA do otimo. Solucao: imposto pigouviano.`},{a:2019,r:`FCC/Adm-2019`,q:`Em concorrencia perfeita, no longo prazo, o lucro economico tende a:`,o:[`A) Ser maximo`,`B) Ser zero`,`C) Ser negativo`,`D) Crescer indefinidamente`,`E) Igualar o monopolio`],g:`B`,c:`Concorrencia perfeita: livre entrada/saida leva o lucro economico a ZERO no longo prazo.`},{a:2023,r:`FCC/TRT-2023`,q:`A incidencia economica de um tributo recai mais sobre:`,o:[`A) Quem a lei define como contribuinte`,`B) O lado menos elastico do mercado`,`C) O lado mais elastico`,`D) Sempre o consumidor`,`E) Sempre o produtor`],g:`B`,c:`A carga recai mais sobre o lado MENOS elastico (que tem menos capacidade de evitar o tributo).`},{a:2022,r:`FCC/Fiscal-2022`,q:`O peso morto (perda de bem-estar) da tributacao e maior quando:`,o:[`A) A demanda e perfeitamente inelastica`,`B) Oferta e demanda sao mais elasticas`,`C) Nao ha tributo`,`D) O bem e essencial`,`E) A aliquota e zero`],g:`B`,c:`Peso morto e MAIOR quanto mais ELASTICAS forem oferta e demanda (mais distorcao de quantidade).`},{a:2021,r:`FCC/ISS-2021`,q:`No monopolio, comparado a concorrencia perfeita, observa-se:`,o:[`A) Preco menor e quantidade maior`,`B) Preco maior e quantidade menor, com peso morto`,`C) Lucro zero`,`D) Ausencia de barreiras`,`E) Produto homogeneo`],g:`B`,c:`Monopolio: preco MAIOR, quantidade MENOR que o otimo social -> gera peso morto (ineficiencia alocativa).`},{a:2020,r:`FCC/TRF-2020`,q:`Um bem com muitos substitutos proximos tende a ter demanda:`,o:[`A) Inelastica`,`B) Elastica`,`C) Unitaria`,`D) Perfeitamente inelastica`,`E) Constante`],g:`B`,c:`Mais substitutos -> demanda mais ELASTICA (consumidor troca facilmente se o preco sobe).`},{a:2019,r:`FCC/Adm-2019`,q:`O imposto PIGOUVIANO tem como objetivo:`,o:[`A) Maximizar arrecadacao`,`B) Corrigir externalidade negativa internalizando o custo social`,`C) Subsidiar producao`,`D) Reduzir a oferta de bens publicos`,`E) Eliminar o monopolio`],g:`B`,c:`Imposto PIGOUVIANO=corrige externalidade negativa, igualando custo privado ao social (poluidor-pagador).`}],"ECO-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`O PIB pela otica da demanda e:`,o:[`A) Salarios+Lucros+Juros+Alugueis`,`B) Valor da Producao - Consumo Intermediario`,`C) C+I+G+(X-M)`,`D) PNB - renda externa`,`E) Consumo+Poupanca`],g:`C`,c:`Otica da DEMANDA: PIB=C+I+G+(X-M). Renda: W+L+J+A. Producao: soma dos valores adicionados.`},{a:2022,r:`FCC/Fiscal-2022`,q:`A diferenca entre PIB e PNB e:`,o:[`A) Inflacao`,`B) A renda liquida enviada/recebida do exterior`,`C) Os impostos indiretos`,`D) A depreciacao`,`E) O consumo intermediario`],g:`B`,c:`PNB=PIB - renda enviada ao exterior + renda recebida do exterior. PIB=territorio; PNB=residentes.`},{a:2021,r:`FCC/ISS-2021`,q:`Politica fiscal expansionista, no modelo IS-LM:`,o:[`A) Desloca a LM para a esquerda`,`B) Desloca a IS para a direita`,`C) Reduz o PIB`,`D) Eleva a taxa de cambio`,`E) Nao afeta o produto`],g:`B`,c:`Politica fiscal expansionista (aumento de G ou reducao de T) desloca a IS para a DIREITA, elevando produto e juros.`},{a:2020,r:`FCC/TRF-2020`,q:`O indice oficial de inflacao do Brasil e o:`,o:[`A) IGP-M`,`B) IPCA`,`C) INPC`,`D) IPC-Fipe`,`E) IGP-DI`],g:`B`,c:`IPCA (IBGE) e o indice OFICIAL de inflacao, usado nas metas do Banco Central. Familias de 1 a 40 salarios minimos.`},{a:2019,r:`FCC/Adm-2019`,q:`O multiplicador keynesiano dos gastos e igual a:`,o:[`A) 1/(propensao marginal a consumir)`,`B) 1/(propensao marginal a poupar)`,`C) Propensao a consumir`,`D) PIB/consumo`,`E) 1/inflacao`],g:`B`,c:`Multiplicador=1/PMgPoupar=1/(1-PMgConsumir). Quanto maior a propensao a consumir, maior o multiplicador.`},{a:2023,r:`FCC/TRT-2023`,q:`Politica monetaria CONTRACIONISTA (combate a inflacao) envolve:`,o:[`A) Reducao da taxa Selic`,`B) Elevacao da taxa de juros`,`C) Aumento de gastos publicos`,`D) Reducao de impostos`,`E) Emissao de moeda`],g:`B`,c:`Monetaria contracionista: ELEVA juros (Selic), reduz liquidez, controla inflacao. Fiscal usa gastos/tributos.`},{a:2022,r:`FCC/Fiscal-2022`,q:`O investimento (I) no PIB inclui:`,o:[`A) Apenas compra de acoes`,`B) Formacao bruta de capital fixo + variacao de estoques`,`C) Gastos do governo`,`D) Consumo das familias`,`E) Exportacoes`],g:`B`,c:`I=FBCF (maquinas, construcao) + variacao de estoques. Compra de acoes e aplicacao financeira, nao entra no I do PIB.`},{a:2021,r:`FCC/ISS-2021`,q:`O deflator do PIB e calculado por:`,o:[`A) PIB real / PIB nominal`,`B) (PIB nominal / PIB real) x 100`,`C) PIB nominal - PIB real`,`D) IPCA acumulado`,`E) PIB / populacao`],g:`B`,c:`Deflator=(PIB nominal/PIB real)x100. Mede a variacao geral de precos de todos os bens do PIB.`},{a:2020,r:`FCC/TRF-2020`,q:`Na balanca comercial, exportacoes superiores a importacoes geram:`,o:[`A) Deficit`,`B) Superavit comercial`,`C) Equilibrio`,`D) Inflacao`,`E) Recessao`],g:`B`,c:`Exportacoes > importacoes = SUPERAVIT comercial (saldo positivo na balanca comercial).`},{a:2019,r:`FCC/Adm-2019`,q:`A conta corrente do balanco de pagamentos inclui:`,o:[`A) Apenas investimentos diretos`,`B) Bens, servicos, rendas e transferencias unilaterais`,`C) Reservas internacionais`,`D) Emprestimos externos`,`E) Apenas a balanca comercial`],g:`B`,c:`Conta corrente: balanca comercial (bens) + servicos + rendas (juros, lucros) + transferencias unilaterais.`}],"DCO-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No controle CONCENTRADO (ADI), os efeitos da decisao sao:`,o:[`A) Inter partes e ex nunc`,`B) Erga omnes, ex tunc e vinculante`,`C) Inter partes e ex tunc`,`D) Erga omnes e ex nunc apenas`,`E) Vinculante so para a Adm.`],g:`B`,c:`ADI/ADC/ADPF: erga omnes + ex tunc + vinculante (Judiciario e Adm. Publica). Modulacao temporal por 2/3 do STF.`},{a:2022,r:`FCC/TCE-2022`,q:`A ADPF e cabivel para:`,o:[`A) Qualquer lei federal`,`B) Atos do poder publico que violem preceito fundamental, inclusive leis pre-1988`,`C) So leis municipais`,`D) Contratos administrativos`,`E) Atos de particulares`],g:`B`,c:`ADPF (Lei 9.882/99): viola preceito fundamental; cabe contra leis PRE-constitucionais e atos municipais. Carater subsidiario.`},{a:2021,r:`FCC/PGE-2021`,q:`A Sumula Vinculante vincula:`,o:[`A) So o STF`,`B) Todo o Judiciario e a Adm. Publica direta e indireta`,`C) Apenas a Adm. federal`,`D) Tambem o Legislativo (funcao tipica)`,`E) So instancias inferiores`],g:`B`,c:`SV (art. 103-A): vincula todo o Judiciario + Adm. Publica direta e indireta. NAO vincula o STF nem o Legislativo (funcao tipica).`},{a:2020,r:`FCC/ISS-2020`,q:`Os direitos fundamentais do art. 5 CF tem aplicacao:`,o:[`A) Diferida`,`B) Imediata (art. 5 par.1)`,`C) Condicionada a lei`,`D) Programatica`,`E) So para natos`],g:`B`,c:`Art. 5 par. 1: normas de direitos e garantias fundamentais tem aplicacao IMEDIATA.`},{a:2019,r:`FCC/TRF-2019`,q:`No controle DIFUSO, os efeitos sao:`,o:[`A) Erga omnes`,`B) Inter partes e ex tunc`,`C) Vinculantes`,`D) Ex nunc obrigatorio`,`E) So prospectivos`],g:`B`,c:`Difuso: INTER PARTES + ex tunc. Senado pode suspender (art. 52, X) para erga omnes + ex nunc.`},{a:2023,r:`FCC/TRT-2023`,q:`Sao legitimados para propor ADI (art. 103 CF), EXCETO:`,o:[`A) Presidente da Republica`,`B) Procurador-Geral da Republica`,`C) Conselho Federal da OAB`,`D) Qualquer cidadao`,`E) Governador de Estado`],g:`D`,c:`Cidadao NAO e legitimado para ADI (so para acao popular). Legitimados: Presidente, Mesas, Governadores, PGR, OAB, partidos, confederacoes.`},{a:2022,r:`FCC/TCE-2022`,q:`A clausula petrea NAO inclui:`,o:[`A) Forma federativa de Estado`,`B) Voto direto, secreto, universal e periodico`,`C) Separacao dos Poderes`,`D) Direitos e garantias individuais`,`E) A taxa de juros constitucional`],g:`E`,c:`Clausulas petreas (art. 60 par.4): forma federativa, voto direto/secreto, separacao dos poderes, direitos individuais. Taxa de juros nao e clausula petrea.`},{a:2021,r:`FCC/PGE-2021`,q:`Norma constitucional de eficacia CONTIDA caracteriza-se por:`,o:[`A) Depender totalmente de lei`,`B) Ser plena, mas poder ser restringida por lei posterior`,`C) Nunca produzir efeitos`,`D) Ser apenas programatica`,`E) Nao admitir restricao`],g:`B`,c:`Eficacia CONTIDA: aplicacao imediata e plena, mas pode ser RESTRINGIDA por lei (ex: liberdade profissional).`},{a:2020,r:`FCC/ISS-2020`,q:`A ADO (Acao Direta de Inconstitucionalidade por Omissao) combate:`,o:[`A) Lei inconstitucional`,`B) Omissao do legislador em regulamentar a CF`,`C) Ato administrativo`,`D) Decisao judicial`,`E) Conflito entre estados`],g:`B`,c:`ADO: combate a OMISSAO inconstitucional (falta de norma regulamentadora). Da-se ciencia ao orgao omisso.`},{a:2019,r:`FCC/TRF-2019`,q:`O efeito vinculante da ADI alcanca:`,o:[`A) O proprio STF`,`B) O Poder Legislativo na funcao de legislar`,`C) Os demais orgaos do Judiciario e a Adm. Publica`,`D) Apenas as partes do processo`,`E) So a Uniao`],g:`C`,c:`Efeito vinculante: demais orgaos do Judiciario + Adm. Publica direta e indireta. NAO vincula o STF nem o Legislativo (funcao tipica).`}],"DAD-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`O ato com vicio de COMPETENCIA (em razao da pessoa):`,o:[`A) E sempre nulo`,`B) Pode ser convalidado/ratificado pela autoridade competente`,`C) E inexistente`,`D) E revogavel`,`E) Nao produz efeitos`],g:`B`,c:`Vicio de competencia (em razao da pessoa) e SANAVEL -> admite convalidacao/ratificacao. Exceto competencia exclusiva ou em razao da materia.`},{a:2022,r:`FCC/TCE-2022`,q:`A ANULACAO de ato administrativo produz efeitos:`,o:[`A) Ex nunc`,`B) Ex tunc (retroativos)`,`C) So futuros`,`D) Vinculantes`,`E) Prospectivos`],g:`B`,c:`ANULACAO (ilegalidade): efeitos EX TUNC (retroage). REVOGACAO (merito): ex nunc. Sumula 473 STF.`},{a:2021,r:`FCC/PGE-2021`,q:`A responsabilidade civil do Estado (art. 37 par.6) por atos comissivos e:`,o:[`A) Subjetiva`,`B) Objetiva (teoria do risco administrativo)`,`C) Por culpa presumida apenas`,`D) Penal`,`E) Inexistente`],g:`B`,c:`Atos comissivos: responsabilidade OBJETIVA (risco administrativo). Basta conduta+dano+nexo. Regresso contra agente com dolo/culpa.`},{a:2020,r:`FCC/ISS-2020`,q:`A REVOGACAO de ato administrativo:`,o:[`A) Decorre de ilegalidade`,`B) Funda-se em conveniencia e oportunidade, efeitos ex nunc, so pela Adm.`,`C) Tem efeitos ex tunc`,`D) Pode ser feita pelo Judiciario`,`E) E vinculada`],g:`B`,c:`REVOGACAO: motivo de merito (conveniencia/oportunidade), efeitos EX NUNC, exclusiva da Administracao.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`DESCENTRALIZACAO administrativa significa:`,o:[`A) Distribuir competencias dentro do mesmo orgao`,`B) Transferir competencias para outra pessoa juridica`,`C) Criar hierarquia interna`,`D) Concentrar poder`,`E) Extinguir orgaos`],g:`B`,c:`DESCENTRALIZACAO: transfere para OUTRA PJ (autarquia, fundacao, EP, SEM) ou particular. DESCONCENTRACAO: dentro da mesma PJ (orgaos).`},{a:2023,r:`FCC/TRT-2023`,q:`Atributo do ato administrativo que permite execucao sem intervencao judicial:`,o:[`A) Presuncao de legitimidade`,`B) Imperatividade`,`C) Autoexecutoriedade`,`D) Tipicidade`,`E) Discricionariedade`],g:`C`,c:`AUTOEXECUTORIEDADE: a Adm. executa o ato diretamente, sem precisar do Judiciario (ex: demolicao, apreensao).`},{a:2022,r:`FCC/TCE-2022`,q:`O poder de POLICIA caracteriza-se por:`,o:[`A) Punir servidores`,`B) Limitar direitos individuais em favor do interesse publico`,`C) Editar regulamentos internos`,`D) Organizar a hierarquia`,`E) Anular atos`],g:`B`,c:`Poder de POLICIA: condiciona/limita direitos e liberdades em prol do interesse publico (preventivo e repressivo).`},{a:2021,r:`FCC/PGE-2021`,q:`Sao requisitos do ato administrativo (COFIFOMOB):`,o:[`A) Competencia, finalidade, forma, motivo e objeto`,`B) Capacidade, forma e objeto licito`,`C) Apenas competencia e objeto`,`D) Legalidade e moralidade`,`E) Forma e publicidade`],g:`A`,c:`Requisitos: COmpetencia, FInalidade, FOrma, MOtivo, OBjeto. Vicios em competencia/forma sao sanaveis.`},{a:2020,r:`FCC/ISS-2020`,q:`Excludente da responsabilidade civil do Estado:`,o:[`A) Dolo do agente`,`B) Culpa exclusiva da vitima`,`C) Conduta comissiva`,`D) Nexo causal`,`E) Dano material`],g:`B`,c:`Excludentes (rompem o nexo): culpa exclusiva da vitima, caso fortuito/forca maior, fato exclusivo de terceiro.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`A administracao INDIRETA e composta por:`,o:[`A) Ministerios e secretarias`,`B) Autarquias, fundacoes publicas, empresas publicas e sociedades de economia mista`,`C) Orgaos sem personalidade`,`D) So autarquias`,`E) Particulares delegatarios`],g:`B`,c:`Adm. INDIRETA: autarquias, fundacoes publicas, empresas publicas, sociedades de economia mista (todas com personalidade juridica propria).`}],"DCI-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`A SV 24 do STF estabelece que crime material contra a ordem tributaria:`,o:[`A) Independe de lancamento`,`B) So se tipifica apos o lancamento definitivo do tributo`,`C) Prescreve em 3 anos`,`D) Inclui o mero inadimplemento`,`E) E acao penal privada`],g:`B`,c:`SV 24: nao se tipifica crime material (art. 1, I-IV, Lei 8.137/90) antes do lancamento DEFINITIVO do tributo.`},{a:2022,r:`FCC/TRF-2022`,q:`A lavagem de dinheiro (Lei 9.613/98) ocorre quando:`,o:[`A) Ha evasao acima de 5 milhoes`,`B) Bens de infracao penal sao ocultados/dissimulados`,`C) Empresa nao recolhe contribuicao`,`D) Funcionario aceita propina`,`E) Ha exportacao ficticia`],g:`B`,c:`Lavagem: ocultar/dissimular origem de bens de INFRACAO PENAL. Modelo all crimes (Lei 12.683/2012). 3 fases: colocacao, dissimulacao, integracao.`},{a:2021,r:`FCC/PGE-2021`,q:`A Lei Anticorrupcao (12.846/2013) responsabiliza:`,o:[`A) So pessoas fisicas`,`B) Pessoas juridicas objetivamente por atos contra a Adm. nacional e estrangeira`,`C) So servidores`,`D) PJ so se condenada criminalmente`,`E) So transnacionais`],g:`B`,c:`Lei 12.846/2013: responsabilidade OBJETIVA das PJ por atos lesivos a Adm. Publica nacional ou estrangeira. Acordo de leniencia reduz sancoes.`},{a:2020,r:`FCC/ISS-2020`,q:`No Direito Civil, a PRESCRICAO extingue:`,o:[`A) O direito material em si`,`B) A pretensao (direito de exigir judicialmente)`,`C) O negocio juridico`,`D) Contratos a termo`,`E) O direito potestativo`],g:`B`,c:`PRESCRICAO: extingue a PRETENSAO (acao). O direito subjetivo persiste. DECADENCIA: extingue o proprio direito potestativo.`},{a:2019,r:`FCC/TRT-2019`,q:`O crime FORMAL caracteriza-se por:`,o:[`A) Exigir resultado naturalistico`,`B) Consumar-se com a conduta, independente do resultado`,`C) So por funcionario publico`,`D) Exigir dois agentes`,`E) Depender de condicao objetiva`],g:`B`,c:`Crime FORMAL: consuma-se com a CONDUTA, o resultado e mero exaurimento. MATERIAL exige resultado; mera conduta nao preve resultado.`},{a:2023,r:`FCC/TRT-2023`,q:`O art. 2 da Lei 8.137/90 (crimes formais) inclui:`,o:[`A) Omitir informacao as autoridades`,`B) Falta de recolhimento de tributo descontado de terceiros`,`C) Fraudar a fiscalizacao`,`D) Negar nota fiscal`,`E) Alterar documento`],g:`B`,c:`Art. 2 (formais): ex. deixar de recolher tributo descontado/cobrado de terceiros. Consuma com a conduta, sem exigir lancamento definitivo.`},{a:2022,r:`FCC/TCE-2022`,q:`A DECADENCIA, no Direito Civil:`,o:[`A) Pode ser renunciada quando legal`,`B) Extingue o direito potestativo e, sendo legal, e irrenunciavel`,`C) Sempre se interrompe`,`D) So atinge a pretensao`,`E) Depende de acao judicial`],g:`B`,c:`DECADENCIA legal: extingue o DIREITO potestativo, e IRRENUNCIAVEL e pode ser reconhecida de oficio.`},{a:2021,r:`FCC/PGE-2021`,q:`No crime organizado (Lei 12.850/2013), a organizacao exige:`,o:[`A) 2 pessoas`,`B) 4 ou mais pessoas com estrutura ordenada e divisao de tarefas`,`C) 10 pessoas`,`D) Vinculo familiar`,`E) Apenas crimes tributarios`],g:`B`,c:`Lei 12.850/2013: organizacao criminosa = 4+ pessoas, estrutura ordenada, divisao de tarefas, vantagem ilicita. Colaboracao premiada e instrumento.`},{a:2020,r:`FCC/ISS-2020`,q:`No negocio juridico, o plano da VALIDADE exige:`,o:[`A) Apenas manifestacao de vontade`,`B) Agente capaz, objeto licito/possivel e forma prescrita ou nao defesa em lei`,`C) Registro em cartorio`,`D) Eficacia imediata`,`E) Ausencia de condicao`],g:`B`,c:`Validade (art. 104 CC): agente capaz + objeto licito, possivel, determinado + forma prescrita ou nao defesa em lei.`},{a:2019,r:`FCC/TRF-2019`,q:`O peculato (crime contra a Adm. Publica) e praticado por:`,o:[`A) Qualquer particular`,`B) Funcionario publico que se apropria de bem de que tem posse em razao do cargo`,`C) So por agentes politicos`,`D) Empresas`,`E) So em licitacoes`],g:`B`,c:`PECULATO: funcionario publico apropria-se de dinheiro/bem de que tem posse em razao do cargo (crime proprio).`}],"DFI-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`O limite de despesa com pessoal para os ESTADOS (LRF) e:`,o:[`A) 50% da RCL; Executivo 40,9%`,`B) 60% da RCL; Executivo 49%`,`C) 60% da RCL; Executivo 54%`,`D) 65%; Executivo 49%`,`E) 60%; Executivo 45%`],g:`B`,c:`Estados=60% da RCL, Executivo=49% (Leg+TC 3%, Jud 6%, MP 2%). Uniao=50/40,9. Municipios=60/54.`},{a:2022,r:`FCC/TCE-2022`,q:`A limitacao de empenho (art. 9 LRF) e acionada:`,o:[`A) No inicio do exercicio`,`B) Bimestralmente, quando a receita nao comporta as metas de resultado primario`,`C) So por lei`,`D) Em qualquer despesa`,`E) Pelo TCU`],g:`B`,c:`Art. 9: bimestralmente, se a receita nao comportar as metas fiscais -> contingenciamento. Nao atinge despesas constitucionalmente obrigatorias.`},{a:2021,r:`FCC/SEFAZ-2021`,q:`O Resultado Primario e:`,o:[`A) Receitas totais - despesas totais`,`B) Receitas nao financeiras - despesas nao financeiras (sem juros)`,`C) Resultado nominal + correcao`,`D) Receita tributaria - pessoal`,`E) Superavit / PIB`],g:`B`,c:`PRIMARIO: receitas nao financeiras - despesas nao financeiras (exclui juros). Mede o esforco fiscal. NOMINAL=primario - juros.`},{a:2020,r:`FCC/TRT-2020`,q:`O limite PRUDENCIAL de despesa com pessoal corresponde a:`,o:[`A) 90% do limite`,`B) 95% do limite legal`,`C) 100%`,`D) 50%`,`E) 60% da RCL`],g:`B`,c:`Limite prudencial=95% do limite legal. Atingido, vedam-se aumentos, criacao de cargos, horas extras (medidas preventivas).`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O RGF (Relatorio de Gestao Fiscal) e publicado:`,o:[`A) Mensalmente`,`B) Bimestralmente`,`C) Quadrimestralmente`,`D) Anualmente`,`E) Semestralmente`],g:`C`,c:`RGF=QUADRIMESTRAL. RREO (Relatorio Resumido de Execucao Orcamentaria)=BIMESTRAL.`},{a:2023,r:`FCC/TRT-2023`,q:`O art. 42 da LRF veda, nos 2 ultimos quadrimestres do mandato:`,o:[`A) Pagar servidores`,`B) Contrair obrigacao de despesa sem disponibilidade de caixa`,`C) Realizar licitacoes`,`D) Arrecadar tributos`,`E) Editar a LDO`],g:`B`,c:`Art. 42: vedado contrair, nos 2 ultimos quadrimestres, obrigacao de despesa que nao possa ser paga no mandato sem disponibilidade de caixa.`},{a:2022,r:`FCC/TCE-2022`,q:`O Resultado NOMINAL difere do PRIMARIO porque:`,o:[`A) Inclui os juros nominais da divida`,`B) Exclui as receitas`,`C) So considera o PIB`,`D) Ignora as despesas`,`E) E sempre positivo`],g:`A`,c:`NOMINAL=Primario - Juros nominais. Mede a variacao total da divida. Pode haver superavit primario e deficit nominal.`},{a:2021,r:`FCC/SEFAZ-2021`,q:`A regra de ouro (CF/LRF) veda:`,o:[`A) Qualquer endividamento`,`B) Operacoes de credito que superem as despesas de capital`,`C) Pagar juros`,`D) Investir`,`E) Arrecadar acima da meta`],g:`B`,c:`Regra de ouro (art. 167, III CF): veda operacoes de credito que excedam as despesas de capital (evita financiar custeio com divida).`},{a:2020,r:`FCC/TRT-2020`,q:`A RCL (Receita Corrente Liquida) e a base para:`,o:[`A) Calcular o PIB`,`B) Os limites de pessoal e divida na LRF`,`C) A inflacao`,`D) O cambio`,`E) A taxa Selic`],g:`B`,c:`RCL=base de calculo dos limites da LRF (pessoal, divida, garantias). Soma das receitas correntes com deducoes legais.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`A ARO (operacao de credito por antecipacao de receita):`,o:[`A) E proibida`,`B) Destina-se a atender insuficiencia de caixa e deve ser quitada ate 10/12`,`C) Nao tem prazo`,`D) E permanente`,`E) Independe de autorizacao`],g:`B`,c:`ARO: cobre insuficiencia de caixa no exercicio, liquidada ate 10 de dezembro. Vedada no ultimo ano de mandato.`}],"DFI-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Os estagios da DESPESA (Lei 4.320) sao:`,o:[`A) Previsao, lancamento, arrecadacao, recolhimento`,`B) Fixacao, empenho, liquidacao, pagamento`,`C) Programacao, reserva, empenho, quitacao`,`D) Dotacao, contingenciamento, empenho`,`E) Orcamentacao, cobranca, recebimento`],g:`B`,c:`Despesa: FIXACAO, EMPENHO (art. 58), LIQUIDACAO (art. 63), PAGAMENTO (art. 64).`},{a:2022,r:`FCC/TCE-2022`,q:`Creditos EXTRAORDINARIOS sao abertos:`,o:[`A) Por lei especifica`,`B) Por decreto do Executivo para despesas urgentes e improvistos, sem fonte previa`,`C) So com autorizacao legislativa previa`,`D) Para reforcar dotacoes`,`E) Com indicacao de fonte obrigatoria`],g:`B`,c:`EXTRAORDINARIOS: urgentes/improvistos (guerra, calamidade) -> decreto do Executivo, comunicacao posterior, SEM indicacao previa de fonte.`},{a:2021,r:`FCC/PGE-2021`,q:`A LDO tem por finalidade:`,o:[`A) Autorizar despesas do exercicio`,`B) Orientar a elaboracao da LOA, metas e riscos fiscais`,`C) Detalhar o PPA`,`D) Criar fundos`,`E) Estabelecer prioridades sem conteudo fiscal`],g:`B`,c:`LDO: orienta a LOA, fixa metas fiscais (anexo de metas) e riscos fiscais, criterios de limitacao de empenho. PPA=longo prazo; LOA=autoriza despesas.`},{a:2020,r:`FCC/TRT-2020`,q:`O principio orcamentario da UNIVERSALIDADE exige que:`,o:[`A) O orcamento dure 1 ano`,`B) Todas as receitas e despesas constem do orcamento`,`C) Haja um unico orcamento`,`D) Valores liquidos`,`E) Especificacao detalhada`],g:`B`,c:`UNIVERSALIDADE: o orcamento deve conter TODAS as receitas e despesas. ANUALIDADE=1 ano; UNIDADE=orcamento unico.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`Creditos SUPLEMENTARES destinam-se a:`,o:[`A) Novas dotacoes`,`B) Reforco de dotacao orcamentaria existente`,`C) Despesas urgentes`,`D) Calamidade`,`E) Guerra`],g:`B`,c:`SUPLEMENTARES: reforco de dotacao JA existente (a LOA pode ja autorizar). ESPECIAIS: novas dotacoes. EXTRAORDINARIOS: urgentes.`},{a:2023,r:`FCC/TRT-2023`,q:`O EMPENHO da despesa (art. 58):`,o:[`A) Verifica o direito do credor`,`B) Cria para o Estado obrigacao de pagamento`,`C) Entrega o recurso ao credor`,`D) Fixa a dotacao`,`E) Arrecada a receita`],g:`B`,c:`EMPENHO: ato que cria para o Estado obrigacao de pagamento. LIQUIDACAO verifica o direito; PAGAMENTO entrega o recurso.`},{a:2022,r:`FCC/TCE-2022`,q:`Sao receitas de CAPITAL:`,o:[`A) Receita tributaria`,`B) Operacoes de credito, alienacao de bens, transferencias de capital`,`C) Receita patrimonial`,`D) Receita de servicos`,`E) Contribuicoes`],g:`B`,c:`Receitas de CAPITAL: operacoes de credito, alienacao de bens, amortizacao de emprestimos, transferencias de capital. Tributaria=corrente.`},{a:2021,r:`FCC/PGE-2021`,q:`O principio da EXCLUSIVIDADE orcamentaria significa que:`,o:[`A) Ha um unico orcamento`,`B) A LOA nao contem materia estranha a fixacao da despesa e previsao da receita`,`C) O orcamento e anual`,`D) Valores brutos`,`E) Receita vinculada`],g:`B`,c:`EXCLUSIVIDADE: a LOA so trata de receita e despesa (excecao: autorizacao de credito suplementar e operacoes de credito/ARO).`},{a:2020,r:`FCC/TRT-2020`,q:`A LIQUIDACAO da despesa (art. 63) consiste em:`,o:[`A) Criar a obrigacao`,`B) Verificar o direito do credor com base nos titulos e documentos`,`C) Pagar ao credor`,`D) Fixar dotacao`,`E) Empenhar`],g:`B`,c:`LIQUIDACAO: verificacao do direito do credor (apuracao da origem, importancia e a quem pagar), com base em documentos comprobatorios.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O PPA (Plano Plurianual) tem vigencia de:`,o:[`A) 1 ano`,`B) 2 anos`,`C) 4 anos`,`D) 5 anos`,`E) 8 anos`],g:`C`,c:`PPA: 4 anos (do 2o ano de um mandato ao 1o do mandato seguinte). Estabelece diretrizes, objetivos e metas regionalizadas.`}],"CGP-1":[{a:2023,r:`FCC/TCE-2023`,q:`Os estagios da RECEITA orcamentaria (MCASP) sao:`,o:[`A) Empenho, liquidacao, pagamento, recolhimento`,`B) Previsao, lancamento, arrecadacao, recolhimento`,`C) Fixacao, empenho, arrecadacao`,`D) Programacao, reserva, movimentacao`,`E) Orcamentacao, cobranca, deposito`],g:`B`,c:`Receita: PREVISAO (LOA), LANCAMENTO (art. 53), ARRECADACAO (banco), RECOLHIMENTO (Tesouro/conta unica).`},{a:2022,r:`FCC/TCE-2022`,q:`Os Restos a Pagar PROCESSADOS sao aqueles com:`,o:[`A) Apenas empenho`,`B) Empenho e liquidacao realizados (direito verificado)`,`C) Pagamento efetuado`,`D) So dotacao`,`E) Liquidacao cancelada`],g:`B`,c:`RP PROCESSADOS: empenho + liquidacao feitos -> Estado deve pagar. NAO PROCESSADOS: so empenho (liquidacao pendente).`},{a:2021,r:`FCC/PGE-2021`,q:`As caracteristicas qualitativas FUNDAMENTAIS (NBC TSP) sao:`,o:[`A) Comparabilidade e verificabilidade`,`B) Relevancia e representacao fidedigna`,`C) Tempestividade e compreensibilidade`,`D) Objetividade e consistencia`,`E) Neutralidade e prudencia`],g:`B`,c:`FUNDAMENTAIS: relevancia + representacao fidedigna. DE MELHORIA: comparabilidade, verificabilidade, tempestividade, compreensibilidade.`},{a:2020,r:`FCC/TCM-2020`,q:`No PCASP, a classe que registra Variacoes Patrimoniais Diminutivas (VPD) e:`,o:[`A) Classe 1 (Ativo)`,`B) Classe 3 (VPD)`,`C) Classe 4 (VPA)`,`D) Classe 2 (Passivo)`,`E) Classe 5`],g:`B`,c:`PCASP: 1-Ativo, 2-Passivo, 3-VPD (diminutivas), 4-VPA (aumentativas), 5/6-controles, 7/8-especificos.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O EMPENHO ESTIMATIVO e utilizado quando:`,o:[`A) O valor e exato`,`B) Nao se conhece previamente o valor exato (ex: agua, energia)`,`C) E contrato parcelado`,`D) Ha calamidade`,`E) E despesa de capital`],g:`B`,c:`EMPENHO ESTIMATIVO: valor nao exatamente determinado (servicos continuados como agua/energia). ORDINARIO=valor certo; GLOBAL=parcelado.`},{a:2023,r:`FCC/TRT-2023`,q:`A Demonstracao das Variacoes Patrimoniais (DVP) evidencia:`,o:[`A) Apenas o orcamento`,`B) As variacoes quantitativas e qualitativas do patrimonio`,`C) Os restos a pagar`,`D) A divida ativa`,`E) O fluxo de caixa`],g:`B`,c:`DVP: variacoes patrimoniais aumentativas (VPA) e diminut
