ferenca entre eficiencia, eficacia e efetividade: efetividade refere-se a:`,o:[`A) Usar bem os recursos`,`B) Atingir as metas`,`C) Impacto/transformacao real gerada para a sociedade`,`D) Velocidade`,`E) Custo`],g:`C`,c:`EFICIENCIA: usar bem os recursos (meios). EFICACIA: atingir as metas (resultados). EFETIVIDADE: impacto/transformacao real e duradoura na sociedade (efeitos).`},{a:2022,r:`FCC/PGE-2022`,q:`O conflito de interesses no servico publico ocorre quando:`,o:[`A) Ha duas tarefas`,`B) Interesse privado pode influenciar o desempenho da funcao publica`,`C) Ha trabalho em equipe`,`D) O servidor estuda`,`E) Ha meta a cumprir`],g:`B`,c:`CONFLITO DE INTERESSES (Lei 12.813/2013): situacao em que interesses PRIVADOS podem comprometer o interesse coletivo ou influenciar o desempenho da funcao publica.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A primeira linha, no modelo das 3 linhas, e responsavel por:`,o:[`A) Auditoria`,`B) Gerir os riscos no dia a dia (donos dos processos e controles operacionais)`,`C) Supervisao do conselho`,`D) Asseguracao independente`,`E) Compliance`],g:`B`,c:`1a LINHA: gestores operacionais, donos dos riscos e controles no dia a dia (executam e gerenciam os riscos diretamente).`},{a:2023,r:`FCC/TCE-2023`,q:`A gestao por competencias visa:`,o:[`A) Reduzir salarios`,`B) Alinhar conhecimentos, habilidades e atitudes das pessoas aos objetivos organizacionais`,`C) Eliminar cargos`,`D) Centralizar decisoes`,`E) Terceirizar tudo`],g:`B`,c:`Gestao por COMPETENCIAS: gerir pessoas com base em CHA (Conhecimentos, Habilidades, Atitudes), alinhando-as as estrategias e objetivos da organizacao.`},{a:2022,r:`FCC/PGE-2022`,q:`A LAI estabelece como diretriz a observancia da publicidade como:`,o:[`A) Excecao`,`B) Preceito geral e o sigilo como excecao`,`C) Regra absoluta`,`D) Opcao do gestor`,`E) Vedacao`],g:`B`,c:`LAI (art. 3): a publicidade e o PRECEITO GERAL e o SIGILO a EXCECAO. Acesso a informacao e a regra; restricoes devem ser justificadas e temporarias.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O ciclo PDCA aplicado a gestao publica significa:`,o:[`A) Planejar, Dirigir, Controlar, Avaliar`,`B) Plan (planejar), Do (executar), Check (verificar), Act (agir corretivamente)`,`C) Prever, Decidir, Cobrar, Ajustar`,`D) Produzir, Distribuir`,`E) Politica, Diretriz`],g:`B`,c:`PDCA: PLAN (planejar), DO (executar), CHECK (verificar resultados), ACT (agir para corrigir/padronizar) - ciclo de melhoria continua.`},{a:2023,r:`FCC/TCE-2023`,q:`A maturidade em gestao de riscos de uma organizacao indica:`,o:[`A) O lucro`,`B) O grau de estruturacao e institucionalizacao das praticas de gestao de riscos`,`C) O numero de servidores`,`D) O orcamento`,`E) A idade da organizacao`],g:`B`,c:`Maturidade em gestao de riscos: nivel de desenvolvimento, estruturacao e cultura das praticas de gerenciamento de riscos (de inicial/ad hoc a otimizado).`},{a:2022,r:`FCC/PGE-2022`,q:`O planejamento estrategico difere do operacional por ser:`,o:[`A) De curto prazo`,`B) De longo prazo e abrangencia global da organizacao`,`C) Detalhado por tarefa`,`D) Diario`,`E) Setorial apenas`],g:`B`,c:`Planejamento ESTRATEGICO: longo prazo, visao global, alta administracao. TATICO: medio prazo, por area. OPERACIONAL: curto prazo, tarefas especificas.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Accountability vertical refere-se a:`,o:[`A) Controle entre poderes`,`B) Prestacao de contas aos cidadaos/eleitores (ex: eleicoes, controle social)`,`C) Auditoria interna`,`D) Hierarquia administrativa`,`E) Controle do TCU`],g:`B`,c:`Accountability VERTICAL: responsabilizacao perante os cidadaos (voto, controle social, participacao). HORIZONTAL: fiscalizacao entre orgaos/poderes (TCU, MP, freios e contrapesos).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na metodologia de gestao de riscos, o 'risco-chave' (KRI - Key Risk Indicator) serve para:`,o:[`A) Eliminar riscos`,`B) Monitorar antecipadamente a evolucao da exposicao a um risco (alerta)`,`C) Calcular o lucro`,`D) Auditar contas`,`E) Definir o orcamento`],g:`B`,c:`KRI (Key Risk Indicator): metricas que sinalizam ANTECIPADAMENTE o aumento da exposicao a um risco, funcionando como alerta para acao preventiva (diferente do KPI, que mede desempenho).`},{a:2023,r:`FCC/TCE-2023`,q:`No COSO ERM (2017), a gestao de riscos integra-se a:`,o:[`A) Apenas controles internos`,`B) A estrategia e ao desempenho (definicao de objetivos e criacao de valor)`,`C) So a auditoria`,`D) Apenas a TI`,`E) Ao orcamento somente`],g:`B`,c:`O COSO ERM 2017 integra a gestao de riscos a ESTRATEGIA e ao DESEMPENHO: os riscos sao considerados na definicao da estrategia e na busca de objetivos, criando e preservando valor.`},{a:2022,r:`FCC/PGE-2022`,q:`A diferenca entre controle interno e auditoria interna e que a auditoria interna:`,o:[`A) Executa os controles`,`B) Avalia de forma independente a eficacia dos controles e da governanca (asseguracao)`,`C) E parte da gestao operacional`,`D) Define politicas`,`E) Aprova o orcamento`],g:`B`,c:`CONTROLE INTERNO: conjunto de processos/controles da propria gestao (1a e 2a linhas). AUDITORIA INTERNA (3a linha): avalia de forma INDEPENDENTE e objetiva a eficacia desses controles e da governanca.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A 'gestao de continuidade de negocios' (BCM) visa:`,o:[`A) Aumentar vendas`,`B) Assegurar a operacao de processos criticos diante de incidentes/desastres`,`C) Reduzir tributos`,`D) Contratar pessoal`,`E) Auditar contas`],g:`B`,c:`BCM (Business Continuity Management): garante a resiliencia e a continuidade dos PROCESSOS CRITICOS diante de incidentes (desastres, ciberataques), com planos de contingencia e recuperacao.`},{a:2023,r:`FCC/TCE-2023`,q:`O mapa estrategico do Balanced Scorecard (BSC) relaciona objetivos em perspectivas, sendo a base a perspectiva de:`,o:[`A) Financeira`,`B) Aprendizado e crescimento (pessoas, sistemas)`,`C) Clientes`,`D) Processos internos`,`E) Sociedade`],g:`B`,c:`No BSC, a perspectiva de APRENDIZADO E CRESCIMENTO (pessoas, capital, sistemas) e a BASE que sustenta as demais (processos -> clientes -> financeira), numa relacao de causa e efeito.`},{a:2022,r:`FCC/PGE-2022`,q:`A 'cadeia de valor' de Porter, no setor publico, ajuda a:`,o:[`A) Calcular impostos`,`B) Identificar atividades primarias e de apoio que geram valor publico`,`C) Definir aliquotas`,`D) Auditar`,`E) Eleger gestores`],g:`B`,c:`A CADEIA DE VALOR mapeia as atividades PRIMARIAS (que entregam o servico/valor ao cidadao) e de APOIO (suporte), permitindo identificar onde se cria valor e onde melhorar.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A avaliacao de politicas publicas quanto a 'efetividade' verifica:`,o:[`A) Se os recursos foram bem usados`,`B) Se houve impacto/transformacao real na realidade-alvo`,`C) Se as metas foram atingidas`,`D) A rapidez`,`E) O custo unitario`],g:`B`,c:`EFETIVIDADE na avaliacao de politicas: mede o IMPACTO real (mudancas na realidade-alvo), alem de produzir entregas. Diferente de eficiencia (recursos) e eficacia (metas).`},{a:2023,r:`FCC/TCE-2023`,q:`O ciclo de vida de uma politica publica inclui as fases de:`,o:[`A) So execucao`,`B) Formacao de agenda, formulacao, implementacao, monitoramento e avaliacao`,`C) Apenas avaliacao`,`D) Orcamento e pagamento`,`E) Empenho e liquidacao`],g:`B`,c:`Ciclo da politica publica: identificacao do problema/AGENDA -> FORMULACAO de alternativas -> tomada de decisao -> IMPLEMENTACAO -> MONITORAMENTO e AVALIACAO (com possivel retroalimentacao).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No setor publico, a auditoria baseada em riscos significa:`,o:[`A) Auditar tudo igualmente`,`B) Direcionar o trabalho de auditoria para as areas de maior risco e materialidade`,`C) So auditar contas`,`D) Eliminar riscos`,`E) Auditar por sorteio`],g:`B`,c:`AUDITORIA BASEADA EM RISCOS: prioriza os trabalhos nas areas/processos de maior RISCO e MATERIALIDADE, otimizando recursos e focando onde o impacto potencial e maior.`},{a:2023,r:`FCC/TCE-2023`,q:`O controle interno administrativo tem como finalidade primaria:`,o:[`A) Punir servidores`,`B) Assegurar a legalidade, eficiencia e protecao do patrimonio, apoiando o controle externo`,`C) Substituir o TCU`,`D) Elaborar a LOA`,`E) Julgar contas`],g:`B`,c:`O CONTROLE INTERNO (art. 74 CF) visa avaliar o cumprimento de metas, a execucao dos programas, a legalidade/eficiencia da gestao e a guarda do patrimonio, alem de APOIAR o controle externo.`},{a:2022,r:`FCC/PGE-2022`,q:`O 'compliance' difere da auditoria porque o compliance:`,o:[`A) Avalia de forma independente`,`B) Atua de forma continua e preventiva, assegurando conformidade no dia a dia (2a linha)`,`C) E externo`,`D) Julga contas`,`E) Substitui a gestao`],g:`B`,c:`COMPLIANCE (2a linha): funcao CONTINUA e PREVENTIVA, garante conformidade no cotidiano. AUDITORIA (3a linha): avaliacao INDEPENDENTE e periodica da eficacia dos controles.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O modelo de excelencia em gestao publica enfatiza:`,o:[`A) Burocracia rigida`,`B) Foco no cidadao, resultados, governanca e melhoria continua`,`C) Centralizacao total`,`D) Sigilo`,`E) Pessoalidade`],g:`B`,c:`Os modelos de excelencia em gestao publica (ex: GesPublica/MEG) enfatizam FOCO NO CIDADAO, orientacao por RESULTADOS, governanca, lideranca, e MELHORIA CONTINUA dos processos.`},{a:2023,r:`FCC/TCE-2023`,q:`Indicadores de desempenho do tipo 'eficacia' medem:`,o:[`A) O uso de recursos`,`B) O grau de alcance das metas/objetivos`,`C) O impacto social`,`D) A rapidez`,`E) O custo`],g:`B`,c:`Indicadores de EFICACIA medem o GRAU DE ALCANCE das metas e objetivos (resultados x previsto). Eficiencia mede uso de recursos; efetividade, o impacto.`},{a:2022,r:`FCC/PGE-2022`,q:`A transparencia passiva, na LAI, materializa-se por:`,o:[`A) Divulgacao espontanea`,`B) Atendimento a pedidos de informacao via SIC (Servico de Informacao ao Cidadao)`,`C) Sigilo`,`D) Portais de internet`,`E) Audiencias`],g:`B`,c:`Transparencia PASSIVA: resposta a PEDIDOS de informacao formulados pelos cidadaos, em regra via SIC. Transparencia ATIVA: divulgacao espontanea (portais).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na gestao de processos (BPM), o mapeamento 'as is' representa:`,o:[`A) O processo ideal`,`B) O processo como ele e atualmente (estado atual)`,`C) O futuro`,`D) O orcamento`,`E) O organograma`],g:`B`,c:`BPM: o mapeamento 'AS IS' retrata o processo COMO ELE E hoje (estado atual); o 'TO BE' desenha o processo melhorado/futuro desejado.`},{a:2023,r:`FCC/TCE-2023`,q:`A teoria contingencial da administracao defende que:`,o:[`A) Existe uma unica melhor forma de administrar`,`B) Nao ha melhor forma unica: a estrutura depende do ambiente e das circunstancias`,`C) A burocracia e ideal`,`D) O lucro e o unico fim`,`E) A centralizacao e sempre melhor`],g:`B`,c:`Teoria CONTINGENCIAL: nao existe 'one best way'; a melhor estrutura/abordagem DEPENDE do ambiente, da tecnologia e das contingencias enfrentadas pela organizacao.`}],"ADM-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`A modalidade DIALOGO COMPETITIVO (Lei 14.133/2021) aplica-se quando:`,o:[`A) O valor supera o limite do pregao`,`B) Ha 5 fornecedores cadastrados`,`C) Necessita-se de inovacao ou solucao inexistente no mercado`,`D) O objeto e intelectual`,`E) A licitacao e eletronica`],g:`C`,c:`Art. 32: dialogo competitivo para inovacao tecnologica ou solucao inexistente no mercado. A Adm. dialoga com licitantes antes de definir o objeto.`},{a:2022,r:`FCC/TCE-2022`,q:`Na Lei 14.133/2021, o criterio de julgamento por MENOR PRECO e tipico de:`,o:[`A) Concurso`,`B) Pregao (bens e servicos comuns)`,`C) Leilao`,`D) Dialogo competitivo`,`E) Concorrencia para obras especiais`],g:`B`,c:`PREGAO: bens e servicos comuns, criterio menor preco ou maior desconto.`},{a:2021,r:`FCC/PGE-2021`,q:`A improbidade que importa enriquecimento ilicito (Lei 8.429/92):`,o:[`A) Dispensa dolo`,`B) Exige dolo especifico apos a Lei 14.230/2021`,`C) Admite culpa`,`D) E imprescritivel`,`E) So atinge particulares`],g:`B`,c:`Apos Lei 14.230/2021, TODAS as modalidades de improbidade exigem DOLO ESPECIFICO, inclusive enriquecimento ilicito.`},{a:2020,r:`FCC/Adm-2020`,q:`A INEXIGIBILIDADE de licitacao ocorre quando:`,o:[`A) O valor e baixo`,`B) Ha inviabilidade de competicao`,`C) Ha emergencia`,`D) E guerra`,`E) Ha calamidade`],g:`B`,c:`INEXIGIBILIDADE (art. 74): inviabilidade de competicao (fornecedor exclusivo, artista consagrado). DISPENSA: competicao viavel mas a lei dispensa.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`Os principios da Adm. Publica no art. 37 CF sao (LIMPE):`,o:[`A) Legalidade, razoabilidade, moralidade, publicidade, eficiencia`,`B) Legalidade, impessoalidade, moralidade, publicidade, eficiencia`,`C) Legitimidade, economicidade, moralidade, publicidade, eficiencia`,`D) Supremacia, indisponibilidade, moralidade, publicidade`,`E) Legalidade, proporcionalidade, moralidade, publicidade`],g:`B`,c:`LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiencia (EC 19/98).`},{a:2023,r:`FCC/TRT-2023`,q:`A prescricao na improbidade (Lei 14.230/2021) e de:`,o:[`A) 5 anos`,`B) 8 anos do fato ou 4 anos apos fim do vinculo`,`C) 10 anos`,`D) 3 anos`,`E) Imprescritivel`],g:`B`,c:`Lei 14.230/2021: prescricao de 8 anos do fato; ou 4 anos apos o fim do vinculo (prescricao intercorrente).`},{a:2022,r:`FCC/TCE-2022`,q:`Na Lei 14.133/2021, a fase de habilitacao ocorre:`,o:[`A) Antes do julgamento das propostas`,`B) Apos o julgamento das propostas (regra geral)`,`C) Antes do edital`,`D) Apos a homologacao`,`E) Junto com a fase recursal apenas`],g:`B`,c:`Lei 14.133: regra geral inverte fases - habilitacao APOS julgamento das propostas (como no pregao).`},{a:2021,r:`FCC/PGE-2021`,q:`A legitimidade para propor acao de improbidade e:`,o:[`A) Concorrente entre MP e pessoa juridica lesada`,`B) Exclusiva do MP (Lei 14.230/2021)`,`C) De qualquer cidadao`,`D) Do Tribunal de Contas`,`E) Da Defensoria Publica`],g:`B`,c:`Lei 14.230/2021: legitimidade EXCLUSIVA do Ministerio Publico (extinguiu a legitimidade da pessoa juridica).`},{a:2020,r:`FCC/Adm-2020`,q:`A Lei Anticorrupcao (12.846/2013) responsabiliza pessoas juridicas de forma:`,o:[`A) Subjetiva`,`B) Objetiva`,`C) Solidaria apenas`,`D) Penal`,`E) Apenas civil mediante culpa`],g:`B`,c:`Lei 12.846/2013: responsabilidade OBJETIVA (independe de dolo/culpa) das pessoas juridicas por atos lesivos a Adm. nacional ou estrangeira.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`O LEILAO, na Lei 14.133/2021, destina-se a:`,o:[`A) Servicos comuns`,`B) Trabalho tecnico`,`C) Alienacao de bens (maior lance)`,`D) Inovacao tecnologica`,`E) Obras de engenharia`],g:`C`,c:`LEILAO: alienacao de bens moveis/imoveis inserviveis ou legalmente apreendidos, criterio maior lance.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na Lei 14.133/2021, o orcamento estimado pode ser sigiloso ate:`,o:[`A) O fim do contrato`,`B) A conclusao da licitacao (orcamento sigiloso facultativo)`,`C) Sempre publico`,`D) 5 anos`,`E) A homologacao mais 1 ano`],g:`B`,c:`Lei 14.133: o orcamento estimado pode ser SIGILOSO (criterio da Adm.), tornando-se publico apos a fase de propostas/conclusao da licitacao.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A modalidade CONCURSO (Lei 14.133) destina-se a:`,o:[`A) Compra de bens comuns`,`B) Escolha de trabalho tecnico, cientifico ou artistico mediante premio`,`C) Alienacao de bens`,`D) Obras`,`E) Servicos continuos`],g:`B`,c:`CONCURSO: selecao de trabalho TECNICO, CIENTIFICO ou ARTISTICO, com premio ou remuneracao ao vencedor.`},{a:2022,r:`FCC/PGE-2022`,q:`Na improbidade (Lei 14.230/21), atos que atentam contra principios exigem:`,o:[`A) Culpa`,`B) Dolo (vontade livre e consciente de violar a lei)`,`C) Mero dano`,`D) Enriquecimento`,`E) Prejuizo ao erario`],g:`B`,c:`Apos a Lei 14.230/21, todos os atos de improbidade (inclusive o do art. 11 - contra principios) exigem DOLO. Culpa nao caracteriza mais improbidade.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A agencia de inovacao 'sandbox regulatorio' refere-se a:`,o:[`A) Licitacao`,`B) Ambiente experimental controlado para testar inovacoes com flexibilizacao temporaria de regras`,`C) Pregao eletronico`,`D) Convenio`,`E) Termo de fomento`],g:`B`,c:`Sandbox regulatorio: ambiente de testes com afastamento controlado e temporario de normas, para inovacoes (ex: fintechs), sob supervisao do regulador.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O credenciamento, na Lei 14.133, e hipotese de:`,o:[`A) Licitacao por pregao`,`B) Contratacao direta por inexigibilidade (todos os interessados aptos sao contratados)`,`C) Dispensa por valor`,`D) Concorrencia`,`E) Leilao`],g:`B`,c:`Credenciamento: processo de contratacao em que TODOS os interessados que cumpram os requisitos podem ser contratados (inviabilidade de competicao -> inexigibilidade).`},{a:2022,r:`FCC/PGE-2022`,q:`As sancoes por ato de improbidade incluem:`,o:[`A) Apenas multa`,`B) Perda da funcao, suspensao de direitos politicos, ressarcimento e proibicao de contratar`,`C) Prisao automatica`,`D) So advertencia`,`E) Apenas demissao`],g:`B`,c:`Sancoes (art. 12 Lei 8.429): perda dos bens, ressarcimento, perda da funcao, suspensao dos direitos politicos, multa civil e proibicao de contratar com o Poder Publico.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A fase preparatoria da licitacao (Lei 14.133) compreende:`,o:[`A) A homologacao`,`B) O planejamento: ETP, termo de referencia, pesquisa de precos e analise de riscos`,`C) O julgamento`,`D) A habilitacao`,`E) Os recursos`],g:`B`,c:`Fase preparatoria: planejamento com Estudo Tecnico Preliminar (ETP), termo de referencia/projeto, pesquisa de precos e matriz/analise de riscos.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A Lei Anticorrupcao prevê, como atenuante, a celebracao de:`,o:[`A) Termo de ajuste`,`B) Acordo de leniencia (colaboracao da PJ reduz sancoes)`,`C) Convenio`,`D) Contrato`,`E) Parceria`],g:`B`,c:`Acordo de LENIENCIA (Lei 12.846): a PJ que colabora efetivamente (identifica envolvidos, fornece provas) obtem reducao das sancoes.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A Lei 14.133/21 permite, como procedimento auxiliar:`,o:[`A) Apenas o pregao`,`B) O sistema de registro de precos (SRP) e o credenciamento`,`C) So a concorrencia`,`D) Somente dispensa`,`E) Apenas leilao`],g:`B`,c:`Procedimentos auxiliares (Lei 14.133): credenciamento, pre-qualificacao, procedimento de manifestacao de interesse, sistema de registro de precos (SRP) e registro cadastral.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Na contratacao integrada (Lei 14.133), o contratado:`,o:[`A) So executa a obra`,`B) Elabora os projetos basico e executivo e executa a obra`,`C) Apenas projeta`,`D) Fiscaliza`,`E) Fornece material`],g:`B`,c:`CONTRATACAO INTEGRADA: o contratado e responsavel por elaborar os projetos BASICO e EXECUTIVO, executar a obra e demais operacoes necessarias (regime de obras).`},{a:2022,r:`FCC/PGE-2022`,q:`A prescricao das sancoes da Lei Anticorrupcao (12.846) e de:`,o:[`A) 3 anos`,`B) 5 anos da ciencia da infracao (ou do fim, se permanente)`,`C) 10 anos`,`D) 8 anos`,`E) Imprescritivel`],g:`B`,c:`Lei 12.846: as infracoes prescrevem em 5 ANOS contados da ciencia da infracao ou, no caso de permanente/continuada, do dia em que cessar.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A modalidade de licitacao extinta pela Lei 14.133 (em relacao a Lei 8.666) foi:`,o:[`A) Pregao`,`B) Tomada de precos e convite`,`C) Concorrencia`,`D) Leilao`,`E) Concurso`],g:`B`,c:`A Lei 14.133 EXTINGUIU as modalidades TOMADA DE PRECOS e CONVITE (da antiga Lei 8.666). Restam: pregao, concorrencia, concurso, leilao e dialogo competitivo.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O agente de contratacao, na Lei 14.133, e responsavel por:`,o:[`A) Julgar recursos sempre`,`B) Conduzir a licitacao, impulsionando o procedimento`,`C) Assinar o contrato`,`D) Fiscalizar a obra`,`E) Pagar o fornecedor`],g:`B`,c:`O AGENTE DE CONTRATACAO (servidor designado) conduz e impulsiona o processo licitatorio, recebe propostas, conduz a sessao e encaminha as decisoes (auxiliado por equipe de apoio).`},{a:2022,r:`FCC/PGE-2022`,q:`A inexigibilidade por notoria especializacao (servico tecnico) exige:`,o:[`A) Servico comum`,`B) Servico tecnico especializado, de natureza singular, com profissional/empresa de notoria especializacao`,`C) Menor preco`,`D) Concorrencia`,`E) Pregao`],g:`B`,c:`Inexigibilidade (art. 74, III): contratacao de servico TECNICO ESPECIALIZADO de natureza predominantemente intelectual com profissional ou empresa de NOTORIA ESPECIALIZACAO (vedada para publicidade).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na Lei 14.133, a matriz de riscos do contrato serve para:`,o:[`A) Definir o preco`,`B) Alocar entre as partes os riscos do contrato, equilibrando a relacao`,`C) Eliminar a fiscalizacao`,`D) Dispensar garantia`,`E) Aumentar a multa`],g:`B`,c:`A MATRIZ DE RISCOS aloca objetivamente os riscos entre contratante e contratado (quem responde por cada evento), promovendo equilibrio e seguranca juridica, sobretudo em obras.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A garantia de execucao do contrato (Lei 14.133), em regra, e de ate:`,o:[`A) 1%`,`B) 5% do valor do contrato (ate 10% em obras de grande vulto)`,`C) 20%`,`D) 50%`,`E) 100%`],g:`B`,c:`A garantia pode ser exigida ate 5% do valor do contrato; em obras/servicos de grande vulto e complexidade, pode chegar a 10%. Seguro-garantia com clausula de retomada e incentivado.`},{a:2022,r:`FCC/PGE-2022`,q:`A sancao de 'declaracao de inidoneidade' (Lei 14.133):`,o:[`A) Impede licitar por 6 meses`,`B) Impede de licitar/contratar com toda a Administracao Publica por ate 6 anos`,`C) E so multa`,`D) Dura 2 anos`,`E) E advertencia`],g:`B`,c:`A DECLARACAO DE INIDONEIDADE (sancao mais grave) impede de licitar e contratar com toda a Administracao Publica (todos os entes) por ate 6 anos. O impedimento de licitar (menos grave) atinge so o ente sancionador, por ate 3 anos.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O 'pregao' na Lei 14.133 e obrigatorio para:`,o:[`A) Obras de engenharia`,`B) Aquisicao de bens e servicos comuns (criterio menor preco/maior desconto)`,`C) Servicos tecnicos especializados`,`D) Locacao de imoveis`,`E) Alienacao`],g:`B`,c:`O PREGAO e obrigatorio para bens e servicos COMUNS (com padroes de desempenho objetivamente definidos), julgados por menor preco ou maior desconto. Vedado para servicos tecnicos de natureza intelectual e obras.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Na Lei 14.133, a fase de habilitacao verifica:`,o:[`A) O preco`,`B) A aptidao juridica, tecnica, fiscal/trabalhista e economico-financeira do licitante`,`C) So o CNPJ`,`D) A proposta`,`E) O recurso`],g:`B`,c:`HABILITACAO: exame dos requisitos de qualificacao - juridica, tecnica, fiscal/social/trabalhista e economico-financeira - para verificar se o licitante reune condicoes de contratar.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O sistema de registro de precos (SRP) caracteriza-se por:`,o:[`A) Compra unica`,`B) Registro formal de precos para futuras e eventuais contratacoes, sem obrigar a aquisicao`,`C) Dispensa de licitacao`,`D) Inexigibilidade`,`E) Leilao`],g:`B`,c:`SRP: procedimento que REGISTRA PRECOS (ata de registro) para futuras e eventuais contratacoes, sem obrigar a Administracao a adquirir; permite adesoes ('carona') nos termos da lei.`},{a:2022,r:`FCC/PGE-2022`,q:`A impugnacao ao edital de licitacao, na Lei 14.133, pode ser feita ate:`,o:[`A) O dia da sessao`,`B) 3 dias uteis antes da data de abertura das propostas`,`C) Apos a homologacao`,`D) 30 dias antes`,`E) Nao cabe`],g:`B`,c:`Lei 14.133: qualquer pessoa pode IMPUGNAR o edital ate 3 DIAS UTEIS antes da data de abertura das propostas; a Administracao responde em ate 3 dias uteis.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A duracao dos contratos de servicos continuos, na Lei 14.133, pode ser de ate:`,o:[`A) 12 meses`,`B) 5 anos (e prorrogavel ate 10 anos no total)`,`C) 2 anos`,`D) Indefinida`,`E) 6 meses`],g:`B`,c:`Lei 14.133: contratos de servicos e fornecimentos CONTINUOS podem ter prazo de ate 5 anos, prorrogavel sucessivamente ate o limite de 10 anos, observados os requisitos.`}],"ECO-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`Se |Ed|=0,3, a demanda e:`,o:[`A) Elastica`,`B) Inelastica: aumento de preco eleva a receita`,`C) Unitaria`,`D) Perfeitamente inelastica`,`E) Perfeitamente elastica`],g:`B`,c:`|Ed|=0,3<1 -> INELASTICA. Aumento de preco eleva a receita total (quantidade cai pouco).`},{a:2022,r:`FCC/Fiscal-2022`,q:`A Curva de Laffer demonstra que:`,o:[`A) Mais aliquota sempre eleva arrecadacao`,`B) Ha aliquota otima; acima dela, mais tributacao reduz arrecadacao`,`C) Arrecadacao maxima com aliquota zero`,`D) Relacao linear aliquota-arrecadacao`,`E) Reduzir aliquota sempre eleva arrecadacao`],g:`B`,c:`Laffer: aliquota 0%=arrecadacao 0; 100%=arrecadacao 0. Ha ponto OTIMO; acima dele, evasao/informalidade reduzem a arrecadacao.`},{a:2021,r:`FCC/ISS-2021`,q:`A Regra de Ramsey, na tributacao otima, recomenda:`,o:[`A) Mesma aliquota para todos os bens`,`B) Aliquotas maiores em bens inelasticos para minimizar o peso morto`,`C) Aliquotas menores em bens de luxo`,`D) Maximizar arrecadacao ignorando eficiencia`,`E) Tributar so servicos`],g:`B`,c:`Regra de RAMSEY: aliquotas inversamente proporcionais a elasticidade. Bens INELASTICOS -> aliquota maior (menor distorcao).`},{a:2020,r:`FCC/TRF-2020`,q:`A externalidade NEGATIVA provoca falha de mercado porque:`,o:[`A) Produz quantidade insuficiente`,`B) Custo social > custo privado; mercado produz em excesso`,`C) Empresas nao lucram`,`D) E bem publico`,`E) Exige subsidio`],g:`B`,c:`Externalidade NEGATIVA: custo social > privado -> producao ACIMA do otimo. Solucao: imposto pigouviano.`},{a:2019,r:`FCC/Adm-2019`,q:`Em concorrencia perfeita, no longo prazo, o lucro economico tende a:`,o:[`A) Ser maximo`,`B) Ser zero`,`C) Ser negativo`,`D) Crescer indefinidamente`,`E) Igualar o monopolio`],g:`B`,c:`Concorrencia perfeita: livre entrada/saida leva o lucro economico a ZERO no longo prazo.`},{a:2023,r:`FCC/TRT-2023`,q:`A incidencia economica de um tributo recai mais sobre:`,o:[`A) Quem a lei define como contribuinte`,`B) O lado menos elastico do mercado`,`C) O lado mais elastico`,`D) Sempre o consumidor`,`E) Sempre o produtor`],g:`B`,c:`A carga recai mais sobre o lado MENOS elastico (que tem menos capacidade de evitar o tributo).`},{a:2022,r:`FCC/Fiscal-2022`,q:`O peso morto (perda de bem-estar) da tributacao e maior quando:`,o:[`A) A demanda e perfeitamente inelastica`,`B) Oferta e demanda sao mais elasticas`,`C) Nao ha tributo`,`D) O bem e essencial`,`E) A aliquota e zero`],g:`B`,c:`Peso morto e MAIOR quanto mais ELASTICAS forem oferta e demanda (mais distorcao de quantidade).`},{a:2021,r:`FCC/ISS-2021`,q:`No monopolio, comparado a concorrencia perfeita, observa-se:`,o:[`A) Preco menor e quantidade maior`,`B) Preco maior e quantidade menor, com peso morto`,`C) Lucro zero`,`D) Ausencia de barreiras`,`E) Produto homogeneo`],g:`B`,c:`Monopolio: preco MAIOR, quantidade MENOR que o otimo social -> gera peso morto (ineficiencia alocativa).`},{a:2020,r:`FCC/TRF-2020`,q:`Um bem com muitos substitutos proximos tende a ter demanda:`,o:[`A) Inelastica`,`B) Elastica`,`C) Unitaria`,`D) Perfeitamente inelastica`,`E) Constante`],g:`B`,c:`Mais substitutos -> demanda mais ELASTICA (consumidor troca facilmente se o preco sobe).`},{a:2019,r:`FCC/Adm-2019`,q:`O imposto PIGOUVIANO tem como objetivo:`,o:[`A) Maximizar arrecadacao`,`B) Corrigir externalidade negativa internalizando o custo social`,`C) Subsidiar producao`,`D) Reduzir a oferta de bens publicos`,`E) Eliminar o monopolio`],g:`B`,c:`Imposto PIGOUVIANO=corrige externalidade negativa, igualando custo privado ao social (poluidor-pagador).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Quando a demanda e perfeitamente INELASTICA, um imposto recai:`,o:[`A) Todo sobre o produtor`,`B) Todo sobre o consumidor`,`C) Meio a meio`,`D) Sobre ninguem`,`E) Gera maior peso morto`],g:`B`,c:`Demanda perfeitamente inelastica: o consumidor compra a mesma quantidade a qualquer preco, logo arca com TODO o imposto; peso morto = zero.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Bens GIFFEN caracterizam-se por:`,o:[`A) Demanda elastica`,`B) Quantidade demandada que AUMENTA quando o preco sobe`,`C) Serem de luxo`,`D) Nao terem substitutos`,`E) Demanda unitaria`],g:`B`,c:`Bem de GIFFEN (caso raro): a quantidade demandada aumenta com o aumento do preco (efeito renda supera o substituicao), violando a lei da demanda.`},{a:2022,r:`FCC/PGE-2022`,q:`Em concorrencia perfeita, a empresa e tomadora de preco porque:`,o:[`A) Define o preco`,`B) Sua producao e insignificante frente ao mercado`,`C) Tem monopolio`,`D) Diferencia produtos`,`E) Ha barreiras a entrada`],g:`B`,c:`Concorrencia perfeita: muitos produtores com produto homogeneo; cada um e PRICE TAKER (a oferta individual nao afeta o preco de mercado).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O excedente do consumidor e:`,o:[`A) O lucro da empresa`,`B) A diferenca entre o que o consumidor estaria disposto a pagar e o que pagou`,`C) O imposto`,`D) O custo marginal`,`E) A receita total`],g:`B`,c:`Excedente do CONSUMIDOR: diferenca entre a disposicao maxima a pagar e o preco efetivamente pago. Tributos reduzem os excedentes e geram peso morto.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A elasticidade-renda negativa indica bem:`,o:[`A) Normal`,`B) Inferior`,`C) De luxo`,`D) Substituto`,`E) Complementar`],g:`B`,c:`Elasticidade-renda NEGATIVA: a demanda CAI quando a renda sobe = bem INFERIOR (ex: transporte muito basico). Positiva = normal; >1 = superior/luxo.`},{a:2022,r:`FCC/PGE-2022`,q:`O monopolio natural ocorre quando:`,o:[`A) Ha muitos produtores`,`B) Os custos medios decrescem na faixa relevante (economias de escala)`,`C) Nao ha barreiras`,`D) O produto e homogeneo`,`E) Ha livre entrada`],g:`B`,c:`Monopolio natural: economias de escala fazem o custo medio cair continuamente; uma unica firma atende ao mercado com custo menor que varias (ex: redes de agua, energia).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Tributar um bem com oferta inelastica, do ponto de vista da eficiencia:`,o:[`A) Gera grande peso morto`,`B) Gera pequeno peso morto (menor distorcao)`,`C) Nao arrecada`,`D) Aumenta a quantidade`,`E) Reduz a arrecadacao`],g:`B`,c:`Quanto mais INELASTICA a oferta (ou demanda), MENOR o peso morto do imposto (a quantidade pouco se altera). Base da regra de Ramsey.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Dois bens sao SUBSTITUTOS quando a elasticidade-preco cruzada e:`,o:[`A) Negativa`,`B) Positiva`,`C) Zero`,`D) Unitaria`,`E) Infinita`],g:`B`,c:`Elasticidade cruzada POSITIVA: o aumento do preco de um eleva a demanda do outro = SUBSTITUTOS (cafe e cha). Negativa = complementares (carro e gasolina).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O custo marginal e definido como:`,o:[`A) Custo total / quantidade`,`B) Variacao do custo total ao produzir uma unidade adicional`,`C) Custo fixo medio`,`D) Receita marginal`,`E) Custo variavel total`],g:`B`,c:`Custo MARGINAL (CMg): acrescimo no custo total ao produzir UMA unidade adicional. A firma maximiza lucro onde CMg = Receita Marginal.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Em mercado de concorrencia perfeita, o preco e igual ao:`,o:[`A) Custo fixo`,`B) Custo marginal no equilibrio (P = CMg)`,`C) Custo total`,`D) Lucro`,`E) Custo medio sempre`],g:`B`,c:`Em concorrencia perfeita, a firma produz onde P = CMg (a curva de oferta da firma e o ramo crescente do CMg acima do custo variavel medio).`},{a:2022,r:`FCC/PGE-2022`,q:`O imposto sobre o consumo tende a ser, quanto a equidade:`,o:[`A) Progressivo`,`B) Regressivo (pesa mais sobre quem tem menor renda)`,`C) Neutro sempre`,`D) Proporcional ao patrimonio`,`E) Confiscatorio`],g:`B`,c:`Tributos sobre o CONSUMO tendem a ser REGRESSIVOS: os mais pobres gastam proporcionalmente mais da renda em consumo, suportando carga relativa maior.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A externalidade positiva justifica a intervencao estatal via:`,o:[`A) Imposto pigouviano`,`B) Subsidio ou provisao publica (consumo abaixo do otimo social)`,`C) Proibicao`,`D) Tarifa`,`E) Monopolio`],g:`B`,c:`Externalidade POSITIVA (ex: educacao, vacinacao): beneficio social > privado, consumo fica ABAIXO do otimo. Solucao: SUBSIDIO ou provisao publica para aproximar do otimo.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A curva de Laffer sugere que aliquotas muito altas:`,o:[`A) Sempre aumentam a arrecadacao`,`B) Podem reduzir a arrecadacao (desestimulo, evasao, informalidade)`,`C) Nao afetam`,`D) Eliminam o peso morto`,`E) Tornam o tributo progressivo`],g:`B`,c:`Curva de LAFFER: a partir de certo ponto, aliquotas mais altas REDUZEM a arrecadacao (desestimulam producao, estimulam evasao e informalidade).`},{a:2022,r:`FCC/PGE-2022`,q:`Bens publicos puros caracterizam-se por nao-rivalidade, que significa:`,o:[`A) Exclusao facil`,`B) O consumo por um nao reduz a disponibilidade para outros`,`C) Preco alto`,`D) Escassez`,`E) Rivalidade total`],g:`B`,c:`NAO-RIVALIDADE: o consumo por um individuo nao diminui a quantidade disponivel aos demais (ex: iluminacao publica, defesa nacional). Combinada com nao-exclusao = bem publico puro.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Quando oferta e demanda sao ambas elasticas, o peso morto do imposto e:`,o:[`A) Zero`,`B) Maior (grande reducao de quantidade transacionada)`,`C) Negativo`,`D) Igual a arrecadacao`,`E) Inexistente`],g:`B`,c:`Peso morto e MAIOR quando ambos os lados sao elasticos: o imposto provoca grande queda na quantidade negociada, aumentando a perda de eficiencia.`},{a:2023,r:`FCC/Fiscal-2023`,q:`No oligopolio, a interdependencia significa que:`,o:[`A) As firmas ignoram as concorrentes`,`B) A decisao de cada firma considera a reacao das demais`,`C) Ha infinitas firmas`,`D) O produto e unico`,`E) Nao ha barreiras`],g:`B`,c:`OLIGOPOLIO: poucas firmas com INTERDEPENDENCIA estrategica - cada uma considera as possiveis reacoes das concorrentes ao definir preco/quantidade (teoria dos jogos).`},{a:2022,r:`FCC/PGE-2022`,q:`A regra de Ramsey, sob equidade, e criticada porque:`,o:[`A) Tributa bens elasticos`,`B) Tributar mais bens inelasticos (essenciais) pode ser regressivo`,`C) Reduz a arrecadacao`,`D) Elimina o peso morto`,`E) Beneficia os pobres`],g:`B`,c:`Critica a regra de Ramsey: bens INELASTICOS sao muitas vezes ESSENCIAIS (alimentos, remedios), consumidos proporcionalmente mais pelos pobres - tributa-los pesadamente fere a EQUIDADE.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A receita marginal de um monopolista e:`,o:[`A) Igual ao preco`,`B) Menor que o preco (precisa baixar o preco para vender mais)`,`C) Maior que o preco`,`D) Constante`,`E) Zero`],g:`B`,c:`No MONOPOLIO, a receita marginal e MENOR que o preco, pois para vender uma unidade a mais o monopolista reduz o preco de todas as unidades (curva de demanda negativamente inclinada).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Demanda Q=100-2P e oferta Q=10+3P. O preco de equilibrio e:`,o:[`A) 15`,`B) 18`,`C) 20`,`D) 22`,`E) 30`],g:`B`,c:`Equilibrio: 100-2P=10+3P -> 90=5P -> P=18. (Q=100-36=64.)`},{a:2023,r:`FCC/Fiscal-2023`,q:`Imposto especifico de R$2/un em mercado com oferta e demanda de elasticidades iguais. A carga e repartida:`,o:[`A) Toda no consumidor`,`B) Igualmente entre consumidor e produtor (1 cada)`,`C) Toda no produtor`,`D) Em ninguem`,`E) 3 para 1`],g:`B`,c:`Quando as elasticidades de oferta e demanda sao IGUAIS, a carga do imposto reparte-se IGUALMENTE entre consumidor e produtor (R$1 cada). O lado mais inelastico arca com a maior parte.`},{a:2022,r:`FCC/PGE-2022`,q:`A elasticidade-preco da demanda de -0,5 indica que um aumento de 10% no preco reduz a quantidade em:`,o:[`A) 10%`,`B) 5%`,`C) 0,5%`,`D) 50%`,`E) 20%`],g:`B`,c:`Ed=-0,5 -> variacao da quantidade = Ed x variacao do preco = -0,5 x 10% = -5%. Demanda inelastica (|Ed|<1).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`No monopolio, o lucro maximo ocorre onde:`,o:[`A) P = CMg`,`B) Receita Marginal = Custo Marginal (RMg = CMg)`,`C) RMg = P`,`D) CMe minimo`,`E) Receita maxima`],g:`B`,c:`O monopolista maximiza lucro onde RMg = CMg (como qualquer firma), mas cobra o preco da curva de demanda nesse nivel de quantidade, superior ao CMg (gera peso morto).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Curva de Lorenz mais distante da linha de igualdade indica:`,o:[`A) Menor desigualdade`,`B) Maior desigualdade (Gini mais alto)`,`C) Igualdade perfeita`,`D) Pleno emprego`,`E) Eficiencia`],g:`B`,c:`Quanto mais a curva de LORENZ se afasta da linha de igualdade (45 graus), MAIOR a desigualdade de renda, refletida num indice de GINI mais proximo de 1.`},{a:2022,r:`FCC/PGE-2022`,q:`O 'otimo de Pareto' e uma alocacao em que:`,o:[`A) Todos sao iguais`,`B) Nao e possivel melhorar a situacao de alguem sem piorar a de outro`,`C) Ha maxima arrecadacao`,`D) O Estado controla tudo`,`E) Nao ha trocas`],g:`B`,c:`OTIMO DE PARETO: alocacao eficiente em que NAO se pode melhorar a situacao de um agente sem PIORAR a de outro. Eficiencia, porem, nao implica equidade.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Subsidio a um bem com externalidade positiva busca aproximar a producao do:`,o:[`A) Monopolio`,`B) Otimo social (onde beneficio marginal social = custo marginal)`,`C) Ponto de Laffer`,`D) Equilibrio sem intervencao`,`E) Peso morto maximo`],g:`B`,c:`Externalidade POSITIVA gera producao abaixo do otimo social; o SUBSIDIO desloca a oferta/demanda para aproximar a quantidade do OTIMO SOCIAL (beneficio social marginal = custo social marginal).`},{a:2023,r:`FCC/Fiscal-2023`,q:`Bem cuja elasticidade-renda esta entre 0 e 1 e classificado como:`,o:[`A) Inferior`,`B) Normal necessario (demanda cresce menos que a renda)`,`C) De luxo`,`D) Giffen`,`E) Substituto`],g:`B`,c:`Elasticidade-renda entre 0 e 1: bem NORMAL NECESSARIO (demanda aumenta com a renda, mas menos que proporcionalmente). >1 = luxo/superior; <0 = inferior.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A condicao de maximizacao de lucro de uma firma e produzir ate onde:`,o:[`A) Receita total = custo total`,`B) Receita marginal = custo marginal (RMg = CMg)`,`C) Custo medio e minimo`,`D) Preco e maximo`,`E) Receita e maxima`],g:`B`,c:`Qualquer firma maximiza lucro produzindo ate o ponto em que a RECEITA MARGINAL iguala o CUSTO MARGINAL (RMg = CMg).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O custo de oportunidade representa:`,o:[`A) O custo contabil`,`B) O valor da melhor alternativa sacrificada ao tomar uma decisao`,`C) O custo fixo`,`D) A depreciacao`,`E) O imposto`],g:`B`,c:`CUSTO DE OPORTUNIDADE: o valor da MELHOR ALTERNATIVA RENUNCIADA. E um custo economico (implicito), nao necessariamente contabil.`},{a:2022,r:`FCC/PGE-2022`,q:`Na concorrencia monopolistica, as firmas:`,o:[`A) Vendem produto homogeneo`,`B) Vendem produtos DIFERENCIADos e tem certo poder de preco, com livre entrada`,`C) Sao monopolistas`,`D) Nao fazem propaganda`,`E) Tem lucro extraordinario no longo prazo`],g:`B`,c:`CONCORRENCIA MONOPOLISTICA: muitas firmas, produtos DIFERENCIADOS (marca, qualidade), algum poder de preco, livre entrada/saida -> lucro economico tende a zero no longo prazo.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A lei dos rendimentos marginais decrescentes afirma que:`,o:[`A) A producao cresce sempre`,`B) A partir de certo ponto, cada unidade adicional de um fator gera acrescimo cada vez menor de produto`,`C) Os custos caem`,`D) O lucro e constante`,`E) Nao ha limite a producao`],g:`B`,c:`Lei dos RENDIMENTOS MARGINAIS DECRESCENTES: mantidos fixos os demais fatores, a partir de certo ponto cada unidade adicional do fator variavel gera incremento de produto cada vez MENOR.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Um imposto sobre o produtor desloca a curva de:`,o:[`A) Demanda para a direita`,`B) Oferta para cima/esquerda (eleva o custo), reduzindo a quantidade de equilibrio`,`C) Demanda para baixo`,`D) Oferta para a direita`,`E) Nenhuma`],g:`B`,c:`Imposto sobre o produtor aumenta o custo, deslocando a OFERTA para a esquerda/cima; o preco ao consumidor sobe, a quantidade cai - gerando peso morto (a incidencia economica depende das elasticidades).`},{a:2022,r:`FCC/PGE-2022`,q:`A assimetria de informacao gera falhas como:`,o:[`A) Bens publicos`,`B) Selecao adversa e risco moral`,`C) Externalidades positivas`,`D) Monopolio natural`,`E) Pleno emprego`],g:`B`,c:`ASSIMETRIA DE INFORMACAO produz SELECAO ADVERSA (ex: seguros, mercado de usados - 'limoes') e RISCO MORAL (mudanca de comportamento apos o contrato), justificando regulacao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O excedente do produtor e:`,o:[`A) O lucro contabil`,`B) A diferenca entre o preco recebido e o minimo que aceitaria receber (custo marginal)`,`C) O imposto`,`D) A receita total`,`E) O custo fixo`],g:`B`,c:`Excedente do PRODUTOR: diferenca entre o preco efetivamente recebido e o minimo pelo qual estaria disposto a vender (refletido no custo marginal). Area acima da oferta e abaixo do preco.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Quando a demanda e perfeitamente elastica, o imposto recai:`,o:[`A) Sobre o consumidor`,`B) Inteiramente sobre o produtor`,`C) Meio a meio`,`D) Sobre ninguem`,`E) Sobre o governo`],g:`B`,c:`Demanda perfeitamente ELASTICA (horizontal): o consumidor abandona o produto a qualquer aumento de preco, logo o PRODUTOR arca com todo o imposto (nao pode repassa-lo).`}],"ECO-2":[{a:2023,r:`FCC/SEFAZ-2023`,q:`O PIB pela otica da demanda e:`,o:[`A) Salarios+Lucros+Juros+Alugueis`,`B) Valor da Producao - Consumo Intermediario`,`C) C+I+G+(X-M)`,`D) PNB - renda externa`,`E) Consumo+Poupanca`],g:`C`,c:`Otica da DEMANDA: PIB=C+I+G+(X-M). Renda: W+L+J+A. Producao: soma dos valores adicionados.`},{a:2022,r:`FCC/Fiscal-2022`,q:`A diferenca entre PIB e PNB e:`,o:[`A) Inflacao`,`B) A renda liquida enviada/recebida do exterior`,`C) Os impostos indiretos`,`D) A depreciacao`,`E) O consumo intermediario`],g:`B`,c:`PNB=PIB - renda enviada ao exterior + renda recebida do exterior. PIB=territorio; PNB=residentes.`},{a:2021,r:`FCC/ISS-2021`,q:`Politica fiscal expansionista, no modelo IS-LM:`,o:[`A) Desloca a LM para a esquerda`,`B) Desloca a IS para a direita`,`C) Reduz o PIB`,`D) Eleva a taxa de cambio`,`E) Nao afeta o produto`],g:`B`,c:`Politica fiscal expansionista (aumento de G ou reducao de T) desloca a IS para a DIREITA, elevando produto e juros.`},{a:2020,r:`FCC/TRF-2020`,q:`O indice oficial de inflacao do Brasil e o:`,o:[`A) IGP-M`,`B) IPCA`,`C) INPC`,`D) IPC-Fipe`,`E) IGP-DI`],g:`B`,c:`IPCA (IBGE) e o indice OFICIAL de inflacao, usado nas metas do Banco Central. Familias de 1 a 40 salarios minimos.`},{a:2019,r:`FCC/Adm-2019`,q:`O multiplicador keynesiano dos gastos e igual a:`,o:[`A) 1/(propensao marginal a consumir)`,`B) 1/(propensao marginal a poupar)`,`C) Propensao a consumir`,`D) PIB/consumo`,`E) 1/inflacao`],g:`B`,c:`Multiplicador=1/PMgPoupar=1/(1-PMgConsumir). Quanto maior a propensao a consumir, maior o multiplicador.`},{a:2023,r:`FCC/TRT-2023`,q:`Politica monetaria CONTRACIONISTA (combate a inflacao) envolve:`,o:[`A) Reducao da taxa Selic`,`B) Elevacao da taxa de juros`,`C) Aumento de gastos publicos`,`D) Reducao de impostos`,`E) Emissao de moeda`],g:`B`,c:`Monetaria contracionista: ELEVA juros (Selic), reduz liquidez, controla inflacao. Fiscal usa gastos/tributos.`},{a:2022,r:`FCC/Fiscal-2022`,q:`O investimento (I) no PIB inclui:`,o:[`A) Apenas compra de acoes`,`B) Formacao bruta de capital fixo + variacao de estoques`,`C) Gastos do governo`,`D) Consumo das familias`,`E) Exportacoes`],g:`B`,c:`I=FBCF (maquinas, construcao) + variacao de estoques. Compra de acoes e aplicacao financeira, nao entra no I do PIB.`},{a:2021,r:`FCC/ISS-2021`,q:`O deflator do PIB e calculado por:`,o:[`A) PIB real / PIB nominal`,`B) (PIB nominal / PIB real) x 100`,`C) PIB nominal - PIB real`,`D) IPCA acumulado`,`E) PIB / populacao`],g:`B`,c:`Deflator=(PIB nominal/PIB real)x100. Mede a variacao geral de precos de todos os bens do PIB.`},{a:2020,r:`FCC/TRF-2020`,q:`Na balanca comercial, exportacoes superiores a importacoes geram:`,o:[`A) Deficit`,`B) Superavit comercial`,`C) Equilibrio`,`D) Inflacao`,`E) Recessao`],g:`B`,c:`Exportacoes > importacoes = SUPERAVIT comercial (saldo positivo na balanca comercial).`},{a:2019,r:`FCC/Adm-2019`,q:`A conta corrente do balanco de pagamentos inclui:`,o:[`A) Apenas investimentos diretos`,`B) Bens, servicos, rendas e transferencias unilaterais`,`C) Reservas internacionais`,`D) Emprestimos externos`,`E) Apenas a balanca comercial`],g:`B`,c:`Conta corrente: balanca comercial (bens) + servicos + rendas (juros, lucros) + transferencias unilaterais.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O PIB nominal difere do real porque o nominal:`,o:[`A) Exclui servicos`,`B) Usa precos correntes (inclui o efeito da inflacao)`,`C) Usa precos de um ano-base`,`D) E sempre menor`,`E) Nao considera o governo`],g:`B`,c:`PIB NOMINAL: a precos correntes (sofre inflacao). PIB REAL: a precos de um ano-base (mede a producao fisica). Deflator = nominal/real x 100.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Politica monetaria expansionista, em regra:`,o:[`A) Eleva a Selic`,`B) Reduz juros e aumenta a oferta de moeda`,`C) Reduz gastos publicos`,`D) Eleva impostos`,`E) Vende titulos`],g:`B`,c:`Monetaria EXPANSIONISTA: reduz juros, compra titulos (open market), reduz compulsorio -> mais credito e demanda agregada.`},{a:2022,r:`FCC/PGE-2022`,q:`No modelo IS-LM, a curva LM representa o equilibrio no mercado:`,o:[`A) De bens`,`B) Monetario (oferta e demanda por moeda)`,`C) De trabalho`,`D) Cambial`,`E) Externo`],g:`B`,c:`LM: equilibrio do mercado MONETARIO (oferta = demanda por moeda). IS: mercado de BENS. O cruzamento da o equilibrio de renda e juros.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A inflacao de DEMANDA ocorre quando:`,o:[`A) Custos sobem`,`B) A demanda agregada cresce acima da capacidade produtiva`,`C) A moeda valoriza`,`D) Cai o consumo`,`E) Sobe o desemprego`],g:`B`,c:`Inflacao de DEMANDA: excesso de demanda agregada frente a oferta (economia aquecida). Inflacao de CUSTOS: alta de insumos/salarios.`},{a:2023,r:`FCC/Fiscal-2023`,q:`Os instrumentos classicos da politica monetaria sao:`,o:[`A) Gastos e tributos`,`B) Taxa de juros, deposito compulsorio e open market`,`C) Cambio fixo`,`D) Salario minimo`,`E) Tarifas publicas`],g:`B`,c:`Politica MONETARIA: taxa de juros (Selic), recolhimento compulsorio e operacoes de mercado aberto (open market). Politica FISCAL usa gastos e tributos.`},{a:2022,r:`FCC/PGE-2022`,q:`Quando o pais tem superavit em conta corrente:`,o:[`A) Importa mais que exporta`,`B) As receitas externas (exportacoes, rendas) superam as despesas`,`C) Aumenta a divida externa`,`D) Ha deficit comercial`,`E) Cai a reserva`],g:`B`,c:`Superavit em conta corrente: as entradas (exportacoes, rendas, transferencias) superam as saidas; o pais e exportador liquido de poupanca.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O cambio FLUTUANTE caracteriza-se por:`,o:[`A) Taxa fixada pelo governo`,`B) Taxa definida pelo mercado (oferta e demanda de divisas)`,`C) Bandas cambiais rigidas`,`D) Paridade com o ouro`,`E) Controle de capitais total`],g:`B`,c:`Cambio FLUTUANTE: a taxa e determinada livremente pelo mercado. FIXO: o BC fixa e defende a paridade. Brasil adota flutuante (com intervencoes).`},{a:2023,r:`FCC/Fiscal-2023`,q:`O efeito multiplicador dos gastos publicos e maior quando:`,o:[`A) A propensao marginal a consumir e baixa`,`B) A propensao marginal a consumir e alta`,`C) Nao ha consumo`,`D) Os impostos sao altos`,`E) A poupanca e total`],g:`B`,c:`Multiplicador = 1/(1-PMgC). Quanto MAIOR a propensao a consumir, maior o multiplicador (cada real gasto reverbera mais na economia).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O agregado M1 (meios de pagamento restritos) compreende:`,o:[`A) Poupanca e titulos`,`B) Papel-moeda em poder do publico + depositos a vista`,`C) Apenas moeda no BC`,`D) Reservas internacionais`,`E) Toda a divida`],g:`B`,c:`M1 = papel-moeda em poder do publico + depositos a vista (a liquidez imediata). M2, M3, M4 agregam aplicacoes progressivamente menos liquidas.`},{a:2023,r:`FCC/Fiscal-2023`,q:`O efeito 'crowding out' (deslocamento) ocorre quando:`,o:[`A) Gasto publico estimula o privado`,`B) Aumento do gasto/divida publica eleva juros e reduz o investimento privado`,`C) Cai a inflacao`,`D) Sobe o cambio`,`E) Reduz o consumo`],g:`B`,c:`CROWDING OUT: a expansao fiscal (mais gasto/divida) pressiona os juros para cima, DESLOCANDO (reduzindo) o investimento privado.`},{a:2022,r:`FCC/PGE-2022`,q:`A taxa Selic e o principal instrumento da politica:`,o:[`A) Fiscal`,`B) Monetaria`,`C) Cambial`,`D) De rendas`,`E) Comercial`],g:`B`,c:`A taxa SELIC (meta definida pelo Copom) e o instrumento central da politica MONETARIA brasileira para controlar a inflacao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Uma desvalorizacao cambial tende a:`,o:[`A) Encarecer exportacoes`,`B) Estimular exportacoes e encarecer importacoes`,`C) Reduzir o dolar`,`D) Baratear importacoes`,`E) Nao afetar o comercio`],g:`B`,c:`Desvalorizacao da moeda nacional (dolar sobe): exportacoes ficam mais competitivas (estimuladas) e importacoes mais caras (desestimuladas).`},{a:2023,r:`FCC/Fiscal-2023`,q:`No balanco de pagamentos, o investimento estrangeiro direto registra-se na conta:`,o:[`A) Corrente`,`B) Financeira (capital e financeira)`,`C) De servicos`,`D) De rendas`,`E) De transferencias`],g:`B`,c:`O Investimento Estrangeiro Direto (IED) e registrado na conta FINANCEIRA (entrada de capitais), nao na conta corrente.`},{a:2022,r:`FCC/PGE-2022`,q:`A politica fiscal contracionista, para conter inflacao de demanda, envolve:`,o:[`A) Aumentar gastos`,`B) Reduzir gastos publicos e/ou elevar tributos`,`C) Reduzir juros`,`D) Emitir moeda`,`E) Desvalorizar o cambio`],g:`B`,c:`Politica fiscal CONTRACIONISTA: reduzir gastos e/ou aumentar tributos, diminuindo a demanda agregada para conter a inflacao.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A 'armadilha da liquidez' ocorre quando:`,o:[`A) Os juros sao altos`,`B) Os juros estao tao baixos que a politica monetaria perde eficacia`,`C) Ha hiperinflacao`,`D) O cambio e fixo`,`E) O PIB cresce`],g:`B`,c:`ARMADILHA DA LIQUIDEZ: com juros proximos de zero, aumentar a oferta de moeda nao reduz mais os juros nem estimula a economia (politica monetaria ineficaz); recomenda-se politica fiscal.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A curva de Phillips de curto prazo sugere relacao entre:`,o:[`A) Juros e cambio`,`B) Inflacao e desemprego (trade-off no curto prazo)`,`C) PIB e divida`,`D) Consumo e poupanca`,`E) Importacao e exportacao`],g:`B`,c:`Curva de PHILLIPS (curto prazo): trade-off entre INFLACAO e DESEMPREGO (mais inflacao, menos desemprego). No longo prazo, tende a ser vertical (sem trade-off permanente).`},{a:2022,r:`FCC/PGE-2022`,q:`Politica monetaria via 'open market' contracionista significa:`,o:[`A) Comprar titulos`,`B) Vender titulos publicos, enxugando liquidez`,`C) Reduzir compulsorio`,`D) Baixar juros`,`E) Emitir moeda`],g:`B`,c:`Open market CONTRACIONISTA: o BC VENDE titulos publicos, retirando moeda de circulacao (enxuga liquidez), elevando juros. Compra de titulos seria expansionista.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Um pais com cambio fixo e livre mobilidade de capitais perde autonomia de:`,o:[`A) Politica fiscal`,`B) Politica monetaria (trilema/triangulo impossivel)`,`C) Politica comercial`,`D) Politica de rendas`,`E) Nenhuma`],g:`B`,c:`TRILEMA (triangulo impossivel de Mundell): nao se pode ter simultaneamente cambio fixo, livre mobilidade de capitais E autonomia monetaria. Com os dois primeiros, perde-se a politica MONETARIA.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O conceito de 'produto potencial' refere-se a:`,o:[`A) PIB de um ano qualquer`,`B) Nivel de producao com pleno emprego dos fatores, sem pressao inflacionaria`,`C) PIB nominal`,`D) Exportacoes`,`E) Consumo`],g:`B`,c:`PRODUTO POTENCIAL: nivel de producao sustentavel com PLENO EMPREGO dos fatores, sem acelerar a inflacao. O hiato do produto e a diferenca entre o efetivo e o potencial.`},{a:2023,r:`FCC/Fiscal-2023`,q:`A politica fiscal anticiclica em recessao recomenda:`,o:[`A) Cortar gastos`,`B) Aumentar gastos e/ou reduzir tributos para estimular a demanda`,`C) Elevar juros`,`D) Reduzir moeda`,`E) Aumentar tributos`],g:`B`,c:`Em RECESSAO, a politica fiscal ANTICICLICA expansionista (mais gastos, menos tributos) estimula a demanda agregada, ajudando a reaquecer a economia.`},{a:2022,r:`FCC/PGE-2022`,q:`O 'tripe macroeconomico' brasileiro e composto por:`,o:[`A) Cambio fixo, controle de capitais e gasto`,`B) Metas de inflacao, cambio flutuante e responsabilidade fiscal`,`C) Juros zero, subsidios e tarifas`,`D) Monopolio, subsidio e divida`,`E) Renda, emprego e tributos`],g:`B`,c:`O TRIPE MACROECONOMICO (desde 1999): regime de METAS DE INFLACAO, CAMBIO FLUTUANTE e RESPONSABILIDADE/superavit fiscal (disciplina das contas publicas).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A taxa de cambio real considera:`,o:[`A) Apenas a nominal`,`B) A taxa nominal ajustada pela razao de precos (inflacao) entre os paises`,`C) So o dolar`,`D) A Selic`,`E) O PIB`],g:`B`,c:`Cambio REAL = cambio nominal x (precos externos/precos internos). Ajusta o cambio nominal pela inflacao relativa, medindo a competitividade real.`}],"DCO-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`No controle CONCENTRADO (ADI), os efeitos da decisao sao:`,o:[`A) Inter partes e ex nunc`,`B) Erga omnes, ex tunc e vinculante`,`C) Inter partes e ex tunc`,`D) Erga omnes e ex nunc apenas`,`E) Vinculante so para a Adm.`],g:`B`,c:`ADI/ADC/ADPF: erga omnes + ex tunc + vinculante (Judiciario e Adm. Publica). Modulacao temporal por 2/3 do STF.`},{a:2022,r:`FCC/TCE-2022`,q:`A ADPF e cabivel para:`,o:[`A) Qualquer lei federal`,`B) Atos do poder publico que violem preceito fundamental, inclusive leis pre-1988`,`C) So leis municipais`,`D) Contratos administrativos`,`E) Atos de particulares`],g:`B`,c:`ADPF (Lei 9.882/99): viola preceito fundamental; cabe contra leis PRE-constitucionais e atos municipais. Carater subsidiario.`},{a:2021,r:`FCC/PGE-2021`,q:`A Sumula Vinculante vincula:`,o:[`A) So o STF`,`B) Todo o Judiciario e a Adm. Publica direta e indireta`,`C) Apenas a Adm. federal`,`D) Tambem o Legislativo (funcao tipica)`,`E) So instancias inferiores`],g:`B`,c:`SV (art. 103-A): vincula todo o Judiciario + Adm. Publica direta e indireta. NAO vincula o STF nem o Legislativo (funcao tipica).`},{a:2020,r:`FCC/ISS-2020`,q:`Os direitos fundamentais do art. 5 CF tem aplicacao:`,o:[`A) Diferida`,`B) Imediata (art. 5 par.1)`,`C) Condicionada a lei`,`D) Programatica`,`E) So para natos`],g:`B`,c:`Art. 5 par. 1: normas de direitos e garantias fundamentais tem aplicacao IMEDIATA.`},{a:2019,r:`FCC/TRF-2019`,q:`No controle DIFUSO, os efeitos sao:`,o:[`A) Erga omnes`,`B) Inter partes e ex tunc`,`C) Vinculantes`,`D) Ex nunc obrigatorio`,`E) So prospectivos`],g:`B`,c:`Difuso: INTER PARTES + ex tunc. Senado pode suspender (art. 52, X) para erga omnes + ex nunc.`},{a:2023,r:`FCC/TRT-2023`,q:`Sao legitimados para propor ADI (art. 103 CF), EXCETO:`,o:[`A) Presidente da Republica`,`B) Procurador-Geral da Republica`,`C) Conselho Federal da OAB`,`D) Qualquer cidadao`,`E) Governador de Estado`],g:`D`,c:`Cidadao NAO e legitimado para ADI (so para acao popular). Legitimados: Presidente, Mesas, Governadores, PGR, OAB, partidos, confederacoes.`},{a:2022,r:`FCC/TCE-2022`,q:`A clausula petrea NAO inclui:`,o:[`A) Forma federativa de Estado`,`B) Voto direto, secreto, universal e periodico`,`C) Separacao dos Poderes`,`D) Direitos e garantias individuais`,`E) A taxa de juros constitucional`],g:`E`,c:`Clausulas petreas (art. 60 par.4): forma federativa, voto direto/secreto, separacao dos poderes, direitos individuais. Taxa de juros nao e clausula petrea.`},{a:2021,r:`FCC/PGE-2021`,q:`Norma constitucional de eficacia CONTIDA caracteriza-se por:`,o:[`A) Depender totalmente de lei`,`B) Ser plena, mas poder ser restringida por lei posterior`,`C) Nunca produzir efeitos`,`D) Ser apenas programatica`,`E) Nao admitir restricao`],g:`B`,c:`Eficacia CONTIDA: aplicacao imediata e plena, mas pode ser RESTRINGIDA por lei (ex: liberdade profissional).`},{a:2020,r:`FCC/ISS-2020`,q:`A ADO (Acao Direta de Inconstitucionalidade por Omissao) combate:`,o:[`A) Lei inconstitucional`,`B) Omissao do legislador em regulamentar a CF`,`C) Ato administrativo`,`D) Decisao judicial`,`E) Conflito entre estados`],g:`B`,c:`ADO: combate a OMISSAO inconstitucional (falta de norma regulamentadora). Da-se ciencia ao orgao omisso.`},{a:2019,r:`FCC/TRF-2019`,q:`O efeito vinculante da ADI alcanca:`,o:[`A) O proprio STF`,`B) O Poder Legislativo na funcao de legislar`,`C) Os demais orgaos do Judiciario e a Adm. Publica`,`D) Apenas as partes do processo`,`E) So a Uniao`],g:`C`,c:`Efeito vinculante: demais orgaos do Judiciario + Adm. Publica direta e indireta. NAO vincula o STF nem o Legislativo (funcao tipica).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A modulacao de efeitos na ADI exige quorum de:`,o:[`A) Maioria simples`,`B) Maioria absoluta`,`C) 2/3 dos membros do STF`,`D) Unanimidade`,`E) 3/5`],g:`C`,c:`Art. 27 Lei 9.868/99: a modulacao temporal dos efeitos (restringir/alterar o marco) exige maioria de 2/3 dos membros do STF (8 ministros).`},{a:2023,r:`FCC/TCE-2023`,q:`No controle difuso, a clausula de reserva de plenario (art. 97 CF) exige:`,o:[`A) Decisao monocratica`,`B) Que a inconstitucionalidade so seja declarada pela maioria absoluta do tribunal ou do orgao especial`,`C) Voto unanime`,`D) Decisao do STF sempre`,`E) Quorum simples`],g:`B`,c:`Art. 97 (full bench): tribunais so declaram inconstitucionalidade pela maioria absoluta do plenario ou do orgao especial (SV 10 reforca).`},{a:2022,r:`FCC/PGE-2022`,q:`A acao declaratoria de constitucionalidade (ADC) tem por objeto:`,o:[`A) Lei estadual`,`B) Lei ou ato normativo FEDERAL, para afastar controversia relevante`,`C) Ato municipal`,`D) Emenda constitucional`,`E) Decreto autonomo estadual`],g:`B`,c:`ADC: cabivel apenas contra lei/ato normativo FEDERAL, exigindo demonstracao de controversia judicial relevante. Efeitos: erga omnes, vinculante, ex tunc.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Norma de eficacia LIMITADA:`,o:[`A) Produz todos os efeitos desde a promulgacao`,`B) Depende de regulamentacao para produzir plenos efeitos`,`C) Pode ser restringida por lei`,`D) E autoaplicavel`,`E) E clausula petrea`],g:`B`,c:`Eficacia LIMITADA: depende de lei integradora para produzir todos os efeitos (programaticas/institutivas). Tem eficacia minima (revoga normas contrarias, vincula o legislador).`},{a:2023,r:`FCC/TCE-2023`,q:`Sao direitos sociais (art. 6 CF), EXCETO:`,o:[`A) Educacao`,`B) Saude`,`C) Propriedade privada`,`D) Moradia`,`E) Trabalho`],g:`C`,c:`Direitos sociais (art. 6): educacao, saude, alimentacao, trabalho, moradia, transporte, lazer, seguranca, previdencia, protecao a maternidade/infancia e assistencia. Propriedade e direito individual (art. 5).`},{a:2022,r:`FCC/PGE-2022`,q:`A acao popular pode ser proposta por:`,o:[`A) Qualquer cidadao, para anular ato lesivo ao patrimonio publico`,`B) Apenas o MP`,`C) So partidos politicos`,`D) O PGR`,`E) Pessoas juridicas`],g:`A`,c:`Acao popular (art. 5, LXXIII): qualquer CIDADAO (eleitor) pode anular ato lesivo ao patrimonio publico, a moralidade, ao meio ambiente e ao patrimonio historico.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O principio da legalidade tributaria (art. 150, I CF) exige:`,o:[`A) Decreto`,`B) Lei para instituir ou majorar tributos`,`C) Portaria`,`D) Convenio`,`E) Resolucao do Senado sempre`],g:`B`,c:`Legalidade tributaria: tributo so e instituido ou majorado por LEI (em regra). Excecoes de aliquota (II, IE, IPI, IOF) podem ser alteradas por ato do Executivo, nos limites legais.`},{a:2023,r:`FCC/TCE-2023`,q:`A imunidade reciproca (art. 150, VI, 'a') veda:`,o:[`A) Cobranca de taxas`,`B) Instituicao de IMPOSTOS sobre patrimonio, renda e servicos entre os entes federativos`,`C) Contribuicoes`,`D) Tarifas`,`E) ICMS sobre empresas`],g:`B`,c:`Imunidade reciproca: veda a Uniao, Estados, DF e Municipios instituirem IMPOSTOS sobre patrimonio, renda ou servicos uns dos outros (protege o pacto federativo).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A repartição de receitas tributarias (CF) destina aos Municipios:`,o:[`A) 100% do IR retido na fonte de seus servidores`,`B) Parcela do ICMS (25%) e do IPVA (50%) estaduais`,`C) Todo o ICMS`,`D) O IPI integral`,`E) Nada`],g:`B`,c:`Os Municipios recebem 25% do ICMS e 50% do IPVA arrecadados pelo Estado (alem de 100% do IR-fonte de seus servidores e 50% do ITR). E reparticao de receita, nao da competencia.`},{a:2023,r:`FCC/TCE-2023`,q:`A imunidade dos templos de qualquer culto (art. 150, VI, 'b') alcanca:`,o:[`A) Todos os tributos`,`B) Impostos sobre patrimonio, renda e servicos relacionados as finalidades essenciais`,`C) Taxas`,`D) Contribuicoes`,`E) So o IPTU`],g:`B`,c:`A imunidade religiosa abrange IMPOSTOS sobre patrimonio, renda e servicos vinculados as finalidades essenciais do templo. Nao alcanca taxas nem contribuicoes.`},{a:2022,r:`FCC/PGE-2022`,q:`O principio da anterioridade nonagesimal (noventena) NAO se aplica ao:`,o:[`A) ICMS`,`B) Imposto de Renda`,`C) IPI`,`D) Contribuicoes sociais`,`E) IPVA (base de calculo)`],g:`B`,c:`O IR e excecao a NOVENTENA (mas obedece a anterioridade anual). A fixacao da base de calculo de IPVA e IPTU tambem excepciona a noventena.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A competencia para instituir o ITCD e:`,o:[`A) Federal`,`B) Estadual/DF`,`C) Municipal`,`D) Compartilhada`,`E) Do Senado`],g:`B`,c:`O ITCD (transmissao causa mortis e doacao) e de competencia dos ESTADOS e do DF (art. 155, I CF). As aliquotas maximas sao fixadas pelo Senado (8%).`},{a:2023,r:`FCC/TCE-2023`,q:`Lei complementar e exigida para:`,o:[`A) Instituir qualquer tributo`,`B) Dispor sobre normas gerais, conflitos de competencia e instituir emprestimos compulsorios`,`C) Fixar aliquota do IPI`,`D) Criar taxa`,`E) Conceder isencao de ICMS`],g:`B`,c:`Art. 146 CF: LC para normas gerais, conflitos de competencia, regular limitacoes ao poder de tributar. Tambem instituicao de emprestimos compulsorios (art. 148) e IGF.`},{a:2022,r:`FCC/PGE-2022`,q:`O principio do nao-confisco (art. 150, IV) veda tributo que:`,o:[`A) Seja progressivo`,`B) Tenha efeito de confisco (carga excessiva que inviabilize a propriedade/atividade)`,`C) Seja seletivo`,`D) Incida sobre consumo`,`E) Seja indireto`],g:`B`,c:`Vedacao ao CONFISCO: o tributo nao pode ser tao gravoso que absorva o bem/renda ou inviabilize a atividade economica. Aplica-se tambem as multas (STF).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A medida provisoria, em materia tributaria, pode:`,o:[`A) Instituir qualquer tributo livremente`,`B) Instituir/majorar impostos, produzindo efeito no exercicio seguinte se convertida em lei ate o fim do exercicio de edicao`,`C) Criar emprestimo compulsorio`,`D) Tratar de materia de LC`,`E) Reduzir garantias`],g:`B`,c:`Art. 62, par.2 CF: MP que institua/majore IMPOSTO so produz efeitos no exercicio seguinte se convertida em LEI ate o ultimo dia do exercicio em que foi editada (salvo II, IE, IPI, IOF, extraordinarios).`},{a:2023,r:`FCC/TCE-2023`,q:`A seletividade do IPI e do ICMS significa que:`,o:[`A) A aliquota e unica`,`B) As aliquotas variam conforme a essencialidade do produto`,`C) Ha isencao total`,`D) O tributo e cumulativo`,`E) Nao ha credito`],g:`B`,c:`SELETIVIDADE: aliquotas inversamente proporcionais a essencialidade - produtos essenciais (alimentos) menor aliquota; superfluos (cigarro, bebida) maior. Obrigatoria no IPI, facultativa no ICMS.`},{a:2022,r:`FCC/PGE-2022`,q:`O contribuinte que paga tributo indevido tem direito a:`,o:[`A) Multa`,`B) Restituicao (repeticao de indebito)`,`C) Prisao`,`D) Nada`,`E) Compensacao obrigatoria`],g:`B`,c:`Art. 165 CTN: quem paga tributo indevido ou a maior tem direito a RESTITUICAO (repeticao de indebito), independentemente de previo protesto, no prazo de 5 anos.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A vedacao a instituicao de tributo nao uniforme no territorio nacional decorre do principio da:`,o:[`A) Capacidade contributiva`,`B) Uniformidade geografica (art. 151, I CF)`,`C) Anterioridade`,`D) Legalidade`,`E) Irretroatividade`],g:`B`,c:`Art. 151, I: a Uniao deve instituir tributos UNIFORMES em todo o territorio nacional, vedada distincao em relacao a Estados/Municipios (admitidos incentivos para reduzir desigualdades regionais).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Lei estadual concede isencao de ICMS sem convenio CONFAZ. No controle, ela e:`,o:[`A) Constitucional`,`B) Inconstitucional (viola art. 155, par.2, XII, 'g' CF e a LC 24/75)`,`C) Valida se ratificada depois`,`D) Mera irregularidade`,`E) Sujeita so a multa`],g:`B`,c:`Conceder beneficio de ICMS sem convenio CONFAZ viola o art. 155, par.2, XII, 'g' da CF (exige LC e deliberacao dos Estados). O STF reiteradamente declara INCONSTITUCIONAIS tais leis (guerra fiscal).`},{a:2023,r:`FCC/TCE-2023`,q:`A 'transcendencia dos motivos determinantes' (efeito vinculante), atualmente, segundo o STF:`,o:[`A) E aceita amplamente`,`B) NAO e adotada como regra (vincula o dispositivo, nao a fundamentacao)`,`C) Vincula o Legislativo`,`D) E automatica`,`E) Aplica-se so a sumulas`],g:`B`,c:`O STF atualmente NAO adota a teoria da transcendencia dos motivos determinantes como regra: o efeito vinculante recai sobre o DISPOSITIVO da decisao, nao sobre os fundamentos (ratio decidendi).`},{a:2022,r:`FCC/PGE-2022`,q:`A ADI por omissao parcial cabe quando a lei:`,o:[`A) Inexiste totalmente`,`B) Existe, mas regula de forma insuficiente/deficiente o comando constitucional`,`C) E inconstitucional formal`,`D) Foi revogada`,`E) E posterior a CF`],g:`B`,c:`Omissao PARCIAL: a norma existe, mas e insuficiente/deficiente para cumprir integralmente o mandamento constitucional (ex: lei que concede reajuste a apenas parte dos servidores). Cabe ADO.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`Tratado internacional sobre direitos humanos aprovado em 2 turnos, 3/5, nas 2 Casas (art. 5, par.3) tem status de:`,o:[`A) Lei ordinaria`,`B) Emenda constitucional`,`C) Lei complementar`,`D) Decreto`,`E) Norma supralegal apenas`],g:`B`,c:`Art. 5, par.3 CF: tratados de direitos humanos aprovados em 2 turnos, por 3/5 dos votos, em cada Casa, equivalem a EMENDAS CONSTITUCIONAIS. Os demais tratados de DH tem status supralegal (STF).`},{a:2023,r:`FCC/TCE-2023`,q:`O principio da anterioridade tributaria protege:`,o:[`A) O Fisco`,`B) A seguranca juridica e a nao surpresa do contribuinte`,`C) O Legislativo`,`D) A arrecadacao`,`E) Os municipios`],g:`B`,c:`A ANTERIORIDADE (anual e nonagesimal) materializa a NAO SURPRESA e a seguranca juridica: o contribuinte deve ter tempo para se planejar antes da exigencia do tributo novo/majorado.`},{a:2022,r:`FCC/PGE-2022`,q:`Imunidade de livros, jornais e periodicos (art. 150, VI, 'd') alcanca, segundo o STF:`,o:[`A) So o papel`,`B) Tambem os livros eletronicos (e-books) e os e-readers destinados exclusivamente a leitura`,`C) So obras impressas`,`D) Apenas jornais`,`E) Nada digital`],g:`B`,c:`STF (RE 330.817, 2017 / Sumula Vinculante 57): a imunidade abrange os LIVROS ELETRONICOS (e-books) e os suportes destinados exclusivamente a sua leitura (e-readers), alem do papel.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O principio da capacidade contributiva aplica-se preferencialmente aos:`,o:[`A) Tributos vinculados`,`B) Impostos (art. 145, par.1 CF), 'sempre que possivel'`,`C) Taxas`,`D) Contribuicoes de melhoria`,`E) Emprestimos compulsorios`],g:`B`,c:`Art. 145, par.1: 'sempre que possivel, os IMPOSTOS terao carater pessoal e serao graduados segundo a capacidade economica do contribuinte'. Aplica-se preferencialmente aos impostos.`},{a:2023,r:`FCC/TCE-2023`,q:`A repristinacao de norma, no direito brasileiro:`,o:[`A) E automatica`,`B) NAO ocorre automaticamente; depende de disposicao expressa (LINDB art. 2, par.3)`,`C) Sempre acontece`,`D) E vedada`,`E) Independe de lei`],g:`B`,c:`REPRISTINACAO (volta da vigencia da lei revogada quando a revogadora e revogada) NAO e automatica no Brasil: so ocorre se houver disposicao EXPRESSA nesse sentido (LINDB).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O principio da irretroatividade tributaria (art. 150, III, 'a') veda cobrar tributos sobre fatos:`,o:[`A) Futuros`,`B) Geradores ocorridos ANTES da vigencia da lei que os instituiu/aumentou`,`C) Presentes`,`D) Isentos`,`E) Imunes`],g:`B`,c:`Art. 150, III, 'a' CF: e vedado cobrar tributos sobre fatos geradores ocorridos ANTES do inicio da vigencia da lei que os instituiu ou aumentou (irretroatividade).`},{a:2023,r:`FCC/TCE-2023`,q:`A bitributacao ocorre quando:`,o:[`A) Um ente cobra dois tributos`,`B) Dois entes diferentes tributam o mesmo fato gerador (em regra, vedada)`,`C) Ha isencao dupla`,`D) Ha credito presumido`,`E) O contribuinte paga atrasado`],g:`B`,c:`BITRIBUTACAO: dois ENTES distintos tributam o MESMO fato gerador (conflito de competencia, em regra vedado). Difere do BIS IN IDEM (mesmo ente cobra duas vezes sobre o mesmo fato).`},{a:2022,r:`FCC/PGE-2022`,q:`O IPTU pode ser progressivo em razao de:`,o:[`A) So da renda`,`B) Valor do imovel (fiscal) e funcao social (extrafiscal, no tempo)`,`C) Numero de moradores`,`D) Idade do dono`,`E) Cor da fachada`],g:`B`,c:`O IPTU admite progressividade FISCAL (art. 156, par.1: em razao do valor do imovel) e EXTRAFISCAL (art. 182, par.4: progressiva no tempo, para cumprimento da funcao social da propriedade).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A competencia residual da Uniao permite instituir, por LC:`,o:[`A) Qualquer imposto estadual`,`B) Novos impostos nao previstos, nao-cumulativos e com fato gerador/base diversos dos existentes`,`C) Taxas`,`D) ICMS`,`E) ISS`],g:`B`,c:`Art. 154, I CF: a Uniao pode, por LEI COMPLEMENTAR, instituir impostos RESIDUAIS (novos), desde que nao-cumulativos e que nao tenham fato gerador/base proprios dos discriminados na CF.`},{a:2023,r:`FCC/TCE-2023`,q:`O imposto extraordinario de guerra (art. 154, II) pode:`,o:[`A) So por LC`,`B) Ser instituido pela Uniao, na iminencia/caso de guerra externa, inclusive com fato gerador de outros impostos`,`C) Ser permanente`,`D) Por decreto estadual`,`E) Ser cobrado sem guerra`],g:`B`,c:`Art. 154, II: na iminencia ou no caso de GUERRA EXTERNA, a Uniao institui imposto extraordinario, ainda que com fato gerador identico a outros impostos (bitributacao excepcionalmente permitida), suprimido gradativamente cessadas as causas.`},{a:2022,r:`FCC/PGE-2022`,q:`As contribuicoes especiais (art. 149) sao, em regra, de competencia:`,o:[`A) Estadual`,`B) Da Uniao (sociais, de intervencao no dominio economico e de interesse de categorias)`,`C) Municipal`,`D) Compartilhada`,`E) Do DF`],g:`B`,c:`Art. 149 CF: as contribuicoes sociais, de intervencao no dominio economico (CIDE) e de interesse de categorias profissionais/economicas sao, em regra, de competencia exclusiva da UNIAO (Estados/Municipios so a previdenciaria de seus servidores e a COSIP municipal).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A vedacao ao 'bis in idem' admite excecao quando:`,o:[`A) Nunca`,`B) A propria CF autoriza (ex: IR e CSLL sobre o lucro pela Uniao; PIS e COFINS)`,`C) Dois estados cobram`,`D) Ha isencao`,`E) O contribuinte aceita`],g:`B`,c:`BIS IN IDEM (mesmo ente, duas exigencias sobre o mesmo fato) e admitido quando a CF AUTORIZA, como IRPJ e CSLL sobre o lucro, ou PIS e COFINS sobre a receita - ambos pela Uniao.`},{a:2023,r:`FCC/TCE-2023`,q:`O principio da legalidade admite exigencia/majoracao por ato infralegal para:`,o:[`A) Todos os tributos`,`B) Alteracao de aliquotas, nos limites legais, do II, IE, IPI e IOF (extrafiscais)`,`C) Nenhum`,`D) Taxas`,`E) Contribuicao de melhoria`],g:`B`,c:`Excecoes a legalidade estrita: o Executivo pode ALTERAR ALIQUOTAS, nos limites e condicoes da lei, do II, IE, IPI e IOF (e CIDE-combustiveis/ICMS-monofasico), dada a funcao extrafiscal/regulatoria.`}],"DAD-1":[{a:2023,r:`FCC/SEFAZ-2023`,q:`O ato com vicio de COMPETENCIA (em razao da pessoa):`,o:[`A) E sempre nulo`,`B) Pode ser convalidado/ratificado pela autoridade competente`,`C) E inexistente`,`D) E revogavel`,`E) Nao produz efeitos`],g:`B`,c:`Vicio de competencia (em razao da pessoa) e SANAVEL -> admite convalidacao/ratificacao. Exceto competencia exclusiva ou em razao da materia.`},{a:2022,r:`FCC/TCE-2022`,q:`A ANULACAO de ato administrativo produz efeitos:`,o:[`A) Ex nunc`,`B) Ex tunc (retroativos)`,`C) So futuros`,`D) Vinculantes`,`E) Prospectivos`],g:`B`,c:`ANULACAO (ilegalidade): efeitos EX TUNC (retroage). REVOGACAO (merito): ex nunc. Sumula 473 STF.`},{a:2021,r:`FCC/PGE-2021`,q:`A responsabilidade civil do Estado (art. 37 par.6) por atos comissivos e:`,o:[`A) Subjetiva`,`B) Objetiva (teoria do risco administrativo)`,`C) Por culpa presumida apenas`,`D) Penal`,`E) Inexistente`],g:`B`,c:`Atos comissivos: responsabilidade OBJETIVA (risco administrativo). Basta conduta+dano+nexo. Regresso contra agente com dolo/culpa.`},{a:2020,r:`FCC/ISS-2020`,q:`A REVOGACAO de ato administrativo:`,o:[`A) Decorre de ilegalidade`,`B) Funda-se em conveniencia e oportunidade, efeitos ex nunc, so pela Adm.`,`C) Tem efeitos ex tunc`,`D) Pode ser feita pelo Judiciario`,`E) E vinculada`],g:`B`,c:`REVOGACAO: motivo de merito (conveniencia/oportunidade), efeitos EX NUNC, exclusiva da Administracao.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`DESCENTRALIZACAO administrativa significa:`,o:[`A) Distribuir competencias dentro do mesmo orgao`,`B) Transferir competencias para outra pessoa juridica`,`C) Criar hierarquia interna`,`D) Concentrar poder`,`E) Extinguir orgaos`],g:`B`,c:`DESCENTRALIZACAO: transfere para OUTRA PJ (autarquia, fundacao, EP, SEM) ou particular. DESCONCENTRACAO: dentro da mesma PJ (orgaos).`},{a:2023,r:`FCC/TRT-2023`,q:`Atributo do ato administrativo que permite execucao sem intervencao judicial:`,o:[`A) Presuncao de legitimidade`,`B) Imperatividade`,`C) Autoexecutoriedade`,`D) Tipicidade`,`E) Discricionariedade`],g:`C`,c:`AUTOEXECUTORIEDADE: a Adm. executa o ato diretamente, sem precisar do Judiciario (ex: demolicao, apreensao).`},{a:2022,r:`FCC/TCE-2022`,q:`O poder de POLICIA caracteriza-se por:`,o:[`A) Punir servidores`,`B) Limitar direitos individuais em favor do interesse publico`,`C) Editar regulamentos internos`,`D) Organizar a hierarquia`,`E) Anular atos`],g:`B`,c:`Poder de POLICIA: condiciona/limita direitos e liberdades em prol do interesse publico (preventivo e repressivo).`},{a:2021,r:`FCC/PGE-2021`,q:`Sao requisitos do ato administrativo (COFIFOMOB):`,o:[`A) Competencia, finalidade, forma, motivo e objeto`,`B) Capacidade, forma e objeto licito`,`C) Apenas competencia e objeto`,`D) Legalidade e moralidade`,`E) Forma e publicidade`],g:`A`,c:`Requisitos: COmpetencia, FInalidade, FOrma, MOtivo, OBjeto. Vicios em competencia/forma sao sanaveis.`},{a:2020,r:`FCC/ISS-2020`,q:`Excludente da responsabilidade civil do Estado:`,o:[`A) Dolo do agente`,`B) Culpa exclusiva da vitima`,`C) Conduta comissiva`,`D) Nexo causal`,`E) Dano material`],g:`B`,c:`Excludentes (rompem o nexo): culpa exclusiva da vitima, caso fortuito/forca maior, fato exclusivo de terceiro.`},{a:2019,r:`FCC/SEFAZ-2019`,q:`A administracao INDIRETA e composta por:`,o:[`A) Ministerios e secretarias`,`B) Autarquias, fundacoes publicas, empresas publicas e sociedades de economia mista`,`C) Orgaos sem personalidade`,`D) So autarquias`,`E) Particulares delegatarios`],g:`B`,c:`Adm. INDIRETA: autarquias, fundacoes publicas, empresas publicas, sociedades de economia mista (todas com personalidade juridica propria).`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A convalidacao do ato administrativo:`,o:[`A) Tem efeitos ex nunc`,`B) Tem efeitos ex tunc (retroativos), sanando vicio sanavel`,`C) E sempre vedada`,`D) Equivale a revogacao`,`E) So o Judiciario faz`],g:`B`,c:`Convalidacao: sana vicio SANAVEL (competencia/forma) com efeitos EX TUNC (retroage a origem do ato).`},{a:2023,r:`FCC/TCE-2023`,q:`O atributo da presuncao de legitimidade implica que:`,o:[`A) O ato e sempre valido`,`B) O onus de provar o vicio recai sobre quem alega (inversao)`,`C) O ato nao pode ser anulado`,`D) A Adm. nao erra`,`E) O ato e imutavel`],g:`B`,c:`Presuncao de legitimidade (relativa/juris tantum): presume-se que o ato nasceu conforme a lei; o ONUS DA PROVA do vicio cabe ao administrado.`},{a:2022,r:`FCC/PGE-2022`,q:`A responsabilidade do Estado por OMISSAO e, segundo o STF, em regra:`,o:[`A) Objetiva`,`B) Subjetiva (exige culpa do servico - faute du service)`,`C) Inexistente`,`D) Solidaria`,`E) Penal`],g:`B`,c:`Para a corrente majoritaria/STF, a responsabilidade por omissao e SUBJETIVA: exige demonstrar a falha/culpa do servico (faute du service). Atos comissivos: objetiva.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A autotutela administrativa (Sumulas 346 e 473 STF) permite a Adm.:`,o:[`A) Julgar acoes`,`B) Anular seus atos ilegais e revogar os inconvenientes, sem o Judiciario`,`C) Criar tributos`,`D) Legislar`,`E) Punir terceiros sem processo`],g:`B`,c:`Autotutela: a Adm. pode ANULAR atos ilegais e REVOGAR atos inconvenientes/inoportunos, respeitados direitos adquiridos e o devido processo (Sumulas 346 e 473 STF).`},{a:2023,r:`FCC/TCE-2023`,q:`O poder discricionario submete-se a controle judicial quanto a:`,o:[`A) Conveniencia e oportunidade (merito)`,`B) Legalidade, razoabilidade e proporcionalidade`,`C) Nada`,`D) So a forma`,`E) So o motivo`],g:`B`,c:`O Judiciario controla a LEGALIDADE do ato discricionario (inclusive razoabilidade/proporcionalidade), mas NAO substitui o MERITO (conveniencia/oportunidade) do administrador.`},{a:2022,r:`FCC/PGE-2022`,q:`A teoria dos motivos determinantes estabelece que:`,o:[`A) O motivo e irrelevante`,`B) Os motivos declarados vinculam o ato; se falsos/inexistentes, ele e invalido`,`C) So o objeto importa`,`D) A forma e livre`,`E) A competencia e delegavel sempre`],g:`B`,c:`Teoria dos motivos determinantes: a validade do ato fica vinculada aos motivos que o fundamentaram; se inexistentes ou falsos, o ato e nulo.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A delegacao de competencia administrativa:`,o:[`A) E sempre proibida`,`B) E possivel, salvo competencia exclusiva, decisao de recurso e edicao de ato normativo`,`C) Transfere a titularidade`,`D) Independe de publicacao`,`E) E irrevogavel`],g:`B`,c:`Lei 9.784/99: a delegacao e admitida, salvo: competencia exclusiva, decisao de recursos administrativos e edicao de atos normativos. E revogavel e exige publicacao.`},{a:2023,r:`FCC/TCE-2023`,q:`O servico publico prestado sob regime de concessao:`,o:[`A) Dispensa licitacao`,`B) Exige licitacao e e remunerado por tarifa do usuario`,`C) E gratuito sempre`,`D) Nao admite reajuste`,`E) E executado direto pela Adm.`],g:`B`,c:`Concessao (Lei 8.987/95): delegacao mediante LICITACAO (concorrencia), por conta e risco do concessionario, remunerada por TARIFA, preservado o equilibrio economico-financeiro.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`O ato administrativo VINCULADO caracteriza-se por:`,o:[`A) Liberdade de escolha do agente`,`B) A lei predeterminar todos os elementos, sem margem de juizo`,`C) Conveniencia e oportunidade`,`D) Discricionariedade`,`E) Merito administrativo`],g:`B`,c:`Ato VINCULADO: a lei define todos os requisitos, sem margem de escolha ao agente (ex: licenca, aposentadoria). DISCRICIONARIO: ha juizo de conveniencia/oportunidade nos limites legais.`},{a:2023,r:`FCC/TCE-2023`,q:`A desapropriacao e forma de intervencao do Estado na propriedade que:`,o:[`A) E gratuita`,`B) Transfere a propriedade mediante previa e justa indenizacao (em regra, em dinheiro)`,`C) Nao indeniza`,`D) E temporaria`,`E) Independe de utilidade publica`],g:`B`,c:`DESAPROPRIACAO: o Estado retira compulsoriamente a propriedade por necessidade/utilidade publica ou interesse social, mediante PREVIA e JUSTA indenizacao (em dinheiro, em regra).`},{a:2022,r:`FCC/PGE-2022`,q:`O servidor estavel so perde o cargo por:`,o:[`A) Vontade do chefe`,`B) Sentenca judicial transitada em julgado, PAD ou avaliacao periodica de desempenho`,`C) Aposentadoria compulsoria apenas`,`D) Decreto`,`E) Portaria`],g:`B`,c:`Art. 41 CF: o servidor estavel so perde o cargo por sentenca judicial transitada em julgado, processo administrativo (PAD com ampla defesa) ou avaliacao periodica de desempenho.`},{a:2024,r:`FCC/SEFAZ-2024`,q:`A licitacao tem como um de seus principios a:`,o:[`A) Pessoalidade`,`B) Isonomia (igualdade entre os licitantes)`,`C) Discricionariedade plena`,`D) Sigilo das propostas sempre`,`E) Informalidade`],g:`B`,c:`A licitacao busca a ISONOMIA (tratamento igualitario aos licitantes) e a selecao da proposta mais vantajosa, alem do desenvolvimento nacional sustentavel.`},{a:2023,r:`FCC/TCE-2023`,q:`A revogacao de ato administrativo NAO pode atingir:`,o:[`A) Atos discricionarios`,`B) Atos
